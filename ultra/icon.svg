<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ultra: an N64 cartridge under four console-colour quads, rotated like the logo -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#232338"/>
      <stop offset="100%" stop-color="#0b0b14"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a54"/>
      <stop offset="100%" stop-color="#23233a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- four quads -->
  <g transform="translate(256 148) rotate(45)">
    <rect x="-50" y="-50" width="44" height="44" rx="10" fill="#4f7df9"/>
    <rect x="6"   y="-50" width="44" height="44" rx="10" fill="#e94b5a"/>
    <rect x="-50" y="6"   width="44" height="44" rx="10" fill="#f2b634"/>
    <rect x="6"   y="6"   width="44" height="44" rx="10" fill="#3ec46d"/>
  </g>
  <!-- cartridge -->
  <g>
    <rect x="126" y="252" width="260" height="150" rx="18" fill="url(#shell)"/>
    <rect x="126" y="380" width="260" height="22" rx="8" fill="#17172a"/>
    <rect x="176" y="402" width="160" height="26" rx="8" fill="#101020"/>
    <!-- label -->
    <rect x="156" y="278" width="200" height="82" rx="10" fill="#0e0e1c"/>
    <rect x="172" y="296" width="118" height="12" rx="6" fill="#e8e8f2"/>
    <rect x="172" y="320" width="82" height="10" rx="5" fill="#55556e"/>
    <circle cx="330" cy="318" r="18" fill="#f2b634"/>
    <!-- grip ridges -->
    <rect x="140" y="266" width="8" height="96" rx="4" fill="#1b1b2e"/>
    <rect x="364" y="266" width="8" height="96" rx="4" fill="#1b1b2e"/>
  </g>
</svg>
