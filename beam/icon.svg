<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="20%" cy="15%" r="95%">
      <stop offset="0%" stop-color="#1b2446"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <linearGradient id="ray" gradientUnits="userSpaceOnUse" x1="292" y1="220" x2="470" y2="60">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#ffb020"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- a QR finder pattern (7x7 modules of 28px, centre 190,322): outer ring, light gap, 3x3 core -->
    <path fill="#ffb020" fill-rule="evenodd" d="M 92 224 h 196 v 196 h -196 Z M 120 252 v 140 h 140 v -140 Z"/>
    <rect x="148" y="280" width="84" height="84" fill="#ffb020"/>
    <!-- three light rays fanning up-right from the finder's top-right corner toward 470,60 -->
    <polygon points="296.0,224.5 482.1,78.4 452.7,45.7 288.0,215.5" fill="url(#ray)" opacity="0.95"/>
    <polygon points="294.1,225.6 500.6,167.5 485.6,126.1 289.9,214.4" fill="url(#ray)" opacity="0.7"/>
    <polygon points="297.4,222.6 405.6,37.3 366.0,18.0 286.6,217.4" fill="url(#ray)" opacity="0.45"/>
  </g>
</svg>
