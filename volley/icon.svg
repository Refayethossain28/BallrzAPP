<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#10203a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#aefccf"/>
      <stop offset="100%" stop-color="#2fae6e"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the target: three scoring rings -->
  <circle cx="330" cy="196" r="110" fill="none" stroke="#ff5c8f" stroke-width="18"/>
  <circle cx="330" cy="196" r="66" fill="none" stroke="#ffd166" stroke-width="14"/>
  <circle cx="330" cy="196" r="26" fill="#ffd166"/>
  <!-- the ball, streaking in for the bullseye -->
  <line x1="66" y1="452" x2="136" y2="392" stroke="#4dd8ff" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <line x1="106" y1="448" x2="160" y2="402" stroke="#4dd8ff" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
  <circle cx="186" cy="376" r="48" fill="url(#ball)"/>
</svg>
