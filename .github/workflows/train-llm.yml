name: Train browser LLM (from scratch)

# Trains the "My Own AI Model" GPT on a GitHub-hosted runner — which runs a job
# to completion (unlike an ephemeral dev container) — then commits the exported
# web/model.json back to the branch it ran on. Dispatch it, wait for it to
# finish, then merge the branch so GitHub Pages deploys the new model.
#
# Run: Actions → "Train browser LLM (from scratch)" → Run workflow → pick branch
#      and (optionally) tune the size/steps inputs.

on:
  workflow_dispatch:
    inputs:
      corpus_url:
        description: "Plain-text corpus: a URL, a repo path like data/web.txt, or 'classics' (the shipped model's recipe: fetch_data.py classics). Ignored when seed_urls is set"
        default: "classics"
      seed_urls:
        description: "SCRAPE the corpus from the live internet instead: space-separated seed URLs (Magpie crawls same-host links, robots.txt respected)"
        default: ""
      scrape_pages:
        description: "Page budget for the scrape (when seed_urls is set)"
        default: "60"
      arch:
        description: "v1 = GPT-2 style (learned positions, LayerNorm, GELU); v2 = Llama style (RoPE, RMSNorm, SwiGLU, tied embeddings)"
        default: "v2"
      tokenizer:
        description: "char | bpe"
        default: "bpe"
      vocab_size:
        default: "2048"
      n_layer:
        default: "8"
      n_head:
        default: "8"
      n_embd:
        default: "320"
      block_size:
        default: "256"
      batch_size:
        default: "16"
      steps:
        default: "1200"
      lr:
        default: "6e-4"
      dtype:
        description: "Exported weight precision: f4 (float32) | f2 (float16, half) | q8 (int8 per column, a quarter)"
        default: "q8"
      eval_every:
        description: "Steps between val-loss evaluations (each costs ~30 s; raise for long runs)"
        default: "200"
      out_model:
        description: "Model filename to write under llm-from-scratch/web/ (use model-names.json etc. for niche models; the page can load any of them)"
        default: "model.json"
      clean_wikitext:
        description: "Strip WikiText markup (<unk>, @,@, spaced punctuation)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: train-llm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout the target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install numpy

      - name: Fetch corpus
        working-directory: llm-from-scratch
        run: |
          mkdir -p data
          if [ -n "${{ inputs.seed_urls }}" ]; then
            # scrape the corpus from the live internet with Magpie (robots.txt
            # respected, MagpieBot UA, one page a second)
            node ../scripts/build-web-corpus.mjs ${{ inputs.seed_urls }} \
              --pages "${{ inputs.scrape_pages }}" \
              --out llm-from-scratch/data/corpus.txt
          elif [ "${{ inputs.corpus_url }}" = "classics" ]; then
            # the shipped model's diet: big.txt + eleven public-domain novels,
            # Gutenberg boilerplate stripped (see fetch_data.py)
            python fetch_data.py classics data/corpus.txt
          elif [ -f "${{ inputs.corpus_url }}" ]; then
            # a committed corpus file (e.g. data/web.txt from build-web-corpus.mjs)
            cp "${{ inputs.corpus_url }}" data/corpus.txt
          else
            curl -fsSL "${{ inputs.corpus_url }}" -o data/corpus.txt
          fi
          if [ "${{ inputs.clean_wikitext }}" = "true" ]; then
            echo "cleaning WikiText markup…"
            sed -i \
              -e 's/@,@//g; s/ @\.@ /./g; s/ @-@ /-/g' \
              -e 's/<unk>//g' \
              -e 's/ \([,.;:!?)]\)/\1/g; s/\(( \)/(/g' \
              data/corpus.txt
          fi
          echo "corpus: $(wc -c < data/corpus.txt) bytes"

      - name: Train
        working-directory: llm-from-scratch
        run: |
          python train.py \
            --data data/corpus.txt \
            --corpus_name "${{ inputs.seed_urls && 'web scrape' || inputs.corpus_url }}" \
            --arch "${{ inputs.arch }}" \
            --tokenizer "${{ inputs.tokenizer }}" \
            --vocab_size "${{ inputs.vocab_size }}" \
            --n_layer "${{ inputs.n_layer }}" \
            --n_head "${{ inputs.n_head }}" \
            --n_embd "${{ inputs.n_embd }}" \
            --block_size "${{ inputs.block_size }}" \
            --batch_size "${{ inputs.batch_size }}" \
            --steps "${{ inputs.steps }}" \
            --lr "${{ inputs.lr }}" \
            --min_lr_ratio 0.05 \
            --eval_every "${{ inputs.eval_every }}" \
            --out ckpt.npz

      - name: Export to web/${{ inputs.out_model }}
        working-directory: llm-from-scratch
        run: python export_web.py --ckpt ckpt.npz --out "web/${{ inputs.out_model }}" --dtype "${{ inputs.dtype }}" --check_data data/corpus.txt

      # Safety net: the trained weights survive even if the commit/push can't
      # land (branch protection, a race, a non-fast-forward). Download from the
      # run's Artifacts and drop into llm-from-scratch/web/ by hand if needed.
      - name: Upload model.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-json
          path: llm-from-scratch/web/${{ inputs.out_model }}
          retention-days: 14

      - name: Commit the trained model to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SIZE=$(wc -c < "llm-from-scratch/web/${{ inputs.out_model }}")
          MSG1="Train browser LLM on runner (${{ inputs.arch }} ${{ inputs.n_layer }}L/${{ inputs.n_embd }}d, ${{ inputs.steps }} steps) [skip ci]"
          MSG2="Corpus: ${{ inputs.corpus_url }}${{ inputs.seed_urls }}; tokenizer ${{ inputs.tokenizer }} vocab ${{ inputs.vocab_size }}; ${{ inputs.dtype }} weights; ${{ inputs.out_model }} ${SIZE} bytes."
          cp "llm-from-scratch/web/${{ inputs.out_model }}" /tmp/model.json
          # Training took ~hours; the branch may have moved on. Rebase our single
          # weights change onto the current tip and retry, so a non-fast-forward
          # never throws away the run. (model.json is a generated blob — "ours".)
          for i in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            cp /tmp/model.json "llm-from-scratch/web/${{ inputs.out_model }}"
            git add "llm-from-scratch/web/${{ inputs.out_model }}"
            if git diff --cached --quiet; then echo "model.json unchanged — nothing to commit"; break; fi
            git commit -m "$MSG1" -m "$MSG2"
            if git push origin HEAD:"${{ github.ref_name }}"; then echo "pushed"; break; fi
            echo "push $i failed (branch advanced?) — retrying"; sleep 5
          done
