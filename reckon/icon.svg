<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Reckon: a gold coin split by a rising divider — the taxman's slice vs yours -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b36"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3cd7a"/>
      <stop offset="1" stop-color="#c98f2e"/>
    </linearGradient>
    <linearGradient id="keep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dd8ff"/>
      <stop offset="1" stop-color="#8f7cf7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the full coin -->
  <circle cx="256" cy="256" r="150" fill="url(#coin)"/>
  <!-- the kept share: a pie slice in brand blue -->
  <path d="M256 256 L256 106 A150 150 0 0 1 391 322 Z" fill="url(#keep)"/>
  <!-- coin rim -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#0a0d16" stroke-width="14"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#0a0d16" stroke-width="6" opacity="0.35"/>
  <!-- the pound sign, embossed dark -->
  <text x="216" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="150" font-weight="800" fill="#0a0d16">£</text>
</svg>
