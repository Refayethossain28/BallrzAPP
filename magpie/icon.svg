<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#16203d"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dd8ff"/>
      <stop offset="55%" stop-color="#8f7cf7"/>
      <stop offset="100%" stop-color="#e8b34c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the page being scraped: a card with data lines -->
  <rect x="118" y="128" width="212" height="268" rx="22" fill="none" stroke="url(#brand)" stroke-width="18"/>
  <line x1="156" y1="192" x2="292" y2="192" stroke="#4dd8ff" stroke-width="16" stroke-linecap="round"/>
  <line x1="156" y1="244" x2="268" y2="244" stroke="#8f7cf7" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
  <line x1="156" y1="296" x2="292" y2="296" stroke="#8f7cf7" stroke-width="16" stroke-linecap="round" opacity="0.65"/>
  <line x1="156" y1="348" x2="240" y2="348" stroke="#8f7cf7" stroke-width="16" stroke-linecap="round" opacity="0.4"/>
  <!-- the magpie's beak, plucking the shiny row -->
  <path d="M 402 128 L 322 192 L 402 236 L 368 182 Z" fill="url(#brand)"/>
