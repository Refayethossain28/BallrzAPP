<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tokens: a gradient token coin being metered — tick lines streaming off
       it getting shorter (the count), and the gold spark of the last token.
       Rasterized to icon-{180,192,512}.png by scripts/gen-tokens-icons.mjs. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dd8ff"/>
      <stop offset="0.55" stop-color="#8f7cf7"/>
      <stop offset="1" stop-color="#e8b34c"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#16203d"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the token coin -->
  <circle cx="196" cy="256" r="108" fill="none" stroke="url(#g)" stroke-width="20"/>
  <circle cx="196" cy="256" r="56" fill="none" stroke="url(#g)" stroke-width="12" opacity="0.55"/>
  <!-- the meter: tokens streaming off, counted down -->
  <line x1="342" y1="196" x2="426" y2="196" stroke="#4dd8ff" stroke-width="16" stroke-linecap="round"/>
  <line x1="342" y1="256" x2="402" y2="256" stroke="#8f7cf7" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <line x1="342" y1="316" x2="378" y2="316" stroke="#8f7cf7" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
  <!-- the gold spark: the last token -->
  <path d="M424 356 L436 388 L468 400 L436 412 L424 444 L412 412 L380 400 L412 388 Z" fill="#e8b34c"/>
</svg>
