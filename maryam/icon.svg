<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maryam — the sun that is also a full stop. Cream paper, marigold sun,
       hairline ink rays, and the four operators keeping it company. -->
  <rect width="512" height="512" rx="116" fill="#FFFBF2"/>
  <g stroke="#221D16" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="88"  x2="256" y2="128"/>
    <line x1="374.8" y1="137.2" x2="346.5" y2="165.5"/>
    <line x1="424" y1="256" x2="384" y2="256"/>
    <line x1="374.8" y1="374.8" x2="346.5" y2="346.5"/>
    <line x1="256" y1="424" x2="256" y2="384"/>
    <line x1="137.2" y1="374.8" x2="165.5" y2="346.5"/>
    <line x1="88"  y1="256" x2="128" y2="256"/>
    <line x1="137.2" y1="137.2" x2="165.5" y2="165.5"/>
  </g>
  <circle cx="256" cy="256" r="104" fill="#FFB703" stroke="#E08E00" stroke-width="8"/>
  <g fill="#221D16" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="52" text-anchor="middle">
    <text x="92" y="110">+</text>
    <text x="420" y="110">×</text>
    <text x="92" y="440">÷</text>
    <text x="420" y="440">=</text>
  </g>
</svg>
