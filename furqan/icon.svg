<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Furqan: an open book — two cream pages over a darker fold, three gold
       lines of text on each — under a small gold rub el hizb (a square over
       a 45° square, dark dot in the middle), on radial midnight. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#16203d"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="98" y1="408" x2="414" y2="94">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#f0c75e"/>
    </linearGradient>
    <linearGradient id="pageL" gradientUnits="userSpaceOnUse" x1="190" y1="0" x2="250" y2="0">
      <stop offset="0" stop-color="#f5efe1"/>
      <stop offset="1" stop-color="#ebe2cd"/>
    </linearGradient>
    <linearGradient id="pageR" gradientUnits="userSpaceOnUse" x1="322" y1="0" x2="262" y2="0">
      <stop offset="0" stop-color="#f5efe1"/>
      <stop offset="1" stop-color="#ebe2cd"/>
    </linearGradient>
    <mask id="hole">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="256" cy="134" r="8" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the fold between the pages -->
  <rect x="246" y="232" width="20" height="176" fill="#e3d9c3"/>
  <!-- the two pages, dipping toward the spine (the round-joined stroke softens their corners) -->
  <path d="M 104 214 L 244 238 L 244 402 L 104 378 Z" fill="url(#pageL)" stroke="url(#pageL)" stroke-width="12" stroke-linejoin="round"/>
  <path d="M 408 214 L 268 238 L 268 402 L 408 378 Z" fill="url(#pageR)" stroke="url(#pageR)" stroke-width="12" stroke-linejoin="round"/>
  <!-- three lines of text on each page -->
  <g stroke="url(#gold)" stroke-width="16" stroke-linecap="round">
    <line x1="134" y1="270" x2="220" y2="270"/>
    <line x1="134" y1="308" x2="220" y2="308"/>
    <line x1="134" y1="346" x2="194" y2="346"/>
    <line x1="292" y1="270" x2="378" y2="270"/>
    <line x1="292" y1="308" x2="378" y2="308"/>
    <line x1="318" y1="346" x2="378" y2="346"/>
  </g>
  <!-- the rub el hizb above: a square over a 45° square, with a dark dot in the middle -->
  <g fill="url(#gold)" mask="url(#hole)">
    <rect x="228" y="106" width="56" height="56"/>
    <rect x="228" y="106" width="56" height="56" transform="rotate(45 256 134)"/>
  </g>
</svg>
