<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Axon: the smallest possible mind — two senses (cyan) feeding three
       hidden neurons (violet) firing one answer (gold), synapses thick or
       thin by their learned weight. Rasterized to icon-{180,192,512}.png
       by scripts/gen-axon-icons.mjs (keep both in sync). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dd8ff"/>
      <stop offset="0.55" stop-color="#8f7cf7"/>
      <stop offset="1" stop-color="#e8b34c"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#171236"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- synapses: input → hidden (weights of different strengths) -->
  <line x1="128" y1="188" x2="256" y2="118" stroke="url(#g)" stroke-width="14" stroke-linecap="round"/>
  <line x1="128" y1="188" x2="256" y2="256" stroke="url(#g)" stroke-width="7"  stroke-linecap="round"/>
  <line x1="128" y1="188" x2="256" y2="394" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>
  <line x1="128" y1="324" x2="256" y2="118" stroke="url(#g)" stroke-width="6"  stroke-linecap="round"/>
  <line x1="128" y1="324" x2="256" y2="256" stroke="url(#g)" stroke-width="15" stroke-linecap="round"/>
  <line x1="128" y1="324" x2="256" y2="394" stroke="url(#g)" stroke-width="8"  stroke-linecap="round"/>
  <!-- synapses: hidden → output -->
  <line x1="256" y1="118" x2="388" y2="256" stroke="url(#g)" stroke-width="9"  stroke-linecap="round"/>
  <line x1="256" y1="256" x2="388" y2="256" stroke="url(#g)" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="394" x2="388" y2="256" stroke="url(#g)" stroke-width="7"  stroke-linecap="round"/>
  <!-- the senses -->
  <circle cx="128" cy="188" r="34" fill="#0a0d16" stroke="#4dd8ff" stroke-width="14"/>
  <circle cx="128" cy="324" r="34" fill="#0a0d16" stroke="#4dd8ff" stroke-width="14"/>
  <!-- the hidden layer -->
  <circle cx="256" cy="118" r="30" fill="#0a0d16" stroke="#8f7cf7" stroke-width="13"/>
  <circle cx="256" cy="256" r="30" fill="#0a0d16" stroke="#8f7cf7" stroke-width="13"/>
  <circle cx="256" cy="394" r="30" fill="#0a0d16" stroke="#8f7cf7" stroke-width="13"/>
  <!-- the answer -->
  <circle cx="388" cy="256" r="42" fill="#0a0d16" stroke="#e8b34c" stroke-width="16"/>
  <circle cx="388" cy="256" r="13" fill="#e8b34c"/>
</svg>
