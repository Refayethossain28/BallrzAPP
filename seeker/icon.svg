<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#14203d"/>
      <stop offset="60%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#070a14"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d9fff"/>
      <stop offset="55%" stop-color="#9f6bff"/>
      <stop offset="100%" stop-color="#e8b34c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d9fff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9f6bff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- lens -->
  <circle cx="228" cy="222" r="108" fill="url(#glass)" stroke="url(#ring)" stroke-width="34"/>
  <!-- glint -->
  <path d="M168 168 a84 84 0 0 1 62 -26" fill="none" stroke="#dbe9ff" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
  <!-- handle -->
  <line x1="312" y1="308" x2="396" y2="392" stroke="url(#ring)" stroke-width="46" stroke-linecap="round"/>
  <!-- spark of the found thing -->
  <circle cx="228" cy="222" r="14" fill="#e8b34c"/>
</svg>
