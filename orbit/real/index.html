<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit Real — rides, errands, parcels & pay, between real people</title>
<meta name="description" content="The real version of Orbit — the same super-app, but every counterpart is a real human: real map, real addresses, real road fares, cash settled honestly.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  --bg: #0b0e1a; --panel: #141a2e; --panel2: #1b2340; --line: #262f52;
  --text: #eef1fb; --dim: #9aa4c7; --faint: #5b6488;
  --accent: #6c5cff; --accent2: #22d3a5; --gold: #f5c04c; --red: #ff5d73;
  --r: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overscroll-behavior: none;
}
#app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; position: relative; }
header {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px;
  position: sticky; top: 0; z-index: 20; background: linear-gradient(var(--bg) 75%, transparent);
}
.logo { font-weight: 800; font-size: 20px; letter-spacing: .5px; }
.logo span { color: var(--accent); }
.chip {
  margin-left: auto; display: flex; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 99px;
  padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.chip b { color: var(--accent2); }
main { flex: 1; padding: 0 16px calc(86px + env(safe-area-inset-bottom)); }
h2 { font-size: 17px; margin: 18px 0 10px; }
h3 { font-size: 15px; margin: 14px 0 8px; }
.dim { color: var(--dim); } .faint { color: var(--faint); font-size: 12px; }
.small { font-size: 13px; }
nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; justify-content: center; background: rgba(11,14,26,.92);
  backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav .inner { display: flex; width: 100%; max-width: 520px; }
nav button {
  flex: 1; background: none; border: none; color: var(--faint); font: inherit;
  font-size: 11px; font-weight: 600; padding: 9px 0 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
nav button .ico { font-size: 21px; line-height: 1; }
nav button.on { color: var(--text); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
.card.flat { background: var(--panel2); }
.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.btn {
  display: block; width: 100%; border: none; border-radius: 14px; cursor: pointer;
  background: var(--accent); color: #fff; font: inherit; font-weight: 700;
  padding: 14px; font-size: 15px; text-align: center;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
.btn.mini { width: auto; padding: 8px 14px; font-size: 13px; border-radius: 10px; display: inline-block; }
.btn.danger { background: var(--red); }
select, input[type=text], input[type=number] {
  width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px; font: inherit; appearance: none;
}
label.f { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 5px; font-weight: 600; }
.pillrow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.pillrow::-webkit-scrollbar { display: none; }
.pill {
  flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 12px; cursor: pointer; text-align: center; min-width: 92px;
}
.pill.on { border-color: var(--accent); background: rgba(108,92,255,.14); }
.pill .em { font-size: 22px; } .pill .nm { font-weight: 700; font-size: 13px; margin-top: 2px; }
.pill .pr { font-size: 12px; color: var(--dim); }
.banner { border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.banner.surge { background: rgba(245,192,76,.12); color: var(--gold); border: 1px solid rgba(245,192,76,.35); }
.banner.calm { background: rgba(34,211,165,.1); color: var(--accent2); border: 1px solid rgba(34,211,165,.3); }
.hr { height: 1px; background: var(--line); margin: 12px 0; }
.kv { display: flex; justify-content: space-between; font-size: 13.5px; padding: 3px 0; }
.kv span:first-child { color: var(--dim); }
.total { font-weight: 800; font-size: 16px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(108,92,255,.18); color: #b5aaff; }
.tag.green { background: rgba(34,211,165,.15); color: var(--accent2); }
.tag.gold { background: rgba(245,192,76,.15); color: var(--gold); }
.steps { list-style: none; }
.steps li { display: flex; gap: 10px; padding: 6px 0; color: var(--faint); font-size: 13.5px; align-items: center; }
.steps li::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: 0 0 auto; }
.steps li.done { color: var(--dim); } .steps li.done::before { background: var(--accent2); }
.steps li.now { color: var(--text); font-weight: 700; } .steps li.now::before { background: var(--accent); box-shadow: 0 0 0 4px rgba(108,92,255,.25); }
.item { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 10px; }
.item .em { font-size: 26px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--panel2); border-radius: 12px; flex: 0 0 auto; }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 700; font-size: 14.5px; } .item .s { font-size: 12.5px; color: var(--dim); }
.item .end { text-align: right; font-size: 13px; font-weight: 700; flex: 0 0 auto; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bigmoney { font-size: 34px; font-weight: 800; letter-spacing: -.5px; }
.center { text-align: center; }
.mt { margin-top: 10px; } .mb { margin-bottom: 10px; }
#map { width: 100%; height: 240px; border-radius: var(--r); border: 1px solid var(--line); display: block; background: #0e1327; touch-action: none; cursor: grab; }
.mapwrap { position: relative; }
.zoomctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoomctl button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: rgba(20,26,46,.9); color: var(--text); font-size: 18px; font-weight: 800; cursor: pointer; }
.results { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; margin-top: 6px; overflow: hidden; }
.results div { padding: 10px 12px; font-size: 13.5px; cursor: pointer; border-bottom: 1px solid var(--line); }
.results div:last-child { border-bottom: none; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 60;
  background: var(--panel2); border: 1px solid var(--line); color: var(--text);
  padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
  opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">O<span>rbit</span> <span class="tag green">🌍 REAL</span></div>
    <a href="../" style="font-size:12px;color:var(--faint);text-decoration:none;font-weight:700">🪐 demo ↗</a>
    <div class="chip" onclick="go('pay')">💷 <b id="cashChip">£0.00</b></div>
  </header>
  <main id="main"></main>
  <nav><div class="inner">
    <button data-tab="goTab" onclick="go('goTab')"><span class="ico">🚕</span>Go</button>
    <button data-tab="eat" onclick="go('eat')"><span class="ico">🍔</span>Eat</button>
    <button data-tab="send" onclick="go('send')"><span class="ico">📦</span>Send</button>
    <button data-tab="pay" onclick="go('pay')"><span class="ico">💳</span>Pay</button>
    <button data-tab="me" onclick="go('me')"><span class="ico">⭐</span>Me</button>
  </div></nav>
  <div class="toast" id="toast"></div>
</div>

<script src="../config.js"></script>
<script src="../engine.js"></script>
<script>
'use strict';
var E = OrbitEngine;

/* ── state ─────────────────────────────────────────────────────────── */
var S = load();
function load() {
  try { var raw = localStorage.getItem('orbit-real-state'); if (raw) return JSON.parse(raw); } catch (e) {}
  return { name: '', uid: null, rides: [], jobs: [], trusted: '' };
}
function save() { try { localStorage.setItem('orbit-real-state', JSON.stringify(S)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function money(n) { return E.fmtMoney(n); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
var tab = 'goTab';
var ui = {
  center: { lat: 51.5074, lon: -0.1278 }, zoom: 14, gps: null,
  pick: null, dest: null, setMode: 'dest', results: [], searching: false,
  route: null, cls: 'go', fares: null,
  sendSize: 'm', errNote: '', errFee: null,
  req: null, capReqs: {}, capRide: null, capPos: null, captainOn: false
};
var JOB_META = {
  ride:   { emoji: '🚗', label: 'Ride',   riderPays: 'Cash to your captain at the end' },
  parcel: { emoji: '📦', label: 'Parcel', riderPays: 'Cash to your courier on delivery' },
  errand: { emoji: '🛍️', label: 'Errand', riderPays: 'Cash fee + the receipt, when it arrives' }
};
function cashNet() {
  var n = 0;
  S.jobs.forEach(function (j) { n += j.fare; });
  S.rides.forEach(function (r) { n -= r.fare; });
  return Math.round(n * 100) / 100;
}
function refreshChips() { $('cashChip').textContent = money(cashNet()); }

/* ── transport: BroadcastChannel + optional Firestore ──────────────── */
var Net = {
  uid: null, bc: null, db: null, cloud: false, live: false,
  init: function () {
    if (!S.uid) { S.uid = 'u' + Math.random().toString(36).slice(2, 12); save(); }
    this.uid = S.uid;
    var self = this;
    try {
      this.bc = new BroadcastChannel('orbit-real-market');
      this.bc.onmessage = function (e) { if (e.data && e.data.ride) onRide(e.data.ride); };
      this.live = true;
    } catch (e) {}
    var cfg = (typeof ORBIT_FIREBASE_CONFIG !== 'undefined') && ORBIT_FIREBASE_CONFIG;
    if (!cfg || !cfg.projectId || location.protocol === 'file:') return;
    var V = '10.12.2', parts = ['app', 'auth', 'firestore'];
    (function loadNext(i) {
      if (i >= parts.length) { boot(); return; }
      var s = document.createElement('script');
      s.src = 'https://www.gstatic.com/firebasejs/' + V + '/firebase-' + parts[i] + '-compat.js';
      s.onload = function () { loadNext(i + 1); };
      s.onerror = function () {};
      document.head.appendChild(s);
    })(0);
    function boot() {
      try {
        var app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
        firebase.auth(app).signInAnonymously().then(function (cred) {
          self.uid = S.uid = cred.user.uid; save();
          self.db = firebase.firestore(app);
          self.cloud = true;
          self.db.collection('orbit_real_rides').where('ts', '>', Date.now() - 15 * 60000)
            .onSnapshot(function (snap) {
              snap.docChanges().forEach(function (ch) { onRide(ch.doc.data()); });
            }, function () {});
          render();
        }).catch(function () {});
      } catch (e) {}
    }
  },
  publish: function (ride) {
    if (this.bc) { try { this.bc.postMessage({ ride: ride }); } catch (e) {} }
    if (this.cloud) { try { this.db.collection('orbit_real_rides').doc(ride.id).set(JSON.parse(JSON.stringify(ride))); } catch (e) {} }
  }
};

function onRide(ride) {
  if (!E.validRealRequest(ride)) return;
  if (ui.req && ride.id === ui.req.id) {
    if (ride.status === 'CLAIMED' && ui.req.status === 'OPEN') {
      var resolved = E.marketResolveClaim(ui.req, ride, Date.now());
      if (resolved.status === 'CLAIMED') {
        ui.req = resolved;
        Net.publish(resolved);
        toast('👤 ' + resolved.captain.name + ' accepted your ' + JOB_META[resolved.jobType].label.toLowerCase());
      }
    } else if (ride.captainUid && ui.req.captainUid === ride.captainUid &&
               E.MARKET_FLOW.indexOf(ride.status) > E.MARKET_FLOW.indexOf(ui.req.status)) {
      ui.req = ride;
      if (ride.status === 'COMPLETED') {
        S.rides.unshift({ id: ride.id, jobType: ride.jobType, from: ride.from.label, to: ride.to.label, fare: ride.fare, captain: ride.captain.name, ms: Date.now() });
        save();
      }
    }
    render();
    return;
  }
  if (ride.riderUid !== Net.uid) {
    if (ride.status === 'OPEN' && !E.realExpired(ride, Date.now())) ui.capReqs[ride.id] = ride;
    else delete ui.capReqs[ride.id];
    if (ui.capRide && ride.id === ui.capRide.id) {
      if (ride.status === 'CLAIMED' && ride.captainUid !== Net.uid) { ui.capRide = null; toast('Another captain got there first'); }
      else if (ride.status === 'CANCELLED') { ui.capRide = null; toast('They cancelled'); }
    }
    if (ui.captainOn && tab === 'me') render();
  }
}

/* ── real map (OSM tiles on canvas) ────────────────────────────────── */
var TILE = 256, tileCache = {};
function lon2x(lon, z) { return (lon + 180) / 360 * Math.pow(2, z); }
function lat2y(lat, z) { var r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z); }
function x2lon(x, z) { return x / Math.pow(2, z) * 360 - 180; }
function y2lat(y, z) { var n = Math.PI - 2 * Math.PI * y / Math.pow(2, z); return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))); }
function drawMap() {
  var cv = $('map'); if (!cv) return;
  var ctx = cv.getContext('2d');
  var W = cv.width = cv.clientWidth * 2, H = cv.height = 480;
  var z = ui.zoom;
  var cx = lon2x(ui.center.lon, z) * TILE, cy = lat2y(ui.center.lat, z) * TILE;
  var x0 = cx - W / 2, y0 = cy - H / 2;
  ctx.fillStyle = '#0e1327'; ctx.fillRect(0, 0, W, H);
  var t0x = Math.floor(x0 / TILE), t0y = Math.floor(y0 / TILE);
  var t1x = Math.floor((x0 + W) / TILE), t1y = Math.floor((y0 + H) / TILE);
  var max = Math.pow(2, z);
  for (var tx = t0x; tx <= t1x; tx++) {
    for (var ty = t0y; ty <= t1y; ty++) {
      if (ty < 0 || ty >= max) continue;
      var wx = ((tx % max) + max) % max;
      var key = z + '/' + wx + '/' + ty;
      var img = tileCache[key];
      if (!img) {
        img = tileCache[key] = new Image();
        img.onload = function () { if ($('map')) drawMap(); };
        img.src = 'https://tile.openstreetmap.org/' + key + '.png';
      }
      if (img.complete && img.naturalWidth) {
        ctx.globalAlpha = 0.88;
        ctx.drawImage(img, tx * TILE - x0, ty * TILE - y0, TILE, TILE);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(11,14,26,.35)';
        ctx.fillRect(tx * TILE - x0, ty * TILE - y0, TILE, TILE);
      }
    }
  }
  function px(p) { return { x: lon2x(p.lon, z) * TILE - x0, y: lat2y(p.lat, z) * TILE - y0 }; }
  var routeReq = ui.req || (ui.captainOn ? ui.capRide : null);
  if (ui.route && ui.route.coords && !routeReq) {
    ctx.strokeStyle = '#6c5cff'; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    ui.route.coords.forEach(function (c, i) {
      var p = px({ lat: c[1], lon: c[0] });
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  }
  ctx.font = '30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  if (ui.gps) { var g = px(ui.gps); ctx.fillText('🔵', g.x, g.y + 14); }
  var A = routeReq ? routeReq.from : ui.pick, B = routeReq ? routeReq.to : ui.dest;
  if (A) { var a = px(A); ctx.fillText('📍', a.x, a.y + 4); }
  if (B) { var b = px(B); ctx.fillText('🏁', b.x, b.y + 4); }
  if (ui.captainOn) {
    Object.keys(ui.capReqs).forEach(function (k) {
      var r = ui.capReqs[k], p = px(r.from);
      ctx.fillText(JOB_META[r.jobType].emoji, p.x, p.y + 4);
    });
    if (ui.capPos) { var c2 = px(ui.capPos); ctx.fillText('🧢', c2.x, c2.y + 4); }
  }
}
function mapWire() {
  var cv = $('map'); if (!cv || cv._wired === true) return;
  cv._wired = true;
  var drag = null;
  cv.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (err) {} });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = (e.clientX - drag.x) * 2, dy = (e.clientY - drag.y) * 2;
    if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
    drag.x = e.clientX; drag.y = e.clientY;
    var z = ui.zoom;
    ui.center = {
      lon: x2lon(lon2x(ui.center.lon, z) - dx / TILE, z),
      lat: y2lat(lat2y(ui.center.lat, z) - dy / TILE, z)
    };
    drawMap();
  });
  cv.addEventListener('pointerup', function (e) {
    if (drag && !drag.moved && !ui.req && !ui.captainOn) {
      var rect = cv.getBoundingClientRect();
      var mx = (e.clientX - rect.left) * 2, my = (e.clientY - rect.top) * (480 / rect.height);
      var z = ui.zoom;
      var cx = lon2x(ui.center.lon, z) * TILE - cv.width / 2, cy = lat2y(ui.center.lat, z) * TILE - 240;
      var pt = { lon: x2lon((cx + mx) / TILE, z), lat: y2lat((cy + my) / TILE, z), label: 'Dropped pin' };
      if (ui.setMode === 'pick') { ui.pick = pt; toast('Pickup set 📍'); } else { ui.dest = pt; toast('Drop-off set 🏁'); }
      routeAndQuote();
    }
    drag = null;
  });
}
function zoomBy(d) { ui.zoom = Math.max(3, Math.min(18, ui.zoom + d)); drawMap(); }
function mapBlock() {
  return '<div class="mapwrap"><canvas id="map"></canvas>' +
    '<div class="zoomctl"><button onclick="zoomBy(1)">+</button><button onclick="zoomBy(-1)">−</button></div></div>';
}

/* ── real location, places, roads ──────────────────────────────────── */
function useGPS(cb) {
  if (!navigator.geolocation) { toast('No GPS here — tap the map instead'); return; }
  navigator.geolocation.getCurrentPosition(function (pos) {
    ui.gps = { lat: pos.coords.latitude, lon: pos.coords.longitude, label: 'My location' };
    ui.center = { lat: ui.gps.lat, lon: ui.gps.lon };
    if (cb) cb(ui.gps);
    render();
  }, function () { toast('Location blocked — tap the map to set points'); }, { enableHighAccuracy: true, timeout: 8000 });
}
function searchPlace(q) {
  if (!q || q.length < 3) { ui.results = []; renderResults(); return; }
  ui.searching = true; renderResults();
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(q))
    .then(function (r) { return r.json(); })
    .then(function (list) {
      ui.searching = false;
      ui.results = (list || []).map(function (x) {
        return { lat: parseFloat(x.lat), lon: parseFloat(x.lon), label: x.display_name.split(',').slice(0, 2).join(',') };
      });
      renderResults();
    })
    .catch(function () { ui.searching = false; ui.results = []; toast('Search needs internet'); renderResults(); });
}
function renderResults() {
  var el = $('resBox'); if (!el) { render(); return; }
  el.innerHTML = ui.searching ? '<div class="faint" style="padding:8px 12px">Searching…</div>'
    : ui.results.map(function (r, i) { return '<div onclick="pickResult(' + i + ')">📌 ' + esc(r.label) + '</div>'; }).join('');
}
function pickResult(i) {
  var r = ui.results[i]; if (!r) return;
  ui.dest = r; ui.results = [];
  ui.center = { lat: r.lat, lon: r.lon };
  routeAndQuote();
}
function routeAndQuote() {
  ui.route = null; ui.fares = null; ui.errFee = null;
  if (!ui.pick || !ui.dest) { render(); return; }
  var a = ui.pick, b = ui.dest;
  render();
  fetch('https://router.project-osrm.org/route/v1/driving/' + a.lon + ',' + a.lat + ';' + b.lon + ',' + b.lat + '?overview=full&geometries=geojson')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var rt = j.routes && j.routes[0];
      if (!rt) throw new Error('no route');
      ui.route = { km: rt.distance / 1000, mins: rt.duration / 60, coords: rt.geometry.coordinates, src: 'real roads (OSRM)' };
      quoteAll();
    })
    .catch(function () {
      var km = E.geoKm(a.lat, a.lon, b.lat, b.lon) * 1.3;
      ui.route = { km: km, mins: (km / 26) * 60, coords: [[a.lon, a.lat], [b.lon, b.lat]], src: 'estimated (router unreachable)' };
      quoteAll();
    });
}
function quoteAll() {
  var now = Date.now();
  ui.fares = {};
  E.RIDE_CLASSES.forEach(function (c) {
    ui.fares[c.id] = E.realFare(Math.max(0.1, ui.route.km), Math.max(1, ui.route.mins), c.id, now);
  });
  render();
}

/* ── requests (all three job types share this) ─────────────────────── */
function makeRequest(jobType, classId, fare, note) {
  if (!ui.pick || !ui.dest || !(fare > 0)) return;
  var req = E.mkRealRequest({
    id: 'RL' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    riderUid: Net.uid, riderName: S.name || 'Someone',
    from: ui.pick, to: ui.dest, km: ui.route ? ui.route.km : null,
    jobType: jobType, classId: classId, fare: fare, note: note
  }, Date.now());
  if (!req) { toast('Couldn\'t build the request — check the points'); return; }
  ui.req = req;
  Net.publish(req);
  clearInterval(ui.reqTimer);
  ui.reqTimer = setInterval(function () {
    if (!ui.req) { clearInterval(ui.reqTimer); return; }
    if (ui.req.status === 'OPEN' && E.realExpired(ui.req, Date.now())) {
      clearInterval(ui.reqTimer);
      var cx = E.marketCancel(ui.req, Net.uid);
      if (cx.ok) Net.publish(cx.ride);
      ui.req = null;
      toast('Nobody was online near you — the honest truth of a young network. Try again, or be your own captain in a second tab.');
      render(); return;
    }
    var el = $('reqCount');
    if (el && ui.req.status === 'OPEN') {
      var left = Math.max(0, Math.ceil((E.REAL_OPEN_MS - (Date.now() - ui.req.ts)) / 1000));
      el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    }
  }, 500);
  render();
}
function cancelRequest() {
  if (!ui.req) return;
  var cx = E.marketCancel(ui.req, Net.uid);
  if (!cx.ok) { toast(cx.why); return; }
  Net.publish(cx.ride);
  clearInterval(ui.reqTimer);
  ui.req = null;
  toast('Cancelled');
  render();
}

/* ── router ────────────────────────────────────────────────────────── */
function go(t) {
  tab = t;
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
  render();
}
function render() {
  var m = $('main');
  if (ui.req) m.innerHTML = viewActiveRequest();
  else if (tab === 'goTab') m.innerHTML = viewGo();
  else if (tab === 'eat') m.innerHTML = viewEat();
  else if (tab === 'send') m.innerHTML = viewSend();
  else if (tab === 'pay') m.innerHTML = viewPay();
  else m.innerHTML = viewMe();
  refreshChips();
  if ($('map')) { mapWire(); drawMap(); }
}

function capAccept(id) {
  var req = ui.capReqs[id]; if (!req) return;
  var me = { uid: Net.uid, name: S.name || 'Captain', car: S.car || 'My car', plate: S.plate || '—', rating: 5 };
  var c = E.marketClaim(req, me, Date.now());
  if (!c.ok) { toast(c.why); delete ui.capReqs[id]; render(); return; }
  ui.capRide = c.ride;
  delete ui.capReqs[id];
  Net.publish(c.ride);
  render();
}
function capAdvance() {
  if (!ui.capRide) return;
  var a = E.marketAdvance(ui.capRide, Net.uid);
  if (!a.ok) { toast(a.why); return; }
  ui.capRide = a.ride;
  Net.publish(a.ride);
  if (a.ride.status === 'COMPLETED') {
    S.jobs.unshift({ id: a.ride.id, jobType: a.ride.jobType, from: a.ride.from.label, to: a.ride.to.label, fare: a.ride.fare, rider: a.ride.riderName, ms: Date.now() });
    save();
    toast('Collect ' + money(a.ride.fare) + ' in cash — it\'s all yours 💷');
    setTimeout(function () { ui.capRide = null; render(); }, 2600);
  }
  render();
}

<script>
/* Tap-to-update — shows a prompt when a newer version of the app is ready, then
 * swaps it in on tap. Shared across BallrzAPP PWAs; observes the existing service
 * worker registration, so it doesn't re-register or change caching. */
(function () {
  try {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  var ready = navigator.serviceWorker.ready;
  if (!ready || typeof ready.then !== 'function') return;
  var tapped = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (tapped) { tapped = false; location.reload(); }
  });
  function banner(reg) {
    if (document.getElementById('pwa-update-bar')) return;
    var b = document.createElement('button');
    b.id = 'pwa-update-bar'; b.type = 'button';
    b.textContent = '\uD83D\uDD04 New version \u2014 tap to update';
    b.setAttribute('aria-label', 'A new version is available. Tap to update.');
    b.style.cssText = 'position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));'
      + 'transform:translateX(-50%);z-index:2147483000;font:600 14px/1.2 -apple-system,'
      + 'BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#0a0d16;'
      + 'background:linear-gradient(92deg,#4dd8ff,#8f7cf7);border:0;border-radius:999px;'
      + 'padding:11px 18px;box-shadow:0 8px 30px rgba(0,0,0,.35);cursor:pointer;'
      + 'max-width:calc(100vw - 32px);animation:pwaUp .25s ease-out;';
    b.addEventListener('click', function () {
      tapped = true; b.textContent = 'Updating\u2026';
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      else location.reload();
    });
    var s = document.createElement('style');
    s.textContent = '@keyframes pwaUp{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translateX(-50%)}}'
      + '@media (prefers-reduced-motion:reduce){#pwa-update-bar{animation:none}}';
    document.head.appendChild(s);
    (document.body || document.documentElement).appendChild(b);
  }
  ready.then(function (reg) {
    try {
      if (reg.waiting && navigator.serviceWorker.controller) banner(reg);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) banner(reg);
        });
      });
      setInterval(function () { reg.update().catch(function () {}); }, 3600000);
    } catch (e) {}
  }).catch(function () {});
  } catch (e) {}
})();
</script>
