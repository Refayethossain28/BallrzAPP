<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse — Analytics Dashboard</title>
<style>
  :root{
    --bg:#0d0d0f; --card:#17171a; --card-2:#1d1d21;
    --border:rgba(255,255,255,0.08);
    --text:#f2f2f0; --text-2:#a3a29b; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835;
    --accent:#3987e5; --accent-soft:rgba(57,135,229,0.12);
    --good:#0ca30c; --warn:#fab219; --bad:#e66767;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}

  /* ---------- header ---------- */
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:12px 24px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:rgba(13,13,15,0.88);
    backdrop-filter:blur(8px);z-index:20;
  }
  .back{font-size:13px;color:var(--text-2);text-decoration:none;padding:6px 10px;
    border:1px solid var(--border);border-radius:8px;white-space:nowrap}
  .back:hover{color:var(--text);border-color:rgba(255,255,255,0.16)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-0.01em}
  .brand .logo{width:22px;height:22px;border-radius:7px;background:var(--accent);
    display:inline-flex;align-items:center;justify-content:center}
  .brand .logo svg{display:block}
  .topbar .spacer{flex:1}
  .topbar .who{font-size:12.5px;color:var(--muted)}

  .wrap{max-width:1120px;margin:0 auto;padding:24px 24px 56px}

  /* ---------- filters row ---------- */
  .filters{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .filters .label{font-size:13px;color:var(--text-2)}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:3px;gap:2px}
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--text-2);
    font:inherit;font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer;
  }
  .seg button:hover{color:var(--text)}
  .seg button.active{background:var(--accent-soft);color:var(--text);font-weight:600}
  .filters .hint{font-size:12.5px;color:var(--muted);margin-left:auto}

  /* ---------- KPI tiles ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:520px){.kpis{grid-template-columns:1fr}}
  .tile{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
  .tile .k-label{font-size:12.5px;color:var(--text-2)}
  .tile .k-value{font-size:27px;font-weight:600;letter-spacing:-0.02em;margin-top:6px}
  .tile .k-delta{display:inline-flex;align-items:center;gap:4px;margin-top:8px;
    font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
  .tile .k-delta .vs{font-weight:400;color:var(--muted)}
  .delta-good{color:var(--good);background:rgba(12,163,12,0.12)}
  .delta-bad{color:var(--bad);background:rgba(230,103,103,0.12)}

  /* ---------- cards / charts ---------- */
  .charts{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-bottom:20px}
  @media (max-width:900px){.charts{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
  .card h2{font-size:14.5px;font-weight:600}
  .card .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .chart-box{position:relative;margin-top:14px}
  .chart-box svg{display:block;width:100%;height:auto}

  .tooltip{
    position:absolute;pointer-events:none;z-index:5;display:none;
    background:#222226;border:1px solid rgba(255,255,255,0.12);border-radius:9px;
    padding:8px 11px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,0.5);
    min-width:110px;
  }
  .tooltip .tt-date{color:var(--muted);margin-bottom:4px;white-space:nowrap}
  .tooltip .tt-row{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .tooltip .tt-key{width:12px;height:0;border-top:2.5px solid var(--accent);border-radius:2px}
  .tooltip .tt-val{font-weight:600;font-size:13px}
  .tooltip .tt-name{color:var(--text-2)}

  /* ---------- table ---------- */
  .table-card{padding:0;overflow:hidden}
  .table-head{display:flex;align-items:center;gap:12px;padding:16px 18px;flex-wrap:wrap}
  .table-head h2{font-size:14.5px}
  .table-head .count{font-size:12.5px;color:var(--muted)}
  .table-head input{
    margin-left:auto;background:var(--bg);border:1px solid var(--border);border-radius:9px;
    color:var(--text);font:inherit;font-size:13px;padding:7px 12px;width:220px;max-width:100%;
  }
  .table-head input::placeholder{color:var(--muted)}
  .table-head input:focus{outline:none;border-color:var(--accent)}
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
  thead th{
    text-align:left;font-weight:500;color:var(--text-2);font-size:12px;
    padding:9px 18px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
    cursor:pointer;user-select:none;white-space:nowrap;
  }
  thead th:hover{color:var(--text)}
  thead th .arrow{display:inline-block;width:1em;color:var(--muted);font-size:11px}
  thead th.sorted{color:var(--text)}
  thead th.sorted .arrow{color:var(--accent)}
  tbody td{padding:10px 18px;border-bottom:1px solid rgba(255,255,255,0.04);white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:rgba(255,255,255,0.025)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .oid{color:var(--text-2)}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
    padding:2px 9px;border-radius:999px;border:1px solid var(--border)}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-paid{color:var(--good)}
  .b-pending{color:var(--warn)}
  .b-refunded{color:var(--text-2)}
  .b-failed{color:var(--bad)}
  .empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="../index.html">&#8592; All apps</a>
    <span class="brand">
      <span class="logo"><svg width="13" height="13" viewBox="0 0 13 13"><path d="M0.5 8.5 L3.5 8.5 L5 4 L7.5 11 L9.5 6.5 L12.5 6.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Pulse
    </span>
    <span class="spacer"></span>
    <span class="who">Acme Inc &middot; demo workspace</span>
  </header>

  <div class="wrap">
    <div class="filters">
      <span class="label">Date range</span>
      <div class="seg" id="rangeSeg" role="group" aria-label="Date range">
        <button data-days="7">7 days</button>
        <button data-days="30">30 days</button>
        <button data-days="90">90 days</button>
      </div>
      <span class="hint" id="rangeHint"></span>
    </div>

    <section class="kpis" id="kpis"></section>

    <section class="charts">
      <div class="card">
        <h2>Revenue</h2>
        <div class="sub" id="revSub"></div>
        <div class="chart-box" id="lineBox">
          <svg id="lineSvg" viewBox="0 0 720 260" preserveAspectRatio="xMidYMid meet" aria-label="Revenue over time line chart" role="img"></svg>
          <div class="tooltip" id="lineTip"></div>
        </div>
      </div>
      <div class="card">
        <h2 id="barTitle">Signups by week</h2>
        <div class="sub" id="barSub"></div>
        <div class="chart-box" id="barBox">
          <svg id="barSvg" viewBox="0 0 480 260" preserveAspectRatio="xMidYMid meet" aria-label="Signups bar chart" role="img"></svg>
          <div class="tooltip" id="barTip"></div>
        </div>
      </div>
    </section>

    <section class="card table-card">
      <div class="table-head">
        <h2>Recent orders</h2>
        <span class="count" id="orderCount"></span>
        <input type="search" id="orderFilter" placeholder="Filter orders&hellip;" aria-label="Filter orders">
      </div>
      <div class="table-scroll">
        <table>
          <thead id="ordersHead">
            <tr>
              <th data-key="id">Order <span class="arrow"></span></th>
              <th data-key="customer">Customer <span class="arrow"></span></th>
              <th data-key="product">Product <span class="arrow"></span></th>
              <th data-key="amount" class="num">Amount <span class="arrow"></span></th>
              <th data-key="status">Status <span class="arrow"></span></th>
              <th data-key="date">Date <span class="arrow"></span></th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
        <div class="empty" id="ordersEmpty" style="display:none">No orders match your filter.</div>
      </div>
    </section>
  </div>

<script>
"use strict";
/* ================= seeded PRNG — deterministic per range ================= */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent){
  const e = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function fmtMoney(v){
  if (v >= 1e6) return "$" + (v/1e6).toFixed(2) + "M";
  if (v >= 1e4) return "$" + (v/1e3).toFixed(1) + "K";
  return "$" + Math.round(v).toLocaleString("en-US");
}
function fmtMoneyFull(v){ return "$" + v.toLocaleString("en-US", {maximumFractionDigits:0}); }
function fmtNum(v){
  if (v >= 1e6) return (v/1e6).toFixed(2) + "M";
  if (v >= 1e4) return (v/1e3).toFixed(1) + "K";
  return Math.round(v).toLocaleString("en-US");
}
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtDate(d){ return MONTHS[d.getMonth()] + " " + d.getDate(); }
function niceMax(v){
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const d = v / p;
  const m = d <= 1 ? 1 : d <= 2 ? 2 : d <= 2.5 ? 2.5 : d <= 5 ? 5 : 10;
  return m * p;
}

/* ================= data generation ================= */
function today0(){ const t = new Date(); t.setHours(0,0,0,0); return t; }

// Generates 2*days daily points ending today; first half = previous period.
function genDaily(days){
  const rng = mulberry32(days * 7919 + 20260731);
  const base0 = 3400 + rng() * 700;
  const drift = 5 + rng() * 7;
  const t0 = today0();
  const out = [];
  let base = base0;
  for (let i = 0; i < days * 2; i++){
    const date = new Date(t0);
    date.setDate(date.getDate() - (days * 2 - 1 - i));
    const dow = date.getDay();
    const weekend = (dow === 0 || dow === 6) ? 0.7 : (dow === 2 || dow === 3 ? 1.07 : 1);
    const rev = base * weekend * (0.86 + rng() * 0.28);
    const signups = Math.round((26 + i * 0.16) * (weekend < 1 ? 0.62 : 1) * (0.7 + rng() * 0.6));
    const users = Math.round(1750 + i * 8.5 + rng() * 240);
    out.push({ date, rev, signups, users });
    base += drift;
  }
  const churnRng = mulberry32(days * 104729 + 7);
  return {
    prev: out.slice(0, days),
    cur:  out.slice(days),
    churnPrev: 2.3 + churnRng() * 1.3,
    churnCur:  2.3 + churnRng() * 1.3
  };
}

function genOrders(){
  const rng = mulberry32(424242);
  const customers = ["Maya Lindqvist","Omar Haddad","June Park","Felix Braun","Priya Nair",
    "Tomás Rivera","Alice Zhou","Noah Bergstrom","Ines Duarte","Kenji Watanabe",
    "Sara Kowalski","Dmitri Volkov","Hana Yusuf","Leo Marchetti","Greta Olsen",
    "Ravi Chandra","Chloe Dubois","Mateo Silva","Ada Nwosu","Erik Johansson"];
  const products = [
    {name:"Starter plan",  price:29},
    {name:"Growth plan",   price:99},
    {name:"Scale plan",    price:249},
    {name:"Enterprise",    price:899},
    {name:"Add-on: Seats", price:12},
    {name:"Add-on: API",   price:49}
  ];
  const orders = [];
  for (let i = 0; i < 36; i++){
    const c = customers[Math.floor(rng() * customers.length)];
    const p = products[Math.floor(rng() * products.length)];
    const qty = p.price < 60 ? 1 + Math.floor(rng() * 8) : 1 + Math.floor(rng() * 2);
    const r = rng();
    const status = r < 0.6 ? "paid" : r < 0.8 ? "pending" : r < 0.9 ? "refunded" : "failed";
    const daysAgo = Math.floor(Math.pow(rng(), 2.2) * 90);
    const date = today0();
    date.setDate(date.getDate() - daysAgo);
    orders.push({
      id: "ORD-" + (7311 + i),
      customer: c,
      product: p.name,
      amount: p.price * qty,
      status,
      date
    });
  }
  return orders;
}
const ALL_ORDERS = genOrders();

/* ================= state ================= */
const state = {
  days: (function(){
    const v = parseInt(localStorage.getItem("pulse.range"), 10);
    return [7,30,90].includes(v) ? v : 30;
  })(),
  sort: { key: "date", dir: -1 },
  filter: ""
};

/* ================= KPI tiles ================= */
function sum(arr, f){ return arr.reduce((a, x) => a + f(x), 0); }

function renderKpis(data){
  const el = document.getElementById("kpis");
  el.textContent = "";
  const revCur = sum(data.cur, d => d.rev),  revPrev = sum(data.prev, d => d.rev);
  const usrCur = data.cur[data.cur.length - 1].users, usrPrev = data.prev[data.prev.length - 1].users;
  const convCur = sum(data.cur, d => d.signups) / sum(data.cur, d => d.users) * 100;
  const convPrev = sum(data.prev, d => d.signups) / sum(data.prev, d => d.users) * 100;

  const tiles = [
    { label: "Revenue",         value: fmtMoney(revCur), cur: revCur,        prev: revPrev,        upGood: true  },
    { label: "Active users",    value: fmtNum(usrCur),   cur: usrCur,        prev: usrPrev,        upGood: true  },
    { label: "Conversion rate", value: convCur.toFixed(2) + "%", cur: convCur, prev: convPrev,     upGood: true  },
    { label: "Churn",           value: data.churnCur.toFixed(1) + "%", cur: data.churnCur, prev: data.churnPrev, upGood: false }
  ];
  for (const t of tiles){
    const pct = (t.cur - t.prev) / t.prev * 100;
    const up = pct >= 0;
    const good = up === t.upGood;
    const tile = document.createElement("div");
    tile.className = "tile";
    const lab = document.createElement("div"); lab.className = "k-label"; lab.textContent = t.label;
    const val = document.createElement("div"); val.className = "k-value"; val.textContent = t.value;
    const delta = document.createElement("span");
    delta.className = "k-delta " + (good ? "delta-good" : "delta-bad");
    delta.textContent = (up ? "▲ +" : "▼ −") + Math.abs(pct).toFixed(1) + "% ";
    const vs = document.createElement("span"); vs.className = "vs"; vs.textContent = "vs prev " + state.days + "d";
    delta.appendChild(vs);
    tile.append(lab, val, delta);
    el.appendChild(tile);
  }
}

/* ================= line chart ================= */
function renderLineChart(data){
  const svg = document.getElementById("lineSvg");
  const tip = document.getElementById("lineTip");
  const box = document.getElementById("lineBox");
  svg.textContent = "";
  tip.style.display = "none";

  const W = 720, H = 260, L = 56, R = 14, T = 14, B = 30;
  const iw = W - L - R, ih = H - T - B;
  const pts = data.cur;
  const n = pts.length;
  const ymax = niceMax(Math.max(...pts.map(p => p.rev)) * 1.05);
  const x = i => L + (n === 1 ? iw / 2 : i / (n - 1) * iw);
  const y = v => T + ih - (v / ymax) * ih;

  // gridlines + y ticks
  for (let g = 0; g <= 4; g++){
    const v = ymax * g / 4;
    const yy = y(v);
    svgEl("line", { x1: L, x2: W - R, y1: yy, y2: yy,
      stroke: g === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, svg);
    const t = svgEl("text", { x: L - 8, y: yy + 4, "text-anchor": "end",
      "font-size": 11, fill: "var(--muted)" }, svg);
    t.textContent = g === 0 ? "0" : fmtMoney(v);
  }
  // x labels
  const step = n <= 7 ? 1 : n <= 30 ? 7 : 15;
  for (let i = 0; i < n; i += step){
    const t = svgEl("text", { x: x(i), y: H - 8, "text-anchor": "middle",
      "font-size": 11, fill: "var(--muted)" }, svg);
    t.textContent = fmtDate(pts[i].date);
  }

  const lineD = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(p.rev).toFixed(1)).join(" ");
  svgEl("path", { d: lineD + " L" + x(n - 1).toFixed(1) + "," + (T + ih) + " L" + x(0).toFixed(1) + "," + (T + ih) + " Z",
    fill: "var(--accent)", opacity: 0.1 }, svg);
  svgEl("path", { d: lineD, fill: "none", stroke: "var(--accent)",
    "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);

  // end marker + end label (selective direct label)
  const last = pts[n - 1];
  svgEl("circle", { cx: x(n - 1), cy: y(last.rev), r: 4.5,
    fill: "var(--accent)", stroke: "var(--card)", "stroke-width": 2 }, svg);
  const endLab = svgEl("text", { x: x(n - 1) - 6, y: y(last.rev) - 10,
    "text-anchor": "end", "font-size": 11.5, "font-weight": 600, fill: "var(--text)" }, svg);
  endLab.textContent = fmtMoney(last.rev);

  // hover layer: crosshair snaps to nearest day
  const cross = svgEl("line", { y1: T, y2: T + ih, stroke: "rgba(255,255,255,0.25)",
    "stroke-width": 1, visibility: "hidden" }, svg);
  const dot = svgEl("circle", { r: 4.5, fill: "var(--accent)", stroke: "var(--card)",
    "stroke-width": 2, visibility: "hidden" }, svg);
  const hit = svgEl("rect", { x: L, y: T, width: iw, height: ih, fill: "transparent" }, svg);

  function show(ev){
    const r = svg.getBoundingClientRect();
    const lx = (ev.clientX - r.left) * (W / r.width);
    let i = Math.round((lx - L) / (n === 1 ? 1 : iw / (n - 1)));
    i = Math.max(0, Math.min(n - 1, i));
    const p = pts[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i));
    cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(p.rev));
    dot.setAttribute("visibility", "visible");

    tip.textContent = "";
    const d1 = document.createElement("div"); d1.className = "tt-date";
    d1.textContent = DOW[p.date.getDay()] + ", " + fmtDate(p.date);
    const d2 = document.createElement("div"); d2.className = "tt-row";
    const key = document.createElement("span"); key.className = "tt-key";
    const val = document.createElement("span"); val.className = "tt-val";
    val.textContent = fmtMoneyFull(p.rev);
    const name = document.createElement("span"); name.className = "tt-name"; name.textContent = "revenue";
    d2.append(key, val, name);
    tip.append(d1, d2);
    tip.style.display = "block";

    const sx = r.width / W, sy = r.height / H;
    let px = x(i) * sx + 12;
    const py = Math.max(0, y(p.rev) * sy - 48);
    if (px + tip.offsetWidth > box.clientWidth) px = x(i) * sx - tip.offsetWidth - 12;
    tip.style.left = px + "px";
    tip.style.top = py + "px";
  }
  function hide(){
    cross.setAttribute("visibility", "hidden");
    dot.setAttribute("visibility", "hidden");
    tip.style.display = "none";
  }
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerleave", hide);

  document.getElementById("revSub").textContent =
    fmtMoney(sum(pts, p => p.rev)) + " total · last " + state.days + " days";
}

/* ================= bar chart ================= */
function renderBarChart(data){
  const svg = document.getElementById("barSvg");
  const tip = document.getElementById("barTip");
  const box = document.getElementById("barBox");
  svg.textContent = "";
  tip.style.display = "none";

  // 7-day range: daily bars; otherwise weekly buckets
  const daily = state.days === 7;
  let buckets;
  if (daily){
    buckets = data.cur.map(p => ({ label: DOW[p.date.getDay()], full: fmtDate(p.date), v: p.signups }));
  } else {
    // bucket in weeks anchored to the end of the range, so any partial week is the oldest
    buckets = [];
    for (let end = data.cur.length; end > 0; end -= 7){
      const chunk = data.cur.slice(Math.max(0, end - 7), end);
      buckets.unshift({
        full: fmtDate(chunk[0].date) + " – " + fmtDate(chunk[chunk.length - 1].date) +
          (chunk.length < 7 ? " (partial)" : ""),
        v: sum(chunk, p => p.signups)
      });
    }
    buckets.forEach((b, i) => { b.label = "W" + (i + 1); });
  }
  document.getElementById("barTitle").textContent = daily ? "Signups by day" : "Signups by week";
  document.getElementById("barSub").textContent =
    fmtNum(sum(buckets, b => b.v)) + " signups · last " + state.days + " days";

  const W = 480, H = 260, L = 44, R = 12, T = 14, B = 30;
  const iw = W - L - R, ih = H - T - B;
  const n = buckets.length;
  const ymax = niceMax(Math.max(...buckets.map(b => b.v)) * 1.08);
  const y = v => T + ih - (v / ymax) * ih;

  for (let g = 0; g <= 4; g++){
    const v = ymax * g / 4;
    const yy = y(v);
    svgEl("line", { x1: L, x2: W - R, y1: yy, y2: yy,
      stroke: g === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, svg);
    const t = svgEl("text", { x: L - 8, y: yy + 4, "text-anchor": "end",
      "font-size": 11, fill: "var(--muted)" }, svg);
    t.textContent = fmtNum(v);
  }

  const slot = iw / n;
  const bw = Math.min(24, slot * 0.62);
  const labStep = n > 14 ? Math.ceil(n / 10) : 1;

  buckets.forEach((b, i) => {
    const cx = L + slot * (i + 0.5);
    const bx = cx - bw / 2;
    const by = y(b.v);
    const bh = T + ih - by;
    const r = Math.min(4, bh, bw / 2);
    const d = "M" + bx + "," + (by + bh) +
      " L" + bx + "," + (by + r) +
      " Q" + bx + "," + by + " " + (bx + r) + "," + by +
      " L" + (bx + bw - r) + "," + by +
      " Q" + (bx + bw) + "," + by + " " + (bx + bw) + "," + (by + r) +
      " L" + (bx + bw) + "," + (by + bh) + " Z";
    const bar = svgEl("path", { d, fill: "var(--accent)" }, svg);
    if (i % labStep === 0){
      const t = svgEl("text", { x: cx, y: H - 8, "text-anchor": "middle",
        "font-size": 11, fill: "var(--muted)" }, svg);
      t.textContent = b.label;
    }
    // hit target wider than the bar
    const hit = svgEl("rect", { x: L + slot * i, y: T, width: slot, height: ih, fill: "transparent" }, svg);
    function show(){
      bar.setAttribute("fill", "#5598e7");
      tip.textContent = "";
      const d1 = document.createElement("div"); d1.className = "tt-date"; d1.textContent = b.full;
      const d2 = document.createElement("div"); d2.className = "tt-row";
      const key = document.createElement("span"); key.className = "tt-key";
      const val = document.createElement("span"); val.className = "tt-val"; val.textContent = b.v.toLocaleString("en-US");
      const name = document.createElement("span"); name.className = "tt-name"; name.textContent = "signups";
      d2.append(key, val, name);
      tip.append(d1, d2);
      tip.style.display = "block";
      const rct = svg.getBoundingClientRect();
      const sx = rct.width / W, sy = rct.height / H;
      let px = cx * sx + 10;
      if (px + tip.offsetWidth > box.clientWidth) px = cx * sx - tip.offsetWidth - 10;
      tip.style.left = px + "px";
      tip.style.top = Math.max(0, by * sy - 40) + "px";
    }
    function hide(){
      bar.setAttribute("fill", "var(--accent)");
      tip.style.display = "none";
    }
    hit.addEventListener("pointerenter", show);
    hit.addEventListener("pointerleave", hide);
  });
}

/* ================= orders table ================= */
function renderOrders(){
  const tbody = document.getElementById("ordersBody");
  const empty = document.getElementById("ordersEmpty");
  tbody.textContent = "";

  const cutoff = today0();
  cutoff.setDate(cutoff.getDate() - (state.days - 1));
  const q = state.filter.trim().toLowerCase();

  let rows = ALL_ORDERS.filter(o => o.date >= cutoff);
  if (q){
    rows = rows.filter(o =>
      o.id.toLowerCase().includes(q) ||
      o.customer.toLowerCase().includes(q) ||
      o.product.toLowerCase().includes(q) ||
      o.status.includes(q));
  }
  const { key, dir } = state.sort;
  rows.sort((a, b) => {
    let va = a[key], vb = b[key];
    if (va instanceof Date){ va = va.getTime(); vb = vb.getTime(); }
    if (typeof va === "string") return va.localeCompare(vb) * dir;
    return (va - vb) * dir;
  });

  document.getElementById("orderCount").textContent =
    rows.length + " of " + ALL_ORDERS.length + " orders · last " + state.days + " days";
  empty.style.display = rows.length ? "none" : "block";

  for (const o of rows){
    const tr = document.createElement("tr");
    const tdId = document.createElement("td"); tdId.className = "oid"; tdId.textContent = o.id;
    const tdC = document.createElement("td"); tdC.textContent = o.customer;
    const tdP = document.createElement("td"); tdP.textContent = o.product;
    const tdA = document.createElement("td"); tdA.className = "num";
    tdA.textContent = "$" + o.amount.toLocaleString("en-US");
    const tdS = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = "badge b-" + o.status;
    badge.textContent = o.status[0].toUpperCase() + o.status.slice(1);
    tdS.appendChild(badge);
    const tdD = document.createElement("td"); tdD.textContent = fmtDate(o.date);
    tr.append(tdId, tdC, tdP, tdA, tdS, tdD);
    tbody.appendChild(tr);
  }

  // header sort indicators
  document.querySelectorAll("#ordersHead th").forEach(th => {
    const active = th.dataset.key === key;
    th.classList.toggle("sorted", active);
    th.querySelector(".arrow").textContent = active ? (dir === 1 ? "↑" : "↓") : "↕";
  });
}

/* ================= wiring ================= */
function renderAll(){
  const data = genDaily(state.days);
  renderKpis(data);
  renderLineChart(data);
  renderBarChart(data);
  renderOrders();
  const t0 = today0();
  const from = new Date(t0); from.setDate(from.getDate() - (state.days - 1));
  document.getElementById("rangeHint").textContent = fmtDate(from) + " – " + fmtDate(t0);
  document.querySelectorAll("#rangeSeg button").forEach(b =>
    b.classList.toggle("active", parseInt(b.dataset.days, 10) === state.days));
}

document.getElementById("rangeSeg").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  state.days = parseInt(b.dataset.days, 10);
  localStorage.setItem("pulse.range", String(state.days));
  renderAll();
});
document.getElementById("ordersHead").addEventListener("click", ev => {
  const th = ev.target.closest("th");
  if (!th) return;
  const key = th.dataset.key;
  if (state.sort.key === key) state.sort.dir *= -1;
  else state.sort = { key, dir: key === "date" || key === "amount" ? -1 : 1 };
  renderOrders();
});
document.getElementById("orderFilter").addEventListener("input", ev => {
  state.filter = ev.target.value;
  renderOrders();
});

renderAll();
</script>
