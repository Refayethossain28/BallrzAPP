<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocChat — Ask your documents</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel-2: #171f2b;
    --border: #253141;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #22d3ee;
    --accent-dim: rgba(34, 211, 238, 0.12);
    --danger: #f87171;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  header .logo {
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.2px;
  }
  header .logo span { color: var(--accent); }
  header a.back {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: color .15s, border-color .15s;
  }
  header a.back:hover { color: var(--text); border-color: var(--accent); }
  header .spacer { flex: 1; }
  .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 13px;
    font-size: 13px;
    font-family: var(--font);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    color: #06282e;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.small { padding: 4px 9px; font-size: 12px; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .wrap {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 16px;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    min-height: 0;
  }
  /* Sidebar: library */
  .sidebar {
    width: 320px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    overflow-y: auto;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .doc-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    background: var(--panel-2);
  }
  .doc-item .name {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .doc-item .meta { font-size: 11px; color: var(--muted); }
  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input[type="text"], input[type="password"], textarea, select {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: var(--font);
  }
  textarea { resize: vertical; min-height: 80px; }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .warn {
    font-size: 11.5px;
    color: #fbbf24;
    background: rgba(251, 191, 36, 0.08);
    border: 1px solid rgba(251, 191, 36, 0.25);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 8px;
  }

  /* Chat */
  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 0;
    min-width: 0;
  }
  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--accent-dim);
    border: 1px solid rgba(34, 211, 238, 0.35);
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble .engine-badge {
    display: inline-block;
    font-size: 10.5px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 8px;
    margin-bottom: 6px;
  }
  .bubble .engine-badge.api { color: var(--accent); border-color: rgba(34,211,238,.4); }
  .citations { align-self: flex-start; max-width: 82%; display: flex; flex-direction: column; gap: 8px; }
  .cite-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 12.5px;
  }
  .cite-card .cite-src {
    font-weight: 600;
    color: var(--accent);
    font-size: 12px;
    margin-bottom: 4px;
  }
  .cite-card .cite-text { color: var(--muted); font-style: italic; }
  .notice {
    align-self: center;
    font-size: 12px;
    color: #fbbf24;
    background: rgba(251, 191, 36, 0.08);
    border: 1px solid rgba(251, 191, 36, 0.25);
    border-radius: 999px;
    padding: 4px 14px;
  }
  .chat-input {
    display: flex;
    gap: 10px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }
  .chat-input input { flex: 1; padding: 10px 12px; font-size: 14px; }
  .thinking { color: var(--muted); font-style: italic; }

  /* Settings modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    width: 100%;
    max-width: 440px;
  }
  .modal h3 { font-size: 16px; margin-bottom: 12px; }
  .modal .row { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }

  @media (max-width: 820px) {
    .wrap { flex-direction: column; overflow-y: auto; }
    .sidebar { width: 100%; overflow: visible; }
    .chat { min-height: 420px; }
    .bubble, .citations { max-width: 95%; }
  }
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All apps</a>
  <div class="logo">Doc<span>Chat</span></div>
  <div class="spacer"></div>
  <span id="apiStatus" style="font-size:12px;color:var(--muted);"></span>
  <button class="btn" id="settingsBtn">Settings</button>
</header>

<div class="wrap">
  <aside class="sidebar">
    <div class="card">
      <h2>Document library</h2>
      <div id="docList"></div>
      <div class="hint" id="docStats"></div>
    </div>
    <div class="card">
      <h2>Add document</h2>
      <div class="field">
        <label for="docName">Name</label>
        <input type="text" id="docName" placeholder="e.g. Onboarding notes">
      </div>
      <div class="field">
        <label for="docText">Paste text</label>
        <textarea id="docText" placeholder="Paste document text here..."></textarea>
      </div>
      <button class="btn primary" id="addDocBtn">Add to library</button>
      <div class="hint" style="margin-top:12px;">or upload a file (.txt / .md)</div>
      <input type="file" id="fileInput" accept=".txt,.md,text/plain,text/markdown" multiple style="margin-top:6px;font-size:12px;color:var(--muted);">
    </div>
  </aside>

  <main class="chat">
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input">
      <input type="text" id="question" placeholder="Ask a question about your documents..." autocomplete="off">
      <button class="btn primary" id="askBtn">Ask</button>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <h3>Settings</h3>
    <div class="field">
      <label for="apiKey">Anthropic API key (optional)</label>
      <input type="password" id="apiKey" placeholder="sk-ant-...">
    </div>
    <div class="warn">
      Storing API keys in browser localStorage is for <strong>local demo use only</strong>.
      Do not use a production key. Without a key, DocChat uses its built-in offline retrieval engine.
    </div>
    <div class="row">
      <button class="btn danger" id="clearKeyBtn">Clear key</button>
      <button class="btn" id="closeSettingsBtn">Close</button>
      <button class="btn primary" id="saveKeyBtn">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var LS_DOCS = "docchat.docs.v1";
  var LS_KEY = "docchat.apikey.v1";

  var SEED_DOCS = [
    {
      id: "seed-handbook",
      name: "Team Handbook",
      text: [
        "Welcome to the Ballrz team handbook. This document covers our core working practices, time-off policy, and communication norms.",
        "Working hours are flexible. Core collaboration hours run from 10:00 to 15:00 in your local timezone, and everyone is expected to be reachable during that window. Outside core hours, you are free to arrange your day however you like.",
        "The vacation policy grants 25 paid days off per year, plus public holidays. Time off must be logged in the HR portal at least one week in advance for absences longer than two days. Unused days do not roll over past March of the following year.",
        "For communication, we default to asynchronous written updates. Weekly team updates are posted every Friday before 16:00. Urgent issues should be raised in the incidents channel, and anything blocking a release should be escalated directly to the on-call lead.",
        "Expenses under 50 euros can be claimed without prior approval. Larger purchases require sign-off from your team lead. Reimbursement runs happen on the last business day of each month."
      ].join("\n\n")
    },
    {
      id: "seed-product",
      name: "Product Spec — Relay v2",
      text: [
        "Relay v2 is the next major release of our workflow automation product. The release focuses on three pillars: reliability, extensibility, and an improved onboarding experience.",
        "Reliability: Relay v2 introduces at-least-once delivery for every job in the pipeline. Failed jobs are retried up to five times with exponential backoff, starting at 30 seconds. Jobs that exhaust their retries are moved to a dead-letter queue that operators can inspect and replay from the dashboard.",
        "Extensibility: a new plugin API lets customers register custom step types. Plugins are sandboxed and run with a 10-second execution budget per step. The plugin marketplace is planned for the following quarter and is not part of the v2 launch scope.",
        "Onboarding: the new setup wizard reduces time-to-first-workflow from roughly 40 minutes to under 10 minutes. Templates are provided for the five most common automation patterns, including inbox triage and uptime monitoring.",
        "Launch timeline: the beta begins on the first Monday of next quarter and runs for four weeks. General availability follows two weeks after the beta closes, assuming no critical bugs remain open."
      ].join("\n\n")
    },
    {
      id: "seed-security",
      name: "Security FAQ",
      text: [
        "This FAQ answers common security questions about our platform for customers and auditors.",
        "Where is data stored? All customer data is stored in the EU (Frankfurt region) with encrypted backups replicated to Dublin. Data at rest is encrypted with AES-256, and all traffic in transit uses TLS 1.2 or higher.",
        "How is access controlled? Production access requires hardware security keys and is limited to the on-call engineering rotation. All access is logged and reviewed weekly. Customer support staff can only view metadata, never message contents.",
        "How long is data retained? Logs are kept for 30 days. Customer content is retained until the account is deleted, after which it is purged from live systems within 24 hours and from backups within 30 days.",
        "Do you support single sign-on? Yes. SAML-based single sign-on is available on the Business plan and above. SCIM provisioning is available on the Enterprise plan."
      ].join("\n\n")
    }
  ];

  var STOPWORDS = new Set(("a,an,the,and,or,but,if,then,else,of,in,on,at,to,for,with,by,from,as,is,are,was,were,be,been,being,it,its,this,that,these,those,i,you,he,she,we,they,them,his,her,our,your,their,my,me,do,does,did,doing,have,has,had,having,will,would,can,could,should,shall,may,might,must,not,no,so,than,too,very,just,about,into,over,after,before,between,out,up,down,off,again,further,there,here,when,where,why,how,what,which,who,whom,all,any,both,each,few,more,most,other,some,such,only,own,same,s,t,don,now").split(","));

  // ---------- state ----------
  var docs = loadDocs();
  var chunks = [];   // {docId, docName, text, tf: Map, norm}
  var idf = new Map();
  var busy = false;

  function loadDocs() {
    try {
      var raw = localStorage.getItem(LS_DOCS);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }
    localStorage.setItem(LS_DOCS, JSON.stringify(SEED_DOCS));
    return SEED_DOCS.slice();
  }
  function saveDocs() {
    localStorage.setItem(LS_DOCS, JSON.stringify(docs));
  }

  // ---------- indexing ----------
  function tokenize(text) {
    var m = text.toLowerCase().match(/[a-z0-9']+/g) || [];
    var out = [];
    for (var i = 0; i < m.length; i++) {
      var w = m[i].replace(/^'+|'+$/g, "");
      if (w.length > 1 && !STOPWORDS.has(w)) out.push(w);
    }
    return out;
  }

  function chunkDoc(doc) {
    var parts = doc.text.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
    var merged = [];
    for (var i = 0; i < parts.length; i++) {
      if (merged.length && parts[i].length < 60) {
        merged[merged.length - 1] += "\n" + parts[i];
      } else {
        merged.push(parts[i]);
      }
    }
    return merged.map(function (p) {
      return { docId: doc.id, docName: doc.name, text: p };
    });
  }

  function rebuildIndex() {
    chunks = [];
    docs.forEach(function (d) { chunks = chunks.concat(chunkDoc(d)); });
    var df = new Map();
    chunks.forEach(function (c) {
      var tf = new Map();
      tokenize(c.text).forEach(function (w) { tf.set(w, (tf.get(w) || 0) + 1); });
      c.tf = tf;
      tf.forEach(function (_, w) { df.set(w, (df.get(w) || 0) + 1); });
    });
    idf = new Map();
    var N = Math.max(chunks.length, 1);
    df.forEach(function (n, w) { idf.set(w, Math.log(1 + N / n)); });
    chunks.forEach(function (c) {
      var s = 0;
      c.tf.forEach(function (n, w) {
        var v = n * (idf.get(w) || 0);
        s += v * v;
      });
      c.norm = Math.sqrt(s) || 1;
    });
  }

  function retrieve(question, topK) {
    var qTokens = tokenize(question);
    if (!qTokens.length) return [];
    var qtf = new Map();
    qTokens.forEach(function (w) { qtf.set(w, (qtf.get(w) || 0) + 1); });
    var qnorm = 0;
    qtf.forEach(function (n, w) {
      var v = n * (idf.get(w) || 0);
      qnorm += v * v;
    });
    qnorm = Math.sqrt(qnorm) || 1;

    var scored = chunks.map(function (c) {
      var dot = 0, overlap = 0;
      qtf.forEach(function (n, w) {
        if (c.tf.has(w)) {
          dot += (n * (idf.get(w) || 0)) * (c.tf.get(w) * (idf.get(w) || 0));
          overlap++;
        }
      });
      var cosine = dot / (qnorm * c.norm);
      var score = cosine + 0.05 * (overlap / qtf.size);
      return { chunk: c, score: score, overlap: overlap };
    }).filter(function (s) { return s.overlap > 0 && s.score > 0.001; });

    scored.sort(function (a, b) { return b.score - a.score; });
    return scored.slice(0, topK);
  }

  function splitSentences(text) {
    return (text.replace(/\n+/g, " ").match(/[^.!?]+[.!?]+(?:["')\]]+)?|[^.!?]+$/g) || [])
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  function extractiveAnswer(question, hits) {
    var qTokens = new Set(tokenize(question));
    var sentences = [];
    hits.forEach(function (h, rank) {
      splitSentences(h.chunk.text).forEach(function (s, idx) {
        var score = 0;
        tokenize(s).forEach(function (w) {
          if (qTokens.has(w)) score += (idf.get(w) || 1);
        });
        if (score > 0) sentences.push({ text: s, score: score - rank * 0.15, rank: rank, idx: idx });
      });
    });
    sentences.sort(function (a, b) { return b.score - a.score; });
    var picked = sentences.slice(0, 3);
    picked.sort(function (a, b) { return (a.rank - b.rank) || (a.idx - b.idx); });
    if (!picked.length) return null;
    var seen = new Set(), out = [];
    picked.forEach(function (s) {
      if (!seen.has(s.text)) { seen.add(s.text); out.push(s.text); }
    });
    return out.join(" ");
  }

  // ---------- Claude API ----------
  function getKey() { return (localStorage.getItem(LS_KEY) || "").trim(); }

  async function askClaude(question, hits) {
    var excerpts = hits.map(function (h, i) {
      return "[" + (i + 1) + "] From \"" + h.chunk.docName + "\":\n" + h.chunk.text;
    }).join("\n\n");
    var res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": getKey(),
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 1024,
        system: "You are DocChat, a document Q&A assistant. Answer the user's question using ONLY the provided document excerpts. Be concise. Mention document names when relevant. If the excerpts do not contain the answer, say so plainly.",
        messages: [{
          role: "user",
          content: "Question: " + question + "\n\nDocument excerpts:\n\n" + excerpts
        }]
      })
    });
    if (!res.ok) throw new Error("API error " + res.status);
    var data = await res.json();
    var text = (data.content || [])
      .filter(function (b) { return b.type === "text"; })
      .map(function (b) { return b.text; })
      .join("\n").trim();
    if (!text) throw new Error("Empty response");
    return text;
  }

  // ---------- UI ----------
  var $ = function (id) { return document.getElementById(id); };
  var chatLog = $("chatLog");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function scrollLog() { chatLog.scrollTop = chatLog.scrollHeight; }

  function addBubble(role, text, engine) {
    var b = el("div", "bubble " + role);
    if (engine) {
      var badge = el("span", "engine-badge" + (engine === "claude" ? " api" : ""),
        engine === "claude" ? "Claude (claude-sonnet-5)" : "Local engine");
      b.appendChild(badge);
      b.appendChild(el("div", "", text));
    } else {
      b.textContent = text;
    }
    chatLog.appendChild(b);
    scrollLog();
    return b;
  }

  function addNotice(text) {
    chatLog.appendChild(el("div", "notice", text));
    scrollLog();
  }

  function addCitations(hits) {
    if (!hits.length) return;
    var box = el("div", "citations");
    hits.forEach(function (h) {
      var c = el("div", "cite-card");
      c.appendChild(el("div", "cite-src", h.chunk.docName + "  ·  relevance " + h.score.toFixed(2)));
      var t = h.chunk.text;
      if (t.length > 320) t = t.slice(0, 320) + "…";
      c.appendChild(el("div", "cite-text", "“" + t + "”"));
      box.appendChild(c);
    });
    chatLog.appendChild(box);
    scrollLog();
  }

  function renderDocs() {
    var list = $("docList");
    list.innerHTML = "";
    docs.forEach(function (d) {
      var item = el("div", "doc-item");
      var name = el("div", "name", d.name);
      var meta = el("div", "meta", Math.round(d.text.length / 100) / 10 + "k chars");
      var del = el("button", "btn small danger", "Remove");
      del.addEventListener("click", function () {
        docs = docs.filter(function (x) { return x.id !== d.id; });
        saveDocs(); rebuildIndex(); renderDocs();
      });
      item.appendChild(name); item.appendChild(meta); item.appendChild(del);
      list.appendChild(item);
    });
    $("docStats").textContent = docs.length + " document(s), " + chunks.length + " indexed chunks";
  }

  function addDoc(name, text) {
    if (!name || !text.trim()) return;
    docs.push({ id: "doc-" + Date.now() + "-" + Math.floor(Math.random() * 1e6), name: name, text: text.trim() });
    saveDocs(); rebuildIndex(); renderDocs();
  }

  function updateApiStatus() {
    $("apiStatus").textContent = getKey() ? "Claude API: on" : "Offline mode";
  }

  async function handleAsk() {
    if (busy) return;
    var q = $("question").value.trim();
    if (!q) return;
    $("question").value = "";
    busy = true;
    addBubble("user", q);

    var thinking = addBubble("assistant", "Searching documents…");
    thinking.classList.add("thinking");

    // Give the browser a paint frame
    await new Promise(function (r) { setTimeout(r, 60); });

    var hits = retrieve(q, 3);
    var answered = false;

    if (getKey() && hits.length) {
      try {
        var text = await askClaude(q, hits);
        thinking.remove();
        addBubble("assistant", text, "claude");
        addCitations(hits);
        answered = true;
      } catch (err) {
        thinking.remove();
        addNotice("Claude API unavailable (" + err.message + ") — falling back to local engine");
        thinking = addBubble("assistant", "Searching locally…");
        thinking.classList.add("thinking");
      }
    }

    if (!answered) {
      var local;
      if (!hits.length) {
        local = "I couldn't find anything in the library that matches that question. Try rephrasing it, or add a document that covers the topic.";
      } else {
        var ext = extractiveAnswer(q, hits);
        local = ext
          ? "Here is what I found in your documents:\n\n" + ext
          : "I found some related passages but no sentence directly answers that — see the cited excerpts below.";
      }
      thinking.remove();
      addBubble("assistant", local, "local");
      addCitations(hits);
    }
    busy = false;
  }

  // ---------- wiring ----------
  $("askBtn").addEventListener("click", handleAsk);
  $("question").addEventListener("keydown", function (e) {
    if (e.key === "Enter") handleAsk();
  });

  $("addDocBtn").addEventListener("click", function () {
    var name = $("docName").value.trim() || "Untitled document";
    addDoc(name, $("docText").value);
    $("docName").value = ""; $("docText").value = "";
  });

  $("fileInput").addEventListener("change", function (e) {
    Array.prototype.forEach.call(e.target.files, function (file) {
      var reader = new FileReader();
      reader.onload = function () {
        addDoc(file.name.replace(/\.(txt|md)$/i, ""), String(reader.result || ""));
      };
      reader.readAsText(file);
    });
    e.target.value = "";
  });

  // Settings modal
  $("settingsBtn").addEventListener("click", function () {
    $("apiKey").value = getKey();
    $("settingsModal").classList.add("open");
  });
  $("closeSettingsBtn").addEventListener("click", function () {
    $("settingsModal").classList.remove("open");
  });
  $("saveKeyBtn").addEventListener("click", function () {
    var v = $("apiKey").value.trim();
    if (v) localStorage.setItem(LS_KEY, v); else localStorage.removeItem(LS_KEY);
    updateApiStatus();
    $("settingsModal").classList.remove("open");
  });
  $("clearKeyBtn").addEventListener("click", function () {
    localStorage.removeItem(LS_KEY);
    $("apiKey").value = "";
    updateApiStatus();
  });
  $("settingsModal").addEventListener("click", function (e) {
    if (e.target === $("settingsModal")) $("settingsModal").classList.remove("open");
  });

  // ---------- init ----------
  rebuildIndex();
  renderDocs();
  updateApiStatus();
  addBubble("assistant",
    "Hi, I'm DocChat. Ask me anything about the documents in your library — three sample documents are preloaded. Try: “How many vacation days do I get?”, “What happens to failed jobs in Relay v2?”, or “Where is customer data stored?”");
})();
</script>
</body>
</html>
