<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoteMark</title>
<style>
  :root {
    --bg: #111420;
    --surface: #171b26;
    --surface-2: #222842;
    --border: #2c3350;
    --text: #e6e9f4;
    --text-dim: #8f97b3;
    --accent: #ffd54a;
    --danger: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 320px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header .name { font-weight: 800; font-size: 15px; }
  header .name span { color: var(--accent); }
  .global {
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
  }
  main { padding: 12px 14px 14px; max-height: 380px; overflow-y: auto; }
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .item:hover { background: var(--surface-2); border-color: #3a4266; }
  .kind {
    width: 24px; height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
    font-weight: 800;
  }
  .kind.h { background: rgba(255, 213, 74, 0.18); color: var(--accent); }
  .kind.n { background: rgba(122, 162, 255, 0.18); color: #7aa2ff; }
  .preview {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .del {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 6px;
    flex-shrink: 0;
    line-height: 1;
  }
  .del:hover { color: var(--danger); background: rgba(248, 113, 113, 0.12); }
  .empty {
    color: var(--text-dim);
    text-align: center;
    padding: 26px 10px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<header>
  <div class="name">Note<span>Mark</span></div>
  <div class="global" id="global-count">…</div>
</header>
<main>
  <div class="section-title">This page</div>
  <div id="list"><div class="empty">Loading…</div></div>
</main>
<script src="popup.js"></script>
</body>
</html>
