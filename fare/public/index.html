<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1118">
<title>Fare — chauffeur jobs &amp; invoicing</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #0c1118; --panel: #131a24; --card: #161f2b; --line: #223042;
    --text: #e9edf3; --muted: #8d97a7; --gold: #d4af37; --gold-dim: #9c8329;
    --green: #34c48a; --red: #e4604f; --amber: #e0a83a;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }

  header.app { display: flex; align-items: baseline; gap: 10px; padding: 18px 16px 6px; }
  header.app h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
  header.app h1 em { color: var(--gold); font-style: normal; }
  header.app .sub { color: var(--muted); font-size: 12.5px; }

  main { padding: 8px 14px 20px; max-width: 640px; margin: 0 auto; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 14px; margin: 10px 0; }
  .card.tap { cursor: pointer; }
  .card.tap:active { background: #1b2634; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .small { font-size: 12.5px; }
  .amount { font-variant-numeric: tabular-nums; font-weight: 650; }
  .gold { color: var(--gold); }

  /* month switcher + totals banner */
  .monthbar { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 2px; }
  .monthbar b { font-size: 17px; }
  .monthbar button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; font-size: 18px; width: 42px; height: 38px; }
  .totalbar { display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(120deg, #1a2230, #141c28); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px; margin: 10px 0; }
  .totalbar .amount { font-size: 20px; color: var(--gold); }

  /* chips */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--gold); border-color: var(--gold); color: #16130a; font-weight: 650; }
  .chip.ghost { border-style: dashed; color: var(--muted); }

  /* status pills */
  .pill { border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase; }
  .pill.sent { background: rgba(224,168,58,.15); color: var(--amber); }
  .pill.paid { background: rgba(52,196,138,.15); color: var(--green); }
  .pill.overdue { background: rgba(228,96,79,.18); color: var(--red); }
  .pill.invoiced { background: rgba(212,175,55,.14); color: var(--gold); }

  /* forms */
  label.f { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 12.5px;
    text-transform: uppercase; letter-spacing: .06em; }
  input, textarea, select { width: 100%; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 11px 12px; font-size: 16px; }
  input:focus, textarea:focus { outline: none; border-color: var(--gold-dim); }
  textarea { min-height: 72px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stepper { display: flex; gap: 8px; align-items: center; }
  .stepper button { background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; min-width: 52px; height: 44px; font-size: 15px; }
  .switch { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
  .switch input { width: auto; transform: scale(1.4); accent-color: var(--gold); }

  button.primary { width: 100%; background: var(--gold); color: #16130a; font-weight: 750;
    font-size: 17px; border: 0; border-radius: 12px; padding: 14px; margin-top: 16px; }
  button.primary:active { background: var(--gold-dim); }
  button.secondary { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; font-size: 15px; margin-top: 10px; }
  button.danger { color: var(--red); border-color: rgba(228,96,79,.4); }
  .btn-sm { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 12px; font-size: 13.5px; }
  .btn-sm.gold { background: var(--gold); border-color: var(--gold); color: #16130a; font-weight: 700; }

  .back { background: none; border: 0; color: var(--gold); font-size: 15px; padding: 4px 0; }
  .section { margin: 20px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .08em; }
  .empty { text-align: center; color: var(--muted); padding: 34px 12px; }
  .logo-preview { max-height: 56px; max-width: 180px; border-radius: 6px; background: #fff; padding: 4px; }

  /* bottom nav + FAB */
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    background: rgba(12,17,24,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); font-size: 11.5px;
    padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav.tabs button .ico { font-size: 20px; line-height: 1; }
  nav.tabs button.on { color: var(--gold); }
  .fab { position: fixed; right: 18px; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 6;
    width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--gold); color: #16130a;
    font-size: 30px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.45); }

  #toast { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(88px + env(safe-area-inset-bottom)); background: #222d3d; color: var(--text);
    border: 1px solid var(--line); padding: 10px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9; max-width: 86vw; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <header class="app"><h1><em>Fare</em></h1><span class="sub">chauffeur jobs &amp; invoicing</span></header>
  <main id="view"><div class="empty">Loading…</div></main>

  <button class="fab" id="fab" aria-label="New job">+</button>
  <nav class="tabs" id="tabs">
    <button data-tab="jobs"><span class="ico">🚘</span>Jobs</button>
    <button data-tab="invoices"><span class="ico">📄</span>Invoices</button>
    <button data-tab="clients"><span class="ico">👤</span>Clients</button>
    <button data-tab="settings"><span class="ico">⚙️</span>Settings</button>
  </nav>
  <div id="toast"></div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
  <script>
    if (typeof FareApp !== 'undefined') FareApp.boot();
    if (typeof navigator !== 'undefined' && navigator.serviceWorker && navigator.serviceWorker.register) {
      try { navigator.serviceWorker.register('sw.js'); } catch (e) { /* optional */ }
    }
  </script>
</body>
</html>
