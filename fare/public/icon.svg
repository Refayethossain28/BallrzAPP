<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fare: a midnight rounded square, a gold chauffeur road curving up,
       and the pound-line it earns — the whole app in one motif. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="95%">
      <stop offset="0%" stop-color="#1b2433"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#9c7a1e"/>
      <stop offset="100%" stop-color="#e9c25a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the road: a sweeping S-curve with a dashed centre line -->
  <path d="M96 428 C 210 388, 176 268, 268 220 C 348 178, 380 150, 408 96"
        fill="none" stroke="url(#gold)" stroke-width="58" stroke-linecap="round"/>
  <path d="M96 428 C 210 388, 176 268, 268 220 C 348 178, 380 150, 408 96"
        fill="none" stroke="#0a0f16" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="1 44"/>
  <!-- the pound earned at the summit -->
  <circle cx="408" cy="96" r="54" fill="#0a0f16" stroke="url(#gold)" stroke-width="10"/>
  <text x="408" y="118" text-anchor="middle" font-family="Georgia, serif"
        font-size="66" font-weight="bold" fill="#e9c25a">£</text>
</svg>
