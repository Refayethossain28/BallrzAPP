<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Parrot: a voice, replayed — a play beak throwing sound rings, and the
       gold spark of the phrase it kept. Same motif as gen-parrot-icons.mjs. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#14241d"/>
      <stop offset="100%" stop-color="#08110d"/>
    </radialGradient>
    <linearGradient id="voice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fe3a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the play beak -->
  <path d="M150 176 L150 336 L286 256 Z" fill="url(#voice)"/>
  <!-- three sound rings -->
  <g stroke="url(#voice)" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M326.2 198.7 A70 70 0 0 1 326.2 313.3" opacity="0.95"/>
    <path d="M349.1 165.9 A110 110 0 0 1 349.1 346.1" opacity="0.65"/>
    <path d="M372.1 133.2 A150 150 0 0 1 372.1 378.8" opacity="0.4"/>
  </g>
  <!-- the gold spark it kept -->
  <path d="M420 84 L432 116 L464 128 L432 140 L420 172 L408 140 L376 128 L408 116 Z" fill="#fbbf24"/>
</svg>
