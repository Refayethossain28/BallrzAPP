<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parrot — your pocket voice board</title>
<meta name="description" content="Record a voice once, play it forever. A pocket board of pre-recorded voices — record, import, tap to play, queue, shuffle, repeat. Works offline.">
<meta name="theme-color" content="#0d1412">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0d1412; --card: #131d19; --card2: #182521; --line: rgba(120, 220, 170, .14);
    --ink: #e9f5ee; --dim: #8fa89b; --green: #34d399; --deep: #10b981;
    --gold: #fbbf24; --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 560px; margin: 0 auto; padding: 18px 16px 120px;
    min-height: 100vh;
  }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 26px; letter-spacing: -.02em; }
  h1 .bird { margin-right: 6px; }
  .stats { color: var(--dim); font-size: 13px; margin-left: auto; }
  .tagline { color: var(--dim); font-size: 14px; margin-bottom: 16px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .rec-card { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .rec-btn {
    width: 74px; height: 74px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 32% 28%, #3fe3a6, var(--deep));
    color: #05231a; font-size: 30px; flex: none;
    box-shadow: 0 6px 22px rgba(16, 185, 129, .35);
    transition: transform .12s ease;
  }
  .rec-btn:active { transform: scale(.94); }
  .rec-btn.live {
    background: radial-gradient(circle at 32% 28%, #fb9a9a, var(--red));
    box-shadow: 0 0 0 0 rgba(248, 113, 113, .5); animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(248, 113, 113, .45); }
    100% { box-shadow: 0 0 0 22px rgba(248, 113, 113, 0); }
  }
  .rec-info { flex: 1; min-width: 0; }
  .rec-title { font-weight: 700; }
  .rec-hint { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .rec-clock { font-variant-numeric: tabular-nums; color: var(--red); font-weight: 700; display: none; }
  .rec-card.live .rec-clock { display: block; }
  .rec-card.live .rec-hint { display: none; }
  .import-btn {
    border: 1px solid var(--line); background: var(--card2); color: var(--ink);
    border-radius: 12px; padding: 10px 12px; font-size: 13px; cursor: pointer; flex: none;
  }

  .toolbar { display: flex; gap: 8px; margin: 0 0 10px; flex-wrap: wrap; }
  .toolbar button, .toolbar select {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 12px; padding: 9px 13px; font-size: 14px; cursor: pointer;
  }
  .toolbar .primary { background: var(--green); border-color: var(--green); color: #05231a; font-weight: 700; }
  .search { flex: 1; min-width: 130px; }
  .search input {
    width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 12px; padding: 9px 13px; font-size: 14px; outline: none;
  }
  .search input:focus { border-color: var(--green); }

  .tile {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px; margin-bottom: 10px; cursor: pointer;
  }
  .tile.playing { border-color: var(--green); background: var(--card2); }
  .face {
    width: 52px; height: 52px; border-radius: 14px; display: flex;
    align-items: center; justify-content: center; font-size: 26px; flex: none;
  }
  .tinfo { min-width: 0; }
  .tname { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tmeta { color: var(--dim); font-size: 12px; margin: 1px 0 6px; }
  .wave { display: flex; align-items: flex-end; gap: 2px; height: 22px; }
  .wave i { flex: 1; background: rgba(143, 168, 155, .45); border-radius: 2px; min-height: 2px; }
  .wave i.lit { background: var(--green); }
  .tacts { display: flex; flex-direction: column; gap: 6px; }
  .tacts button {
    border: 1px solid var(--line); background: var(--card2); color: var(--ink);
    border-radius: 10px; width: 36px; height: 30px; cursor: pointer; font-size: 13px;
  }
  .tacts .play { background: var(--green); border-color: var(--green); color: #05231a; font-weight: 700; }

  .empty { text-align: center; color: var(--dim); padding: 44px 18px; }
  .empty .big { font-size: 52px; margin-bottom: 10px; }
  .empty b { color: var(--ink); }

  .nowbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px;
    width: calc(100% - 28px); max-width: 532px;
    background: var(--card2); border: 1px solid var(--green); border-radius: 16px;
    padding: 10px 14px; display: none; align-items: center; gap: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45); z-index: 5;
  }
  .nowbar.on { display: flex; }
  .nowname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; font-size: 14px; }
  .nowbar button { border: none; background: transparent; color: var(--ink); font-size: 18px; cursor: pointer; padding: 4px 6px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 78px;
    background: #1e2b26; color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 16px; font-size: 14px; max-width: 90%;
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 9;
  }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
  <header>
    <h1><span class="bird">🦜</span>Parrot</h1>
    <div class="stats" id="stats"></div>
  </header>
  <p class="tagline">Your pocket voice board — record a voice once, play it forever.</p>

  <div class="card rec-card" id="recCard">
    <button class="rec-btn" id="recBtn" title="Record a voice">🎙️</button>
    <div class="rec-info">
      <div class="rec-title" id="recTitle">Record a voice</div>
      <div class="rec-hint" id="recHint">Tap, speak, tap again — it lands on the board.</div>
      <div class="rec-clock" id="recClock">0:00</div>
    </div>
    <button class="import-btn" id="importBtn">＋ Add audio file</button>
    <input type="file" id="filePick" accept="audio/*" multiple hidden>
  </div>

  <div class="toolbar">
    <button class="primary" id="playAllBtn">▶ Play all</button>
    <button id="shuffleBtn">🔀 Shuffle</button>
    <button id="repeatBtn">↻ off</button>
    <select id="sortSel" title="Sort">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="name">By name</option>
      <option value="longest">Longest first</option>
    </select>
    <div class="search"><input id="searchBox" type="search" placeholder="Search voices…"></div>
  </div>

  <div id="list"></div>

  <div class="nowbar" id="nowbar">
    <span>🦜</span>
    <span class="nowname" id="nowName"></span>
    <button id="prevBtn" title="Previous">⏮</button>
    <button id="nextBtn" title="Next">⏭</button>
    <button id="stopBtn" title="Stop">⏹</button>
  </div>

  <div class="toast" id="toast"></div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.ParrotEngine;
  var $ = function (id) { return document.getElementById(id); };
  var els = {
    stats: $('stats'), recCard: $('recCard'), recBtn: $('recBtn'), recTitle: $('recTitle'),
    recHint: $('recHint'), recClock: $('recClock'), importBtn: $('importBtn'), filePick: $('filePick'),
    playAllBtn: $('playAllBtn'), shuffleBtn: $('shuffleBtn'), repeatBtn: $('repeatBtn'),
    sortSel: $('sortSel'), searchBox: $('searchBox'), list: $('list'),
    nowbar: $('nowbar'), nowName: $('nowName'), prevBtn: $('prevBtn'), nextBtn: $('nextBtn'),
    stopBtn: $('stopBtn'), toast: $('toast')
  };

  var PEAK_BARS = 36;
  var hasIDB = !!window.indexedDB;
  var canRecord = !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  var prefs = {};
  try { prefs = JSON.parse(localStorage.getItem('parrot-prefs') || '{}') || {}; } catch (e) { prefs = {}; }

  var state = {
    clips: [],            // full records: engine meta + peaks + blob
    urls: {},             // id -> objectURL
    audio: null, playingId: null, paused: false,
    queue: null, qi: -1,
    repeat: E.REPEATS.indexOf(prefs.repeat) !== -1 ? prefs.repeat : 'off',
    sort: E.SORTS.indexOf(prefs.sort) !== -1 ? prefs.sort : 'newest',
    query: '',
    recording: false, recorder: null, recStart: 0, recTimer: 0,
    warnedNoSave: false
  };
  var db = null;

  function savePrefs() {
    try { localStorage.setItem('parrot-prefs', JSON.stringify({ repeat: state.repeat, sort: state.sort })); } catch (e) {}
  }

  /* ---------------- storage: the board survives the tab ---------------- */

  function openDB(cb) {
    if (!hasIDB) return cb(null);
    try {
      var req = window.indexedDB.open('parrot', 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('voices', { keyPath: 'id' }); };
      req.onsuccess = function () { cb(req.result); };
      req.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }

  function loadAll(cb) {
    if (!db) return cb([]);
    try {
      var req = db.transaction('voices', 'readonly').objectStore('voices').getAll();
      req.onsuccess = function () { cb(req.result || []); };
      req.onerror = function () { cb([]); };
    } catch (e) { cb([]); }
  }

  function putRec(rec) {
    if (!db) {
      if (!state.warnedNoSave) {
        state.warnedNoSave = true;
        toast('This browser can’t save — voices last until you close the tab.');
      }
      return;
    }
    try { db.transaction('voices', 'readwrite').objectStore('voices').put(rec); } catch (e) {}
  }

  function deleteRec(id) {
    if (!db) return;
    try { db.transaction('voices', 'readwrite').objectStore('voices').delete(id); } catch (e) {}
  }

  /* ---------------- recording: a new voice for the board ---------------- */

  function toggleRecord() {
    if (state.recording) return stopRecord();
    if (!canRecord) {
      toast('No microphone here — use “Add audio file” instead.');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var mr = new window.MediaRecorder(stream);
      var chunks = [];
      mr.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      mr.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        finishRecording(chunks, mr.mimeType, Date.now() - state.recStart);
      };
      state.recorder = mr;
      state.recording = true;
      state.recStart = Date.now();
      mr.start();
      state.recTimer = setInterval(function () {
        els.recClock.textContent = E.formatClock(Date.now() - state.recStart);
        if (Date.now() - state.recStart > E.MAX_CLIP_MS) stopRecord();
      }, 100);
      renderRecCard();
    }).catch(function () {
      toast('Microphone permission was refused.');
    });
  }

  function stopRecord() {
    if (!state.recording) return;
    state.recording = false;
    clearInterval(state.recTimer);
    try { state.recorder.stop(); } catch (e) {}
    renderRecCard();
  }

  function finishRecording(chunks, mime, elapsedMs) {
    var check = E.validateRecording(elapsedMs);
    if (!check.ok) { toast(check.reason); return; }
    var blob = new window.Blob(chunks, { type: mime || 'audio/webm' });
    if (!blob.size) { toast('Nothing came through the microphone.'); return; }
    var name = E.defaultName(names());
    addClip(blob, name, elapsedMs);
  }

  function importFiles(files) {
    var list = Array.prototype.slice.call(files || []);
    list.forEach(function (file) {
      var base = String(file.name || '').replace(/\.[a-z0-9]+$/i, '');
      var name = E.uniqueName(base, names());
      addClip(file, name, 0);
    });
  }

  // Shared tail for record + import: decode peaks (and true duration where
  // the browser can), build the engine record, persist, render.
  function addClip(blob, name, fallbackMs) {
    decodeAudio(blob, function (peaks, decodedMs) {
      var durationMs = decodedMs || fallbackMs;
      var check = E.validateRecording(durationMs);
      if (durationMs && !check.ok) { toast('“' + name + '”: ' + check.reason); return; }
      var clip = E.makeClip({ name: name, durationMs: durationMs, bytes: blob.size, type: blob.type }, Date.now());
      clip.peaks = peaks || E.pseudoPeaks(clip.id, PEAK_BARS);
      clip.blob = blob;
      state.clips.push(clip);
      putRec(clip);
      render();
      toast('“' + clip.name + '” is on the board — tap it to play.');
    });
  }

  function decodeAudio(blob, cb) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !blob.arrayBuffer) return cb(null, 0);
    blob.arrayBuffer().then(function (buf) {
      var ac = new AC();
      var done = function (peaks, ms) { try { ac.close(); } catch (e) {} cb(peaks, ms); };
      ac.decodeAudioData(buf, function (audio) {
        done(E.normalizePeaks(audio.getChannelData(0), PEAK_BARS), Math.round(audio.duration * 1000));
      }, function () { done(null, 0); });
    }).catch(function () { cb(null, 0); });
  }

  /* ---------------- playback: tap a voice, hear a voice ---------------- */

  function byId(id) {
    for (var i = 0; i < state.clips.length; i++) if (state.clips[i].id === id) return state.clips[i];
    return null;
  }
  function names() {
    return state.clips.map(function (c) { return c.name; });
  }
  function visible() {
    return E.sortClips(E.filterClips(state.clips, state.query), state.sort);
  }

  function clipURL(rec) {
    if (!state.urls[rec.id]) state.urls[rec.id] = window.URL.createObjectURL(rec.blob);
    return state.urls[rec.id];
  }

  function ensureAudio() {
    if (state.audio) return state.audio;
    var a = new window.Audio();
    a.addEventListener('ended', onEnded);
    a.addEventListener('timeupdate', onTime);
    a.addEventListener('error', function () { stopPlayback(); });
    state.audio = a;
    return a;
  }

  function playClip(id) {
    var rec = byId(id);
    if (!rec || !rec.blob) return;
    var a = ensureAudio();
    if (state.playingId === id) {
      if (a.paused) { a.play(); state.paused = false; }
      else { a.pause(); state.paused = true; }
      render();
      return;
    }
    a.src = clipURL(rec);
    state.playingId = id;
    state.paused = false;
    rec.plays = (rec.plays || 0) + 1;
    putRec(rec);
    a.play();
    render();
  }

  function stopPlayback() {
    if (state.audio) { try { state.audio.pause(); } catch (e) {} }
    state.playingId = null; state.paused = false;
    state.queue = null; state.qi = -1;
    render();
  }

  function startQueue(shuffle) {
    var ids = E.buildQueue(visible(), { shuffle: shuffle, seed: String(Date.now()) });
    if (!ids.length) { toast('Nothing on the board yet — record or add a voice first.'); return; }
    state.queue = ids;
    state.qi = 0;
    playClip(ids[0]);
  }

  function skip(dir) {
    if (!state.queue) { stopPlayback(); return; }
    // Manual skips always move, even on repeat-one.
    var repeat = state.repeat === 'one' ? 'all' : state.repeat;
    var next = E.stepQueue(state.queue.length, state.qi, dir, repeat);
    if (next === -1) { stopPlayback(); return; }
    state.qi = next;
    playClip(state.queue[next]);
  }

  function onEnded() {
    if (state.queue) {
      var next = E.stepQueue(state.queue.length, state.qi, 1, state.repeat);
      if (next === -1) { stopPlayback(); return; }
      state.qi = next;
      var id = state.queue[next];
      if (id === state.playingId) { state.audio.currentTime = 0; state.audio.play(); }
      else playClip(id);
      return;
    }
    if (state.repeat === 'one' && state.playingId) {
      state.audio.currentTime = 0;
      state.audio.play();
      return;
    }
    state.playingId = null; state.paused = false;
    render();
  }

  function onTime() {
    if (!state.playingId || !state.audio) return;
    var rec = byId(state.playingId);
    var durMs = (rec && rec.durationMs) || state.audio.duration * 1000;
    var frac = E.playbackProgress(state.audio.currentTime * 1000, durMs);
    var wave = document.querySelector('[data-wave="' + state.playingId + '"]');
    if (!wave) return;
    var bars = wave.children;
    for (var i = 0; i < bars.length; i++) {
      bars[i].className = (i + 0.5) / bars.length <= frac ? 'lit' : '';
    }
  }

  /* ---------------- renaming & removing ---------------- */

  function renameClip(id) {
    var rec = byId(id);
    if (!rec) return;
    var input = prompt('Rename this voice', rec.name);
    if (input == null) return;
    var others = names().filter(function (n) { return n !== rec.name; });
    var check = E.validateName(input, others);
    if (!check.ok) { toast(check.reason); return; }
    rec.name = check.name;
    putRec(rec);
    render();
  }

  function removeClip(id) {
    var rec = byId(id);
    if (!rec) return;
    if (!confirm('Delete “' + rec.name + '”? This voice is gone for good.')) return;
    if (state.playingId === id) stopPlayback();
    state.clips = state.clips.filter(function (c) { return c.id !== id; });
    deleteRec(id);
    if (state.urls[id]) { try { window.URL.revokeObjectURL(state.urls[id]); } catch (e) {} delete state.urls[id]; }
    render();
  }

  /* ---------------- rendering ---------------- */

  function waveHTML(rec, playing) {
    var peaks = rec.peaks && rec.peaks.length ? rec.peaks : E.pseudoPeaks(rec.id, PEAK_BARS);
    var bars = '';
    for (var i = 0; i < peaks.length; i++) {
      bars += '<i style="height:' + Math.max(9, Math.round(peaks[i] * 100)) + '%"></i>';
    }
    return '<div class="wave"' + (playing ? ' data-wave="' + rec.id + '"' : '') + '>' + bars + '</div>';
  }

  function renderList() {
    var rows = visible();
    if (!rows.length) {
      var searching = !!E.cleanName(state.query);
      els.list.innerHTML =
        '<div class="empty"><div class="big">🦜</div>' +
        (searching
          ? 'No voice on the board matches that.'
          : '<b>Nothing on the board yet.</b><br>Hit the mic to record a voice, or add a pre-recorded audio file — then it’s one tap away, forever.') +
        '</div>';
      return;
    }
    var now = Date.now();
    var html = '';
    for (var i = 0; i < rows.length; i++) {
      var rec = rows[i];
      var style = E.clipStyle(rec.id);
      var playing = rec.id === state.playingId;
      var playGlyph = playing && !state.paused ? '⏸' : '▶';
      html +=
        '<div class="tile' + (playing ? ' playing' : '') + '" data-id="' + rec.id + '">' +
          '<div class="face" style="background:hsl(' + style.hue + ' 45% 22%)">' + style.emoji + '</div>' +
          '<div class="tinfo">' +
            '<div class="tname">' + E.escapeHTML(rec.name) + '</div>' +
            '<div class="tmeta">' + E.formatClock(rec.durationMs) + ' · ' + E.timeAgo(rec.ts, now) +
              ' · ' + E.formatBytes(rec.bytes) +
              (rec.plays ? ' · ' + rec.plays + '×' : '') + '</div>' +
            waveHTML(rec, playing) +
          '</div>' +
          '<div class="tacts">' +
            '<button class="play" data-act="play" title="Play">' + playGlyph + '</button>' +
            '<button data-act="rename" title="Rename">✏️</button>' +
            '<button data-act="delete" title="Delete">✕</button>' +
          '</div>' +
        '</div>';
    }
    els.list.innerHTML = html;
  }

  function renderRecCard() {
    if (state.recording) {
      els.recCard.classList.add('live');
      els.recBtn.classList.add('live');
      els.recBtn.textContent = '⏹';
      els.recTitle.textContent = 'Recording…';
      els.recClock.textContent = '0:00';
    } else {
      els.recCard.classList.remove('live');
      els.recBtn.classList.remove('live');
      els.recBtn.textContent = '🎙️';
      els.recTitle.textContent = canRecord ? 'Record a voice' : 'Add a voice';
      els.recHint.textContent = canRecord
        ? 'Tap, speak, tap again — it lands on the board.'
        : 'No microphone here — add a pre-recorded audio file.';
    }
  }

  function renderNowBar() {
    var rec = state.playingId ? byId(state.playingId) : null;
    if (!rec) { els.nowbar.classList.remove('on'); return; }
    els.nowbar.classList.add('on');
    var pos = state.queue ? ' (' + (state.qi + 1) + '/' + state.queue.length + ')' : '';
    els.nowName.textContent = (state.paused ? '⏸ ' : '') + rec.name + pos;
  }

  function render() {
    els.stats.textContent = E.libraryStats(state.clips).label;
    els.repeatBtn.textContent = '↻ ' + state.repeat;
    renderList();
    renderNowBar();
  }

  var toastTimer = 0;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { els.toast.classList.remove('on'); }, 2600);
  }

  /* ---------------- wiring ---------------- */

  els.recBtn.addEventListener('click', toggleRecord);
  els.importBtn.addEventListener('click', function () { els.filePick.click(); });
  els.filePick.addEventListener('change', function () {
    importFiles(els.filePick.files);
    els.filePick.value = '';
  });
  els.playAllBtn.addEventListener('click', function () { startQueue(false); });
  els.shuffleBtn.addEventListener('click', function () { startQueue(true); });
  els.repeatBtn.addEventListener('click', function () {
    state.repeat = E.nextRepeat(state.repeat);
    savePrefs();
    render();
  });
  els.sortSel.addEventListener('change', function () {
    state.sort = String(els.sortSel.value);
    savePrefs();
    render();
  });
  els.searchBox.addEventListener('input', function () {
    state.query = String(els.searchBox.value);
    renderList();
  });
  els.prevBtn.addEventListener('click', function () { skip(-1); });
  els.nextBtn.addEventListener('click', function () { skip(1); });
  els.stopBtn.addEventListener('click', stopPlayback);

  // One delegated handler for every tile: play on the tile, act on the buttons.
  els.list.addEventListener('click', function (ev) {
    var t = ev.target;
    var act = null, id = null;
    while (t && t !== els.list) {
      if (!act && t.getAttribute && t.getAttribute('data-act')) act = t.getAttribute('data-act');
      if (t.getAttribute && t.getAttribute('data-id')) { id = t.getAttribute('data-id'); break; }
      t = t.parentNode;
    }
    if (!id) return;
    if (act === 'rename') renameClip(id);
    else if (act === 'delete') removeClip(id);
    else playClip(id);
  });

  /* ---------------- boot ---------------- */

  els.sortSel.value = state.sort;
  renderRecCard();
  render();

  openDB(function (opened) {
    db = opened;
    loadAll(function (recs) {
      state.clips = recs;
      render();
    });
  });

  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
