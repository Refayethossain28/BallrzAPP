<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Synapse: two neuron-coins joined across the gap — the question node
       (violet, upper left) firing to the answer node (cyan, lower right),
       with the gold spark of the minted coin at the junction. Rasterized to
       icon-{180,192,512}.png by scripts/gen-synapse-icons.mjs. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f7cf7"/>
      <stop offset="0.6" stop-color="#4dd8ff"/>
      <stop offset="1" stop-color="#e8b34c"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#171236"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the question node -->
  <circle cx="160" cy="176" r="74" fill="none" stroke="#8f7cf7" stroke-width="20"/>
  <!-- the answer node -->
  <circle cx="352" cy="336" r="74" fill="none" stroke="#4dd8ff" stroke-width="20"/>
  <!-- the firing: axon from node to node, broken at the synaptic gap -->
  <line x1="212" y1="220" x2="268" y2="266" stroke="url(#g)" stroke-width="18" stroke-linecap="round"/>
  <line x1="292" y1="286" x2="300" y2="292" stroke="url(#g)" stroke-width="18" stroke-linecap="round"/>
  <!-- the minted coin: a gold spark in the gap -->
  <path d="M282 234 L292 262 L320 272 L292 282 L282 310 L272 282 L244 272 L272 262 Z" fill="#e8b34c"/>
</svg>
