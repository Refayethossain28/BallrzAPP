<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#2a2f7a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="25" y1="28" x2="47" y2="6">
      <stop offset="0" stop-color="#3ee0ff"/>
      <stop offset="1" stop-color="#7cf0ff"/>
    </linearGradient>
  </defs>
  <!-- night-navy → indigo tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- a slim aerial mast standing on a small base -->
  <g stroke="#e6ebff" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M25 28 V52"/>
    <path d="M19 52 H31"/>
  </g>
  <!-- three concentric broadcast arcs (r 8 / 15 / 22) rising from the tip to the upper right: a 45° sweep, -65° → -20° -->
  <g stroke="url(#wave)" stroke-width="3.6" stroke-linecap="round" fill="none">
    <path d="M28.381 20.750 A8 8 0 0 1 32.518 25.264"/>
    <path d="M31.339 14.405 A15 15 0 0 1 39.095 22.870"/>
    <path d="M34.298 8.061 A22 22 0 0 1 45.673 20.476"/>
  </g>
  <!-- the warm amber beacon at the mast tip -->
  <circle cx="25" cy="28" r="2.6" fill="#ffb454"/>
</svg>
