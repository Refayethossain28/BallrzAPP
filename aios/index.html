/* ── context menu (shared by desktop, icons and Files rows) ── */
var ctx = $('ctxmenu');
function hideMenu() { ctx.style.display = 'none'; }
function showMenu(x, y, items) {
  ctx.textContent = '';
  items.forEach(function (it) {
    if (it === '-') { ctx.appendChild(el('div', 'sep')); return; }
    var b = el('button', it.danger ? 'danger' : null, it.label);
    b.addEventListener('click', function () { hideMenu(); it.fn(); });
    ctx.appendChild(b);
  });
  ctx.style.display = 'block';
  var mw = ctx.offsetWidth || 190, mh = ctx.offsetHeight || 220;
  ctx.style.left = Math.max(4, Math.min(x, (window.innerWidth || 1000) - mw - 8)) + 'px';
  ctx.style.top = Math.max(4, Math.min(y, (window.innerHeight || 700) - mh - 8)) + 'px';
}
window.addEventListener('pointerdown', function (e) { if (!ctx.contains(e.target)) hideMenu(); });

function refreshAll() {
  for (var pid in runtime) if (runtime[pid].refresh) runtime[pid].refresh();
  sync();
}

/* export a virtual file to the user's real device (data: URLs download as-is) */
function downloadFile(full) {
  var r = K.fsRead(state.fs, full);
  if (!r.ok) { notify('Files', r.error); return; }
  var href = /^data:/.test(r.content) ? r.content : 'data:text/plain;charset=utf-8,' + encodeURIComponent(r.content);
  var a = el('a');
  a.href = href;
  a.download = K.splitPath(full).name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function renamePath(full) {
  var sp = K.splitPath(full);
  var nn = prompt('Rename “' + sp.name + '” to:', sp.name);
  if (!nn || nn === sp.name) return;
  var target = K.normalizePath(sp.parent, nn);
  if (K.fsGet(state.fs, target) && !confirm('“' + nn + '” already exists — replace it?')) return;
  var r = K.fsMove(state.fs, full, target, Date.now());
  if (!r.ok) notify('Files', r.error);
  refreshAll();
}

/* ── desktop icons: ~/Desktop drawn on the wallpaper ── */
function fileEmoji(name, type) {
  if (type === 'dir') return '📁';
  var ext = ((/\.([a-z0-9]+)$/i.exec(name) || [])[1] || '').toLowerCase();
  return ext === 'md' ? '📝' : ext === 'sh' ? '⚙️' : '📄';
}

function openEntry(full, type) {
  if (type === 'dir') spawnApp('files', full);
  else spawnApp('notes', full);
}

function renderDesktop() {
  var layer = $('icons');
  layer.textContent = '';
  K.pruneIconPos(state);
  var entries = K.desktopEntries(state);
  entries.forEach(function (e2, idx) {
    var pos = K.iconPos(state, e2.name, idx);
    var full = K.DESKTOP + '/' + e2.name;
    var ic = el('div', 'dicon');
    ic.style.left = pos.x + 'px';
    ic.style.top = pos.y + 'px';
    var g = el('div', 'ig', fileEmoji(e2.name, e2.type));
    ic.appendChild(g);
    ic.appendChild(el('div', 'il', e2.name));

    /* drag moves it (position remembered); a still click opens it */
    var drag = null, moved = false;
    ic.addEventListener('pointerdown', function (ev) {
      if (ev.button === 2) return;
      drag = { dx: ev.clientX - ic.offsetLeft, dy: ev.clientY - ic.offsetTop };
      moved = false;
      try { ic.setPointerCapture(ev.pointerId); } catch (err) {}
    });
    ic.addEventListener('pointermove', function (ev) {
      if (!drag) return;
      var nx = ev.clientX - drag.dx, ny = ev.clientY - drag.dy;
      if (!moved && Math.abs(nx - ic.offsetLeft) + Math.abs(ny - ic.offsetTop) < 5) return;
      moved = true;
      ic.classList.add('drag');
      ic.style.left = Math.max(0, nx) + 'px';
      ic.style.top = Math.max(0, ny) + 'px';
    });
    ic.addEventListener('pointerup', function () {
      if (!drag) return;
      ic.classList.remove('drag');
      if (moved) { K.setIconPos(state, e2.name, parseInt(ic.style.left, 10) || 0, parseInt(ic.style.top, 10) || 0); save(); }
      else openEntry(full, e2.type);
      drag = null;
    });
    ic.addEventListener('contextmenu', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      showMenu(ev.clientX, ev.clientY, [
        { label: 'Open', fn: function () { openEntry(full, e2.type); } },
        { label: 'Rename…', fn: function () { renamePath(full); } },
        '-',
        { label: 'Move to Trash', danger: true, fn: function () {
          var t = K.fsTrash(state.fs, full, Date.now());
          if (t.ok) notify('🗑 Moved to trash', e2.name + ' — restorable from the 🗑 view.');
          else notify('Desktop', t.error);
          refreshAll();
        } }
      ]);
    });
    layer.appendChild(ic);
  });
}

/* ── home-screen widgets: same cards on the phone grid and the desktop ── */
function widgetCard(id) {
  var meta = K.widgetById(id);
  var d = K.widgetData(state, id, Date.now());
  var card = el('button', 'widget' + (id === 'notes' ? ' span2' : ''));
  var cap = el('div', 'wcap');
  cap.appendChild(el('span', null, meta.emoji));
  cap.appendChild(el('span', null, meta.name));
  card.appendChild(cap);
  if (id === 'clock') {
    var now = new Date();
    card.appendChild(el('div', 'wbig', now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })));
    card.appendChild(el('div', 'wsub', now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' })));
    card.addEventListener('click', function () { openSpot(); });
  } else if (id === 'notes') {
    if (d.empty) card.appendChild(el('div', 'wsub', 'No notes yet — say “note that…”'));
    else {
      card.appendChild(el('div', 'wline', d.title));
      d.preview.slice(0, 2).forEach(function (l) { var ln = el('div', 'wline', l); ln.style.color = 'rgba(255,255,255,.55)'; card.appendChild(ln); });
      card.addEventListener('click', function () { spawnApp('notes', d.path); });
    }
  } else if (id === 'automations') {
    if (!d.count) card.appendChild(el('div', 'wsub', 'Nothing scheduled'));
    else {
      card.appendChild(el('div', 'wbig', d.nextIn < 60 ? d.nextIn + 's' : Math.round(d.nextIn / 60) + 'm'));
      card.appendChild(el('div', 'wsub', 'until: ' + d.nextCommand.slice(0, 40)));
    }
    card.addEventListener('click', function () { spawnApp('automations'); });
  } else if (id === 'system') {
    card.appendChild(el('div', 'wline', '✦ AIOS ' + d.version + ' · ' + d.windows + ' window' + (d.windows === 1 ? '' : 's')));
    card.appendChild(el('div', 'wline', (d.diskBytes / 1024).toFixed(1) + ' KB disk · ' + d.installed + ' installed'));
    if (d.lastJournal) { var lj = el('div', 'wline', '» ' + d.lastJournal); lj.style.color = 'rgba(255,255,255,.5)'; card.appendChild(lj); }
    card.addEventListener('click', function () { spawnApp('monitor'); });
  }
  return card;
}

function widgetPicker(x, y) {
  showMenu(x, y, K.WIDGETS.map(function (w) {
    var on = state.widgets.indexOf(w.id) !== -1;
    return { label: (on ? '✓ ' : '＋ ') + w.emoji + ' ' + w.name, fn: function () {
      if (on) K.removeWidget(state, w.id); else K.addWidget(state, w.id);
      if (MOBILE) buildSpringboard(); else renderWidgets();
      save();
    } };
  }));
}

function renderWidgets() {
  var host = MOBILE ? $('p-widgets') : $('d-widgets');
  var other = MOBILE ? $('d-widgets') : $('p-widgets');
  if (other) other.textContent = '';
  if (!host) return;
  host.textContent = '';
  state.widgets.forEach(function (id) {
    if (K.widgetById(id)) host.appendChild(widgetCard(id));
  });
  var add = el('button', 'widget addw', '＋ widgets');
  add.addEventListener('click', function (e) { widgetPicker(e.clientX || 80, e.clientY || 120); });
  host.appendChild(add);
}
setInterval(function () { if (document.hasFocus && document.hasFocus()) renderWidgets(); }, 30000);

/* right-click the wallpaper: create things right where you clicked */
function newDesktopItem(kind, x, y) {
  var name = prompt(kind === 'dir' ? 'New folder name:' : 'New file name:', kind === 'dir' ? 'New folder' : 'untitled.md');
  if (!name) return;
  var full = K.normalizePath(K.DESKTOP, name);
  if (K.fsGet(state.fs, full)) { notify('Desktop', '“' + name + '” already exists here.'); return; }
  var r = kind === 'dir' ? K.fsMkdir(state.fs, full, Date.now()) : K.fsWrite(state.fs, full, '', Date.now());
  if (!r.ok) { notify('Desktop', r.error); return; }
  K.setIconPos(state, K.splitPath(full).name, Math.max(0, x - 42), Math.max(0, y - 90));
  refreshAll();
  if (kind !== 'dir') spawnApp('notes', full);
}
$('wallpaper').addEventListener('contextmenu', function (ev) {
  ev.preventDefault();
  var x = ev.clientX, y = ev.clientY;
  showMenu(x, y, [
    { label: '📄 New file here…', fn: function () { newDesktopItem('file', x, y); } },
    { label: '📁 New folder here…', fn: function () { newDesktopItem('dir', x, y); } },
    '-',
    { label: '⌨️ Open Terminal', fn: function () { spawnApp('terminal'); } },
    { label: '✦ Ask AIOS  (Ctrl/Cmd-K)', fn: function () { openSpot(); } },
    '-',
    { label: '⟲ Arrange icons', fn: function () { state.desktop = {}; sync(); } }
  ]);
});

/* ── start menu: every app (built-in AND installed) one click from ✦ ── */

/* dock */
(function buildDock() {

  trash.appendChild(tic);
  trash.addEventListener('click', function () { spawnApp('files', K.TRASH); });
  dock.appendChild(trash);
})();

/* macOS menu bar: the ✦ menu plus File / Go / Window / Help, each a real
   dropdown wired to existing OS actions (reuses the context-menu renderer). */
(function buildMenuBar() {
  var bar = $('menubar');
  var anchor = $('mb-ws');
  function topPid() { var t = K.topProc(state); return t ? t.pid : null; }
  var MENUS = [
    { name: 'File', items: function () { return [
      { label: '📄 New File on Desktop…', fn: function () { newDesktopItem('file', 90, 90); } },
      { label: '📁 New Folder on Desktop…', fn: function () { newDesktopItem('dir', 90, 90); } },
      '-',
      { label: '⌨️ Open Terminal', fn: function () { spawnApp('terminal'); } }
    ]; } },
    { name: 'Go', items: function () { return [
      { label: '🏠 Home', fn: function () { spawnApp('files', '/home/user'); } },
      { label: '🛍️ Applications', fn: function () { spawnApp('store'); } },
      { label: '🗑 Trash', fn: function () { spawnApp('files', K.TRASH); } }
    ]; } },
    { name: 'Window', items: function () {
      var pid = topPid();
      if (!pid) return [{ label: '(no windows)', fn: function () {} }];
      return [
        { label: 'Minimize', fn: function () { K.minimizeProc(state, pid); sync(); } },
        { label: 'Zoom', fn: function () { K.maximizeProc(state, pid); sync(); } },
        { label: 'Tile Left', fn: function () { K.snapProc(state, pid, 'left'); sync(); } },
        { label: 'Tile Right', fn: function () { K.snapProc(state, pid, 'right'); sync(); } },
        '-',
        { label: 'Close', danger: true, fn: function () { K.closeProc(state, pid); sync(); } }
      ];
    } },
    { name: 'Help', items: function () { return [
      { label: '✦ About AIOS', fn: function () { spawnApp('about'); } },
      { label: '💬 Ask AIOS  (⌘K)', fn: function () { openSpot(); } }
    ]; } }
  ];
  MENUS.forEach(function (m) {
    var b = el('button', 'mbmenu', m.name);
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      var r = b.getBoundingClientRect();
      showMenu(r.left, r.bottom + 2, m.items());
    });
    bar.insertBefore(b, anchor);
  });
})();

/* workspace pills */
(function buildWs() {
  var wsEl = $('mb-ws');
  for (var n = 1; n <= K.WS_COUNT; n++) {
    (function (num) {
      var b = el('button', num === 1 ? 'on' : null, String(num));
      b.addEventListener('click', function () { K.switchWorkspace(state, num); sync(); });
      wsEl.appendChild(b);
    })(n);
  }
})();

/* the automation ticker — the OS runs itself while the desktop is open */
setInterval(function () {
  var due = K.dueAutomations(state, Date.now());
  if (!due.length) return;
  for (var i = 0; i < due.length; i++) {
    var r = K.execCommand(state, due[i].command, Date.now());
    notify('🤖 ' + due[i].command, r.out.slice(0, 3).join('\n') || (r.error ? 'failed' : 'done'));
    applyEffects(r.effects);
  }
  for (var pid in runtime) if (runtime[pid].refresh) runtime[pid].refresh();
  sync();
}, 15000);

/* clock */
function tickClock() {
  var d = new Date();
  $('mb-clock').textContent = d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }) +
    '  ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  var pc = $('p-clock');
  if (pc) pc.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
tickClock();
setInterval(tickClock, 15000);

/* spotlight */
var spot = $('spot'), spotIn = $('spot-in'), spotPrev = $('spot-prev');
function openSpot() { spot.classList.add('open'); spotIn.value = ''; previewSpot(); setTimeout(function () { spotIn.focus(); }, 30); }
function closeSpot() { spot.classList.remove('open'); }
function previewSpot() {
  var q = spotIn.value.trim();
  if (!q) { spotPrev.innerHTML = 'Press <span class="tag">Enter</span> to run · <span class="tag">Esc</span> to close'; return; }
  var it = K.routeIntent(q);
  var desc = {
    open_app: 'Open ' + ((K.appById(it.app) || {}).name || ''),
    calc: '= ' + (typeof it.value === 'number' ? Math.round(it.value * 1e6) / 1e6 : ''),
    convert: it.conv ? '= ' + it.conv.value + ' ' + it.conv.to : '',
    datemath: (function () { var d = K.dateMath(it.text || '', Date.now()); return d ? d.text : 'Date arithmetic'; })(),
    timer: 'Start a ' + it.seconds + 's timer',
    note: 'Save a note',
    search: 'Search file names for “' + (it.q || '') + '”',
    content_search: 'Search file contents for “' + (it.q || '') + '”',
    mkdir: 'Create folder “' + (it.name || '') + '”',
    time: 'Tell the time',
    workspace: 'Switch to workspace ' + (it.n || ''),
    set_name: 'Call you ' + (it.name || ''),
    set_accent: 'Switch accent to ' + (it.accent || ''),
    help: 'Show what I can do',
    chat: 'Ask the Assistant'
  }[it.type] || '';
  spotPrev.textContent = '';
  var tag = el('span', 'tag', '✦ ');
  spotPrev.appendChild(tag);
  spotPrev.appendChild(document.createTextNode(desc));
}
spotIn.addEventListener('input', previewSpot);
spot.addEventListener('click', function (e) { if (e.target === spot) closeSpot(); });
spotIn.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeSpot(); return; }
  if (e.key !== 'Enter') return;
  var q = spotIn.value.trim();
  if (!q) { closeSpot(); return; }
  var it = K.routeIntent(q);
  if (it.type === 'chat') { closeSpot(); spawnApp('assistant'); return; }
  var a = K.assistant(state, q, Date.now());
  closeSpot();
  notify('✦ AIOS', a.reply);
  applyEffects(a.actions);
  for (var pid in runtime) if (runtime[pid].refresh) runtime[pid].refresh();
});
window.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { hideMenu(); closeStart(); return; }
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    if (spot.classList.contains('open')) closeSpot(); else openSpot();
    return;
  }
  /* window tiling & workspaces: Ctrl/Cmd-Alt + arrows / digits */
  if ((e.metaKey || e.ctrlKey) && e.altKey) {
    if (e.key >= '1' && e.key <= String(K.WS_COUNT)) {
      K.switchWorkspace(state, Number(e.key)); sync(); e.preventDefault(); return;
    }
    var top = K.topProc(state);
    if (!top) return;
    if (e.key === 'ArrowLeft') { K.snapProc(state, top.pid, 'left'); sync(); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { K.snapProc(state, top.pid, 'right'); sync(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { K.maximizeProc(state, top.pid); sync(); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { K.minimizeProc(state, top.pid); sync(); e.preventDefault(); }
  }
});
$('wallmark').addEventListener('click', openSpot);

/* voice control — the OS you can talk to. Uses the browser's on-device
 * Web Speech API where present; each utterance runs through the same
 * assistant path as typing, so voice has exactly the OS's full vocabulary. */
(function voice() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var mic = $('mb-mic');
  if (!SR) return; // unsupported browser — stay hidden, everything else works
  mic.style.display = 'inline-block';
  var rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  var on = false;
  mic.addEventListener('click', function () {
    if (on) { rec.stop(); return; }
    try { rec.start(); } catch (e) {}
  });
  rec.addEventListener('start', function () { on = true; mic.classList.add('listening'); });
  rec.addEventListener('end', function () { on = false; mic.classList.remove('listening'); });
  rec.addEventListener('error', function (e) {
    on = false; mic.classList.remove('listening');
    if (e && e.error === 'not-allowed') notify('🎙 Voice', 'Microphone permission denied — allow it in your browser to talk to AIOS.');
  });
  rec.addEventListener('result', function (e) {
    var text = e.results[0][0].transcript.trim();
    if (!text) return;
    var it = K.routeIntent(text);
    var a = K.assistant(state, text, Date.now());
    notify('🎙 “' + text + '”', a.reply);
    applyEffects(a.actions);
    for (var pid in runtime) if (runtime[pid].refresh) runtime[pid].refresh();
    sync();
  });
})();

/* live AI availability — the optional proxy, if one is serving us
   (BYOK needs no server: liveReady() also checks for a linked key) */
fetch('api/health').then(function (r) { return r.json(); }).then(function (d) {
  if (d && d.live) { liveAI.proxy = true; refreshLiveSwitches(); }
}).catch(function () {});

/* ══════════════ mobile shell ══════════════
 * The same kernel and the SAME app renderers, presented as a phone: a
 * springboard of icons, one fullscreen app at a time, a home bar and an
 * app switcher — instead of draggable windows. Desktop chrome is hidden by
 * CSS (body.mobile); sync() short-circuits to phoneChrome(). */
var MOBILE = false;
/* Installed as a PWA? Then the device shows a REAL status bar above us —
   hide our imitation one (CSS keys off body.standalone). */
try {
  if (window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches === true)) {
    document.body.classList.add('standalone');
  }
} catch (e) {}
var LAYOUT_KEY = 'aios.layout'; // 'auto' | 'phone' | 'desktop' (device preference, not disk state)
function getLayout() {
  try {
    var q = new URLSearchParams(location.search).get('layout');
    if (q === 'phone' || q === 'desktop') return q;
    return localStorage.getItem(LAYOUT_KEY) || 'auto';
  } catch (e) { return 'auto'; }
}
function setLayout(v) { try { localStorage.setItem(LAYOUT_KEY, v); } catch (e) {} }
function detectMobile() {
  var forced = getLayout();
  if (forced === 'phone') return true;
  if (forced === 'desktop') return false;
  try {
    var narrow = (window.innerWidth || 1024) <= 640;
    var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    return narrow || (coarse && (window.innerWidth || 1024) < 820);
  } catch (e) { return false; }
}

function phoneIcon(entry, big) {
  var b = el('button', 'p-icon');
  b.dataset.app = entry.id;
  if (entry.arg) b.dataset.userapp = entry.arg;
  var ic = el('div', 'pi', entry.emoji);
  b.appendChild(ic);
  if (!big) b.appendChild(el('div', 'pl', entry.name));
  b.addEventListener('click', function () { spawnApp(entry.id, entry.arg); });
  return b;
}

var ROW_H = 104; // one icon row (icon + label + gap), px

/* Lay out the home screen as swipeable pages. Widgets sit at the top of page
 * 1 (spanning the grid), so page 1 holds fewer icons and pages 2+ are full. */
function buildSpringboard() {
  var sb = K.springboard(state);
  var grid = $('p-grid');
  var widgetsEl = $('p-widgets');          // captured before we clear the grid…
  grid.textContent = '';                    // …so the detached node survives here
  var gridH = grid.clientHeight;
  if (gridH < 120) gridH = Math.max(360, (window.innerHeight || 780) - 250); // pre-layout estimate
  var rows = Math.max(3, Math.floor(gridH / ROW_H));
  var perFull = rows * 4;

  var pages = [];
  var page1 = el('div', 'p-page');
  page1.appendChild(widgetsEl);            // widgets → page 1, full width
  grid.appendChild(page1);
  renderWidgets();                          // fill the widget cards (in page 1 now)
  var wh = widgetsEl.offsetHeight || 0;
  var widgetRows = wh ? Math.ceil((wh + 18) / ROW_H) : 0;
  var per1 = Math.max(4, (rows - widgetRows) * 4);

  var idx = 0;
  for (; idx < per1 && idx < sb.grid.length; idx++) page1.appendChild(phoneIcon(sb.grid[idx], false));
  pages.push(page1);
  while (idx < sb.grid.length) {
    var pg = el('div', 'p-page');
    for (var k = 0; k < perFull && idx < sb.grid.length; k++, idx++) pg.appendChild(phoneIcon(sb.grid[idx], false));
    grid.appendChild(pg);
    pages.push(pg);
  }

  /* page dots (only with more than one page) */
  var dots = $('p-dots'); dots.textContent = '';
  if (pages.length > 1) pages.forEach(function (_, i) { dots.appendChild(el('span', 'dot' + (i === 0 ? ' on' : ''))); });
  grid.onscroll = function () {
    if (!grid.clientWidth) return;
    var at = Math.round(grid.scrollLeft / grid.clientWidth);
    var ds = dots.querySelectorAll('.dot');
    for (var j = 0; j < ds.length; j++) ds[j].classList.toggle('on', j === at);
  };

  var dock = $('p-dock'); dock.textContent = '';
  sb.dock.forEach(function (e) { dock.appendChild(phoneIcon(e, true)); });

  /* first paint may report gridH=0; once the real height lands, re-paginate
     if the row count changed (converges in ≤2 passes, never loops) */
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(function () {
      if (!MOBILE) return;
      var h = grid.clientHeight;
      if (h > 120 && Math.max(3, Math.floor(h / ROW_H)) !== rows) buildSpringboard();
    });
  }
}

var phoneCur = null; // pid of the app shown fullscreen
function phoneOpenProc(proc) {
  phoneCur = proc.pid;
  var host = $('p-appbody');
  host.className = ''; host.id = 'p-appbody'; host.textContent = '';
  $('p-apptitle').textContent = (proc.emoji || (K.appById(proc.app) || {}).emoji || '') + ' ' + proc.title;
  var render = APP_RENDER[proc.app] || APP_RENDER.about;
  render(proc, host);
  $('p-app').classList.add('open');
}

function phoneHome() { $('p-app').classList.remove('open'); phoneCur = null; buildSpringboard(); phoneChrome(); }

function phoneChrome() {
  $('p-live').style.display = (liveAI.on && liveReady()) ? 'inline' : 'none';
}

function phoneSwitcher(openIt) {
  var sw = $('p-switcher');
  if (!openIt) { sw.classList.remove('open'); return; }
  var listEl = $('p-switcher-list'); listEl.textContent = '';
  if (!state.procs.length) listEl.appendChild(el('div', 'empty', 'No open apps.'));
  state.procs.slice().reverse().forEach(function (p) {
    var card = el('div', 'p-card');
    card.appendChild(el('span', 'pc-emoji', p.emoji || (K.appById(p.app) || {}).emoji || '🧩'));
    card.appendChild(el('span', 'pc-name', p.title));
    var x = el('button', 'pc-close', '✕');
    x.addEventListener('click', function (e) {
      e.stopPropagation();
      K.closeProc(state, p.pid); delete runtime[p.pid];
      if (phoneCur === p.pid) { phoneCur = null; $('p-app').classList.remove('open'); }
      phoneSwitcher(true); buildSpringboard(); save();
    });
    card.appendChild(x);
    card.addEventListener('click', function () { phoneSwitcher(false); K.focusProc(state, p.pid); phoneOpenProc(p); });
    listEl.appendChild(card);
  });
  sw.classList.add('open');
}

function applyMobile() {
  var m = detectMobile();
  if (m === MOBILE && document.body.classList.contains('mobile') === m) return;
  MOBILE = m;
  document.body.classList.toggle('mobile', m);
  if (m) { buildSpringboard(); phoneChrome(); }
  else { sync(); } // returning to desktop rebuilds windows from the same procs
}

$('p-back').addEventListener('click', phoneHome);
$('p-homebar').addEventListener('click', phoneHome);
$('p-switch').addEventListener('click', function () { phoneSwitcher(true); });
$('p-switcher-close').addEventListener('click', function () { phoneSwitcher(false); });
$('p-switcher').addEventListener('click', function (e) { if (e.target === $('p-switcher')) phoneSwitcher(false); });
$('p-search').addEventListener('click', openSpot);
window.addEventListener('resize', applyMobile);

/* boot */
setTimeout(function () { $('bootfill').style.width = '100%'; }, 60);
setTimeout(function () { $('boot').classList.add('gone'); }, 1050);

applyMobile();

/* first run: greet; returning users get their desktop/home */
if (!saved) {
  if (!MOBILE) spawnApp('assistant');
  notify('✦ Welcome to AIOS', MOBILE ? 'Tap an app, or the search bar to just say what you want.' : 'Press Ctrl/Cmd-K anywhere and just say what you want.');
} else if (!MOBILE) {
  sync();
}

/* ── Cloud sync (optional): mirror the disk to Firestore so AIOS follows you
 *    across devices. Dormant unless config.js provides a Firebase project —
 *    offline stays the zero-setup default. Pattern mirrors Ripple/Concierge. */
var cloud = { status: 'off', push: null, uid: null };
(function initCloud() {
  var cfg = window.AIOS_FIREBASE_CONFIG;
  if (!cfg) return; // offline mode — nothing loads, nothing syncs
  cloud.status = 'connecting';
  var VER = '10.12.2', parts = ['app', 'auth', 'firestore'];
  function load(i) {
    if (i >= parts.length) return Promise.resolve();
    if (typeof firebase !== 'undefined' && firebase.firestore && firebase.auth) return Promise.resolve();
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = 'https://www.gstatic.com/firebasejs/' + VER + '/firebase-' + parts[i] + '-compat.js';
      s.onload = function () { load(i + 1).then(res, rej); };
      s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  load(0).then(function () {
    var app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
    var auth = firebase.auth(app), db = firebase.firestore(app);
    return auth.signInAnonymously().then(function () { return new Promise(function (r) { auth.onAuthStateChanged(function (u) { if (u) r(u); }); }); })
      .then(function (user) {
        cloud.uid = user.uid;
        var ref = db.collection('aios_disks').doc(user.uid);
        // pull remote once; adopt it if it exists (last-write-wins on this device open)
        return ref.get().then(function (snap) {
          if (snap.exists && snap.data() && typeof snap.data().disk === 'string') {
            try {
              state = K.deserialize(snap.data().disk, Date.now());
              save(); sync(); refreshAll && refreshAll();
              notify('☁️ Synced', 'Restored your AIOS from the cloud.');
            } catch (e) {}
          }
          cloud.status = 'on';
          var timer = null;
          cloud.push = function () {
            if (timer) clearTimeout(timer);
            timer = setTimeout(function () {
              ref.set({ disk: K.serialize(state), updatedAt: Date.now() }).catch(function () {});
            }, 1500); // debounce writes
          };
          cloud.push();
        });
      });
  }).catch(function () { cloud.status = 'error'; });
})();

/* offline */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
