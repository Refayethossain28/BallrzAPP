<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07091a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIOS">
<meta name="description" content="AIOS — the AI operating system. A desktop that boots in your browser: windows, a real shell, a virtual disk, and an assistant that runs the OS in plain English. On-device, no account.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>AIOS — the AI operating system</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#07091a; --glass:rgba(16,20,42,.78); --glass2:rgba(22,27,54,.9);
    --line:rgba(255,255,255,.1); --ink:#eef1fb; --dim:#9aa6c8; --faint:#67729a;
    --ok:#39e6b4; --warn:#ffb454; --bad:#ff6b81; --shadow:0 24px 70px rgba(0,0,0,.55);
  }
  body[data-accent="violet"]{ --a:#8b7cff; --b:#6e8bff; }
  body[data-accent="teal"]  { --a:#39e6b4; --b:#3fb8ff; }
  body[data-accent="blue"]  { --a:#5b9dff; --b:#7c6fff; }
  body[data-accent="rose"]  { --a:#ff6b9d; --b:#b07cff; }
  body[data-accent="amber"] { --a:#ffb454; --b:#ff7a6b; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden; user-select:none;-webkit-user-select:none;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}

  /* ── wallpaper ── */
  #desktop{position:fixed;inset:0;overflow:hidden}
  #wallpaper{position:absolute;inset:0;transition:background 1s;
    background:
      radial-gradient(1100px 700px at 74% -10%, color-mix(in srgb, var(--a) 26%, transparent) 0, transparent 62%),
      radial-gradient(900px 680px at -6% 108%, color-mix(in srgb, var(--b) 20%, transparent) 0, transparent 58%),
      var(--bg);}
  #wallpaper::after{content:"";position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(80% 70% at 50% 40%,#000 30%,transparent 100%);}
  #wallmark{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:.8}
  #wallmark .glyph{font-size:76px;line-height:1;
    background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 8px 30px color-mix(in srgb, var(--a) 45%, transparent))}
  #wallmark .word{margin-top:8px;font-size:13px;letter-spacing:.42em;color:var(--faint);text-transform:uppercase}

  /* ── desktop icons ── */
  #icons{position:absolute;inset:34px 0 0 0;pointer-events:none}
  .dicon{position:absolute;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:6px 2px 8px;border-radius:12px;pointer-events:auto;touch-action:none;cursor:default}
  .dicon:hover{background:rgba(255,255,255,.06)}
  .dicon.drag{opacity:.75}
  .dicon .ig{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:29px;
    background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border:1px solid var(--line);
    box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .dicon .il{font-size:11.5px;line-height:1.25;text-align:center;max-width:82px;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;
    text-shadow:0 1px 4px rgba(0,0,0,.8)}

  /* ── context menu ── */
  #ctxmenu{position:fixed;z-index:9500;min-width:180px;background:var(--glass2);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);padding:5px;display:none;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  #ctxmenu button{display:block;width:100%;text-align:left;padding:7px 12px;border-radius:8px;font-size:13.5px}
  #ctxmenu button:hover{background:rgba(255,255,255,.09)}
  #ctxmenu button.danger{color:var(--bad)}
  #ctxmenu .sep{height:1px;background:var(--line);margin:5px 6px}

  /* ── start menu ── */
  #startmenu{position:fixed;left:8px;top:38px;z-index:9400;width:292px;background:var(--glass2);
    border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:none;
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
  #startmenu.open{display:block}
  #startmenu .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  #startmenu .sapp{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:12px}
  #startmenu .sapp:hover{background:rgba(255,255,255,.08)}
  #startmenu .sapp .se{font-size:24px}
  #startmenu .sapp .sn{font-size:11px;color:var(--dim)}
  #startmenu .srow{display:flex;gap:6px;margin-top:10px}
  #startmenu .srow .btn{flex:1;text-align:center;font-size:12px}

  /* ── menu bar ── */
  #menubar{position:fixed;left:0;right:0;top:0;height:34px;z-index:5000;display:flex;align-items:center;gap:14px;
    padding:0 12px 0 14px;background:rgba(9,12,26,.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);font-size:13px}
  #menubar .brand{font-weight:700;letter-spacing:.06em;background:none;border:0;padding:2px 8px;border-radius:8px;font-size:13px}
  #menubar .brand:hover{background:rgba(255,255,255,.08)}
  #menubar .brand .g{background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  #menubar .brand .chev{color:var(--faint);font-size:10px}
  #mb-app{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #menubar .sp{flex:1}
  #mb-ws{display:flex;gap:4px}
  #mb-ws button{width:20px;height:20px;border-radius:6px;font-size:11px;color:var(--faint);
    background:rgba(255,255,255,.06);border:1px solid var(--line);padding:0}
  #mb-ws button.on{color:#0b0d20;background:linear-gradient(135deg,var(--a),var(--b));border:0;font-weight:700}
  #mb-mic{display:none;font-size:14px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);line-height:1.4}
  #mb-mic.listening{background:var(--bad);border-color:var(--bad);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  #mb-live{display:none;align-items:center;gap:5px;color:var(--ok);font-size:12px}
  #mb-live .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  #mb-owner{color:var(--faint)}
  #mb-clock{font-variant-numeric:tabular-nums;color:var(--dim)}

  /* ── windows ── */
  .win{position:absolute;min-width:280px;width:460px;max-width:calc(100vw - 16px);
    background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;overflow:hidden}
  .win.focus{border-color:color-mix(in srgb, var(--a) 45%, var(--line))}
  .win.min{display:none}
  .tbar{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:grab;border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.03);touch-action:none}
  .tbar:active{cursor:grabbing}
  .tbar .dot{width:12px;height:12px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:8px;color:transparent;padding:0}
  .tbar .close{background:#ff5f57}.tbar .mini{background:#febc2e}.tbar .maxd{background:#28c840}
  .tbar:hover .dot{color:rgba(0,0,0,.55)}
  .tbar .t{flex:1;text-align:center;font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbar .t .em{margin-right:6px}
  .wbody{flex:1;overflow:auto;min-height:60px;max-height:min(64vh,560px)}
  /* tiled window states (kernel-tracked: max / snap left / snap right) */
  .win.max{left:6px !important;top:40px !important;width:calc(100vw - 12px) !important;height:calc(100dvh - 118px)}
  .win.snapL{left:6px !important;top:40px !important;width:calc(50vw - 9px) !important;height:calc(100dvh - 118px)}
  .win.snapR{left:calc(50vw + 3px) !important;top:40px !important;width:calc(50vw - 9px) !important;height:calc(100dvh - 118px)}
  .win.max .wbody,.win.snapL .wbody,.win.snapR .wbody{max-height:none}
  .win.otherws{display:none}

  /* ── dock ── */
  #dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));z-index:5000;
    display:flex;gap:6px;padding:8px 10px;border-radius:20px;background:rgba(12,15,32,.62);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);max-width:calc(100vw - 12px);overflow-x:auto}
  #dock .dapp{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 6px;border-radius:12px;position:relative}
  #dock .dapp:hover{background:rgba(255,255,255,.08)}
  #dock .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:23px;
    background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border:1px solid var(--line)}
  #dock .dapp[data-app="assistant"] .ic{background:linear-gradient(145deg,color-mix(in srgb,var(--a) 55%,transparent),color-mix(in srgb,var(--b) 40%,transparent))}
  #dock .run{width:4px;height:4px;border-radius:50%;background:var(--a);opacity:0}
  #dock .dapp.on .run{opacity:1}

  /* ── app content ── */
  .pad{padding:12px 14px}
  .rowbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .rowbar .path{flex:1;font-size:12px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
  .btn{padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:13px}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.acc{background:linear-gradient(135deg,var(--a),var(--b));color:#0b0d20;font-weight:650;border:0}
  .flist{list-style:none;margin:0;padding:6px}
  .flist li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;cursor:pointer;font-size:14px}
  .flist li:hover{background:rgba(255,255,255,.07)}
  .flist .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flist .meta{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .flist .del{opacity:0;font-size:12px;color:var(--bad);padding:2px 6px}
  .flist li:hover .del{opacity:1}
  .empty{padding:20px;text-align:center;color:var(--faint);font-size:13px}

  .term{background:rgba(4,6,16,.72);min-height:230px;display:flex;flex-direction:column;height:100%}
  .term .tout{flex:1;overflow:auto;padding:10px 12px;margin:0;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
  .term .tout .err{color:var(--bad)}
  .term .tout .cmdline{color:var(--ok)}
  .term form{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);align-items:center}
  .term .ps1{color:var(--ok);font:12.5px ui-monospace,Menlo,monospace;white-space:nowrap}
  .term input{flex:1;background:none;border:0;outline:0;font:13px ui-monospace,Menlo,monospace;color:var(--ink)}

  .noted{display:flex;flex-direction:column;height:100%;min-height:240px}
  .noted .nedit{flex:1;display:flex;min-height:0}
  .noted textarea{flex:1;resize:none;background:none;border:0;outline:0;padding:12px 14px;color:var(--ink);
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;user-select:text;-webkit-user-select:text}
  .noted .mdprev{flex:1;overflow:auto;padding:4px 16px;user-select:text;-webkit-user-select:text;border-left:1px solid var(--line)}
  .noted .mdprev.solo{border-left:0}
  .noted .mdprev h1{font-size:22px;margin:14px 0 8px}.noted .mdprev h2{font-size:18px;margin:12px 0 6px}
  .noted .mdprev h3{font-size:15px;margin:10px 0 6px;color:var(--dim)}
  .noted .mdprev p{margin:8px 0}.noted .mdprev ul{margin:8px 0;padding-left:20px}.noted .mdprev li{margin:3px 0}
  .noted .mdprev code{background:rgba(255,255,255,.09);padding:1px 5px;border-radius:5px;font-size:12.5px}
  .noted .mdprev pre{background:rgba(4,6,16,.6);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto}
  .noted .mdprev pre code{background:none;padding:0}
  .noted .mdprev a{color:var(--a)}
  .noted .foot{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
  .noted .fpath{flex:1;font-size:11.5px;color:var(--faint);font-family:ui-monospace,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .noted .saved{color:var(--ok);font-size:12px;opacity:0;transition:opacity .25s}

  .chat{display:flex;flex-direction:column;height:100%;min-height:280px}
  .clog{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:86%;padding:8px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
  .msg.you{align-self:flex-end;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 80%,#000 8%),color-mix(in srgb,var(--b) 80%,#000 8%));color:#0b0d20;border-bottom-right-radius:4px}
  .msg.os{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.os.think{color:var(--faint)}
  /* rendered-Markdown bubbles: the OS (and Live AI) speak Markdown — show it, don't spell it */
  .msg.md{white-space:normal}
  .msg.md p{margin:0 0 8px}
  .msg.md p:last-child{margin:0}
  .msg.md ul{margin:4px 0 8px 18px;padding:0}
  .msg.md li{margin:2px 0}
  .msg.md h1,.msg.md h2,.msg.md h3{margin:6px 0 4px;font-size:15px}
  .msg.md code{background:rgba(255,255,255,.09);border-radius:4px;padding:1px 5px;font-size:12.5px}
  .msg.md pre{background:rgba(0,0,0,.3);border-radius:8px;padding:8px 10px;overflow-x:auto;margin:6px 0}
  .msg.md pre code{background:none;padding:0}
  .msg.md a{color:inherit;text-decoration:underline}
  .chat form{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
  .chat input[type=text]{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:8px 12px;outline:0}
  .chat input[type=text]:focus{border-color:color-mix(in srgb,var(--a) 55%,var(--line))}
  .chat .hint{padding:0 12px 8px;font-size:11.5px;color:var(--faint)}
  .livebar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim)}
  .livebar .sp{flex:1}
  .switch{position:relative;width:36px;height:21px;border-radius:11px;background:rgba(255,255,255,.14);transition:background .2s;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .2s}
  .switch.on{background:var(--ok)}
  .switch.on::after{left:17px}
  .switch.off-disabled{opacity:.35;pointer-events:none}

  .calcapp{display:flex;flex-direction:column;min-height:300px}
  .calcapp .cdisp{padding:16px 16px 4px;text-align:right;font:26px/1.2 ui-monospace,Menlo,monospace;
    min-height:40px;word-break:break-all;user-select:text;-webkit-user-select:text}
  .calcapp .cprev{padding:0 16px 10px;text-align:right;color:var(--dim);font:14px ui-monospace,Menlo,monospace;min-height:20px}
  .calcapp .ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;border-top:1px solid var(--line)}
  .calcapp .ckeys button{padding:12px 0;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:17px}
  .calcapp .ckeys button:hover{background:rgba(255,255,255,.13)}
  .calcapp .ckeys .op{color:var(--a);font-weight:650}
  .calcapp .ckeys .eq{background:linear-gradient(135deg,var(--a),var(--b));color:#0b0d20;font-weight:700;border:0}

  .autoapp .arow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-size:13px}
  .autoapp .arow:hover{background:rgba(255,255,255,.06)}
  .autoapp .arow .acmd{flex:1;font-family:ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .autoapp .arow .aev{color:var(--faint);white-space:nowrap}
  .autoapp .arow.paused .acmd{opacity:.45;text-decoration:line-through}
  .autoapp form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
  .autoapp input{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:0;font-size:13px}
  .autoapp .iv{width:74px}
  .autoapp .cmd{flex:1;min-width:150px;font-family:ui-monospace,Menlo,monospace}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
  .kv b{color:var(--dim);font-weight:500}
  .plist{list-style:none;margin:10px 0 0;padding:0}
  .plist li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;font-size:13.5px}
  .plist li:hover{background:rgba(255,255,255,.06)}
  .plist .pid{color:var(--faint);font-variant-numeric:tabular-nums;width:28px}
  .plist .pname{flex:1}
  .plist .kill{color:var(--bad);font-size:12px}

  .set-row{display:flex;align-items:center;gap:10px;margin:12px 0}
  .set-row label{width:88px;color:var(--dim);font-size:13.5px}
  .set-row input[type=text]{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:7px 11px;outline:0}
  .swatches{display:flex;gap:8px}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
  .sw.sel{border-color:#fff}
  .sw[data-ac="violet"]{background:linear-gradient(135deg,#8b7cff,#6e8bff)}
  .sw[data-ac="teal"]{background:linear-gradient(135deg,#39e6b4,#3fb8ff)}
  .sw[data-ac="blue"]{background:linear-gradient(135deg,#5b9dff,#7c6fff)}
  .sw[data-ac="rose"]{background:linear-gradient(135deg,#ff6b9d,#b07cff)}
  .sw[data-ac="amber"]{background:linear-gradient(135deg,#ffb454,#ff7a6b)}

  /* ── spotlight ── */
  #spot{position:fixed;inset:0;z-index:8000;display:none;background:rgba(4,6,16,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #spot.open{display:block}
  #spot .box{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:min(560px,calc(100vw - 28px));
    background:var(--glass2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  #spot input{width:100%;background:none;border:0;outline:0;padding:15px 18px;font-size:17px}
  #spot .prev{padding:0 18px 13px;font-size:13px;color:var(--dim);min-height:18px}
  #spot .prev .tag{color:var(--a);font-weight:600}

  /* ── phone shell (hidden until body.mobile) ── */
  #phone{display:none}
  body.mobile #phone{display:block;position:fixed;inset:0;z-index:6000}
  /* in mobile mode, hide all desktop chrome */
  body.mobile #menubar,body.mobile #dock,body.mobile #windows,body.mobile #icons,
  body.mobile #wallmark,body.mobile #startmenu,body.mobile #d-widgets{display:none !important}
  /* the context menu is shared (widget picker) — center it as a sheet on phones */
  body.mobile #ctxmenu{left:12px !important;right:12px !important;bottom:calc(24px + env(safe-area-inset-bottom)) !important;
    top:auto !important;width:auto;min-width:0;border-radius:16px;padding:6px}
  body.mobile #ctxmenu button{padding:12px 14px;font-size:15px;border-radius:11px}
  #p-status{position:absolute;left:0;right:0;top:0;height:calc(28px + env(safe-area-inset-top));
    padding:max(4px,env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:600;z-index:10;color:var(--ink);pointer-events:none}
  #p-status .sp{flex:1}
  #p-live{color:var(--ok);display:none}
  #p-status .p-batt{color:var(--dim);font-weight:500;font-size:12px}

  #p-home{position:absolute;inset:0;padding:calc(40px + env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;overflow:auto}
  #p-search{display:flex;align-items:center;gap:8px;justify-content:center;margin:6px 0 22px;padding:11px 14px;
    border-radius:14px;background:rgba(255,255,255,.09);border:1px solid var(--line);color:var(--dim);font-size:14px}
  #p-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;align-content:start;flex:1}
  .p-icon{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
  .p-icon .pi{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;
    background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.03));border:1px solid var(--line);
    box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .p-icon[data-app="assistant"] .pi,.p-icon[data-userapp] .pi{background:linear-gradient(145deg,color-mix(in srgb,var(--a) 55%,transparent),color-mix(in srgb,var(--b) 40%,transparent))}
  .p-icon .pl{font-size:11px;color:var(--ink);text-shadow:0 1px 4px rgba(0,0,0,.7);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-icon:active .pi{transform:scale(.9);transition:transform .1s}
  #p-dock{position:absolute;left:12px;right:12px;bottom:calc(28px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-around;padding:12px 8px;border-radius:26px;
    background:rgba(16,20,42,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line)}

  /* one fullscreen app at a time */
  #p-app{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;
    transform:translateY(12px);opacity:0;transition:transform .18s,opacity .18s}
  body.mobile #p-app.open{display:flex;transform:none;opacity:1}
  #p-appbar{display:flex;align-items:center;gap:8px;padding:max(6px,env(safe-area-inset-top)) 10px 8px;
    border-bottom:1px solid var(--line);background:rgba(9,12,26,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  #p-appbar button{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:14px;color:var(--ink)}
  #p-apptitle{flex:1;text-align:center;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #p-appbody{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;
    padding-bottom:env(safe-area-inset-bottom)} /* clear the home indicator so inputs/buttons aren't under it */
  /* the reused app renderers fill the fullscreen body */
  #p-appbody .wbody,#p-appbody .term,#p-appbody .chat,#p-appbody .noted,#p-appbody .calcapp,#p-appbody .autoapp{height:100%;max-height:none}
  #p-appbody .pad{padding:14px 16px}

  /* home indicator — purely decorative; must NEVER intercept touches, or it
     eats taps on the app content beneath it (e.g. the Assistant input + Send) */
  #p-homebar{position:absolute;left:0;right:0;bottom:0;height:calc(22px + env(safe-area-inset-bottom));z-index:20;pointer-events:none}
  body.mobile #p-app.open ~ #p-homebar::after,#p-homebar::after{content:"";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    width:130px;height:5px;border-radius:3px;background:rgba(255,255,255,.4)}

  /* app switcher */
  #p-switcher{position:absolute;inset:0;z-index:30;background:rgba(4,6,16,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:none;flex-direction:column;justify-content:center;gap:14px;padding:24px}
  #p-switcher.open{display:flex}
  #p-switcher-list{display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}
  .p-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;
    background:var(--glass2);border:1px solid var(--line);font-size:15px}
  .p-card .pc-emoji{font-size:22px}
  .p-card .pc-name{flex:1}
  .p-card .pc-close{color:var(--bad);font-size:20px;background:none;border:0}
  #p-switcher-close{align-self:center}

  /* ── toasts ── */
  #toasts{position:fixed;right:12px;top:44px;z-index:9000;display:flex;flex-direction:column;gap:8px;width:min(320px,calc(100vw - 24px))}
  .toast{background:var(--glass2);border:1px solid var(--line);border-left:3px solid var(--a);border-radius:12px;
    padding:10px 13px;box-shadow:var(--shadow);animation:tin .22s ease-out}
  .toast b{display:block;font-size:13.5px}
  .toast .tb{font-size:12.5px;color:var(--dim);white-space:pre-wrap}
  @keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

  /* ── boot ── */
  #boot{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .5s;}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .glyph{font-size:64px;background:linear-gradient(135deg,#8b7cff,#39e6b4);-webkit-background-clip:text;background-clip:text;color:transparent}
  #boot .bar{width:180px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
  #boot .fill{height:100%;width:0;background:linear-gradient(90deg,#8b7cff,#39e6b4);transition:width .9s ease-out}
  #boot .bt{font-size:11.5px;letter-spacing:.34em;color:var(--faint);text-transform:uppercase}

  @media (max-width:640px){
    .win{width:calc(100vw - 12px) !important;left:6px !important;top:40px !important}
    .wbody{max-height:calc(100dvh - 190px)}
    #mb-owner{display:none}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }

  /* ══════════════════════════════════════════════════════════════════
     SKIN LAYER — macOS-style desktop, iOS-style phone. Pure presentation
     over the same kernel; later rules here intentionally override above.
     No brand marks — just the shared design language (squircles, traffic
     lights, frosted bars, magnifying dock).
     ══════════════════════════════════════════════════════════════════ */

  /* per-app icon colours (used by the dock and the iOS springboard) */
  .appicon{--c1:#8b7cff;--c2:#6e8bff}
  [data-app="files"]      {--c1:#4aa3ff;--c2:#1e6fe0}
  [data-app="terminal"]   {--c1:#3a3f4b;--c2:#12151d}
  [data-app="notes"]      {--c1:#ffd24a;--c2:#f5a623}
  [data-app="assistant"]  {--c1:#a98bff;--c2:#6e8bff}
  [data-app="calc"]       {--c1:#3a3f4b;--c2:#0f1218}
  [data-app="automations"]{--c1:#7c8cff;--c2:#5561f0}
  [data-app="paint"]      {--c1:#ff7ac0;--c2:#e0459b}
  [data-app="camera"]     {--c1:#8a95a8;--c2:#5a6376}
  [data-app="arcade"]     {--c1:#37e0a0;--c2:#12b070}
  [data-app="store"]      {--c1:#4ac8ff;--c2:#1596e0}
  [data-app="monitor"]    {--c1:#57d963;--c2:#25a83a}
  [data-app="settings"]   {--c1:#9aa4b4;--c2:#67728a}
  [data-app="about"]      {--c1:#aab4c6;--c2:#7a869c}
  [data-userapp]          {--c1:var(--a);--c2:var(--b)}

  /* ── macOS desktop ──────────────────────────────────────────────── */
  body:not(.mobile) #menubar{
    height:26px;background:rgba(28,30,42,.62);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
    border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;font-weight:500;gap:2px;padding:0 10px}
  body:not(.mobile) #menubar .brand{font-weight:700;padding:2px 9px;font-size:13.5px}
  body:not(.mobile) #menubar .brand .chev{display:none}
  .mbmenu{background:none;border:0;color:var(--ink);font:inherit;font-size:13px;padding:3px 9px;border-radius:6px;opacity:.92}
  .mbmenu:hover,.mbmenu.active{background:rgba(255,255,255,.16)}
  #mb-mic{border:0;background:none;font-size:14px;opacity:.9}
  #mb-clock,#mb-owner{font-weight:500;opacity:.9}

  /* windows: macOS traffic lights + rounded card */
  body:not(.mobile) .win{border-radius:11px;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.12)}
  body:not(.mobile) .tbar{padding:0 12px;height:38px;background:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.02));position:relative}
  body:not(.mobile) .tbar .dot{width:12px;height:12px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
  body:not(.mobile) .tbar .close{background:#ff5f57}
  body:not(.mobile) .tbar .mini{background:#febc2e}
  body:not(.mobile) .tbar .maxd{background:#28c840}
  body:not(.mobile) .tbar .t{position:absolute;left:0;right:0;text-align:center;pointer-events:none;font-weight:600;font-size:13px;color:var(--dim)}
  body:not(.mobile) .win:not(.focus) .tbar .dot{background:#4a4f5a}
  body:not(.mobile) .win:not(.focus) .tbar:hover .dot{background:none}
  body:not(.mobile) .win:not(.focus) .tbar:hover .close{background:#ff5f57}
  body:not(.mobile) .win:not(.focus) .tbar:hover .mini{background:#febc2e}
  body:not(.mobile) .win:not(.focus) .tbar:hover .maxd{background:#28c840}

  /* macOS dock: bigger frosted pill, magnify on hover, Trash at the end */
  body:not(.mobile) #dock{gap:5px;padding:6px 8px;border-radius:22px;background:rgba(40,42,58,.42);
    backdrop-filter:saturate(180%) blur(26px);-webkit-backdrop-filter:saturate(180%) blur(26px);
    border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
  body:not(.mobile) #dock .dapp{padding:2px 3px}
  body:not(.mobile) #dock .ic{width:52px;height:52px;border-radius:14px;font-size:30px;border:0;
    background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 5px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .16s cubic-bezier(.2,.8,.2,1),margin .16s}
  body:not(.mobile) #dock .dapp:hover .ic{transform:translateY(-12px) scale(1.32);margin:0 8px}
  body:not(.mobile) #dock .dapp:hover+.dapp .ic,body:not(.mobile) #dock .dapp:has(+ .dapp:hover) .ic{transform:translateY(-4px) scale(1.12)}
  body:not(.mobile) #dock .run{width:4px;height:4px;margin-top:2px;background:var(--ink)}
  #dock .dsep{width:1px;align-self:stretch;margin:6px 4px;background:rgba(255,255,255,.16)}

  /* ── iOS phone ──────────────────────────────────────────────────── */
  body.mobile{background:#000}
  body.mobile #wallpaper{background:
    radial-gradient(120% 90% at 50% -20%, color-mix(in srgb,var(--a) 42%,transparent), transparent 60%),
    radial-gradient(120% 80% at 20% 120%, color-mix(in srgb,var(--b) 34%,transparent), transparent 55%),
    linear-gradient(160deg,#12122a,#05060f)}
  body.mobile #wallpaper::after{opacity:.14}
  #p-status{font-weight:600;letter-spacing:.01em}
  #p-status .p-batt{font-weight:600;color:var(--ink)}
  #p-sig{display:inline-flex;gap:5px;align-items:center;font-size:12px}
  /* iOS squircle icon tiles */
  .p-icon .pi{width:60px;height:60px;border-radius:15px;border:0;font-size:33px;
    background:linear-gradient(160deg,var(--c1),var(--c2));
    box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35)}
  #p-dock .p-icon .pi{width:58px;height:58px}
  #p-dock{padding:14px 12px;border-radius:32px;background:rgba(255,255,255,.14);
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.16)}
  #p-search{border-radius:12px;background:rgba(255,255,255,.16);color:rgba(255,255,255,.72);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-weight:500}
  #p-grid{gap:24px 12px}
  .p-icon .pl{font-weight:500;letter-spacing:.01em}

  /* iOS app nav bar (blue actions, centred title) */
  body.mobile #p-appbar{height:auto;padding-top:calc(6px + env(safe-area-inset-top))}
  body.mobile #p-appbar button{background:none;border:0;color:#4aa3ff;font-size:16px;font-weight:400;padding:6px 4px}
  body.mobile #p-back{font-weight:400}
  body.mobile #p-apptitle{font-size:16px;font-weight:600}

  /* iOS app switcher: a deck of rounded cards */
  #p-switcher{background:rgba(0,0,0,.55)}
  .p-card{border-radius:20px;padding:18px 18px;box-shadow:0 18px 50px rgba(0,0,0,.55);background:var(--glass2)}
  .p-card .pc-emoji{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(160deg,var(--c1,#8b7cff),var(--c2,#6e8bff));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  #p-switcher-close{background:rgba(255,255,255,.16);border:0;color:var(--ink);border-radius:20px;padding:11px 22px;font-weight:600}

  /* ── home-screen widgets (shared card style; phone grid + desktop column) ── */
  #p-widgets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 22px}
  #d-widgets{position:absolute;top:46px;right:14px;width:230px;display:flex;flex-direction:column;gap:10px;z-index:1}
  .widget{border-radius:20px;padding:12px 14px;text-align:left;overflow:hidden;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.1);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
    box-shadow:0 8px 24px rgba(0,0,0,.3);color:var(--ink);min-height:86px;display:flex;flex-direction:column}
  .widget .wcap{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:5px}
  .widget .wbig{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
  .widget .wsub{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:2px}
  .widget .wline{font-size:12px;line-height:1.45;color:rgba(255,255,255,.82);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .widget.span2{grid-column:span 2}
  .widget.addw{align-items:center;justify-content:center;color:rgba(255,255,255,.45);border-style:dashed;background:rgba(255,255,255,.04);min-height:60px}
  .widget.addw:hover{color:var(--ink)}
  .widget .wx{position:absolute;visibility:hidden}
  #d-widgets .widget{min-height:0}

  /* hub webapps get a browser-sized window on the desktop */
  body:not(.mobile) .win.w-webapp{width:min(940px,calc(100vw - 32px))}
  body:not(.mobile) .win.w-webapp .wbody{height:min(72vh,660px);max-height:none}

  /* installed as a real PWA: the device draws its own status bar, so hide
     AIOS's imitation clock/signal/battery — keep the safe-area spacing and
     the ✦ Live AI dot, which is real information */
  body.standalone #p-clock,body.standalone #p-sig{display:none}

  /* iOS-style paged home screen: swipe horizontally between pages of apps */
  body.mobile #p-home{overflow:hidden}
  #p-grid{display:flex !important;flex:1;min-height:0;gap:0 !important;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #p-grid::-webkit-scrollbar{display:none}
  .p-page{min-width:100%;flex:0 0 100%;scroll-snap-align:center;display:grid;grid-template-columns:repeat(4,1fr);
    gap:24px 12px;align-content:start;padding:0 1px}
  #p-dots{display:flex;justify-content:center;align-items:center;gap:8px;height:16px;margin:2px 0 6px}
  #p-dots .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.32);transition:background .2s}
  #p-dots .dot.on{background:rgba(255,255,255,.92)}
  /* widgets live on page 1 of the pager, spanning the grid, so pages 2+ are full app grids */
  .p-page > #p-widgets{grid-column:1 / -1;margin:0 0 18px}
  /* on phones, inputs must be ≥16px or iOS zooms the page on focus, which shoves
     bottom inputs under the keyboard and makes them feel broken */
  body.mobile #p-appbody input,body.mobile #p-appbody textarea{font-size:16px}
</style>

<script>
'use strict';
/* AIOS desktop — the chrome around the kernel. All OS truth lives in the
 * kernel state object; this file only draws it and forwards events. */
var K = window.AiosKernel;
var LS_KEY = 'aios.v1';

/* ── state ── */
var saved = null;
try { saved = localStorage.getItem(LS_KEY); } catch (e) {}
var state = saved ? K.deserialize(saved, Date.now()) : K.boot(Date.now());

function save() {
  try { localStorage.setItem(LS_KEY, K.serialize(state)); } catch (e) {}
  if (typeof cloud !== 'undefined' && cloud && cloud.push) cloud.push();
}

/* ── dom helpers ── */
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* ── toasts ── */
function notify(title, body) {
  var t = el('div', 'toast');
  t.appendChild(el('b', null, title));
  if (body) { var b = el('div', 'tb', body); t.appendChild(b); }
  $('toasts').appendChild(t);
  setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 6000);
}

/* ── timers (assistant/shell "timer" effects become real) ── */
function startTimer(seconds, label) {
  setTimeout(function () {
    notify('⏰ ' + (label || 'Timer'), 'Your ' + K.slugify(label || 'timer').replace(/-/g, ' ') + ' timer of ' + seconds + 's is done.');
  }, seconds * 1000);
}

/* ── effects: one code path for shell, assistant, spotlight and live AI ── */
function applyEffects(effects, ctx) {
  effects = effects || [];
  for (var i = 0; i < effects.length; i++) {
    var ef = effects[i];
    if (ef.type === 'open') spawnApp(ef.app, ef.arg);
    else if (ef.type === 'timer') startTimer(ef.seconds, ef.label);
    else if (ef.type === 'accent') { /* state already updated by the kernel */ }
    else if (ef.type === 'clear' && ctx && ctx.onClear) ctx.onClear();
  }
  sync();
}

/* ── window manager glue ── */
var winEls = {};   // pid → element
var runtime = {};  // pid → per-window runtime (terminal scrollback, files cwd…)

function spawnApp(appId, arg) {
  var r = K.spawn(state, appId, arg);
  if (!r.ok) { notify('AIOS', r.error); return; }
  if (MOBILE) { phoneOpenProc(r.proc); save(); }
  else sync();
  return r.proc;
}

function focusWin(pid) { K.focusProc(state, pid); sync(); }

function makeWindow(proc) {
  var w = el('div', 'win w-' + proc.app);
  w.style.left = proc.x + 'px';
  w.style.top = (proc.y + 34) + 'px';
  w.dataset.pid = proc.pid;

  var bar = el('div', 'tbar');
  var close = el('button', 'dot close', '✕'); close.title = 'Close';
  var mini = el('button', 'dot mini', '–'); mini.title = 'Minimize';
  var maxd = el('button', 'dot maxd', '+'); maxd.title = 'Maximize';
  var title = el('div', 't');
  var em = el('span', 'em', proc.emoji || (K.appById(proc.app) || {}).emoji || '🧩');
  title.appendChild(em);
  title.appendChild(document.createTextNode(proc.title));
  bar.appendChild(close); bar.appendChild(mini); bar.appendChild(maxd); bar.appendChild(title);
  w.appendChild(bar);

  var body = el('div', 'wbody');
  w.appendChild(body);

  close.addEventListener('click', function (e) { e.stopPropagation(); K.closeProc(state, proc.pid); sync(); });
  mini.addEventListener('click', function (e) { e.stopPropagation(); K.minimizeProc(state, proc.pid); sync(); });
  maxd.addEventListener('click', function (e) { e.stopPropagation(); K.maximizeProc(state, proc.pid); sync(); });
  bar.addEventListener('dblclick', function (e) {
    if (e.target === close || e.target === mini || e.target === maxd) return;
    K.maximizeProc(state, proc.pid); sync();
  });
  w.addEventListener('pointerdown', function () { if (K.topProc(state) !== K.findProc(state, proc.pid)) focusWin(proc.pid); });

  /* drag by the titlebar — dragging a tiled window floats it again */
  var drag = null;
  bar.addEventListener('pointerdown', function (e) {
    if (e.target === close || e.target === mini || e.target === maxd) return;
    var p = K.findProc(state, proc.pid);
    if (p && (p.max || p.snap)) {
      K.floatProc(state, proc.pid);
      p.x = Math.max(0, e.clientX - 200);
      p.y = Math.max(0, e.clientY - 44);
      sync();
    }
    drag = { dx: e.clientX - w.offsetLeft, dy: e.clientY - w.offsetTop };
    try { bar.setPointerCapture(e.pointerId); } catch (err) {}
  });
  bar.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = K.findProc(state, proc.pid);
    if (!p) return;
    p.x = Math.max(0, Math.min(e.clientX - drag.dx, window.innerWidth - 120));
    p.y = Math.max(0, Math.min(e.clientY - drag.dy - 34, window.innerHeight - 120));
    w.style.left = p.x + 'px';
    w.style.top = (p.y + 34) + 'px';
  });
  bar.addEventListener('pointerup', function () { drag = null; });

  var render = APP_RENDER[proc.app] || APP_RENDER.about;
  render(proc, body);
  return w;
}

function sync() {
  var i, pid;
  document.body.dataset.accent = state.settings.accent;
  /* mobile: the phone shell owns rendering — no desktop windows are built */
  if (MOBILE) { phoneChrome(); save(); return; }
  /* prune closed windows */
  for (pid in winEls) {
    if (!K.findProc(state, Number(pid))) {
      if (winEls[pid].parentNode) winEls[pid].parentNode.removeChild(winEls[pid]);
      delete winEls[pid]; delete runtime[pid];
    }
  }
  /* create/update live ones */
  var top = K.topProc(state);
  for (i = 0; i < state.procs.length; i++) {
    var p = state.procs[i];
    var w = winEls[p.pid];
    if (!w) { w = winEls[p.pid] = makeWindow(p); $('windows').appendChild(w); }
    w.style.zIndex = 100 + p.z;
    w.classList.toggle('min', !!p.minimized);
    w.classList.toggle('focus', top === p);
    w.classList.toggle('max', !!p.max);
    w.classList.toggle('snapL', p.snap === 'left');
    w.classList.toggle('snapR', p.snap === 'right');
    w.classList.toggle('otherws', p.ws !== state.ws);
  }
  /* workspace pills */
  var pills = document.querySelectorAll('#mb-ws button');
  for (i = 0; i < pills.length; i++) pills[i].classList.toggle('on', Number(pills[i].textContent) === state.ws);
  renderDesktop();
  renderWidgets();
  var topApp = top ? K.appById(top.app) : null;
  $('mb-app').textContent = top ? (topApp ? topApp.name + (top.arg ? ' — ' + top.title : '') : top.title) : '';
  $('mb-owner').textContent = state.settings.owner;
  document.body.dataset.accent = state.settings.accent;
  /* dock running dots */
  var dapps = document.querySelectorAll('#dock .dapp');
  for (i = 0; i < dapps.length; i++) {
    var id = dapps[i].dataset.app, on = false;
    for (var j = 0; j < state.procs.length; j++) if (state.procs[j].app === id) on = true;
    dapps[i].classList.toggle('on', on);
  }
  save();
}

/* ══════════════ app renderers ══════════════ */
var APP_RENDER = {};

/* ── Files ── */
APP_RENDER.files = function (proc, body) {
  var rt = runtime[proc.pid] = { dir: proc.arg || '/home/user' };
  var bar = el('div', 'rowbar');
  var up = el('button', 'btn', '↑ Up');
  var path = el('div', 'path');
  var newF = el('button', 'btn', '+ File');
  var newD = el('button', 'btn', '+ Folder');
  var impB = el('button', 'btn', '⬆ Import'); impB.title = 'Import a file from your device';
  var trashB = el('button', 'btn', '🗑'); trashB.title = 'Open the trash';
  var emptyB = el('button', 'btn', 'Empty'); emptyB.title = 'Empty the trash — permanent';
  bar.appendChild(up); bar.appendChild(path); bar.appendChild(newF); bar.appendChild(newD);
  bar.appendChild(impB); bar.appendChild(trashB); bar.appendChild(emptyB);
  var fileInput = el('input'); fileInput.type = 'file'; fileInput.style.display = 'none';
  var list = el('ul', 'flist');
  body.appendChild(bar); body.appendChild(fileInput); body.appendChild(list);

  // Import a real file from the user's device onto the virtual disk.
  impB.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    var isText = /^text\/|json|javascript|xml|csv|\.(md|txt|sh|app)$/i.test(f.type + ' ' + f.name);
    reader.onload = function () {
      var full = K.normalizePath(rt.dir, f.name);
      var w = K.fsWrite(state.fs, full, reader.result, Date.now());
      if (!w.ok) { notify('Files', w.error); return; }
      notify('⬆ Imported', full);
      refresh(); sync();
    };
    if (isText) reader.readAsText(f); else reader.readAsDataURL(f);
    fileInput.value = '';
  });

  function inTrash() { return rt.dir === K.TRASH; }

  function refresh() {
    path.textContent = rt.dir;
    emptyB.style.display = inTrash() ? '' : 'none';
    list.textContent = '';
    var r = K.fsList(state.fs, rt.dir);
    if (!r.ok) { rt.dir = '/'; r = K.fsList(state.fs, '/'); }
    if (!r.entries.length) list.appendChild(el('div', 'empty', inTrash() ? 'Trash is empty' : 'Empty folder'));
    r.entries.forEach(function (e2) {
      var li = el('li');
      var full = K.normalizePath(rt.dir, e2.name);
      li.appendChild(el('span', null, e2.type === 'dir' ? '📁' : '📄'));
      var label = e2.name + (inTrash() && state.fs.trash[e2.name] ? '  ← ' + state.fs.trash[e2.name] : '');
      li.appendChild(el('span', 'fname', label));
      li.appendChild(el('span', 'meta', e2.type === 'dir' ? '' : e2.size + ' B'));
      if (inTrash() && state.fs.trash[e2.name]) {
        var res = el('button', 'del', 'restore');
        res.style.color = 'var(--ok)';
        res.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var rr = K.fsRestore(state.fs, e2.name, Date.now());
          notify('🗑 Trash', rr.ok ? 'Restored to ' + rr.origin : rr.error);
          refresh(); sync();
        });
        li.appendChild(res);
      }
      var del = el('button', 'del', inTrash() ? 'purge' : 'delete');
      del.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (inTrash()) {
          if (!confirm('Permanently delete ' + full + '? This cannot be undone.')) return;
          var rr = K.fsRemove(state.fs, full, { recursive: true });
          if (!rr.ok) notify('Files', rr.error);
        } else {
          var tr = K.fsTrash(state.fs, full, Date.now());
          if (!tr.ok) notify('Files', tr.error);
          else notify('🗑 Moved to trash', full + ' — restore it from the 🗑 view.');
        }
        refresh(); sync();
      });
      li.appendChild(del);
      li.addEventListener('click', function () {
        if (e2.type === 'dir') { rt.dir = full; refresh(); }
        else { spawnApp('notes', full); }
      });
      li.addEventListener('contextmenu', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        var items = [{ label: 'Open', fn: function () { e2.type === 'dir' ? (rt.dir = full, refresh()) : spawnApp('notes', full); } }];
        if (inTrash() && state.fs.trash[e2.name]) {
          items.push({ label: 'Restore', fn: function () {
            var rr = K.fsRestore(state.fs, e2.name, Date.now());
            notify('🗑 Trash', rr.ok ? 'Restored to ' + rr.origin : rr.error);
            refreshAll();
          } });
        } else if (!inTrash()) {
          items.push({ label: 'Rename…', fn: function () { renamePath(full); refresh(); } });
          if (e2.type === 'file') {
            items.push({ label: 'Download', fn: function () { downloadFile(full); } });
          }
          if (rt.dir !== K.DESKTOP) {
            items.push({ label: 'Send to Desktop', fn: function () {
              var mv = K.fsMove(state.fs, full, K.DESKTOP, Date.now());
              if (!mv.ok) notify('Files', mv.error);
              refreshAll();
            } });
          }
        }
        items.push('-');
        items.push({
          label: inTrash() ? 'Purge forever' : 'Move to Trash', danger: true,
          fn: function () {
            if (inTrash()) {
              if (!confirm('Permanently delete ' + full + '? This cannot be undone.')) return;
              K.fsRemove(state.fs, full, { recursive: true });
            } else {
              var tr = K.fsTrash(state.fs, full, Date.now());
              if (!tr.ok) notify('Files', tr.error);
            }
            refreshAll();
          }
        });
        showMenu(ev.clientX, ev.clientY, items);
      });
      list.appendChild(li);
    });
  }
  trashB.addEventListener('click', function () { rt.dir = K.TRASH; refresh(); });
  emptyB.addEventListener('click', function () {
    if (!confirm('Empty the trash? Everything in it is gone forever.')) return;
    var em = K.fsEmptyTrash(state.fs, Date.now());
    notify('🗑 Trash emptied', em.count + ' item' + (em.count === 1 ? '' : 's') + ' permanently deleted.');
    refresh(); sync();
  });
  up.addEventListener('click', function () { rt.dir = K.normalizePath(rt.dir, '..'); refresh(); });
  newD.addEventListener('click', function () {
    var name = prompt('New folder name:'); if (!name) return;
    var r = K.fsMkdir(state.fs, K.normalizePath(rt.dir, name), Date.now());
    if (!r.ok) notify('Files', r.error);
    refresh(); sync();
  });
  newF.addEventListener('click', function () {
    var name = prompt('New file name:', 'untitled.txt'); if (!name) return;
    var full = K.normalizePath(rt.dir, name);
    var r = K.fsWrite(state.fs, full, '', Date.now());
    if (!r.ok) { notify('Files', r.error); return; }
    refresh(); sync();
    spawnApp('notes', full);
  });
  rt.refresh = refresh;
  refresh();
};

/* ── Terminal ── */
APP_RENDER.terminal = function (proc, body) {
  body.classList.add('term');
  var out = el('pre', 'tout');
  var form = el('form');
  var ps1 = el('span', 'ps1');
  var input = el('input');
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocapitalize', 'off');
  input.setAttribute('spellcheck', 'false');
  form.appendChild(ps1); form.appendChild(input);
  body.appendChild(out); body.appendChild(form);

  var hist = [], hi = 0;
  function prompt() { ps1.textContent = state.settings.owner + '@aios ' + state.cwd + ' $'; }
  function print(lines, cls) {
    for (var i = 0; i < lines.length; i++) {
      var d = el('div', cls || null, lines[i]);
      out.appendChild(d);
    }
    out.scrollTop = out.scrollHeight;
  }
  print([K.fsRead(state.fs, '/etc/motd').content || 'AIOS', 'Type `help` for commands, or `ai <anything>` to speak English.', '']);
  prompt();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var cmd = input.value;
    input.value = '';
    print([ps1.textContent + ' ' + cmd], 'cmdline');
    if (cmd.trim()) { hist.push(cmd); hi = hist.length; }
    var r = K.execCommand(state, cmd, Date.now());
    print(r.out, r.error ? 'err' : null);
    applyEffects(r.effects, { onClear: function () { out.textContent = ''; } });
    prompt();
    /* files windows may be stale after fs commands */
    for (var pid in runtime) if (runtime[pid].refresh) runtime[pid].refresh();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') { if (hi > 0) { hi--; input.value = hist[hi] || ''; e.preventDefault(); } }
    else if (e.key === 'ArrowDown') { if (hi < hist.length) { hi++; input.value = hist[hi] || ''; e.preventDefault(); } }
  });
  body.addEventListener('click', function () { input.focus(); });
  setTimeout(function () { input.focus(); }, 50);
};

/* ── Notes ── */
APP_RENDER.notes = function (proc, body) {
  // Image files (Paint/Camera save data:image PNGs) get a viewer, not an editor.
  if (proc.arg) {
    var ir = K.fsRead(state.fs, proc.arg);
    if (ir.ok && /^data:image\//.test(ir.content)) {
      var vpad = el('div', 'pad');
      vpad.style.textAlign = 'center';
      var img = el('img');
      img.src = ir.content;
      img.style.cssText = 'max-width:100%;border-radius:12px;border:1px solid var(--line)';
      vpad.appendChild(img);
      var cap = el('div', null, proc.arg);
      cap.style.cssText = 'margin-top:8px;font-size:11.5px;color:var(--faint)';
      vpad.appendChild(cap);
      body.appendChild(vpad);
      return;
    }
  }
  body.classList.add('noted');
  var editWrap = el('div', 'nedit');
  var ta = el('textarea');
  ta.placeholder = 'Write… Markdown supported — # headings, **bold**, `code`, - lists, [links](https://…)';
  var prev = el('div', 'mdprev');
  editWrap.appendChild(ta); editWrap.appendChild(prev);
  var foot = el('div', 'foot');
  var fpath = el('div', 'fpath');
  var savedTag = el('span', 'saved', 'saved ✓');
  var prevBtn = el('button', 'btn', '👁 Preview');
  var saveBtn = el('button', 'btn acc', 'Save');
  foot.appendChild(fpath); foot.appendChild(savedTag); foot.appendChild(prevBtn); foot.appendChild(saveBtn);
  body.appendChild(editWrap); body.appendChild(foot);

  var path = proc.arg;
  if (!path) {
    path = '/home/user/notes/untitled.txt';
    var n = 2;
    while (K.fsGet(state.fs, path)) path = '/home/user/notes/untitled-' + (n++) + '.txt';
  }
  fpath.textContent = path;
  var r = K.fsRead(state.fs, path);
  if (r.ok) ta.value = r.content;

  // preview modes: edit-only → split → preview-only (nice on phones)
  var mode = 0;
  function applyMode() {
    ta.style.display = mode === 2 ? 'none' : '';
    prev.style.display = mode === 0 ? 'none' : '';
    prev.classList.toggle('solo', mode === 2);
    prevBtn.textContent = mode === 0 ? '👁 Preview' : mode === 1 ? '⇔ Split' : '✎ Edit';
    if (mode) prev.innerHTML = K.renderMarkdown(ta.value);
  }
  prevBtn.addEventListener('click', function () { mode = (mode + 1) % 3; applyMode(); });
  ta.addEventListener('input', function () { if (mode) prev.innerHTML = K.renderMarkdown(ta.value); });
  applyMode();

  function doSave() {
    var w = K.fsWrite(state.fs, path, ta.value, Date.now());
    if (!w.ok) { notify('Notes', w.error); return; }
    savedTag.style.opacity = 1;
    setTimeout(function () { savedTag.style.opacity = 0; }, 1400);
    sync();
    for (var pid in runtime) if (runtime[pid].refresh) runtime[pid].refresh();
  }
  saveBtn.addEventListener('click', doSave);
  ta.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); doSave(); }
  });
};

/* ── Assistant: Live AI ──
 * Three ways to real intelligence, in priority order:
 *   1. the local proxy (aios/server.mjs) — key stays server-side;
 *   2. Bring-Your-Own-Key: paste an Anthropic key, stored ONLY in this
 *      browser, sent straight to api.anthropic.com with Anthropic's
 *      official direct-browser-access header (same pattern as Lingua) —
 *      this is what makes Live AI work on the hosted static site;
 *   3. neither → the on-device intent router (always available).
 * Both live paths answer with the same contract as server.mjs: a reply
 * plus AIOS shell commands, executed by the unit-tested kernel. */
var BYOK_KEY = 'aios.anthropicKey.v1';
function getKey() { try { return localStorage.getItem(BYOK_KEY) || ''; } catch (e) { return ''; } }
function setKey(k) { try { if (k) localStorage.setItem(BYOK_KEY, k); else localStorage.removeItem(BYOK_KEY); } catch (e) {} }
var liveAI = { proxy: false, on: false };
function liveReady() { return liveAI.proxy || !!getKey(); }

var OS_TOOL = {
  name: 'os_response',
  description: 'Respond to the user of AIOS, optionally driving the OS with shell commands.',
  input_schema: {
    type: 'object',
    properties: {
      reply: { type: 'string', description: 'What to say in the assistant chat bubble. Warm, concise, useful.' },
      commands: { type: 'array', description: 'AIOS shell commands to run, in order. Empty if no action needed.', items: { type: 'string' } }
    },
    required: ['reply']
  }
};
var OS_SYSTEM = 'You are the Live AI of AIOS, an operating system running entirely in the user\'s browser.\n' +
  'You can DO things, not just talk: every command you emit runs in the AIOS shell against the user\'s\n' +
  'virtual disk and window manager. Available commands:\n' +
  '  ls [path] · cd [path] · pwd · cat <file> · echo <text> > <file> (or >>) · mkdir [-p] <dir>\n' +
  '  touch <file> · rm <path> (goes to /trash) · restore <name> · mv <a> <b> · cp <a> <b> · find <text> (names)\n' +
  '  search <text> (file contents) · tree [path] · open <app|file|dir> · ps · kill <pid> · ws [1-3]\n' +
  '  every <interval> <command> · run <script> · set NAME=value ($NAME) · alias name=cmd · journal · pipes: cmd | grep x | head -3\n' +
  'Apps you can open: files, terminal, notes, assistant, calc, automations, monitor, settings, about.\n' +
  'Paths are unix-style; the user\'s home is /home/user, notes live in /home/user/notes.\n' +
  'Quote arguments containing spaces. Prefer a few precise commands over many.\n' +
  'When the user asks for something outside the OS (facts, writing, ideas), just answer in the reply —\n' +
  'you are also a first-class assistant. When you create or change files, mention what you did.\n' +
  'Keep replies short; this is a chat bubble, not an essay.';

function liveContext() {
  return {
    cwd: state.cwd, owner: state.settings.owner,
    apps: K.APPS.map(function (a) { return a.id; }),
    files: K.fsFind(state.fs, '').slice(0, 60)
  };
}

/* Direct browser → Anthropic call (BYOK), given a messages array.
 * Resolves { reply, actions }. */
function callDirectMessages(messages) {
  var ctx = liveContext();
  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': getKey(),
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-opus-4-8',
      max_tokens: 1024,
      system: OS_SYSTEM + '\nCurrent OS context: cwd=' + ctx.cwd + ', user=' + ctx.owner + '. Files (sample): ' + ctx.files.slice(0, 40).join(', '),
      tools: [OS_TOOL],
      tool_choice: { type: 'tool', name: 'os_response' },
      messages: messages
    })
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error('anthropic ' + r.status + ': ' + t.slice(0, 200)); });
    return r.json();
  }).then(function (data) {
    var tu = (data.content || []).filter(function (b) { return b.type === 'tool_use'; })[0];
    var input = tu && tu.input ? tu.input : { reply: '' };
    return {
      reply: String(input.reply || ''),
      actions: (Array.isArray(input.commands) ? input.commands : []).slice(0, 12).map(function (c) { return { command: String(c).slice(0, 400) }; })
    };
  });
}

/* One live exchange (single user turn) through whichever path is available. */
function callLive(text) {
  if (liveAI.proxy) {
    return fetch('api/assistant', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, context: liveContext() })
    }).then(function (r) { return r.json(); });
  }
  return callDirectMessages([{ role: 'user', content: String(text).slice(0, 2000) }]);
}

/* One live exchange given a full message history (used by the agent loop). */
function callLiveMessages(messages) {
  if (liveAI.proxy) {
    return fetch('api/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: messages, context: liveContext() })
    }).then(function (r) { return r.json(); });
  }
  return callDirectMessages(messages);
}

/* ── The agentic loop: the AI reads the OS, acts, sees the result, and
 *    keeps going until the task is done. Each command runs through the
 *    unit-tested kernel, so the agent has exactly a user's powers. `emit`
 *    streams steps to the chat. Bounded to AGENT_MAX_STEPS turns. ── */
var AGENT_MAX_STEPS = 6;
function runAgent(userText, emit) {
  var history = [{ role: 'user', content: String(userText).slice(0, 2000) }];
  var step = 0;
  function loop() {
    if (step >= AGENT_MAX_STEPS) { emit('note', 'Reached the ' + AGENT_MAX_STEPS + '-step limit — stopping.'); return Promise.resolve(); }
    step++;
    return callLiveMessages(history).then(function (d) {
      if (d && d.reply) emit('assistant', d.reply);
      var acts = (d && d.actions) || [];
      if (!acts.length) return; // done — no more actions
      var results = [];
      for (var i = 0; i < acts.length; i++) {
        var r = K.execCommand(state, acts[i].command, Date.now());
        applyEffects(r.effects);
        var outText = r.out.join('\n');
        emit('tool', acts[i].command, outText + (r.error ? '  [error]' : ''));
        results.push('$ ' + acts[i].command + '\n' + (outText || '(ok)') + (r.error ? '  [error]' : ''));
      }
      refreshAll();
      history.push({ role: 'assistant', content: (d.reply || '') + '\n\nI ran:\n' + acts.map(function (a) { return a.command; }).join('\n') });
      history.push({ role: 'user', content: 'Results:\n' + results.join('\n\n') + '\n\nIf the task is complete, reply with a short summary and NO commands. Otherwise continue.' });
      return loop();
    });
  }
  return loop();
}

/* ── Assistant ── */
APP_RENDER.assistant = function (proc, body) {
  body.classList.add('chat');
  var livebar = el('div', 'livebar');
  livebar.appendChild(el('span', null, '✦ On-device intelligence'));
  livebar.appendChild(el('span', 'sp'));
  var keyBtn = el('button', 'btn keybtn', getKey() ? '🔑 ✓' : '🔑 Add key');
  keyBtn.title = 'Link your own Anthropic API key — stored only in this browser, sent only to api.anthropic.com. Enables Live AI with no server.';
  keyBtn.addEventListener('click', function () {
    var cur = getKey();
    var k = prompt(cur
      ? 'An Anthropic key is linked (stored only in this browser). Paste a new key to replace it, or clear the box and press OK to remove it.'
      : 'Paste your Anthropic API key (sk-ant-…).\nIt is stored ONLY in this browser and sent ONLY to api.anthropic.com — that\'s what makes Live AI work on the hosted site, no server needed.\n(On a shared device, prefer running aios/server.mjs instead.)', cur);
    if (k === null) return;
    setKey(k.trim());
    if (!liveReady()) { liveAI.on = false; $('mb-live').style.display = 'none'; }
    refreshLiveSwitches();
    var allSw = document.querySelectorAll('.switch');
    for (var i = 0; i < allSw.length; i++) allSw[i].classList.toggle('on', liveAI.on);
    notify('✦ Live AI', getKey() ? 'Key linked — flip the Live AI switch to talk to the real model.' : 'Key removed — back to on-device intelligence.');
  });
  var liveLbl = el('span', null, 'Live AI');
  var sw = el('button', 'switch' + (liveReady() ? '' : ' off-disabled'));
  sw.setAttribute('aria-label', 'Toggle Live AI');
  var agentLbl = el('span', null, '🤖 Agent');
  agentLbl.title = 'Let the AI act, read the result, and keep going until the task is done';
  var agentSw = el('button', 'switch' + (liveReady() ? '' : ' off-disabled'));
  agentSw.setAttribute('aria-label', 'Toggle Agent mode');
  livebar.appendChild(keyBtn); livebar.appendChild(liveLbl); livebar.appendChild(sw);
  livebar.appendChild(agentLbl); livebar.appendChild(agentSw);
  var agent = { on: false };
  agentSw.addEventListener('click', function () {
    if (!liveReady()) return;
    agent.on = !agent.on;
    agentSw.classList.toggle('on', agent.on);
    if (agent.on && !liveAI.on) { liveAI.on = true; sw.classList.add('on'); $('mb-live').style.display = 'flex'; }
  });
  var log = el('div', 'clog');
  var hint = el('div', 'hint', 'Try: “convert 5 km to miles” · “90 days from now” · “set a timer for 5 minutes” · “create a folder called x then open the files”');
  var form = el('form');
  var input = el('input');
  input.type = 'text';
  input.placeholder = 'Tell the OS what you want…';
  input.setAttribute('autocomplete', 'off');
  var send = el('button', 'btn acc', 'Send');
  form.appendChild(input); form.appendChild(send);
  body.appendChild(livebar); body.appendChild(log); body.appendChild(hint); body.appendChild(form);

  function bubble(text, who, extraCls) {
    var m = el('div', 'msg ' + who + (extraCls ? ' ' + extraCls : ''));
    // The OS and Live AI speak Markdown — render it (safely escaped by the
    // kernel's renderer) instead of spelling the asterisks. Your own words,
    // and status bubbles that get .textContent updates later, stay plain.
    if (who === 'os' && !extraCls) { m.classList.add('md'); m.innerHTML = K.renderMarkdown(text); }
    else m.textContent = text;
    log.appendChild(m);
    log.scrollTop = log.scrollHeight;
    return m;
  }
  bubble('Hello ' + state.settings.owner + ' — I am AIOS. I don\'t just answer, I *do*: apps, files, notes, timers, maths, settings. What do you need?' +
    (liveReady() ? '' : '\n\nWant open conversation too? Tap 🔑 Add key above to link your own Anthropic key — Live AI then works right here, no server needed.'), 'os');

  sw.classList.toggle('on', liveAI.on);
  sw.addEventListener('click', function () {
    if (!liveReady()) return;
    liveAI.on = !liveAI.on;
    sw.classList.toggle('on', liveAI.on);
    $('mb-live').style.display = liveAI.on ? 'flex' : 'none';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    bubble(text, 'you');
    if (agent.on && liveReady()) {
      // agentic mode: think → act → observe → repeat, each step shown
      var working = bubble('🤖 working…', 'os', 'think');
      runAgent(text, function (kind, a, b) {
        if (working) { working.remove(); working = null; }
        if (kind === 'assistant') bubble(a, 'os');
        else if (kind === 'tool') { var t = bubble('⚙️ ' + a, 'os', 'think'); if (b) t.textContent = '⚙️ ' + a + '\n' + b; }
        else if (kind === 'note') bubble(a, 'os', 'think');
      }).catch(function (err) {
        if (working) { working.remove(); working = null; }
        var a = K.assistant(state, text, Date.now());
        bubble('(agent offline: ' + (err && err.message || 'error') + ')\n' + a.reply, 'os');
        applyEffects(a.actions);
      }).then(function () { refreshAll(); });
    } else if (liveAI.on && liveReady()) {
      var think = bubble('thinking…', 'os', 'think');
      callLive(text).then(function (d) {
        // the model answers in Markdown — render it, don't spell the asterisks
        think.classList.add('md');
        think.innerHTML = K.renderMarkdown(d && d.reply ? d.reply : 'The live model returned nothing — falling back to on-device.');
        think.classList.remove('think');
        if (d && d.actions) {
          /* live actions reuse the kernel: run each as a shell command */
          for (var i = 0; i < d.actions.length; i++) {
            var act = d.actions[i];
            if (act && typeof act.command === 'string') {
              var rr = K.execCommand(state, act.command, Date.now());
              applyEffects(rr.effects);
            }
          }
          sync();
        }
      }).catch(function (err) {
        think.classList.remove('think');
        var a = K.assistant(state, text, Date.now());
        var why = String(err && err.message || '').indexOf('401') !== -1 ? ' (your key was rejected — tap 🔑 to fix it)' : '';
        think.textContent = '(offline' + why + ') ' + a.reply;
        applyEffects(a.actions);
      });
    } else {
      var a = K.assistant(state, text, Date.now());
      bubble(a.reply, 'os');
      applyEffects(a.actions);
    }
    for (var pid in runtime) if (runtime[pid].refresh) runtime[pid].refresh();
  });
  setTimeout(function () { input.focus(); }, 50);
};

/* ── Calculator ── */
APP_RENDER.calc = function (proc, body) {
  body.classList.add('calcapp');
  var disp = el('div', 'cdisp', '0');
  var prev = el('div', 'cprev');
  var keys = el('div', 'ckeys');
  body.appendChild(disp); body.appendChild(prev); body.appendChild(keys);
  var expr = '';

  function update() {
    disp.textContent = expr || '0';
    var v = expr ? K.calcEval(expr) : null;
    prev.textContent = v !== null && expr ? '= ' + (Math.round(v * 1e6) / 1e6) : '';
  }
  function press(k) {
    if (k === 'C') expr = '';
    else if (k === '⌫') expr = expr.slice(0, -1);
    else if (k === '=') {
      var v = K.calcEval(expr);
      if (v !== null) expr = String(Math.round(v * 1e6) / 1e6);
    } else expr += k;
    update();
  }
  var LAYOUT = ['C', '(', ')', '⌫', '7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '−', '0', '.', '^', '+', '%'];
  LAYOUT.forEach(function (k) {
    var b = el('button', /[0-9.]/.test(k) ? null : 'op', k);
    b.addEventListener('click', function () { press(k); });
    keys.appendChild(b);
  });
  var eq = el('button', 'eq', '=');
  eq.style.gridColumn = 'span 3';
  eq.addEventListener('click', function () { press('='); });
  keys.appendChild(eq);
  body.tabIndex = 0;
  body.addEventListener('keydown', function (e) {
    if (/^[0-9.+\-*/%^()]$/.test(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === 'Enter') press('=');
    else if (e.key === 'Backspace') press('⌫');
    else if (e.key === 'Escape') press('C');
  });
  update();
};

APP_RENDER.automations = function (proc, body) {
  body.classList.add('autoapp');

  tip.style.cssText = 'font-size:11.5px;color:var(--faint);padding:0 12px 10px';
  body.appendChild(listWrap); body.appendChild(form); body.appendChild(tip);

  function refresh() {
    listWrap.textContent = '';
    if (!state.automations.length) {
      listWrap.appendChild(el('div', 'empty', 'Nothing scheduled — the OS awaits its orders.'));
      return;
    }
    state.automations.forEach(function (a) {
      var row = el('div', 'arow' + (a.enabled ? '' : ' paused'));
      row.appendChild(el('span', 'aev', '#' + a.id + ' · every ' + (a.everySeconds % 3600 === 0 ? (a.everySeconds / 3600) + 'h' : a.everySeconds % 60 === 0 ? (a.everySeconds / 60) + 'm' : a.everySeconds + 's')));
      row.appendChild(el('span', 'acmd', a.command));
      var tog = el('button', 'del', a.enabled ? 'pause' : 'resume');
      tog.style.color = 'var(--warn)';
      tog.addEventListener('click', function () { K.toggleAutomation(state, a.id); refresh(); sync(); });
      var del = el('button', 'del', 'remove');

      row.appendChild(tog); row.appendChild(del);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var secs = K.parseDuration(iv.value);

    if (!r.ok) { notify('🤖 Automations', r.error); return; }
    iv.value = ''; cmd.value = '';
    refresh(); sync();
  });
  runtime[proc.pid] = { refresh: refresh };
  refresh();
};

APP_RENDER.userapp = function (proc, body) {

  var inputs = {};      // name → input element
  var outEl = null;
  app.ui.forEach(function (w) {
    if (w.type === 'label') {
      var l = el('p', null, w.text || '');
      l.style.cssText = 'margin:6px 0;color:var(--dim);font-size:13.5px';
      pad.appendChild(l);
    } else if (w.type === 'input' || w.type === 'number') {

      if (w.name) inputs[w.name] = inp;

      var b = el('button', 'btn acc', w.text || 'Run');
      b.style.cssText = 'margin:8px 0;width:100%';

        // the app's action is a shell command; input values flow in as env vars

      pad.appendChild(outEl);

  });
  var foot = el('div', null, 'A user app — its buttons run AIOS shell commands. Manifest: /apps/' + app.id + '.app');
  foot.style.cssText = 'margin-top:14px;font-size:11px;color:var(--faint)';
  pad.appendChild(foot);
};

/* ── Paint: a real canvas you can draw on and save to the disk ── */
APP_RENDER.paint = function (proc, body) {
  var bar = el('div', 'rowbar');
  var colors = ['#eef1fb', '#ff6b81', '#ffb454', '#39e6b4', '#6e8bff', '#8b7cff', '#0a0d18'];
  var cur = { color: '#6e8bff', size: 6 };
  colors.forEach(function (c) {
    var s = el('button');
    s.style.cssText = 'width:22px;height:22px;border-radius:50%;border:2px solid ' + (c === cur.color ? '#fff' : 'transparent') + ';background:' + c;
    s.addEventListener('click', function () {
      cur.color = c;
      bar.querySelectorAll('button').forEach(function (b) { if (b.style.background) b.style.borderColor = 'transparent'; });
      s.style.borderColor = '#fff';
    });
    bar.appendChild(s);
  });
  var size = el('input'); size.type = 'range'; size.min = 1; size.max = 30; size.value = cur.size;
  size.addEventListener('input', function () { cur.size = Number(size.value); });
  bar.appendChild(size);
  var clearB = el('button', 'btn', 'Clear');
  var saveB = el('button', 'btn acc', 'Save 🖼');
  bar.appendChild(clearB); bar.appendChild(saveB);
  body.appendChild(bar);
  var canvas = el('canvas');
  canvas.width = 620; canvas.height = 420;
  canvas.style.cssText = 'display:block;width:100%;background:#0a0d18;touch-action:none;cursor:crosshair';
  body.appendChild(canvas);
  var g = canvas.getContext('2d');
  g.fillStyle = '#0a0d18'; g.fillRect(0, 0, canvas.width, canvas.height);
  var drawing = false, last = null;
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
  }
  canvas.addEventListener('pointerdown', function (e) { drawing = true; last = pos(e); try { canvas.setPointerCapture(e.pointerId); } catch (x) {} });
  canvas.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    var p = pos(e);
    g.strokeStyle = cur.color; g.lineWidth = cur.size; g.lineCap = 'round';
    g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke();
    last = p;
  });
  canvas.addEventListener('pointerup', function () { drawing = false; });
  clearB.addEventListener('click', function () { g.fillStyle = '#0a0d18'; g.fillRect(0, 0, canvas.width, canvas.height); });
  saveB.addEventListener('click', function () {
    var data = canvas.toDataURL('image/png');
    var name = prompt('Save drawing as:', 'drawing.png');
    if (!name) return;
    if (!/\.png$/i.test(name)) name += '.png';
    var path = '/home/user/' + name;
    var w = K.fsWrite(state.fs, path, data, Date.now());
    if (!w.ok) { notify('Paint', w.error); return; }
    notify('🎨 Saved', path + ' — open it from Files.');
    refreshAll();
  });
};
