<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>ApexVIP</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050403;color:#f5f0e8;font-family:-apple-system,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .wrap{text-align:center;max-width:300px}
  .mark{font-family:Georgia,'Times New Roman',serif;font-size:34px;letter-spacing:1px;margin-bottom:4px}
  .mark small{display:block;font-family:-apple-system,system-ui,sans-serif;font-size:10px;font-weight:700;letter-spacing:5px;color:#D4AF6E;margin-top:6px}
  .rule{width:44px;height:1px;background:rgba(212,175,110,.5);margin:26px auto}
  p{font-size:14px;line-height:1.7;color:rgba(245,240,232,.6);margin-bottom:28px}
  .btn{display:inline-block;padding:15px 34px;border:none;border-radius:14px;background:#D4AF6E;color:#0c0b09;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">Apex<small>V I P</small></div>
  <div class="rule"></div>
  <p>You appear to be offline.<br/>Reconnect to continue your journey.</p>
  <button class="btn" onclick="location.href='https://apexvip.uk/apexvip-client.html?native=1'">Try again</button>
</div>
</body>
</html>
