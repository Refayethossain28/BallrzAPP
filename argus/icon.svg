<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Argus: the all-seeing eye whose iris is the planet, with one orbit around it -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="90%">
      <stop offset="0" stop-color="#16203d"/><stop offset="1" stop-color="#04070f"/>
    </radialGradient>
    <radialGradient id="iris" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#3f8fe6"/><stop offset="0.55" stop-color="#0f3f8f"/><stop offset="1" stop-color="#061a3d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the eye: two arcs of radius 250 between (56,256) and (456,256) -->
  <path d="M56 256 A250 250 0 0 1 456 256 A250 250 0 0 1 56 256 Z" fill="#0a1226" stroke="#8fd3ff" stroke-width="14" stroke-linejoin="round"/>
  <!-- the iris is the world -->
  <circle cx="256" cy="256" r="78" fill="url(#iris)" stroke="#8fd3ff" stroke-width="4"/>
  <path d="M226 214 q18 -10 34 4 q6 14 -8 22 q-22 4 -26 -26 Z M262 262 q22 -14 40 4 q2 20 -18 26 q-24 -4 -22 -30 Z M214 262 q14 6 8 24 q-16 4 -18 -12 Z" fill="#2f8f6a" opacity="0.9"/>
  <!-- the pupil -->
  <circle cx="256" cy="256" r="26" fill="#04070f"/>
  <circle cx="244" cy="244" r="7" fill="#ffffff" opacity="0.85"/>
  <!-- one orbit, and the satellite on it -->
  <ellipse cx="256" cy="256" rx="124" ry="36" transform="rotate(-22 256 256)" fill="none" stroke="#e6b3ff" stroke-width="5" opacity="0.9"/>
  <circle cx="371" cy="209" r="10" fill="#e6b3ff"/>
</svg>
