<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Voyager — a world in orbit: the planet is the web, the ring is you going around it. -->
  <defs>
    <radialGradient id="glow" cx="35%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#172247"/>
      <stop offset="60%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b7bff"/>
      <stop offset="55%" stop-color="#3b5bdb"/>
      <stop offset="100%" stop-color="#1c2f7a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#3ce6b0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- far half of the orbit, behind the planet -->
  <g transform="rotate(-24 256 256)">
    <path d="M 66 256 A 190 74 0 0 1 446 256" fill="none" stroke="url(#ring)" stroke-width="17" stroke-linecap="round" opacity=".45"/>
  </g>
  <!-- the planet, with meridian + equator hinting at a globe/the web -->
  <circle cx="256" cy="256" r="118" fill="url(#planet)"/>
  <ellipse cx="256" cy="256" rx="118" ry="46" fill="none" stroke="#a8c4ff" stroke-width="9" opacity=".5"/>
  <ellipse cx="256" cy="256" rx="46" ry="118" fill="none" stroke="#a8c4ff" stroke-width="9" opacity=".5"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#a8c4ff" stroke-width="9" opacity=".35"/>
  <!-- near half of the orbit, in front -->
  <g transform="rotate(-24 256 256)">
    <path d="M 446 256 A 190 74 0 0 1 66 256" fill="none" stroke="url(#ring)" stroke-width="17" stroke-linecap="round"/>
    <!-- the voyager itself -->
    <circle cx="66" cy="256" r="26" fill="#f5c04a"/>
    <circle cx="58" cy="248" r="9" fill="#fff" opacity=".85"/>
  </g>
</svg>
