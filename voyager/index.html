<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voyager — the internet browser</title>
<meta name="description" content="A real internet browser in your browser: tabs, a smart omnibox that knows a URL from a question, history with frecency-ranked suggestions, bookmarks, private tabs that leave no trace, per-tab zoom, six search engines and a session that survives restarts. Offline-first, installable, no account.">
<meta name="theme-color" content="#070b16">
<meta property="og:title" content="Voyager — the internet browser">
<meta property="og:description" content="Tabs, smart omnibox, history, bookmarks, private mode, sessions. The whole chrome of a browser, built as a pure tested engine.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voyager">
<style>
  :root {
    color-scheme: dark;
    --bg: #070b16;
    --bg2: #0d1322;
    --bar: #101829;
    --card: rgba(255,255,255,0.05);
    --card2: rgba(255,255,255,0.08);
    --line: rgba(255,255,255,0.09);
    --ink: #e9eefb;
    --dim: #93a0c0;
    --faint: #5f6b8f;
    --cyan: #4cc9f0;
    --blue: #5b7bff;
    --mint: #3ce6b0;
    --gold: #f5c04a;
    --red: #ff6b7a;
    --purple: #b07cf7;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  body.private { --bar: #191129; --bg: #0c0716; --bg2: #150d26; }

  /* ═════════ themes & accents ═════════ */
  :root[data-accent="violet"] { --cyan: #b07cf7; --blue: #6e8bff; }
  :root[data-accent="mint"]   { --cyan: #3ce6b0; --blue: #22b8e6; }
  :root[data-accent="gold"]   { --cyan: #f5c04a; --blue: #f78c3b; }
  :root[data-accent="rose"]   { --cyan: #ff6b9a; --blue: #ff6b7a; }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f7fc; --bg2: #e9eef7; --bar: #ffffff;
    --card: rgba(16,22,40,.045); --card2: rgba(16,22,40,.085); --line: rgba(16,22,40,.13);
    --ink: #101728; --dim: #4c5772; --faint: #8894af;
  }
  :root[data-theme="light"] body.private { --bg: #efeaf8; --bg2: #e6def6; --bar: #f4eefc; }

  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  input, select { font: inherit; color: var(--ink); }

  /* ═════════ toolbar ═════════ */
  .toolbar {
    flex: none;
    display: flex; align-items: center; gap: 6px;
    padding: calc(6px + env(safe-area-inset-top)) 8px 6px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    position: relative; z-index: 30;
  }
  .navbtn {
    flex: none; width: 36px; height: 36px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 17px; color: var(--dim);
  }
  .navbtn:not([disabled]):active { background: var(--card2); color: var(--ink); }
  .navbtn[disabled] { opacity: .3; cursor: default; }
  @media (max-width: 560px) { .navbtn.fwd { display: none; } }

  .omnibox {
    flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
    padding: 0 6px 0 10px; height: 40px;
  }
  .omnibox:focus-within { border-color: rgba(76,201,240,.55); box-shadow: 0 0 0 3px rgba(76,201,240,.12); }
  body.private .omnibox:focus-within { border-color: rgba(176,124,247,.55); box-shadow: 0 0 0 3px rgba(176,124,247,.12); }
  .chip { flex: none; font-size: 13px; }
  .chip.secure { color: var(--mint); }
  .chip.insecure { color: var(--gold); }
  .chip.internal { color: var(--cyan); }
  .chip.onion { color: var(--purple); }
  .chip.neutral { color: var(--faint); }
  #urlInput {
    flex: 1; min-width: 0; background: none; border: 0; outline: none;
    font-size: 15px; color: var(--ink);
  }
  #urlInput::placeholder { color: var(--faint); }
  .star { flex: none; width: 30px; height: 30px; border-radius: 8px; font-size: 16px; color: var(--faint); display: inline-flex; align-items: center; justify-content: center; }
  .star.on { color: var(--gold); }
  .star:active { background: var(--card2); }

  .tabbtn {
    flex: none; width: 34px; height: 30px; margin-left: 2px;
    border: 1.6px solid var(--dim); border-radius: 8px;
    font-size: 12.5px; font-weight: 700; color: var(--dim);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .tabbtn:active { border-color: var(--ink); color: var(--ink); }
  body.private .tabbtn { border-color: var(--purple); color: var(--purple); }

  /* ═════════ progress ═════════ */
  .progress { position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; pointer-events: none; }
  .progress i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--cyan), var(--blue));
    transition: width .25s ease, opacity .4s ease;
  }

  /* ═════════ suggestions ═════════ */
  .suggest {
    position: absolute; top: 100%; left: 52px; right: 52px; z-index: 40;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 14px;
    margin-top: 6px; overflow: hidden; display: none;
    box-shadow: 0 18px 40px rgba(0,0,0,.5);
  }
  @media (max-width: 560px) { .suggest { left: 8px; right: 8px; } }
  .suggest.on { display: block; }
  .sug { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 14px; }
  .sug + .sug { border-top: 1px solid rgba(255,255,255,.05); }
  .sug:hover, .sug.sel { background: var(--card2); }
  .sug .ico { flex: none; width: 20px; text-align: center; font-size: 14px; }
  .sug .txt { flex: 1; min-width: 0; }
  .sug .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .sug .u { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--faint); }

  /* ═════════ viewport ═════════ */
  .viewport { flex: 1; position: relative; background: var(--bg); min-height: 0; }
  #frameWrap { position: absolute; inset: 0; overflow: hidden; display: none; background: #fff; }
  #frameWrap.on { display: block; }
  #frame { border: 0; width: 100%; height: 100%; background: #fff; transform-origin: 0 0; }

  .veil {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 24px;
    background: var(--bg); z-index: 5;
  }
  .veil.on { display: flex; }
  .veil .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--card2); border-top-color: var(--cyan);
    animation: whirl .8s linear infinite;
  }
  @keyframes whirl { to { transform: rotate(360deg); } }
  .veil h3 { margin: 0; font-size: 17px; }
  .veil p { margin: 0; color: var(--dim); font-size: 14px; max-width: 340px; }
  .veil .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--line); background: var(--card2); border-radius: 12px;
    padding: 11px 18px; font-weight: 650; font-size: 14px;
  }
  .btn.primary { background: linear-gradient(135deg, var(--cyan), var(--blue)); border: 0; color: #04121f; }
  .btn:active { transform: scale(.97); }

  /* ═════════ internal pages ═════════ */
  #internal { position: absolute; inset: 0; overflow-y: auto; display: none; -webkit-overflow-scrolling: touch; }
  #internal.on { display: block; }
  .page { max-width: 640px; margin: 0 auto; padding: 22px 18px calc(40px + env(safe-area-inset-bottom)); }
  .page h1 { font-size: 22px; margin: 8px 0 4px; letter-spacing: -0.02em; }
  .page .sub { color: var(--dim); font-size: 14px; margin: 0 0 18px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; }
  .muted { color: var(--dim); font-size: 13px; }
  .tiny { color: var(--faint); font-size: 12px; }

  /* start page */
  .hero { text-align: center; padding: 7vh 10px 10px; }
  .hero .logo { width: 88px; height: 88px; border-radius: 24px; }
  .hero h1 { font-size: 30px; margin: 14px 0 4px; }
  .hero p { color: var(--dim); margin: 0 auto; max-width: 300px; }
  .startsearch {
    display: flex; align-items: center; gap: 10px; margin: 22px auto 0; max-width: 480px;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; padding: 13px 20px;
    color: var(--faint); font-size: 15px; cursor: text; width: 100%;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 12px; margin-top: 14px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 4px; border-radius: 14px; }
  .tile:hover { background: var(--card); }
  .tile .fav { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 750; color: #fff; }
  .tile .name { font-size: 12px; color: var(--dim); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h2.sect { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 26px 0 4px 2px; }

  /* list rows (history / bookmarks) */
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 6px; border-bottom: 1px solid rgba(255,255,255,.05); }
  .row:hover { background: var(--card); border-radius: 10px; }
  .row .fav { flex: none; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 750; color: #fff; font-size: 15px; }
  .row .txt { flex: 1; min-width: 0; }
  .row .t { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .u { display: block; font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .x { flex: none; width: 30px; height: 30px; border-radius: 8px; color: var(--faint); font-size: 15px; }
  .row .x:hover { background: var(--card2); color: var(--red); }
  .searchbar {
    width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; outline: none; font-size: 15px; margin: 4px 0 10px;
  }
  .searchbar:focus { border-color: rgba(76,201,240,.5); }

  /* settings */
  .field { margin: 14px 0; }
  .field label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 6px; font-weight: 600; }
  .field select, .field input {
    width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; outline: none; font-size: 15px;
  }
  .btn.danger { color: var(--red); border-color: rgba(255,107,122,.35); background: rgba(255,107,122,.08); }
  .btn.block { width: 100%; margin-top: 10px; }

  /* ═════════ tab switcher ═════════ */
  .tabsheet {
    position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column;
    background: rgba(4,7,14,.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .tabsheet.on { display: flex; }
  .tabsheet .head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top)) 18px 10px; }
  .tabsheet .head b { font-size: 17px; }
  .tabsheet .cards { flex: 1; overflow-y: auto; padding: 6px 14px 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; align-content: start; }
  .tcard {
    position: relative; text-align: left; border-radius: 16px; padding: 14px;
    background: var(--card); border: 1px solid var(--line); min-height: 108px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .tcard.active { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(76,201,240,.25); }
  .tcard.ghost { border-color: rgba(176,124,247,.4); background: rgba(176,124,247,.07); }
  .tcard .fav { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 750; color: #fff; }
  .tcard .t { font-size: 13.5px; font-weight: 650; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tcard .u { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcard .close { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 8px; color: var(--faint); font-size: 13px; background: rgba(0,0,0,.25); }
  .tcard .close:hover { color: var(--red); }
  .tabsheet .foot { flex: none; display: flex; gap: 10px; padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); }
  .tabsheet .foot .btn { flex: 1; }
  .btn.ghostly { border-color: rgba(176,124,247,.4); color: var(--purple); background: rgba(176,124,247,.08); }

  /* ═════════ menu ═════════ */
  .menu {
    position: absolute; top: calc(100% + 6px); right: 8px; z-index: 50; min-width: 230px;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 18px 40px rgba(0,0,0,.5); overflow: hidden; display: none;
  }
  .menu.on { display: block; }
  .mi { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 16px; font-size: 14.5px; }
  .mi:hover { background: var(--card2); }
  .mi .ico { flex: none; width: 20px; text-align: center; }
  .mi.split { border-top: 1px solid var(--line); }
  .zoomrow { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-top: 1px solid var(--line); }
  .zoomrow button { width: 34px; height: 34px; border-radius: 9px; font-size: 17px; color: var(--dim); }
  .zoomrow button:hover { background: var(--card2); color: var(--ink); }
  .zoomrow b { font-size: 13.5px; color: var(--dim); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--bg2); border: 1px solid var(--line); color: var(--ink);
    padding: 10px 18px; border-radius: 999px; font-size: 13.5px; z-index: 80;
    opacity: 0; transition: all .25s ease; pointer-events: none; white-space: nowrap;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ═════════ command palette (⌘K) ═════════ */
  .palette {
    position: fixed; inset: 0; z-index: 70; display: none;
    background: rgba(4,7,14,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: max(60px, 12vh) 14px 14px;
  }
  .palette.on { display: block; animation: pfade .14s ease; }
  @keyframes pfade { from { opacity: 0; } }
  .palbox {
    max-width: 560px; margin: 0 auto; background: var(--bg2); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  .palbox input {
    width: 100%; background: none; border: 0; outline: none; color: var(--ink);
    font-size: 17px; padding: 16px 18px; border-bottom: 1px solid var(--line);
  }
  .palbox input::placeholder { color: var(--faint); }
  .pallist { max-height: min(52vh, 460px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pi { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 16px; }
  .pi.sel, .pi:hover { background: var(--card2); }
  .pi .ico { flex: none; width: 22px; text-align: center; font-size: 15px; }
  .pi .txt { flex: 1; min-width: 0; }
  .pi .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14.5px; }
  .pi .u { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--faint); }
  .pi .tag { flex: none; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .palhint { padding: 9px 16px; font-size: 11.5px; color: var(--faint); border-top: 1px solid var(--line); display: flex; gap: 14px; }
  .palhint b { color: var(--dim); font-weight: 600; }

  /* theme + accent controls in Settings */
  .segrow { display: flex; gap: 8px; }
  .segrow button { flex: 1; padding: 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg2); color: var(--dim); font-size: 13.5px; font-weight: 600; }
  .segrow button[aria-pressed="true"] { border-color: var(--cyan); color: var(--ink); background: var(--card2); }
  .swatches { display: flex; gap: 12px; margin-top: 4px; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg2), 0 0 0 4px currentColor; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .switch { position: relative; width: 46px; height: 27px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); flex: none; transition: background .15s; }
  .switch[aria-pressed="true"] { background: linear-gradient(135deg, var(--cyan), var(--blue)); border-color: transparent; }
  .switch i { position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch[aria-pressed="true"] i { transform: translateX(19px); }

  /* ═════════ reader view ═════════ */
  .reader { max-width: 680px; margin: 0 auto; padding: 20px 20px calc(60px + env(safe-area-inset-bottom)); }
  .reader .rmeta { color: var(--faint); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 2px 0 4px; }
  .reader h1.rtitle { font-size: 26px; line-height: 1.25; letter-spacing: -0.02em; margin: 8px 0 6px; }
  .reader .rbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 18px; }
  .reader .rbar .btn { padding: 8px 14px; font-size: 13px; }
  .reader .rbody { font-size: 17px; line-height: 1.72; }
  .reader .rbody p { margin: 0 0 1.05em; }
  .reader .rbody h1, .reader .rbody h2, .reader .rbody h3, .reader .rbody h4, .reader .rbody h5, .reader .rbody h6 { line-height: 1.3; margin: 1.4em 0 .5em; letter-spacing: -0.01em; }
  .reader .rbody h2 { font-size: 20px; } .reader .rbody h3 { font-size: 17.5px; } .reader .rbody h4 { font-size: 16px; }
  .reader .rbody li { margin: 0 0 .5em 1.1em; }
  .reader .rbody blockquote { margin: 1.1em 0; padding: 4px 0 4px 16px; border-left: 3px solid var(--line); color: var(--dim); font-style: italic; }
  .reader .rbody pre { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-size: 13.5px; white-space: pre-wrap; }
  .reader .rimg { width: 100%; border-radius: 12px; margin: 4px 0 16px; border: 1px solid var(--line); background: var(--bg2); }
  .reader .rempty { color: var(--dim); text-align: center; padding: 12vh 10px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--cyan); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
  .badge.mem { color: var(--purple); }

  /* ═════════ swipe gestures ═════════ */
  .swipezone { position: absolute; top: 0; bottom: 0; width: 24px; z-index: 6; touch-action: none; }
  @media (hover: hover) and (pointer: fine) { .swipezone { display: none; } } /* touch-only: never steal mouse clicks */
  .swipezone.left { left: 0; } .swipezone.right { right: 0; }
  .swipehint {
    position: absolute; top: 50%; transform: translateY(-50%) scale(.6); z-index: 7;
    width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--bg2); border: 1px solid var(--line); color: var(--cyan); font-size: 24px;
    opacity: 0; transition: opacity .12s ease, transform .12s ease; pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .swipehint.on { opacity: 1; transform: translateY(-50%) scale(1); }
  .swipehint.left { left: 14px; } .swipehint.right { right: 14px; }

  /* pinned tabs */
  .tcard.pinned { border-color: rgba(245,192,74,.45); }
  .tcard .pin {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 8px;
    color: var(--faint); font-size: 13px; background: rgba(0,0,0,.25);
  }
  .tcard .pin.on { color: var(--gold); }
  .tcard.pinned .pin { right: 8px; }
  .tcard.pinned .close { display: none; }
  .tcard:not(.pinned) .pin { right: 40px; }

  /* ═════════ time travel: the change banner + diff view ═════════ */
  .changebar {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%) translateY(-160%);
    z-index: 8; display: flex; align-items: center; gap: 10px; max-width: min(94%, 560px);

    transition: transform .25s ease; white-space: nowrap;
  }
  .changebar.on { transform: translateX(-50%) translateY(0); }

  .diff-part { margin: 0 0 1.02em; line-height: 1.66; font-size: 16.5px; }

  .diff-part.removed { color: var(--red); text-decoration: line-through; text-decoration-thickness: 1.5px; opacity: .8; background: rgba(255,107,122,.07); border-radius: 8px; padding: 6px 10px; }

  /* TL;DR box in Reader */

  </div>

<div class="toast" id="toast"></div>

<script src="engine.js"></script>
<script>
'use strict';
/* Voyager UI — a skin over voyager/engine.js. All decisions (what a typed
 * string means, what closing a tab focuses, what lands in history) live in
 * the engine; this file only paints state and forwards events. */

var $ = function (id) { return document.getElementById(id); };
var STORE_KEY = 'voyager.session.v1';

/* ---- state ---- */
var S;                       // the engine state — the single source of truth
try { S = Voyager.restore(localStorage.getItem(STORE_KEY) || ''); }
catch (e) { S = Voyager.createBrowser(); }

var loadTimer = 0;           // embed-refusal watchdog
var pageTrackers = {};       // url → tracker count for pages loaded this session
var progressTimer = 0;
var suggestIndex = -1;
var detectedProxy = '';      // set by the boot probe when voyager/server.mjs is serving us
var currentFrameSrc = '';    // the src the iframe is actually on (may differ from getAttribute after in-frame nav)
var frameSyncing = false;    // true while we're recording an in-frame navigation (don't reload the frame)

/* The proxy base in force right now: 'off' disables, a set URL forces it,
 * empty falls back to a locally-detected server. When set, clearnet pages load
 * through voyager/server.mjs and framing-refusers (YouTube, Google…) open. */
function proxyBaseNow() {
  var p = (S.settings.proxy || '').trim();
  var base;
  if (p.toLowerCase() === 'off') return '';
  else if (p) base = Voyager.normalizeProxyBase(p);   // forgiving: adds https:// and /proxy if missing
  else base = detectedProxy;
  if (!base) return '';
  // Tell the proxy per-request when blocking is off — globally, or overridden
  // for the active tab's site (per-site settings win either way).
  if (!siteEffective(Voyager.tabUrl(Voyager.activeTab(S)), 'blockTrackers')) {
    base += (base.indexOf('?') === -1 ? '?' : '&') + 'block=0';
  }
  return base;
}
function frameOpts() { return { torGateway: S.settings.torGateway, proxyBase: proxyBaseNow() }; }
/** Origin of the active proxy (for validating postMessage from proxied pages). */
function proxyOrigin() {
  var b = proxyBaseNow();
  if (!b) return '\0';                 // no proxy → a value e.origin can never equal
  try { return new URL(b).origin; } catch (e) { return '\0'; }
}

function persist() {
  try { localStorage.setItem(STORE_KEY, Voyager.serialize(S)); } catch (e) {}
}

/* Update a setting and persist WITHOUT repainting — for inputs that live on
 * the settings page, whose value already reflects the change. Avoids the
 * reentrant innerHTML rebuild that would remove the focused field mid-event. */
function saveSetting(key, value) {
  S = Voyager.setSetting(S, key, value);
  persist();
}

/** Every mutation goes through here: swap state, repaint, save. */
function commit(next) {
  var tabBefore = Voyager.activeTab(S);
  var urlBefore = Voyager.tabUrl(tabBefore);
  var idBefore = S.activeId;
  S = next;
  var tab = Voyager.activeTab(S);
  var url = Voyager.tabUrl(tab);
  if (url !== urlBefore || S.activeId !== idBefore) showUrl(url, tab);
  paintChrome();
  persist();
}

/* ---- helpers ---- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var TILE_COLORS = ['#5b7bff', '#4cc9f0', '#3ce6b0', '#f5c04a', '#ff6b7a', '#b07cf7', '#f78c6b', '#6bd968'];
function tileColor(text) {
  var h = 0; text = String(text || '?');
  for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
  return TILE_COLORS[h % TILE_COLORS.length];
}
function letterOf(url, title) {
  var host = Voyager.hostOf(url);
  var base = host.replace(/^www\./, '') || String(title || '?');
  return base.charAt(0).toUpperCase() || '?';
}
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(function () { t.classList.remove('on'); }, 1800);
}

/* ---- painting: toolbar ---- */
function paintChrome() {
  var tab = Voyager.activeTab(S);
  var url = Voyager.tabUrl(tab);

  $('backBtn').disabled = !Voyager.canBack(tab);
  $('fwdBtn').disabled = !Voyager.canForward(tab);

  var sec = Voyager.securityOf(url);
  var chip = $('chip');
  chip.className = 'chip ' + sec;
  chip.textContent = sec === 'secure' ? '🔒' : sec === 'insecure' ? '⚠️' : sec === 'internal' ? '✦' : sec === 'onion' ? '🧅' : '·';
  chip.title = sec === 'secure' ? 'Connection is HTTPS' : sec === 'insecure' ? 'Plain HTTP — not encrypted' : sec === 'internal' ? 'A Voyager page' : sec === 'onion' ? 'A Tor hidden service (.onion) — end-to-end encrypted by Tor' : '';

  var star = $('starBtn');
  var starred = Voyager.isBookmarked(S, url);
  star.textContent = starred ? '★' : '☆';
  star.className = 'star' + (starred ? ' on' : '');

  $('tabsBtn').textContent = String(S.tabs.length);
  $('pinLabel').textContent = tab && tab.pinned ? 'Unpin this tab' : 'Pin this tab';
  $('zoomLabel').textContent = (tab ? tab.zoom : 100) + '%';
  document.body.classList.toggle('private', !!(tab && tab.incognito));

  applyTheme();
  applyZoom(tab);
  paintTrackerBadge();
  renderView(url, tab);
}

/** 🛡 N in the omnibox when the current page carried tracker requests. */
function paintTrackerBadge() {
  var n = pageTrackers[currentUrl()] || 0;
  $('trkBadge').className = 'trkbadge' + (n > 0 ? ' on' : '');
  if (n > 0) $('trkCount').textContent = String(n);
}

/* Resolve theme (dark/light/auto) + accent onto <html>, and match the OS-chrome colour. */
function applyTheme() {
  var el = document.documentElement;
  var theme = S.settings.theme || 'dark';
  var resolved = theme === 'auto'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : theme;
  el.setAttribute('data-theme', resolved);
  el.setAttribute('data-accent', S.settings.accent || 'cyan');
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', resolved === 'light' ? '#ffffff' : '#070b16');
}

function showUrl(url, tab) {
  var input = $('urlInput');
  if (document.activeElement === input) return;   // don't fight the typist
  input.value = url === 'voyager://start' ? '' : Voyager.displayUrl(url);
}

/* ---- painting: the page itself ---- */
function renderView(url, tab) {
  var internal = String(url).indexOf('voyager://') === 0;
  // A .onion with no gateway configured can't be routed by a frame that has no
  // Tor circuit — show the honest dark-web explainer instead of a dead load.
  var onionNoGateway = Voyager.isOnion(url) && !S.settings.torGateway;
  $('internal').className = internal ? 'on' : '';
  $('frameWrap').className = (internal || onionNoGateway) ? '' : 'on';

  if (internal) {
    hideVeil();
    stopProgress(true);
    $('frame').removeAttribute('src');
    renderInternal(url.slice('voyager://'.length) || 'start');
    return;
  }
  if (onionNoGateway) {
    stopProgress(true);
    $('frame').removeAttribute('src');
    currentFrameSrc = '';
    showVeil('onion', url);
    return;
  }
  loadFrame(url);
}

/* Point the iframe at the right src for `url` (proxy / gateway / direct). When
 * we're only syncing an in-frame navigation, the frame is already there — keep
 * currentFrameSrc in step but don't reload it. */
function loadFrame(url) {
  var frame = $('frame');
  var src = Voyager.resolveFrameSrc(url, frameOpts());
  if (frameSyncing) { currentFrameSrc = src; return; }
  if (src === currentFrameSrc) return;
  currentFrameSrc = src;
  startProgress();
  showVeil('loading', url);
  frame.setAttribute('src', src);
  clearTimeout(loadTimer);
  loadTimer = setTimeout(function () { showVeil('blocked', url); }, 9000);
}

function applyZoom(tab) {
  var z = (tab && tab.zoom || 100) / 100;
  var frame = $('frame');
  frame.style.transform = z === 1 ? '' : 'scale(' + z + ')';
  frame.style.width = z === 1 ? '100%' : (100 / z) + '%';
  frame.style.height = z === 1 ? '100%' : (100 / z) + '%';
}

/* ---- the veil: spinner / embed-refusal fallback ---- */
function showVeil(mode, url) {
  var veil = $('veil');
  veil.className = 'veil on';
  if (mode === 'loading') {
    $('veilSpin').style.display = '';
    $('veilTitle').textContent = 'Loading ' + (Voyager.hostOf(url) || 'page') + '…';
    $('veilText').textContent = '';
    $('veilActions').innerHTML = '';
  } else if (mode === 'onion') {
    $('veilSpin').style.display = 'none';
    $('veilTitle').textContent = '🧅 A Tor hidden service';
    $('veilText').innerHTML = 'This is a <b>.onion</b> address — it lives on the Tor network, not the open internet. Reaching it properly needs a <b>Tor circuit</b>, which a page running inside your everyday browser can’t open on its own. Two honest ways through: browse it in the <b>Tor Browser</b> (real anonymity), or set a <b>Tor gateway</b> in Settings to fetch it over the clearnet — faster, but the gateway operator can see the traffic Tor would have hidden, so it is <i>not</i> anonymous.';
    $('veilActions').innerHTML =
      '<button class="btn primary" data-act="settings">Set a Tor gateway ⚙️</button>' +
      '<button class="btn" data-act="copy">Copy .onion address</button>';
    stopProgress(false);
  } else {
    $('veilSpin').style.display = 'none';
    $('veilTitle').textContent = 'This site won’t be framed';
    var proxyOn = !!proxyBaseNow();
    if (Voyager.isOnion(url)) {
      $('veilText').innerHTML = 'The gateway reached the hidden service but it refuses to render inside another page (X-Frame-Options), or the gateway is down. Try opening it in a full tab, or use the Tor Browser.';
    } else if (proxyOn) {
      $('veilText').innerHTML = 'Even through the proxy this page won’t render inside a frame — usually a heavy app, DRM video, or a login. Open it in a full tab instead.';
    } else {
      // The common case: hosted/static, no proxy. Tell them how to actually open it.
      $('veilText').innerHTML = 'Big sites (YouTube, Google, most logins) send <b>X-Frame-Options</b> and refuse to render inside another page — the browser enforces it. To open sites like these, run Voyager’s <b>full-browser server</b> and open the address it prints:<br><code style="display:inline-block;margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px">node voyager/server.mjs</code><br><span class="tiny">(YouTube <i>videos</i> already play here — just paste a <b>youtube.com/watch</b> or <b>youtu.be</b> link.)</span>';
    }
    $('veilActions').innerHTML =
      '<button class="btn primary" data-act="external">Open in full tab ↗</button>' +
      '<button class="btn" data-act="dismissveil">Wait anyway</button>';
    stopProgress(false);
  }
}
function hideVeil() {
  clearTimeout(loadTimer);
  $('veil').className = 'veil';
}

/* ---- progress bar theatre ---- */
function startProgress() {
  var bar = $('progressBar');
  clearInterval(progressTimer);
  bar.style.opacity = '1';
  bar.style.width = '8%';
  var w = 8;
  progressTimer = setInterval(function () {
    w += (90 - w) * 0.08;
    bar.style.width = w.toFixed(1) + '%';
  }, 180);
}
function stopProgress(instant) {
  var bar = $('progressBar');
  clearInterval(progressTimer);
  bar.style.width = '100%';
  setTimeout(function () { bar.style.opacity = '0'; bar.style.width = '0'; }, instant ? 0 : 250);
}

/* ---- internal pages ---- */
function renderInternal(page) {
  var el = $('internal');
  if (page === 'start') el.innerHTML = startPage();
  else if (page === 'history') el.innerHTML = historyPage('');
  else if (page === 'bookmarks') el.innerHTML = bookmarksPage();
  else if (page === 'reading') el.innerHTML = readingPage();
  else if (page === 'memory') el.innerHTML = memoryPage('');
  else if (page === 'reader') el.innerHTML = readerPage();
  else if (page === 'changes') el.innerHTML = changesPage();
  else if (page === 'site') el.innerHTML = sitePage();
  else if (page === 'settings') { el.innerHTML = settingsPage(); checkProxyStatus(); }
  else if (page === 'about') el.innerHTML = aboutPage();
  else el.innerHTML = startPage();
}

function readingPage() {
  var items = Voyager.readingList(S);
  var unread = items.filter(function (r) { return !r.read; }).length;
  var h = '<div class="page"><h1>Reading list</h1><p class="sub">' +
    (items.length ? unread + ' unread of ' + items.length + ' saved' : 'Save pages to read later — tap 📑 in the menu on any page.') + '</p>';
  if (!items.length) h += '<div class="panel muted">Nothing saved yet.</div>';
  for (var i = 0; i < items.length; i++) {
    var r = items[i];
    h += '<div class="row" style="' + (r.read ? 'opacity:.55' : '') + '">' +
      '<button class="x" data-readtoggle="' + esc(r.url) + '" title="' + (r.read ? 'Mark unread' : 'Mark read') + '" style="color:' + (r.read ? 'var(--mint)' : 'var(--faint)') + '">' + (r.read ? '✓' : '○') + '</button>' +
      '<button style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;flex:1;min-width:0" data-nav="' + esc(r.url) + '">' +
      favHtml(r.url, r.title) +
      '<span class="txt"><span class="t"' + (r.read ? ' style="text-decoration:line-through"' : '') + '>' + esc(r.title) + '</span>' +
      '<span class="u">' + esc(Voyager.displayUrl(r.url)) + '</span></span></button>' +
      '<button class="x" data-unread="' + esc(r.url) + '" title="Remove">✕</button></div>';
  }
  return h + '</div>';
}

/* ---- web memory: the thing no other browser does ----
 * Every readable page you open (through the full-browser proxy, outside private
 * tabs, with Remember on) is quietly distilled to clean text and kept on-device.
 * voyager://memory is a full-text search over everything you've *read* — so you
 * can find that article by a phrase from its body and re-open a clean offline
 * copy even after the live page changes, paywalls, or disappears. */
function highlightSnippet(snippet, query) {
  var out = esc(snippet);
  var terms = String(query || '').toLowerCase().split(/\s+/).filter(Boolean);
  for (var i = 0; i < terms.length; i++) {
    var safe = esc(terms[i]).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (safe) out = out.replace(new RegExp('(' + safe + ')', 'ig'), '<b>$1</b>');
  }
  return out;
}
function memoryPage(query) {
  var hits = Voyager.searchMemory(S, query, { limit: 60 });
  var total = S.memory.length;
  var h = '<div class="page"><h1>Web memory</h1><p class="sub">' +
    (total ? 'Search the full text of the ' + total + ' page' + (total === 1 ? '' : 's') + ' you’ve read — by anything they <i>said</i>. All on this device.'
           : 'Nothing remembered yet. Open pages through the full browser (proxy) with <b>Remember</b> on, and Voyager keeps a searchable, offline copy of each one.') + '</p>';
  if (total) h += '<input class="searchbar" id="memSearch" placeholder="Search everything you’ve read…" value="' + esc(query) + '" autocapitalize="off" autocorrect="off" spellcheck="false">';
  if (!total) {
    h += '<div class="panel muted">Tip: turn on <b>Settings → Remember pages I read</b>, connect the full-browser proxy, and browse. Every article becomes findable here.</div>';
    return h + '</div>';
  }
  if (!hits.length) { h += '<div class="panel muted">No remembered page matches “' + esc(query) + '”.</div>'; }
  for (var i = 0; i < hits.length; i++) {
    var m = hits[i];
    h += '<div class="row mem-hit">' +
      '<button style="all:unset;cursor:pointer;display:flex;align-items:flex-start;gap:12px;flex:1;min-width:0" data-readmem="' + esc(m.url) + '">' +
      favHtml(m.url, m.title) +
      '<span class="txt"><span class="t">' + esc(m.title) + '</span>' +

/* The article currently shown in Reader (set just before navigating to

var readerState = null;
function readerPage() {
  var a = readerState;
  if (!a) return '<div class="reader"><div class="rempty"><h1>Reader</h1><p class="muted">Open a page, then choose <b>⌘ → Reader view</b> to read it as clean, distraction-free text.</p></div></div>';

    '<div class="rmeta">' +

      '<span>' + esc(host) + '</span>' +

    '<h1 class="rtitle">' + esc(a.title || host) + '</h1>' +
    '<div class="rbar">' +
      '<button class="btn primary" data-readeropen="' + esc(a.url) + '">Open live page ↗</button>' +
      (a.text ? '<button class="btn" data-act="tldr">⚡ TL;DR</button>' : '') +
      (Voyager.inReading(S, a.url) ? '' : '<button class="btn" data-readersave="' + esc(a.url) + '">📑 Read later</button>') +
      (a.from === 'memory' ? '<button class="btn" data-forgetmem="' + esc(a.url) + '" data-frommemreader="1">🗑 Forget</button>' : '') +
    '</div>';
  if (a.tldr) h += '<div class="tldr"><b class="tag">⚡ TL;DR — the article’s own words, distilled</b>' + esc(a.tldr) + '</div>';
  if (a.from === 'live' && a.images && a.images.length) {
    h += '<img class="rimg" src="' + esc(a.images[0]) + '" alt="" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">';
  }
  var body = a.html;
  if (!body) {
    // offline copies store plain text — render each blank-line block as a paragraph
    var parts = String(a.text || '').split(/\n\n+/);

    for (var i = 0; i < parts.length; i++) { var p = parts[i].trim(); if (p) body += '<p>' + esc(p) + '</p>'; }
  }
  h += '<div class="rbody">' + (body || '<p class="muted">No readable text was found on this page.</p>') + '</div>';

/* ---- time travel: what changed since you read it ----
 * When a remembered page comes back with different text, the capture path

var diffState = null;   // {url, title, sinceTs, added, removed, parts}
function showChangeBanner() {
  if (!diffState) return;
  $('changeMsg').textContent = '📝 Changed since you read it — ' +
    (diffState.added ? diffState.added + ' new' : '') +
    (diffState.added && diffState.removed ? ', ' : '') +
    (diffState.removed ? diffState.removed + ' gone' : '');

}
function hideChangeBanner() { $('changebar').className = 'changebar'; }
function changesPage() {
  var d = diffState;

  var host = Voyager.hostOf(d.url) || Voyager.displayUrl(d.url);
  var since = d.sinceTs ? new Date(d.sinceTs).toLocaleDateString() : 'you read it';
  var h = '<div class="reader">' +
    '<div class="rmeta"><span class="badge">📝 what changed</span><span>' + esc(host) + '</span><span>· since ' + esc(since) + '</span></div>' +

  for (var i = 0; i < d.parts.length; i++) {

}

/* Open the current live page as clean Reader text. Needs the proxy (only a
 * server can fetch cross-origin HTML). Fetches /reader, shows it, and — if
 * Remember is on and we're not private — files it into web memory. */
function openReader() {
  var url = currentUrl();
  if (String(url).indexOf('voyager://') === 0) { toast('Nothing to read here'); return; }
  var ep = readerEndpoint(url);
  if (!ep) { toast('Reader needs the full-browser proxy — set one in Settings'); navTo('voyager://settings'); return; }
  toast('📖 Distilling…');
  fetch(ep, { cache: 'no-store' })
    .then(function (r) { return r && r.ok ? r.json() : null; })
    .then(function (j) {
      if (!j || (!j.text && !j.html)) { toast('Couldn’t extract this page'); return; }
      readerState = { url: url, title: j.title || Voyager.activeTab(S).title || Voyager.hostOf(url), text: j.text || '', html: j.html || '', words: j.words || 0, images: j.images || [], from: 'live' };
      captureToMemory(url, j);      // remember it while we have the text
      navTo('voyager://reader');
    })
    .catch(function () { toast('Reader unreachable — check the proxy'); });
}
/** Open a remembered page as an offline Reader copy (no network). */
function openMemory(url) {
  var m = Voyager.memoryEntry(S, url);
  if (!m) { toast('Not in memory'); return; }
  readerState = { url: m.url, title: m.title, text: m.text || '', html: '', words: m.words || 0, images: [], from: 'memory' };
  navTo('voyager://reader');
}

/* Derive the /reader (or ping) endpoint on the proxy host from the /proxy base,
 * carrying the ?key= through if the user set one. */
function readerEndpoint(targetUrl) {
  var base = proxyBaseNow();
  if (!base) return '';
  var root = base.replace(/[?#].*$/, '').replace(/\/proxy\/?$/, '');
  var key = /[?&]key=([^&]+)/.exec(S.settings.proxy || '');
  return root + '/reader?url=' + encodeURIComponent(targetUrl) + (key ? '&key=' + key[1] : '');
}

/* Background auto-capture: after a proxied page finishes loading, quietly fetch
 * its clean text and file it into web memory. Never for private tabs, internal
 * pages, or when Remember is off; deduped so we don't refetch the same URL. */
var lastCaptured = '';
function maybeCapture(url) {
  if (!siteEffective(url, 'remember')) return;   // global off, or this site opted out
  var tab = Voyager.activeTab(S);
  if (tab && tab.incognito) return;
  if (!url || String(url).indexOf('http') !== 0) return;
  if (url === lastCaptured || Voyager.inMemory(S, url)) return;
  var ep = readerEndpoint(url);
  if (!ep) return;                                  // capture only works with the proxy
  lastCaptured = url;
  fetch(ep, { cache: 'no-store' })
    .then(function (r) { return r && r.ok ? r.json() : null; })
    .then(function (j) { if (j) captureToMemory(url, j); })
    .catch(function () {});
}
function captureToMemory(url, j) {
  if (!siteEffective(url, 'remember')) return;
  var tab = Voyager.activeTab(S);
  if (tab && tab.incognito) return;
  if (!j || !j.text) return;
  // Time travel: diff against the copy you actually read BEFORE overwriting it.
  var ch = Voyager.pageChanges(S, url, j.text);
  if (ch) {
    diffState = { url: url, title: j.title || Voyager.hostOf(url), sinceTs: ch.sinceTs, added: ch.added, removed: ch.removed, parts: ch.parts };
    if (url === currentUrl()) showChangeBanner();
  }
  commit(Voyager.rememberPage(S, { url: url, title: j.title, text: j.text, words: j.words }, Date.now()));
}

/** Ping the active proxy and reflect connected/unreachable in the Settings page. */
function checkProxyStatus() {
  var base = proxyBaseNow();
  var el = $('proxyStatus');
  if (!el) return;
  if (!base) { el.innerHTML = 'Status: <b style="color:var(--faint)">not connected</b>'; return; }
  var ping = base.replace(/\?.*$/, '').replace(/\/proxy\/?$/, '') + '/__voyager/ping';
  fetch(ping, { cache: 'no-store' })
    .then(function (r) { return r && r.ok ? r.json() : null; })
    .then(function (j) {
      var el2 = $('proxyStatus'); if (!el2) return;
      if (j && j.voyager) el2.innerHTML = 'Status: <b style="color:var(--mint)">✓ connected — ' + esc(base) + '</b>';
      else el2.innerHTML = 'Status: <b style="color:var(--red)">reached, but not a Voyager proxy</b>';
    })
    .catch(function () {
      var el2 = $('proxyStatus'); if (!el2) return;

    });

    '<p class="tiny" style="margin:4px 2px 0">• <b>Deployed:</b> host <code>voyager/server.mjs</code> once (see <b>voyager/DEPLOY.md</b>) and paste its URL above — just the address is fine, <code>/proxy</code> is added for you. Then this hosted site opens any site. Type <code>off</code> to disable.</p>' +
    '<p class="tiny" style="margin:4px 2px 0">Locking a public proxy? Set <code>PROXY_KEY</code> on the server and add <code>?key=YOURKEY</code> to the URL above — it rides in the link, so it works where an origin allowlist wouldn’t.</p>' +
    '<p class="tiny" style="margin:8px 2px 0">Honest limits: a proxy isn’t a new engine — heavy apps, DRM video and cookie-logins may not fully work — and whoever runs the proxy sees the traffic, so run your own.</p>' +
    '</div>' +
    '<h2 class="sect">🧅 Dark web (.onion)</h2><div class="panel">' +
    '<div class="field"><label>Tor gateway host</label>' +
    '<input id="torInput" value="' + esc(S.settings.torGateway) + '" placeholder="off — e.g. onion.ws" autocapitalize="off" autocorrect="off" spellcheck="false"></div>' +
    '<p class="tiny" style="margin:2px 2px 0">Voyager renders pages in a sandboxed frame with no Tor circuit of its own, so it can’t reach <b>.onion</b> hidden services directly. Name a Tor2web-style gateway here and Voyager routes <b>.onion</b> addresses through it over the clearnet (e.g. <code>abc.onion</code> → <code>abc.onion.' + esc(S.settings.torGateway || 'ws') + '</code>). Honest trade-off: a gateway is <b>not anonymous</b> — its operator sees the traffic Tor would have hidden, and gateways come and go. For real anonymity use the <b>Tor Browser</b>. Leave blank to keep it off.</p>' +
    '</div>' +
    '<div class="panel">' +
    '<button class="btn danger block" style="margin-top:0" data-act="clearhistory">Clear history</button>' +
    '<button class="btn danger block" data-act="wipe">Erase everything (tabs, history, bookmarks)</button>' +
    '</div>' +
    '<div class="panel tiny">Voyager pages: <a style="color:var(--cyan)" data-nav="voyager://about" href="javascript:void 0">voyager://about</a> · <a style="color:var(--purple)" data-nav="voyager://memory" href="javascript:void 0">voyager://memory</a> · voyager://history · voyager://bookmarks · voyager://site · voyager://settings</div></div>';
  return h;
}

function aboutPage() {
  return '<div class="page"><div class="hero"><img class="logo" src="icon.svg" alt=""><h1>Voyager</h1>' +
    '<p>The internet browser.</p></div>' +
    '<div class="panel muted">A browser, stripped to its truth, is the <i>chrome</i>: the omnibox that knows a URL from a question, tabs and their back/forward stacks, history that learns what matters to you, bookmarks, private tabs, a session that survives restarts. All of that lives in a pure, deterministic, unit-tested engine (<code>voyager/engine.js</code>) — this page is just a skin over it. The pixels come from your device’s real web engine in a sandboxed frame.</div>' +
    '<div class="panel muted">🧅 <b>Dark web:</b> Voyager recognises <b>.onion</b> hidden-service addresses first-class and gives them their own security posture. It can’t open a Tor circuit from inside an ordinary browser, so by default it explains that honestly rather than faking it — but set a <b>Tor gateway</b> in Settings and it will route .onion addresses through it over the clearnet. A gateway is a convenience, not anonymity; the Tor Browser is the real thing.</div>' +
    '<div class="panel tiny">Honest limits: sites that send X-Frame-Options / CSP frame-ancestors refuse to be embedded — Voyager detects the silence and offers a full tab instead. Links followed <i>inside</i> a page move the frame’s own history, not Voyager’s stack. No sync, no telemetry, no cloud: your data lives in this device’s storage and nowhere else.</div></div>';
}

function engineName() {
  var engines = Voyager.SEARCH_ENGINES;
  for (var i = 0; i < engines.length; i++) if (engines[i].id === S.settings.engine) return engines[i].name;
  return engines[0].name;
}

/* ---- tab switcher ---- */
function renderTabsheet() {
  var cards = $('tabCards');
  $('tabCount').textContent = S.tabs.length + ' tab' + (S.tabs.length === 1 ? '' : 's');
  var h = '';
  for (var i = 0; i < S.tabs.length; i++) {
    var t = S.tabs[i];
    var url = Voyager.tabUrl(t);
    var title = t.title || (String(url).indexOf('voyager://') === 0 ? 'New tab' : Voyager.hostOf(url) || Voyager.displayUrl(url));
    h += '<button class="tcard' + (t.id === S.activeId ? ' active' : '') + (t.incognito ? ' ghost' : '') + (t.pinned ? ' pinned' : '') + '" data-tab="' + t.id + '">' +
      (t.incognito ? '<span class="fav" style="background:#3a2a5f">🕶</span>' : favHtml(url, title)) +
      '<span class="t">' + esc(title) + '</span>' +
      '<span class="u">' + esc(Voyager.displayUrl(url)) + '</span>' +
      (t.incognito ? '' : '<span class="pin' + (t.pinned ? ' on' : '') + '" data-pintab="' + t.id + '" title="' + (t.pinned ? 'Unpin' : 'Pin') + '">📌</span>') +
      (t.pinned ? '' : '<span class="close" data-closetab="' + t.id + '">✕</span>') + '</button>';
  }
  cards.innerHTML = h;
}

/* ---- suggestions ---- */
function renderSuggest() {
  var input = $('urlInput').value;
  var box = $('suggest');
  var items = Voyager.suggest(S, input, { nowTs: Date.now(), limit: 6 });
  suggestIndex = -1;
  if (!items.length) { box.className = 'suggest'; box.innerHTML = ''; return; }
  var icons = { goto: '🌐', bookmark: '★', history: '🕘', search: '🔍' };
  var h = '';
  for (var i = 0; i < items.length; i++) {
    h += '<button class="sug" data-nav="' + esc(items[i].url) + '"><span class="ico">' + icons[items[i].kind] + '</span>' +
      '<span class="txt"><span class="t">' + esc(items[i].title) + '</span>' +
      (items[i].kind !== 'search' ? '<span class="u">' + esc(Voyager.displayUrl(items[i].url)) + '</span>' : '') +
      '</span></button>';
  }
  box.innerHTML = h;
  box.className = 'suggest on';
}
function hideSuggest() { $('suggest').className = 'suggest'; suggestIndex = -1; }

/* ---- actions ---- */
function go(input) {
  var cls = Voyager.classify(input, { engine: S.settings.engine });
  if (cls.kind === 'empty') return;
  navTo(cls.url);
}
function navTo(url) {
  hideSuggest();
  hideChangeBanner();
  $('urlInput').blur();
  commit(Voyager.navigate(S, S.activeId, url, { ts: Date.now() }));
  showUrl(url, Voyager.activeTab(S));
}
function currentUrl() { return Voyager.tabUrl(Voyager.activeTab(S)); }

function openExternal() {
  var url = currentUrl();
  if (String(url).indexOf('voyager://') === 0) { toast('That page lives inside Voyager'); return; }
  // A raw .onion won't open in an ordinary browser tab — send the gateway URL
  // if one is set (that one actually resolves); otherwise the real .onion, for
  // whoever has the Tor Browser as their default.
  if (Voyager.isOnion(url) && S.settings.torGateway) url = Voyager.torGatewayUrl(url, S.settings.torGateway);
  window.open(url, '_blank', 'noopener');
}

function doWipe() {
  if (!confirm('Erase all Voyager data on this device — tabs, history, bookmarks, settings?')) return;
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  S = Voyager.createBrowser();
  paintChrome();
  showUrl(currentUrl(), Voyager.activeTab(S));
  persist();
  toast('Fresh start');
}

/* ---- events: omnibox ---- */
$('urlInput').addEventListener('focus', function () {
  var url = currentUrl();
  this.value = String(url).indexOf('voyager://') === 0 ? '' : url;
  var self = this;
  setTimeout(function () { self.select(); }, 0);
});
$('urlInput').addEventListener('blur', function () {
  var self = this;
  setTimeout(function () { hideSuggest(); showUrl(currentUrl(), Voyager.activeTab(S)); }, 150);
});
$('urlInput').addEventListener('input', renderSuggest);
$('urlInput').addEventListener('keydown', function (e) {
  var box = $('suggest');
  var rows = box.querySelectorAll('.sug');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!rows.length) return;
    e.preventDefault();
    suggestIndex = e.key === 'ArrowDown'
      ? (suggestIndex + 1) % rows.length
      : (suggestIndex - 1 + rows.length) % rows.length;
    for (var i = 0; i < rows.length; i++) rows[i].className = 'sug' + (i === suggestIndex ? ' sel' : '');
  } else if (e.key === 'Enter') {
    if (suggestIndex >= 0 && rows[suggestIndex]) navTo(rows[suggestIndex].getAttribute('data-nav'));
    else go(this.value);
  } else if (e.key === 'Escape') {
    hideSuggest();
    this.blur();
  }
});

/* ---- events: toolbar ---- */
$('backBtn').addEventListener('click', function () { commit(Voyager.back(S, S.activeId)); });
$('fwdBtn').addEventListener('click', function () { commit(Voyager.forward(S, S.activeId)); });
$('reloadBtn').addEventListener('click', function () {
  var url = currentUrl();
  if (String(url).indexOf('voyager://') === 0) { renderInternal(url.slice(10)); return; }
  if (Voyager.isOnion(url) && !S.settings.torGateway) { showVeil('onion', url); return; }
  currentFrameSrc = '';                 // force a real reload even if the src is unchanged
  loadFrame(url);
});
$('starBtn').addEventListener('click', function () {
  var url = currentUrl();
  if (String(url).indexOf('voyager://') === 0) { toast('Voyager pages can’t be starred'); return; }
  var tab = Voyager.activeTab(S);
  var was = Voyager.isBookmarked(S, url);
  commit(Voyager.toggleBookmark(S, url, tab.title || Voyager.hostOf(url), Date.now()));
  toast(was ? 'Bookmark removed' : '★ Bookmarked');
});
$('tabsBtn').addEventListener('click', function () { renderTabsheet(); $('tabsheet').className = 'tabsheet on'; });
$('menuBtn').addEventListener('click', function (e) {
  e.stopPropagation();
  $('menu').classList.toggle('on');
});
document.addEventListener('click', function (e) {
  if (!$('menu').contains(e.target) && e.target !== $('menuBtn')) $('menu').classList.remove('on');
});

/* ---- events: one delegated handler for every data-act / data-nav ---- */
document.addEventListener('click', function (e) {
  var el = e.target;
  while (el && el !== document.body) {
    var nav = el.getAttribute && el.getAttribute('data-nav');
    if (nav) { navTo(nav); return; }

    var del = el.getAttribute && el.getAttribute('data-delhist');
    if (del) {
      commit(Voyager.deleteFromHistory(S, del));
      renderInternal('history');
      return;
    }
    var unstar = el.getAttribute && el.getAttribute('data-unstar');
    if (unstar) {
      commit(Voyager.toggleBookmark(S, unstar));
      renderInternal('bookmarks');
      return;
    }
    var rtoggle = el.getAttribute && el.getAttribute('data-readtoggle');
    if (rtoggle) { commit(Voyager.toggleReadingRead(S, rtoggle)); renderInternal('reading'); return; }
    var unread = el.getAttribute && el.getAttribute('data-unread');
    if (unread) { commit(Voyager.removeReading(S, unread)); renderInternal('reading'); return; }
    var readmem = el.getAttribute && el.getAttribute('data-readmem');
    if (readmem) { openMemory(readmem); return; }
    var forgetmem = el.getAttribute && el.getAttribute('data-forgetmem');
    if (forgetmem) {
      var fromReader = el.getAttribute('data-frommemreader');
      commit(Voyager.forgetMemory(S, forgetmem));
      toast('Forgotten');
      if (fromReader) { readerState = null; navTo('voyager://memory'); }
      else renderInternal('memory');
      return;
    }
    var rmshort = el.getAttribute && el.getAttribute('data-rmshortcut');
    if (rmshort) { commit(Voyager.removeShortcut(S, rmshort)); renderInternal('start'); return; }
    var ropen = el.getAttribute && el.getAttribute('data-readeropen');
    if (ropen) { navTo(ropen); return; }
    var rsave = el.getAttribute && el.getAttribute('data-readersave');
    if (rsave) {
      var rt = Voyager.activeTab(S);
      commit(Voyager.addReading(S, rsave, (readerState && readerState.title) || Voyager.hostOf(rsave), Date.now()));
      toast('📑 Saved to reading list'); renderInternal('reader'); return;
    }
    if (el.id === 'rememberSwitch') {
      saveSetting('remember', S.settings.remember === false);
      renderInternal('settings');
      toast(S.settings.remember !== false ? '🧠 Remembering pages you read' : 'Memory off — new pages won’t be kept');
      return;
    }
    var setTheme = el.getAttribute && el.getAttribute('data-theme');
    if (setTheme) { saveSetting('theme', setTheme); applyTheme(); renderInternal('settings'); return; }
    var setAccent = el.parentNode && el.parentNode.id === 'accentRow' && el.getAttribute && el.getAttribute('data-accent');
    if (setAccent) { saveSetting('accent', setAccent); applyTheme(); renderInternal('settings'); return; }
    if (el.id === 'trackerSwitch') {
      saveSetting('blockTrackers', S.settings.blockTrackers === false);
      currentFrameSrc = '';                       // apply the change to the current page
      renderInternal('settings');
      toast(S.settings.blockTrackers ? '🛡️ Blocking ads & trackers' : 'Tracker blocking off');
      return;
    }
    var palNav = el.getAttribute && el.getAttribute('data-palnav');
    if (palNav) { closePalette(); navTo(palNav); return; }
    var palTab = el.getAttribute && el.getAttribute('data-paltab');
    if (palTab) { closePalette(); commit(Voyager.activateTab(S, Number(palTab))); return; }
    var palAct = el.getAttribute && el.getAttribute('data-palact');
    if (palAct) { closePalette(); runAct(palAct); return; }
    var closeId = el.getAttribute && el.getAttribute('data-closetab');
    if (closeId) {
      e.stopPropagation();
      commit(Voyager.closeTab(S, Number(closeId)));
      renderTabsheet();
      return;
    }
    var pinId = el.getAttribute && el.getAttribute('data-pintab');
    if (pinId) {
      e.stopPropagation();
      commit(Voyager.togglePin(S, Number(pinId)));
      renderTabsheet();
      return;
    }
    var siteToggle = el.getAttribute && el.getAttribute('data-sitetoggle');
    if (siteToggle && siteViewHost) {
      // Flip the *effective* value into an explicit override for this site.
      var cur = siteEffective('https://' + siteViewHost + '/', siteToggle);
      commit(Voyager.setSiteSetting(S, siteViewHost, siteToggle, !cur));
      currentFrameSrc = '';                       // blocking changes ride the next load
      renderInternal('site');
      return;
    }
    var clearSite = el.getAttribute && el.getAttribute('data-clearsite');
    if (clearSite) {
      commit(Voyager.clearSiteSettings(S, clearSite));
      renderInternal('site');
      toast('Overrides cleared');
      return;
    }
    var tabId = el.getAttribute && el.getAttribute('data-tab');
    if (tabId) {
      commit(Voyager.activateTab(S, Number(tabId)));
      $('tabsheet').className = 'tabsheet';
      return;
    }

    var act = el.getAttribute && el.getAttribute('data-act');
    if (act) { runAct(act); return; }
    el = el.parentNode;
  }
});

function runAct(act) {
  // Zoom clicks keep the menu open so ± can be tapped repeatedly.
  if (act !== 'zoomin' && act !== 'zoomout') $('menu').classList.remove('on');
  if (act === 'newtab') { $('tabsheet').className = 'tabsheet'; commit(Voyager.newTab(S, { ts: Date.now() })); }
  else if (act === 'newprivate') { $('tabsheet').className = 'tabsheet'; commit(Voyager.newTab(S, { incognito: true, ts: Date.now() })); }
  else if (act === 'closesheet') $('tabsheet').className = 'tabsheet';
  else if (act === 'palette') openPalette();
  else if (act === 'reading') navTo('voyager://reading');
  else if (act === 'readlater') {
    var u = currentUrl();
    if (String(u).indexOf('voyager://') === 0) { toast('Nothing to save here'); return; }
    if (Voyager.inReading(S, u)) { toast('Already in your reading list'); return; }
    var t = Voyager.activeTab(S);
    commit(Voyager.addReading(S, u, t.title || Voyager.hostOf(u), Date.now()));
    toast('📑 Saved to reading list');
  }
  else if (act === 'reader') openReader();
  else if (act === 'memory') navTo('voyager://memory');
  else if (act === 'pintab') {
    var ptab = Voyager.activeTab(S);
    if (ptab && ptab.incognito) { toast('Private tabs can’t be pinned — they’re meant to vanish'); return; }
    var wasPinned = ptab && ptab.pinned;
    commit(Voyager.togglePin(S, S.activeId));
    toast(wasPinned ? 'Unpinned' : '📌 Pinned — this tab can’t be closed until you unpin it');
  }
  else if (act === 'sitesettings') {
    var siteUrl = currentUrl();
    siteViewHost = Voyager.siteOf(siteUrl);
    navTo('voyager://site');
  }
  else if (act === 'tldr') {
    if (!readerState || !readerState.text) return;
    readerState.tldr = readerState.tldr ? '' : Voyager.summarize(readerState.text, { sentences: 3 });
    renderInternal('reader');
  }
  else if (act === 'viewchanges') { hideChangeBanner(); navTo('voyager://changes'); }
  else if (act === 'dismisschanges') hideChangeBanner();
  else if (act === 'clearmemory') {
    if (!confirm('Forget every page Voyager has remembered on this device?')) return;
    commit(Voyager.clearMemory(S));
    var pg = String(currentUrl()).slice(10);
    if (pg === 'memory' || pg === 'settings') renderInternal(pg);
    toast('Memory cleared');
  }
  else if (act === 'addshortcut') {
    var su = currentUrl();
    if (String(su).indexOf('voyager://') === 0) { toast('Open a page first, then pin it'); return; }
    var st = Voyager.activeTab(S);
    commit(Voyager.addShortcut(S, su, st.title || Voyager.hostOf(su)));
    renderInternal('start');
    toast('📌 Pinned to start');
  }
  else if (act === 'bookmarks') navTo('voyager://bookmarks');
  else if (act === 'history') navTo('voyager://history');
  else if (act === 'settings') navTo('voyager://settings');
  else if (act === 'external') openExternal();
  else if (act === 'dismissveil') hideVeil();
  else if (act === 'copy') {
    var url = currentUrl();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url);
    toast('Link copied');
  }
  else if (act === 'zoomin' || act === 'zoomout') {
    var tab = Voyager.activeTab(S);
    var steps = [25, 33, 50, 67, 75, 90, 100, 110, 125, 150, 175, 200, 250, 300, 400, 500];
    var idx = steps.indexOf(tab.zoom);
    if (idx === -1) idx = 6;
    idx = Math.max(0, Math.min(steps.length - 1, idx + (act === 'zoomin' ? 1 : -1)));
    commit(Voyager.setZoom(S, S.activeId, steps[idx]));
  }
  else if (act === 'clearhistory') {
    commit(Voyager.clearHistory(S));
    var page = String(currentUrl()).slice(10);
    if (page === 'history' || page === 'settings') renderInternal(page);
    toast('History cleared');
  }
  else if (act === 'wipe') doWipe();
  else if (act === 'focusurl') $('urlInput').focus();
}

/* ---- events: internal-page inputs (delegated: pages re-render freely) ---- */
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'histSearch') {
    var v = e.target.value;

});
document.addEventListener('change', function (e) {

  // WITHOUT repainting, so we never clobber the focused field mid-event.
  if (e.target && e.target.id === 'engineSel') {

  }

    saveSetting('startName', e.target.value);

  }
  if (e.target && e.target.id === 'torInput') {
    saveSetting('torGateway', e.target.value);
    e.target.value = S.settings.torGateway;
    toast(S.settings.torGateway ? '🧅 Routing .onion via ' + S.settings.torGateway : 'Tor gateway off');
  }
  if (e.target && e.target.id === 'proxyInput') {
    saveSetting('proxy', e.target.value);
    e.target.value = S.settings.proxy;
    var on = proxyBaseNow();

    currentFrameSrc = ''; // next paint reloads the current page through the new setting

  }
});

/* ---- events: the frame ---- */
$('frame').addEventListener('load', function () {
  hideVeil();
  stopProgress(false);
  // Same-origin frames tell us their real title; cross-origin ones politely refuse.
  // Through the proxy every page is same-origin, so titles come back for real.
  var title = '';
  try { title = this.contentDocument && this.contentDocument.title || ''; } catch (err) {}
  if (!title) title = Voyager.hostOf(currentUrl());
  commit(Voyager.setTitle(S, S.activeId, title));
  maybeCapture(currentUrl());
});
$('frame').addEventListener('error', function () {
  showVeil('blocked', currentUrl());
});

/* ---- the proxy bridge: proxied pages postMessage their real navigation up
 * here, so clicking links and submitting searches inside a page drives the
 * omnibox, history and back/forward — a proper browser, not a dead frame. ---- */
window.addEventListener('message', function (e) {
  // Accept only our own content: the app's origin, plus the configured proxy's
  // origin (when the proxy is deployed on a different host than the app).
  if (e.origin !== location.origin && e.origin !== proxyOrigin()) return;
  var d = e.data;
  if (!d || !d.voyager) return;
  var url = d.url;
  if (d.voyager === 'open' && url && /^https?:/i.test(url)) {
    commit(Voyager.newTab(S, { url: url, ts: Date.now() }));
    return;
  }
  if ((d.voyager === 'navigate' || d.voyager === 'loaded') && url && /^https?:/i.test(url)) {
    if (url !== currentUrl()) {
      frameSyncing = true;                        // the frame already moved itself; just record it
      commit(Voyager.navigate(S, S.activeId, url, { ts: Date.now(), title: d.title || '' }));
      frameSyncing = false;
    }
    if (d.voyager === 'loaded') {
      if (d.title) commit(Voyager.setTitle(S, S.activeId, d.title));
      hideVeil();
      stopProgress(false);
      // The receipt: the shim counted the page's tracker requests server-side.
      var trk = Math.floor(Number(d.trackers) || 0);
      if (trk > 0) {
        pageTrackers[url] = trk;
        commit(Voyager.recordTrackers(S, url, trk));
      }
      paintTrackerBadge();
      maybeCapture(url);
    }
  }
});

/* ---- command palette (⌘K) ---- */
var palIndex = -1;
function openPalette() {
  $('menu').classList.remove('on');
  $('palette').className = 'palette on';
  var inp = $('palInput');
  inp.value = '';
  renderPalette();
  setTimeout(function () { inp.focus(); }, 0);
}
function closePalette() { $('palette').className = 'palette'; palIndex = -1; }
function renderPalette() {
  var items = Voyager.commandSearch(S, $('palInput').value, { nowTs: Date.now(), limit: 12 });
  palIndex = items.length ? 0 : -1;
  var icons = { tab: '▤', action: '⚡', reading: '📑', bookmark: '★', history: '🕘' };
  var tags = { tab: 'Tab', action: 'Action', reading: 'Reading', bookmark: 'Bookmark', history: 'History' };
  var h = '';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var attr = it.kind === 'tab' ? 'data-paltab="' + it.id + '"'
      : it.kind === 'action' ? 'data-palact="' + esc(it.id) + '"'
      : 'data-palnav="' + esc(it.url) + '"';
    h += '<button class="pi' + (i === 0 ? ' sel' : '') + '" ' + attr + '>' +
      '<span class="ico">' + (it.incognito ? '🕶' : icons[it.kind] || '•') + '</span>' +
      '<span class="txt"><span class="t">' + esc(it.title) + (it.read ? ' <span style="color:var(--faint)">· read</span>' : '') + '</span>' +
      (it.url && it.kind !== 'action' ? '<span class="u">' + esc(Voyager.displayUrl(it.url)) + '</span>' : '') +
      '</span><span class="tag">' + tags[it.kind] + '</span></button>';
  }
  $('palList').innerHTML = h || '<div class="pi" style="color:var(--faint)">No matches — press ↵ to search the web</div>';
}
function palRows() { return $('palList').querySelectorAll('.pi[data-paltab],.pi[data-palact],.pi[data-palnav]'); }
$('palInput').addEventListener('input', renderPalette);
$('palInput').addEventListener('keydown', function (e) {
  var rows = palRows();
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!rows.length) return; e.preventDefault();
    palIndex = e.key === 'ArrowDown' ? (palIndex + 1) % rows.length : (palIndex - 1 + rows.length) % rows.length;
    for (var i = 0; i < rows.length; i++) rows[i].className = 'pi' + (i === palIndex ? ' sel' : '');
    if (rows[palIndex]) rows[palIndex].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (palIndex >= 0 && rows[palIndex]) rows[palIndex].click();
    else { var q = this.value.trim(); if (q) { closePalette(); go(q); } }
  } else if (e.key === 'Escape') { closePalette(); }
});
$('palette').addEventListener('click', function (e) { if (e.target === this) closePalette(); });

/* ---- swipe gestures: drag from the screen edge (or anywhere on an internal
 * page) to go back (rightward) / forward (leftward). The frame eats touches,
 * so thin edge zones sit over it — touch devices only; the engine's pure
 * swipeAction() decides what a drag meant. ---- */
function attachSwipe(el) {
  var sx = 0, sy = 0, live = false;
  el.addEventListener('touchstart', function (e) {
    live = e.touches.length === 1;
    if (live) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
  }, { passive: true });
  el.addEventListener('touchmove', function (e) {
    if (!live) return;
    var act = Voyager.swipeAction(e.touches[0].clientX - sx, e.touches[0].clientY - sy, { minDist: 30 });
    var tab = Voyager.activeTab(S);
    $('hintBack').className = 'swipehint left' + (act === 'back' && Voyager.canBack(tab) ? ' on' : '');
    $('hintFwd').className = 'swipehint right' + (act === 'forward' && Voyager.canForward(tab) ? ' on' : '');
  }, { passive: true });
  el.addEventListener('touchend', function (e) {
    $('hintBack').className = 'swipehint left';
    $('hintFwd').className = 'swipehint right';
    if (!live) return;
    live = false;
    var t = e.changedTouches[0];
    var act = Voyager.swipeAction(t.clientX - sx, t.clientY - sy);
    if (act === 'back') commit(Voyager.back(S, S.activeId));
    else if (act === 'forward') commit(Voyager.forward(S, S.activeId));
  }, { passive: true });
}
attachSwipe($('swipeL'));
attachSwipe($('swipeR'));
attachSwipe($('internal'));

/* ---- keyboard shortcuts (desktop comfort) ---- */
document.addEventListener('keydown', function (e) {
  var mod = e.ctrlKey || e.metaKey;
  if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); $('palette').className.indexOf('on') !== -1 ? closePalette() : openPalette(); }
  else if (mod && e.key === 'l') { e.preventDefault(); $('urlInput').focus(); }
  else if (mod && e.key === 't') { e.preventDefault(); commit(Voyager.newTab(S, { ts: Date.now() })); $('urlInput').focus(); }
  else if (mod && e.key === 'w') {
    e.preventDefault();
    var wt = Voyager.activeTab(S);
    if (wt && wt.pinned) { toast('📌 Pinned — unpin to close'); return; }
    commit(Voyager.closeTab(S, S.activeId));
  }
  else if (mod && e.key === 'd') { e.preventDefault(); $('starBtn').click(); }
  else if (mod && (e.key === 'e' || e.key === 'E')) { e.preventDefault(); runAct('readlater'); }
  else if (e.key === 'Escape' && $('palette').className.indexOf('on') !== -1) closePalette();
  else if (e.key === 'Escape' && $('tabsheet').className.indexOf('on') !== -1) $('tabsheet').className = 'tabsheet';
});

/* ---- boot ---- */
paintChrome();
showUrl(currentUrl(), Voyager.activeTab(S));

/* Ask whoever is serving us whether they're the Voyager proxy server. If so,
 * switch into full-browser mode and reload the current page through it. On
 * GitHub Pages this 404s and we stay a plain framing browser — no change. */
(function detectProxy() {
  try {
    if (location.protocol === 'file:' || typeof fetch !== 'function') return;
    fetch(location.origin + '/__voyager/ping', { cache: 'no-store' })
      .then(function (r) { return r && r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.voyager) return;
        detectedProxy = location.origin + '/proxy';
        if (proxyBaseNow()) {
          var url = currentUrl();
          if (String(url).indexOf('voyager://') !== 0) { currentFrameSrc = ''; loadFrame(url); }
          toast('🛰️ Full browser mode');
        }
      })
      .catch(function () {});
  } catch (e) {}
})();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
