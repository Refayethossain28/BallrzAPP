# Render Blueprint for the Fixr app (lives at repo root so Render's
# Blueprint flow finds it). Provisions a web service + a managed Postgres
# and wires DATABASE_URL automatically — as close to one-click as it gets.
#
# Deploy: dashboard.render.com → New → Blueprint → pick this repo →
# choose branch `claude/most-needed-app-rxhbcj`. Render reads this file.
services:
  - type: web
    name: fixr
    runtime: node
    rootDir: fixr/app
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # Postgres connection string, injected from the database below.
      - key: DATABASE_URL
        fromDatabase:
          name: fixr-db
          property: connectionString
      # Demo mode works with these blank. Add them in the Render dashboard
      # (Environment tab, mark secret) to switch on the real services:
      - key: ANTHROPIC_API_KEY   # real Claude intake
        sync: false
      - key: STRIPE_SECRET_KEY   # real fare capture + Connect settlement (sk_test_…)
        sync: false
      - key: FLIGHT_API_KEY      # real AviationStack flight tracking
        sync: false

  # ApexFX — Next.js trading app with the AI screenshot analyzer.
  # After the first deploy, open the service's Environment tab and paste the
  # same ANTHROPIC_API_KEY used by fixr / the ApexVIP Firebase functions.
  - type: web
    name: fx-signal-pro
    runtime: node
    rootDir: trading-app
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: ANTHROPIC_API_KEY   # powers the screenshot Buy/Sell analysis
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT  # service-account JSON — enables real-time scoring
        sync: false
      - key: VAPID_PUBLIC_KEY          # web-push signing (public half; safe to inline)
        value: BEq6_PKG0Y7XvZBFGGjslR0gIWX0SYU0RSuLy0naj6bbFaZSwsyp_qRnw85AWJXhDkwFMPmKh-C10zcUVs34SpM
      - key: VAPID_PRIVATE_KEY         # web-push signing (secret half)
        sync: false

  # Voyager proxy — the full-browser proxy that lets the hosted Voyager open
  # sites which refuse to be framed (Google, most logins). Zero-dependency,
  # nothing to build. After deploy, paste this service's URL into
  # Voyager → Settings → Full browser (proxy). Full guide: voyager/DEPLOY.md.
  - type: web
    name: voyager-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node voyager/server.mjs
    healthCheckPath: /__voyager/ping
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # Bind all interfaces so Render can reach the process.
      - key: HOST
        value: 0.0.0.0
      # It deploys OPEN (SSRF-guarded) so it works the moment it's live — no
      # Origin allowlist, which phone browsers break on framed navigations.
      # To LOCK it to just you, add a PROXY_KEY here (any long random string)
      # and append "?key=<same value>" to the proxy URL in Voyager → Settings:
      #   - key: PROXY_KEY
      #     generateValue: true   # Render makes a secret; read it in the dashboard
      # PORT is injected by Render; server.mjs honours it. Leave
      # VOYAGER_ALLOW_PRIVATE unset in production (keeps the SSRF guard on).

  # Fare — chauffeur job logging + monthly invoicing (fare/README.md).
  # Zero dependencies; needs Node 22.13+ for the built-in node:sqlite.
  # NOTE: the disk is what keeps the SQLite file across deploys/restarts,
  # and Render disks require a paid instance — hence plan: starter. Do not
  # downgrade to free: the free filesystem is wiped on every deploy and the
  # invoicing data would be lost.
  - type: web
    name: fare
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node fare/server.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: fare-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      # Keep the database on the mounted disk, not the ephemeral filesystem.
      - key: FARE_DB_PATH
        value: /data/fare.db
      # Owner API key (maps to account 1; keeps curl backups working). Render
      # generates it; read it in the dashboard (Environment tab).
      - key: FARE_KEY
        generateValue: true
      # Public URL, used in emailed sign-in links and Stripe redirects.
      - key: FARE_APP_URL
        value: https://fare-uouk.onrender.com
      # v2 — email (resend.com; verify your sending domain there first).
      # Without these, sign-in links/invoice emails print to the logs (dev mode).
      - key: RESEND_API_KEY
        sync: false
      - key: FARE_EMAIL_FROM       # e.g. "Fare <invoices@yourdomain.uk>"
        sync: false
      # v2 — subscriptions (£9.99/mo). Without these, billing is off and every
      # account has full access — the pre-launch mode.
      - key: STRIPE_SECRET_KEY     # sk_live_… / sk_test_…
        sync: false
      - key: STRIPE_PRICE_ID       # optional; auto-created if unset
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # whsec_… for POST /api/billing/webhook
        sync: false

databases:
  - name: fixr-db
    plan: free
    databaseName: fixr
    user: fixr
