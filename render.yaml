# Render Blueprint for the Fixr app (lives at repo root so Render's
# Blueprint flow finds it). Provisions a web service + a managed Postgres
# and wires DATABASE_URL automatically — as close to one-click as it gets.
#
# Deploy: dashboard.render.com → New → Blueprint → pick this repo →
# choose branch `claude/most-needed-app-rxhbcj`. Render reads this file.
services:
  - type: web
    name: fixr
    runtime: node
    rootDir: fixr/app
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # Postgres connection string, injected from the database below.
      - key: DATABASE_URL
        fromDatabase:
          name: fixr-db
          property: connectionString
      # Demo mode works with these blank. Add them in the Render dashboard
      # (Environment tab, mark secret) to switch on the real services:
      - key: ANTHROPIC_API_KEY   # real Claude intake
        sync: false
      - key: STRIPE_SECRET_KEY   # real fare capture + Connect settlement (sk_test_…)
        sync: false
      - key: FLIGHT_API_KEY      # real AviationStack flight tracking
        sync: false

  # ApexFX — Next.js trading app with the AI screenshot analyzer.
  # After the first deploy, open the service's Environment tab and paste the
  # same ANTHROPIC_API_KEY used by fixr / the ApexVIP Firebase functions.
  - type: web
    name: fx-signal-pro
    runtime: node
    rootDir: trading-app
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: ANTHROPIC_API_KEY   # powers the screenshot Buy/Sell analysis
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT  # service-account JSON — enables real-time scoring
        sync: false
      - key: VAPID_PUBLIC_KEY          # web-push signing (public half; safe to inline)
        value: BEq6_PKG0Y7XvZBFGGjslR0gIWX0SYU0RSuLy0naj6bbFaZSwsyp_qRnw85AWJXhDkwFMPmKh-C10zcUVs34SpM
      - key: VAPID_PRIVATE_KEY         # web-push signing (secret half)
        sync: false

  # Voyager proxy — the full-browser proxy that lets the hosted Voyager open
  # sites which refuse to be framed (Google, most logins). Zero-dependency,
  # nothing to build. After deploy, paste this service's URL into
  # Voyager → Settings → Full browser (proxy). Full guide: voyager/DEPLOY.md.
  - type: web
    name: voyager-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node voyager/server.mjs
    healthCheckPath: /__voyager/ping
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # Bind all interfaces so Render can reach the process.
      - key: HOST
        value: 0.0.0.0
      # It deploys OPEN (SSRF-guarded) so it works the moment it's live — no
      # Origin allowlist, which phone browsers break on framed navigations.
      # To LOCK it to just you, add a PROXY_KEY here (any long random string)
      # and append "?key=<same value>" to the proxy URL in Voyager → Settings:
      #   - key: PROXY_KEY
      #     generateValue: true   # Render makes a secret; read it in the dashboard
      # PORT is injected by Render; server.mjs honours it. Leave
      # VOYAGER_ALLOW_PRIVATE unset in production (keeps the SSRF guard on).

  # Fare — chauffeur job logging + monthly invoicing (fare/README.md).
  # Zero dependencies; needs Node 22.13+ for the built-in node:sqlite.
  # NOTE: the disk is what keeps the SQLite file across deploys/restarts,
  # and Render disks require a paid instance — hence plan: starter. Do not
  # downgrade to free: the free filesystem is wiped on every deploy and the
  # invoicing data would be lost.
  - type: web
    name: fare
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node fare/server.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: fare-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      # Keep the database on the mounted disk, not the ephemeral filesystem.
      - key: FARE_DB_PATH
        value: /data/fare.db
      # Shared secret guarding the API (client list + bank details). Render
      # generates it; read it in the dashboard (Environment tab) and enter it
      # in the app when prompted on first load.
      - key: FARE_KEY
        generateValue: true

  # Genie — the agent that does what you tell it (genie/README.md). A phone
  # console over the Claude Agent SDK: shell, files, web and subagents run on
  # the server, approvals are answered from your phone. Zero dependencies
  # beyond the SDK, nothing to build.
  #
  # After the first deploy: open the service's Environment tab, paste your
  # ANTHROPIC_API_KEY (without it Genie boots in rehearsal mode — nothing runs
  # for real, and it says so), read the generated GENIE_KEY, and open
  #   https://<this-service>.onrender.com/?key=<GENIE_KEY>
  # on your phone (Safari → Share → Add to Home Screen). The hosted console
  # (https://apexvip.uk/genie/ — the github.io address redirects there, since
  # Pages serves this repo from its custom domain) can point at this server
  # too — GENIE_ALLOW_ORIGIN below is what lets it.
  #
  # NOTE: the free filesystem is EPHEMERAL — memory, conversations and standing
  # orders under GENIE_HOME are wiped on every deploy and restart (GENIE_KEY
  # survives because Render stores it as an env var). Fine for trying it; for
  # state that must last, move to a paid instance, add a disk (like `fare`
  # above) and set GENIE_HOME to its mount path. Everything Genie's shell does
  # runs on THIS instance as the service user: keep the key secret and treat a
  # public Genie as a public shell.
  - type: web
    name: genie
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node genie/server.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # Bind all interfaces so Render can reach the process (PORT is injected).
      - key: HOST
        value: 0.0.0.0
      # ask | trust | auto — trust acts freely and only pauses on destructive commands.
      - key: GENIE_MODE
        value: trust
      # The bearer key the console needs. Render generates it; read it in the
      # dashboard (Environment tab) and put it in the phone URL (?key=…).
      - key: GENIE_KEY
        generateValue: true
      # Live Claude. Leave blank and Genie runs the honest offline rehearsal.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Lets the hosted copy of the console talk to this server (CORS). A
      # comma-separated list of exact origins: the custom domain the Pages site
      # actually serves from, plus the github.io address in case the redirect
      # ever goes away. The server echoes whichever one the page came from.
      - key: GENIE_ALLOW_ORIGIN
        value: "https://apexvip.uk,https://refayethossain28.github.io"
      # Auto mode with a live driver needs a non-root process, or a process that
      # declares its container disposable. Only if the boot log warns that this
      # service runs as root outside a sandbox (this instance IS disposable):
      #   - key: IS_SANDBOX
      #     value: "1"

databases:
  - name: fixr-db
    plan: free
    databaseName: fixr
    user: fixr
