<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#3a2b14"/>
      <stop offset="1" stop-color="#121010"/>
    </radialGradient>
    <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="15" y1="51" x2="49" y2="17">
      <stop offset="0" stop-color="#e0b25a"/>
      <stop offset="1" stop-color="#f2cf80"/>
    </linearGradient>
  </defs>
  <!-- warm near-black tile with a brown glow at the upper middle -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- the tuning dial: a brass ring (r 17) around the hub at (32, 34) -->
  <circle cx="32" cy="34" r="17" fill="none" stroke="url(#brass)" stroke-width="3.6"/>
  <!-- the needle, pointing up-right at -50° -->
  <path d="M32 34 L40.36 24.04" stroke="#f2ece3" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <circle cx="32" cy="34" r="2.8" fill="#e0b25a"/>
  <!-- the station it is tuned to: a red "on air" dot on the ring -->
  <circle cx="42.93" cy="20.98" r="2.4" fill="#e5484d"/>
</svg>
