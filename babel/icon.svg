<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#141d3c"/>
      <stop offset="100%" stop-color="#0b0e1a"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4de1ff"/>
      <stop offset="55%" stop-color="#9f6bff"/>
      <stop offset="100%" stop-color="#e8b34c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the universal ring: every language on one circle -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#brand)" stroke-width="18"/>
  <!-- the babel fish swimming through it -->
  <ellipse cx="240" cy="256" rx="96" ry="52" fill="url(#brand)"/>
  <path d="M 322 256 L 396 208 L 374 256 L 396 304 Z" fill="url(#brand)"/>
  <circle cx="196" cy="242" r="13" fill="#0b0e1a"/>
  <!-- sound waves it hears -->
  <path d="M 120 176 A 150 150 0 0 1 200 122" fill="none" stroke="#4de1ff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <path d="M 96 216 A 190 190 0 0 1 190 88" fill="none" stroke="#9f6bff" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
  <!-- the shiny word it speaks back -->
  <path d="M 372 348 l 12 30 30 12 -30 12 -12 30 -12 -30 -30 -12 30 -12 z" fill="#e8b34c"/>
</svg>
