<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rumble: two original fighters clash under the round bars. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#1b2038"/>
      <stop offset="100%" stop-color="#0a0c16"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- health bars -->
  <rect x="76" y="96" width="150" height="22" rx="11" fill="#ffe25e"/>
  <rect x="286" y="96" width="150" height="22" rx="11" fill="#d94a5e"/>

  <!-- left fighter: teal wedge lunging right -->
  <path d="M96 400 L176 208 L226 260 L186 400 Z" fill="#19c8b4"/>
  <circle cx="185" cy="185" r="34" fill="#19c8b4"/>
  <circle cx="245" cy="252" r="26" fill="#ffe25e"/>

  <!-- right fighter: crimson wedge lunging left -->
  <path d="M416 400 L336 208 L286 260 L326 400 Z" fill="#d94a5e"/>
  <circle cx="327" cy="185" r="34" fill="#d94a5e"/>
  <circle cx="267" cy="252" r="26" fill="#ffe25e"/>

  <!-- the clash spark -->
  <path d="M256 196 L268 240 L312 252 L268 264 L256 308 L244 264 L200 252 L244 240 Z" fill="#fff6d8"/>
</svg>
