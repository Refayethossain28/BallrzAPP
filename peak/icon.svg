<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Peak: twin summits over a dark sky — the front peak carries the
       brand gradient (move-green up to summit-gold), a score-sun rises. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122c40"/>
      <stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#1c8f63"/>
      <stop offset="0.7" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#173a52"/>
      <stop offset="1" stop-color="#2b6b8f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <circle cx="368" cy="150" r="46" fill="#ffd166" opacity="0.95"/>
  <path d="M96 400 L268 148 L332 244 L392 400 Z" fill="url(#back)"/>
  <path d="M56 400 L208 176 L360 400 Z" fill="url(#front)"/>
  <path d="M186 208 L208 176 L230 208 L216 200 L208 214 L198 199 Z" fill="#eaf7f0"/>
</svg>
