<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Arcade: a pocket console — glowing screen up top, d-pad left, two
       buttons right, on the house dark rounded square. The generator in
       scripts/gen-arcade-icons.mjs rasterizes this same geometry. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#16203d"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dd8ff"/>
      <stop offset="55%" stop-color="#8f7cf7"/>
      <stop offset="100%" stop-color="#e8b34c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the screen -->
  <rect x="116" y="88" width="280" height="128" rx="22" fill="none"
        stroke="url(#brand)" stroke-width="18"/>
  <rect x="156" y="128" width="120" height="14" rx="7" fill="#4dd8ff"/>
  <rect x="156" y="162" width="76" height="14" rx="7" fill="#8f7cf7" opacity="0.8"/>
  <!-- the d-pad -->
  <rect x="110" y="314" width="132" height="52" rx="26" fill="url(#brand)"/>
  <rect x="150" y="274" width="52" height="132" rx="26" fill="url(#brand)"/>
  <!-- the buttons -->
  <circle cx="340" cy="316" r="30" fill="#e8b34c"/>
  <circle cx="404" cy="364" r="30" fill="#8f7cf7"/>
</svg>
