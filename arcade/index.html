  }

  function stopLoops() {
    if (timerId) { clearTimeout(timerId); timerId = 0; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    lastFrame = 0;
  }

  function ensureLoop() {
    if (!rafId) rafId = requestAnimationFrame(frame);
  }

  /* ---------------- HUD & overlay ---------------- */
  function hud(left, right) {
    $('hudLeft').innerHTML = left;
    $('hudRight').innerHTML = right;
  }

  function showOver(title, score, sub) {
    mode = 'over';
    if (timerId) { clearTimeout(timerId); timerId = 0; }
    var wasBest = E.isHighScore(scores, currentId, score);
    scores = E.recordScore(scores, currentId, score, Date.now());
    saveScores(scores);
    var best = E.bestScore(scores, currentId);
    $('overlay').innerHTML =
      '<div class="big">' + title + '</div>' +
      '<div class="score">' + E.formatScore(score) + '</div>' +
      '<div class="best">' + (wasBest && score > 0 ? '★ NEW HIGH SCORE ★' : 'BEST ' + E.formatScore(best)) + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') +
      '<div class="sub">A PLAY AGAIN · B MENU</div>';
    $('overlay').style.display = 'flex';
    if (wasBest && score > 0) { confetti(); ensureLoop(); }
    beep(wasBest && score > 0 ? 880 : 196, 220, 0.04);
  }

  function queueOver(title, score, sub, delayMs) {
    pendingOver = { title: title, score: score, sub: sub, at: performance.now() + delayMs };
  }

  function enterGame(id) {
    mode = 'play';
    currentId = id;
    pendingOver = null;
    particles.length = 0; floats.length = 0; flashes.length = 0; shakeMag = 0;
    $('menu').style.display = 'none';
    $('overlay').style.display = 'none';
    if (isExternal(id)) {
      // an emulator slot: no canvas, no HUD — the Ultra deck owns the screen
      $('game').style.display = 'none';
      $('hud').style.display = 'none';
      bootUltra(E.gameById(id));
      return;
    }
    $('game').style.display = 'block';
    $('hud').style.display = 'flex';
    if (id === 'serpent') startSerpent();
    else if (id === 'fuse') startFuse();
    else if (id === 'pong') startVersus();
    else if (id === 'quad') startQuad();
    else startBreaker();
    ensureLoop();
  }

  /* ---------------- the render loop: one heart for every game ---------------- */
  function frame(t) {
    rafId = 0;
    if (mode === 'menu') return;
    if (!lastFrame) lastFrame = t;
    var dt = Math.min(0.05, (t - lastFrame) / 1000);
    lastFrame = t;

    if (mode === 'play' && currentId === 'breaker') stepBreakerFrame(t, dt);
    if (mode === 'play' && currentId === 'pong') stepPongFrame(t, dt);
    if (mode === 'play' && currentId === 'quad') stepQuadFrame(t, dt);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, CW, CH);
    if (shakeMag > 0) {
      ctx.translate((Math.random() * 2 - 1) * shakeMag, (Math.random() * 2 - 1) * shakeMag);
    }

    if (currentId === 'serpent') drawSerpent(t);
    else if (currentId === 'fuse') drawFuse(t);
    else if (currentId === 'breaker') drawBreaker(t);
    else if (currentId === 'pong') drawPong(t);
    else if (currentId === 'quad') drawQuad(t);

    stepFX(dt);
    drawFX();
    drawVignette();

    if (pendingOver && t >= pendingOver.at) {
      var po = pendingOver;
      pendingOver = null;
      showOver(po.title, po.score, po.sub);
    }

    // keep animating while playing, or while game-over FX are still falling
    if (mode === 'play' || particles.length || floats.length || flashes.length || pendingOver) {
      rafId = requestAnimationFrame(frame);
    }
  }

  /* ================= SERPENT ================= */
  function startSerpent() {
    snakeState = E.newSnake(newSeed());
    snakePrev = snakeState.snake;
    snakeWant = null;
    snakeTickAt = performance.now();
    snakeTickMs = E.snakeSpeedMs(0);
    scheduleSnakeTick();
  }
  function scheduleSnakeTick() {
    snakeTickMs = E.snakeSpeedMs(snakeState.score);
    timerId = setTimeout(snakeTick, snakeTickMs);
  }
  function snakeTick() {
    if (mode !== 'play' || currentId !== 'serpent') return;
    var prev = snakeState;
    snakePrev = prev.snake;
    snakeState = E.stepSnake(snakeState, snakeWant);
    snakeWant = null;
    snakeTickAt = performance.now();
    var geo = serpentGeom();
    if (snakeState.eaten > prev.eaten) {
      var head = snakeState.snake[0];
      var hx = geo.ox + (head.x + 0.5) * geo.cell, hy = geo.oy + (head.y + 0.5) * geo.cell;
      burst(hx, hy, { n: 16, colors: ['#ff5d7a', '#e8b34c', '#ffd9e1'], speed: 260, size: 5, life: 0.55 });
      addFloat(hx, hy - 20, '+10', '#e8b34c');
      addShake(2.5);
      beep(660, 60);
    }
    if (!snakeState.alive) {
      // the serpent shatters along its whole body
      for (var i = 0; i < snakeState.snake.length; i++) {
        var seg = snakeState.snake[i];
        burst(geo.ox + (seg.x + 0.5) * geo.cell, geo.oy + (seg.y + 0.5) * geo.cell,
              { n: 5, colors: ['#4de8a1', '#4dd8ff', '#bff5ff'], speed: 200, size: 5, life: 0.8 });
      }
      addFlash('255,93,122', 0.28);
      addShake(9);
      beep(140, 260, 0.05);
      queueOver('GAME OVER', snakeState.score,
        'The serpent ate ' + snakeState.eaten + ' apple' + (snakeState.eaten === 1 ? '' : 's') + '.', 750);
      return;
    }
    scheduleSnakeTick();
  }
  function serpentGeom() {
    var s = snakeState;
    var pad = 24, top = 58;
    var cell = Math.min((CW - pad * 2) / s.cols, (CH - top - pad) / s.rows);
    return { cell: cell, ox: (CW - cell * s.cols) / 2, oy: top };
  }
  function drawSerpent(t) {
    var s = snakeState;
    drawBackdrop(t, 'serpent', 0);
    var geo = serpentGeom(), cell = geo.cell, ox = geo.ox, oy = geo.oy;

    // the garden: a soft grid of dots inside a glowing frame
    ctx.strokeStyle = 'rgba(77,216,255,0.35)';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#4dd8ff';
    ctx.shadowBlur = 12;
    roundRect(ox - 6, oy - 6, cell * s.cols + 12, cell * s.rows + 12, 10);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(139,147,184,0.16)';
    for (var gy = 1; gy < s.rows; gy++) {
      for (var gx = 1; gx < s.cols; gx++) {
        ctx.fillRect(ox + gx * cell - 1, oy + gy * cell - 1, 2, 2);
      }
    }

    // interpolation between the last tick and this one
    var k = s.alive ? Math.min(1, (t - snakeTickAt) / snakeTickMs) : 1;
    var pts = [];
    for (var i = 0; i < s.snake.length; i++) {
      var to = s.snake[i];
      var from = snakePrev[i] || to;
      pts.push({
        x: ox + (lerp(from.x, to.x, k) + 0.5) * cell,
        y: oy + (lerp(from.y, to.y, k) + 0.5) * cell
      });
    }

    // the apple: glossy, pulsing, haloed
    if (s.food) {
      var fx = ox + (s.food.x + 0.5) * cell, fy = oy + (s.food.y + 0.5) * cell;
      var pulse = 1 + 0.1 * Math.sin(t / 180);
      var halo = ctx.createRadialGradient(fx, fy, 0, fx, fy, cell * 0.9);
      halo.addColorStop(0, 'rgba(255,93,122,0.35)');
      halo.addColorStop(1, 'rgba(255,93,122,0)');
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(fx, fy, cell * 0.9, 0, Math.PI * 2); ctx.fill();
      var apple = ctx.createRadialGradient(fx - cell * 0.1, fy - cell * 0.12, cell * 0.05, fx, fy, cell * 0.34 * pulse);
      apple.addColorStop(0, '#ffc2cf');
      apple.addColorStop(0.35, '#ff5d7a');
      apple.addColorStop(1, '#c22347');
      ctx.fillStyle = apple;
      ctx.beginPath(); ctx.arc(fx, fy, cell * 0.32 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4de8a1';
      ctx.beginPath();
      ctx.ellipse(fx + cell * 0.1, fy - cell * 0.3 * pulse, cell * 0.1, cell * 0.05, -0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    // the serpent: a tapered, glowing body drawn tail-first
    if (pts.length) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (var j = pts.length - 1; j > 0; j--) {
        var tt = j / Math.max(1, pts.length - 1);
        var wob = 1 + 0.05 * Math.sin(t / 130 + j * 0.9);
        ctx.strokeStyle = 'rgba(' + Math.round(lerp(77, 40, tt)) + ',' + Math.round(lerp(232, 150, tt)) + ',' + Math.round(lerp(161, 200, tt)) + ',' + (1 - tt * 0.45).toFixed(2) + ')';
        ctx.lineWidth = cell * lerp(0.72, 0.34, tt) * wob;
        ctx.shadowColor = '#4de8a1';
        ctx.shadowBlur = 10 * (1 - tt);
        ctx.beginPath();
        ctx.moveTo(pts[j].x, pts[j].y);
        ctx.lineTo(pts[j - 1].x, pts[j - 1].y);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;

      // the head: bright dome, eyes that look where it's going, a tongue flick
      var hp = pts[0];
      var d = E.DIRS[s.dir] || { x: 1, y: 0 };
      var hg = ctx.createRadialGradient(hp.x - d.x * 3, hp.y - d.y * 3, 2, hp.x, hp.y, cell * 0.45);
      hg.addColorStop(0, '#b8ffdc');
      hg.addColorStop(0.5, '#4de8a1');
      hg.addColorStop(1, '#1e9c66');
      ctx.fillStyle = hg;
      ctx.shadowColor = '#4de8a1';
      ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(hp.x, hp.y, cell * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      var exo = { x: -d.y, y: d.x }; // perpendicular
      for (var e = -1; e <= 1; e += 2) {
        var ex = hp.x + d.x * cell * 0.14 + exo.x * e * cell * 0.18;
        var ey = hp.y + d.y * cell * 0.14 + exo.y * e * cell * 0.18;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ex, ey, cell * 0.1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#0b0d16';
        ctx.beginPath(); ctx.arc(ex + d.x * cell * 0.04, ey + d.y * cell * 0.04, cell * 0.05, 0, Math.PI * 2); ctx.fill();
      }
      if (Math.sin(t / 260) > 0.55 && s.alive) {
        ctx.strokeStyle = '#ff5d7a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(hp.x + d.x * cell * 0.4, hp.y + d.y * cell * 0.4);
        ctx.lineTo(hp.x + d.x * cell * 0.65, hp.y + d.y * cell * 0.65);
        ctx.stroke();
      }
    }

    hud('SCORE <b>' + E.formatScore(s.score) + '</b>', 'BEST <b>' + E.formatScore(E.bestScore(scores, 'serpent')) + '</b>');
  }
  function serpentInput(dir) { snakeWant = dir; }

  /* ================= FUSE 2048 ================= */
  var TILE_COLORS = {
    2:    ['#242b52', '#1a2040'], 4: ['#2c3568', '#20274e'],
    8:    ['#3a4a94', '#2a366e'], 16: ['#4a62be', '#35478e'],
    32:   ['#5a6fe8', '#4152b0'], 64: ['#7361ee', '#5343b8'],
    128:  ['#9257ea', '#6c3fb4'], 256: ['#b44ee0', '#8639ac'],
    512:  ['#d64ec0', '#a53993'], 1024: ['#ec4e96', '#b83a74'],
    2048: ['#ffd06e', '#e8b34c']
  };
  var FUSE_ANIM_MS = 110, FUSE_POP_MS = 160;
  function startFuse() {
    fuseState = E.new2048(newSeed());
    fuseAnim = null;
    fusePulse = { spawn: null, merges: [], at: performance.now() - 1000 };
  }
  function fuseGeom() {
    var size = E.FUSE_SIZE, pad = 40, top = 90;
    var grid = Math.min(CW - pad * 2, CH - top - pad);
    var gap = grid * 0.03, cell = (grid - gap * (size + 1)) / size;
    return { size: size, grid: grid, gap: gap, cell: cell, ox: (CW - grid) / 2, oy: top };
  }
  function fuseCellXY(g, r, c) {
    return { x: g.ox + g.gap + c * (g.cell + g.gap), y: g.oy + g.gap + r * (g.cell + g.gap) };
  }
  // Recreate the engine's slide as an animation plan: which tile travels
  // from where to where, which cells fuse, and where the new tile popped.
  function computeFuseAnim(oldBoard, newBoard, dir) {
    var moves = [], merges = [], destSet = {};
    for (var i = 0; i < E.FUSE_SIZE; i++) {
      var coords = E.lineCoords(dir, i);
      var tiles = [];
      for (var j = 0; j < coords.length; j++) {
        var v = oldBoard[coords[j].r][coords[j].c];
        if (v) tiles.push({ idx: j, v: v });
      }
      var out = 0;
      for (var k = 0; k < tiles.length; k++) {
        var dest = coords[out];
        if (k + 1 < tiles.length && tiles[k].v === tiles[k + 1].v) {
          moves.push({ from: coords[tiles[k].idx], to: dest, v: tiles[k].v });
          moves.push({ from: coords[tiles[k + 1].idx], to: dest, v: tiles[k + 1].v });
          merges.push({ r: dest.r, c: dest.c, v: tiles[k].v * 2 });
          k++;
        } else {
          moves.push({ from: coords[tiles[k].idx], to: dest, v: tiles[k].v });
        }
        destSet[dest.r + ':' + dest.c] = (destSet[dest.r + ':' + dest.c] || 0) + 1;
        out++;
      }
    }
    var spawn = null;
    for (var r = 0; r < E.FUSE_SIZE; r++) {
      for (var c = 0; c < E.FUSE_SIZE; c++) {
        if (newBoard[r][c] && !destSet[r + ':' + c]) spawn = { r: r, c: c };
      }
    }
    return { moves: moves, merges: merges, spawn: spawn };
  }
  function fuseInput(dir) {
    if (fuseAnim) fuseAnim = null; // snap the previous slide
    var prev = fuseState;
    fuseState = E.move2048(fuseState, dir);
    if (fuseState === prev) return;
    var plan = computeFuseAnim(prev.board, fuseState.board, dir);
    var now = performance.now();
    fuseAnim = { moves: plan.moves, t0: now };
    fusePulse = { spawn: plan.spawn, merges: plan.merges, at: now + FUSE_ANIM_MS };
    var g = fuseGeom();
    var gained = fuseState.score - prev.score;
    if (gained > 0) {
      for (var m = 0; m < plan.merges.length; m++) {
        var mc = fuseCellXY(g, plan.merges[m].r, plan.merges[m].c);
        burst(mc.x + g.cell / 2, mc.y + g.cell / 2,
              { n: 10, colors: ['#8f7cf7', '#c4b6ff', '#4dd8ff'], speed: 200, size: 4, life: 0.5, grav: 200 });
      }
      addFloat(g.ox + g.grid / 2, g.oy - 26, '+' + gained, '#8f7cf7');
      addShake(1.5);
      beep(520 + Math.min(400, gained), 50);
    }
    if (fuseState.won && !prev.won) {
      addFlash('232,179,76', 0.3);
      confetti();
      beep(880, 300, 0.05);
    }
    if (fuseState.over) {
      addFlash('143,124,247', 0.2);
      queueOver('BOARD FULL', fuseState.score, 'Highest tile: ' + E.highestTile(fuseState.board), 600);
    }
  }
  function drawFuseTile(g, x, y, v, scale) {
    var col = TILE_COLORS[v] || TILE_COLORS[2048];
    var cx = x + g.cell / 2, cy = y + g.cell / 2;
    var sz = g.cell * scale;
    var tg = ctx.createLinearGradient(cx, cy - sz / 2, cx, cy + sz / 2);
    tg.addColorStop(0, col[0]);
    tg.addColorStop(1, col[1]);
    if (v >= 128) {
      ctx.shadowColor = col[0];
      ctx.shadowBlur = v >= 1024 ? 26 : 14;
    }
    ctx.fillStyle = tg;
    roundRect(cx - sz / 2, cy - sz / 2, sz, sz, sz * 0.12);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1.5;
    roundRect(cx - sz / 2 + 1, cy - sz / 2 + 1, sz - 2, sz - 2, sz * 0.11);
    ctx.stroke();
    ctx.fillStyle = v >= 2048 ? '#0b0d16' : '#e8ecff';
    ctx.font = '700 ' + Math.floor(sz * (v < 128 ? 0.42 : v < 1024 ? 0.34 : 0.28)) + 'px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(v), cx, cy + sz * 0.02);
  }
  function drawFuse(t) {
    var st = fuseState;
    drawBackdrop(t, 'fuse', 0);
    var g = fuseGeom();
    // the well the tiles sit in
    ctx.fillStyle = 'rgba(16,20,42,0.92)';
    ctx.shadowColor = '#8f7cf7';
    ctx.shadowBlur = 18;
    roundRect(g.ox, g.oy, g.grid, g.grid, 18);
    ctx.fill();
    ctx.shadowBlur = 0;
    for (var r = 0; r < g.size; r++) {
      for (var c = 0; c < g.size; c++) {
        var p = fuseCellXY(g, r, c);
        ctx.fillStyle = 'rgba(255,255,255,0.035)';
        roundRect(p.x, p.y, g.cell, g.cell, g.cell * 0.12);
        ctx.fill();
      }
    }

    var animK = fuseAnim ? Math.min(1, (t - fuseAnim.t0) / FUSE_ANIM_MS) : 1;
    if (fuseAnim && animK < 1) {
      // mid-slide: draw every travelling tile between its cells
      var k = easeOut(animK);
      for (var i = 0; i < fuseAnim.moves.length; i++) {
        var mv = fuseAnim.moves[i];
        var a = fuseCellXY(g, mv.from.r, mv.from.c);
        var b = fuseCellXY(g, mv.to.r, mv.to.c);
        drawFuseTile(g, lerp(a.x, b.x, k), lerp(a.y, b.y, k), mv.v, 1);
      }
    } else {
      if (fuseAnim) fuseAnim = null;
      // settled: the real board, with pop/pulse on fresh cells
      for (var rr = 0; rr < g.size; rr++) {
        for (var cc = 0; cc < g.size; cc++) {
          var v = st.board[rr][cc];
          if (!v) continue;
          var p2 = fuseCellXY(g, rr, cc);
          var scale = 1;
          var since = t - fusePulse.at;
          if (since >= 0 && since < FUSE_POP_MS) {
            var pk = since / FUSE_POP_MS;
            if (fusePulse.spawn && fusePulse.spawn.r === rr && fusePulse.spawn.c === cc) {
              scale = easeOut(pk); // pop in from nothing
            }
            for (var mm = 0; mm < fusePulse.merges.length; mm++) {
              if (fusePulse.merges[mm].r === rr && fusePulse.merges[mm].c === cc) {
                scale = 1 + 0.18 * Math.sin(pk * Math.PI); // fuse pulse
              }
            }
          }
          drawFuseTile(g, p2.x, p2.y, v, scale);
        }
      }
    }

    hud('SCORE <b>' + E.formatScore(st.score) + '</b>' + (st.won ? ' · <b style="color:#e8b34c">2048!</b>' : ''),
        'BEST <b>' + E.formatScore(E.bestScore(scores, 'fuse')) + '</b>');
  }

  /* ================= BREAKER ================= */
  var BRICK_COLORS = [
    ['#ff8ba1', '#ff5d7a', '#c22347'],
    ['#ffd06e', '#e8b34c', '#b07f22'],
    ['#8af5c8', '#4de8a1', '#1e9c66'],
    ['#8ae6ff', '#4dd8ff', '#1f8fb8'],
    ['#b6a6ff', '#8f7cf7', '#5c48c4']
  ];
  function startBreaker() {
    brkState = E.newBreaker(newSeed());
    brkHeld.left = false; brkHeld.right = false;
    brkPointerX = null;
    brkTrail = [];
  }
  function breakerGeom() {
    var top = 46, S = Math.min(CW, CH - top);
    return { S: S, ox: (CW - S) / 2, oy: top };
  }
  function stepBreakerFrame(t, dt) {
    // paddle target: pointer wins, else held keys nudge it
    var px = brkState.paddleX;
    if (brkPointerX != null) px = brkPointerX;
    else {
      var v = 0.9 * dt;
      if (brkHeld.left) px -= v;
      if (brkHeld.right) px += v;
      var pads = listPads();
      if (pads[0]) px += padHorizontal(pads[0]) * v * 1.3; // controller stick/d-pad
    }
    var prev = brkState;
    var slices = Math.max(1, Math.round(dt * 120));
    for (var i = 0; i < slices; i++) brkState = E.stepBreaker(brkState, px, 1 / 120);

    var geo = breakerGeom();
    if (!brkState.stuck) {
      brkTrail.push({ x: brkState.ball.x, y: brkState.ball.y });
      if (brkTrail.length > 16) brkTrail.shift();
    } else if (brkTrail.length) brkTrail = [];

    if (brkState.score > prev.score) {
      // find the brick that just died and shatter it in its own colours
      for (var b = 0; b < prev.bricks.length; b++) {
        if (prev.bricks[b].alive && !brkState.bricks[b].alive) {
          var bk = prev.bricks[b];
          var cols = BRICK_COLORS[bk.row % BRICK_COLORS.length];
          burst(geo.ox + (bk.x + bk.w / 2) * geo.S, geo.oy + (bk.y + bk.h / 2) * geo.S,
                { n: 14, colors: cols, speed: 240, size: 6, life: 0.7, grav: 620, shape: 'rect' });
          addFloat(geo.ox + (bk.x + bk.w / 2) * geo.S, geo.oy + bk.y * geo.S - 8, '+' + bk.pts, cols[1]);
        }
      }
      addShake(2.5);
      beep(700, 35);
    }
    if (brkState.lives < prev.lives && !brkState.over) {
      addFlash('255,93,122', 0.3);
      addShake(8);
      beep(180, 200, 0.05);
    }
    if (brkState.level > prev.level) {
      addFlash('77,216,255', 0.25);
      confetti();
      beep(880, 250, 0.05);
    }
    if (brkState.over && !prev.over) {
      addFlash('255,93,122', 0.35);
      addShake(10);
      burst(geo.ox + brkState.ball.x * geo.S, geo.oy + Math.min(1, brkState.ball.y) * geo.S,
            { n: 22, colors: ['#ff5d7a', '#e8ecff'], speed: 300, size: 6, life: 0.8 });
      queueOver('GAME OVER', brkState.score, 'Reached level ' + brkState.level + '.', 700);
    }
  }
  function drawBreaker(t) {
    var st = brkState;
    drawBackdrop(t, 'breaker', 1);
    var geo = breakerGeom(), S = geo.S, ox = geo.ox, oy = geo.oy;
    var B = E.BREAKER;

    // bricks: bevelled neon slabs
    for (var i = 0; i < st.bricks.length; i++) {
      var bk = st.bricks[i];
      if (!bk.alive) continue;
      var cols = BRICK_COLORS[bk.row % BRICK_COLORS.length];
      var bx = ox + bk.x * S, by = oy + bk.y * S, bw = bk.w * S, bh = bk.h * S;
      var bg = ctx.createLinearGradient(bx, by, bx, by + bh);
      bg.addColorStop(0, cols[0]);
      bg.addColorStop(0.5, cols[1]);
      bg.addColorStop(1, cols[2]);
      ctx.fillStyle = bg;
      ctx.shadowColor = cols[1];
      ctx.shadowBlur = 10;
      roundRect(bx, by, bw, bh, 6);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.30)';
      roundRect(bx + 2, by + 2, bw - 4, bh * 0.3, 4);
      ctx.fill();
    }

    // the ball's comet trail (additive)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var tr = 0; tr < brkTrail.length; tr++) {
      var a = (tr + 1) / brkTrail.length;
      ctx.globalAlpha = a * 0.35;
      ctx.fillStyle = '#4dd8ff';
      ctx.beginPath();
      ctx.arc(ox + brkTrail[tr].x * S, oy + brkTrail[tr].y * S, B.ballR * S * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // paddle: a lit capsule with an under-glow
    var pw = B.paddleW * S, ph = B.paddleH * S;
    var pxx = ox + (st.paddleX - B.paddleW / 2) * S, pyy = oy + (B.paddleY - B.paddleH / 2) * S;
    var pg = ctx.createLinearGradient(pxx, pyy, pxx, pyy + ph);
    pg.addColorStop(0, '#bff0ff');
    pg.addColorStop(0.4, '#4dd8ff');
    pg.addColorStop(1, '#1f8fb8');
    ctx.fillStyle = pg;
    ctx.shadowColor = '#4dd8ff';
    ctx.shadowBlur = 18;
    roundRect(pxx, pyy, pw, ph, ph / 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // the ball: white-hot core in a cyan halo
    var bxx = ox + st.ball.x * S, byy = oy + st.ball.y * S, br = B.ballR * S;
    var halo = ctx.createRadialGradient(bxx, byy, 0, bxx, byy, br * 3);
    halo.addColorStop(0, 'rgba(191,240,255,0.8)');
    halo.addColorStop(0.4, 'rgba(77,216,255,0.25)');
    halo.addColorStop(1, 'rgba(77,216,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(bxx, byy, br * 3, 0, Math.PI * 2); ctx.fill();
    var core = ctx.createRadialGradient(bxx - br * 0.3, byy - br * 0.3, 0, bxx, byy, br);
    core.addColorStop(0, '#ffffff');
    core.addColorStop(1, '#9fdcff');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(bxx, byy, br, 0, Math.PI * 2); ctx.fill();

    if (st.stuck && !st.over) {
      var blink = 0.55 + 0.45 * Math.sin(t / 300);
      ctx.globalAlpha = blink;
      ctx.fillStyle = '#8b93b8';
      ctx.font = '600 26px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#4dd8ff';
      ctx.shadowBlur = 12;
      ctx.fillText('PRESS A TO LAUNCH', CW / 2, oy + S * 0.62);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
    var hearts = '';
    for (var h = 0; h < st.lives; h++) hearts += '♥';
    hud('SCORE <b>' + E.formatScore(st.score) + '</b> · LV <b>' + st.level + '</b>',
        '<b style="color:#ff5d7a">' + hearts + '</b> · BEST <b>' + E.formatScore(E.bestScore(scores, 'breaker')) + '</b>');
  }

  /* ================= VERSUS (pong) ================= */
  // One pure engine, three ways to play: couch (shared keys/touch/two
  // pads), host online, join online. Online is serverless WebRTC with
  // copy-paste invite codes; the host runs the engine and streams state,
  // the guest streams its paddle. First to 7.
  var VS_OPTIONS = [
    { key: 'local', label: 'VS ON THIS CONSOLE', sub: 'W/S vs ▲▼ · two pads · touch halves' },
    { key: 'host',  label: 'HOST ONLINE',        sub: 'make an invite code, send it to a friend' },
    { key: 'join',  label: 'JOIN ONLINE',        sub: 'paste a friend’s invite code' }
  ];

  function startVersus() {
    vsPhase = 'pick';
    vsSel = 0;
    vsState = null;
    hideNetPanel();
  }
  function beginMatch(m) {
    vsMode = m;
    vsPhase = 'match';
    vsState = E.newPong(newSeed());
    vsP1Y = 0.5; vsP2Y = 0.5;
    vsPrevScores = [0, 0];
    vsFreezeUntil = performance.now() + 900;
    vsTrail = [];
    vsAwaitRestart = false;
    vsTouch.p1 = null; vsTouch.p2 = null;
    net.remoteY = 0.5;
    hideNetPanel();
    if (mode !== 'play') { mode = 'play'; $('overlay').style.display = 'none'; }
    ensureLoop();
  }
  function isNetPlay() { return vsMode === 'host' || vsMode === 'join'; }
  function myPaddle() { return vsMode === 'join' ? 2 : 1; }

  /* ---- the wire: manual-signal WebRTC ---- */
  function encodeSig(desc) {
    try { return btoa(JSON.stringify({ type: desc.type, sdp: desc.sdp })); }
    catch (e) { return ''; }
  }
  function decodeSig(s) {
    return JSON.parse(atob(String(s || '').replace(/\s+/g, '')));
  }
  function waitIce(pc) {
    return new Promise(function (resolve) {
      if (pc.iceGatheringState === 'complete') return resolve();
      var t = setTimeout(resolve, 3000); // whatever has gathered by now will do
      pc.addEventListener('icegatheringstatechange', function () {
        if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(); }
      });
    });
  }
  function npStatus(msg, gold) {
    var el = $('npStatus');
    el.textContent = msg;
    el.style.color = gold === false ? '#ff5d7a' : '#e8b34c';
  }
  function showNetPanel() { $('netpanel').style.display = 'flex'; }
  function hideNetPanel() { $('netpanel').style.display = 'none'; }

  function openNet(role) {
    netCleanup();
    vsPhase = 'net';
    vsMode = role;
    $('npTitle').textContent = role === 'host' ? 'HOST — INVITE A FRIEND' : 'JOIN A FRIEND';
    $('npStart').style.display = 'none';
    $('npOut').value = '';
    $('npIn').value = '';
    if (role === 'host') {
      $('npOutLabel').textContent = 'YOUR INVITE CODE — SEND IT TO YOUR FRIEND';
      $('npInLabel').textContent = 'PASTE THEIR REPLY';
      $('npGo').textContent = 'CONNECT';
    } else {
      $('npOutLabel').textContent = 'YOUR REPLY CODE — SEND IT BACK';
      $('npInLabel').textContent = 'PASTE THEIR INVITE';
      $('npGo').textContent = 'MAKE REPLY CODE';
    }
    showNetPanel();
    if (typeof window.RTCPeerConnection !== 'function') {
      npStatus('This browser has no WebRTC — online play needs it.', false);
      return;
    }
    net.pc = new window.RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    net.pc.onconnectionstatechange = function () {
      var st = net.pc && net.pc.connectionState;
      if ((st === 'failed' || st === 'disconnected' || st === 'closed') && net.open) netDrop();
    };
    if (role === 'host') {
      net.dc = net.pc.createDataChannel('arcade');
      wireDC();
      net.pc.createOffer()
        .then(function (o) { return net.pc.setLocalDescription(o); })
        .then(function () { return waitIce(net.pc); })
        .then(function () {
          $('npOut').value = encodeSig(net.pc.localDescription);
          npStatus('Send the invite code, then paste their reply below.');
        })
        .catch(function () { npStatus('Couldn’t build an invite — try again.', false); });
    } else {
      net.pc.ondatachannel = function (e) { net.dc = e.channel; wireDC(); };
      npStatus('Paste the invite code you were sent, then make a reply.');
    }
  }
  function npGoPressed() {
    if (!net.pc) return;
    var pasted;
    try { pasted = decodeSig($('npIn').value); }
    catch (e) { npStatus('That code didn’t parse — paste the whole thing.', false); return; }
    if (vsMode === 'host') {
      net.pc.setRemoteDescription(pasted)
        .then(function () { npStatus('Reply accepted — connecting…'); })
        .catch(function () { npStatus('That reply was rejected — is it from your invite?', false); });
    } else {
      net.pc.setRemoteDescription(pasted)
        .then(function () { return net.pc.createAnswer(); })
        .then(function (a) { return net.pc.setLocalDescription(a); })
        .then(function () { return waitIce(net.pc); })
        .then(function () {
          $('npOut').value = encodeSig(net.pc.localDescription);
          npStatus('Send the reply code back — connecting once they paste it…');
        })
        .catch(function () { npStatus('That invite was rejected — paste the whole code.', false); });
    }
  }
  function wireDC() {
    net.dc.onopen = function () {
      net.open = true;
      npStatus('Connected!');
      beginMatch(vsMode);
      beep(880, 150, 0.05);
    };
    net.dc.onmessage = function (e) {
      var m;
      try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m.t === 'i' && vsMode === 'host') {
        net.remoteY = Number(m.y) || 0.5;
      } else if (m.t === 's' && vsMode === 'join') {
        vsState = m.s;
        if (vsState.winner == null) vsAwaitRestart = false;
        checkPongFX();
      } else if (m.t === 're' && vsMode === 'host') {
        restartMatch();
      }
    };
    net.dc.onclose = function () { if (net.open) netDrop(); };
  }
  function netSend(obj) {
    if (net.dc && net.dc.readyState === 'open') {
      try { net.dc.send(JSON.stringify(obj)); } catch (e) {}
    }
  }
  function netCleanup() {
    net.open = false;
    try { if (net.dc) net.dc.close(); } catch (e) {}
    try { if (net.pc) net.pc.close(); } catch (e) {}
    net.dc = null; net.pc = null; net.remoteY = 0.5;
  }
  function netDrop() {
    netCleanup();
    if (currentId !== 'pong') return;
    mode = 'over';
    stopVsInput();
    $('overlay').innerHTML =
      '<div class="big">CONNECTION LOST</div>' +
      '<div class="sub">The wire went quiet.</div>' +
      '<div class="sub">A PLAY AGAIN · B MENU</div>';
    $('overlay').style.display = 'flex';
    beep(150, 300, 0.05);
    ensureLoop();
  }
  function stopVsInput() {
    vsHeld.p1Up = vsHeld.p1Down = vsHeld.p2Up = vsHeld.p2Down = false;
    vsTouch.p1 = null; vsTouch.p2 = null;
  }
  function restartMatch() {
    beginMatch(vsMode);
  }

  /* ---- per-frame: inputs, physics (host/local), the wire ---- */
  function stepPongFrame(t, dt) {
    if (vsPhase !== 'match' || !vsState) return;
    var vel = 1.5 * dt;
    var pads = listPads();
    if (isNetPlay()) {
      // every local control drives YOUR paddle
      var mine = myPaddle() === 1 ? vsP1Y : vsP2Y;
      if (vsHeld.p1Up || vsHeld.p2Up) mine -= vel;
      if (vsHeld.p1Down || vsHeld.p2Down) mine += vel;
      if (pads[0]) mine += padVertical(pads[0]) * vel;
      var touch = vsTouch.p1 != null ? vsTouch.p1 : vsTouch.p2;
      if (touch != null) mine = touch;
      mine = E.clampPaddle(mine);
      if (myPaddle() === 1) vsP1Y = mine; else vsP2Y = mine;
    } else {
      if (vsHeld.p1Up) vsP1Y -= vel;
      if (vsHeld.p1Down) vsP1Y += vel;
      if (vsHeld.p2Up) vsP2Y -= vel;
      if (vsHeld.p2Down) vsP2Y += vel;
      if (pads[0]) vsP1Y += padVertical(pads[0]) * vel;
      if (pads[1]) vsP2Y += padVertical(pads[1]) * vel;
      if (vsTouch.p1 != null) vsP1Y = vsTouch.p1;
      if (vsTouch.p2 != null) vsP2Y = vsTouch.p2;
      vsP1Y = E.clampPaddle(vsP1Y);
      vsP2Y = E.clampPaddle(vsP2Y);
    }

    if (vsMode === 'join') {
      // the guest streams its paddle; the host's state stream drives the rest
      if (t - net.lastSend > 33) { net.lastSend = t; netSend({ t: 'i', y: vsP2Y }); }
    } else {
      var p2 = vsMode === 'host' ? net.remoteY : vsP2Y;
      if (t >= vsFreezeUntil && vsState.winner == null) {
        var slices = Math.max(1, Math.round(dt * 120));
        for (var i = 0; i < slices; i++) vsState = E.stepPong(vsState, vsP1Y, p2, 1 / 120);
        checkPongFX();
      } else if (vsState.winner == null) {
        // hold the serve, but keep the paddles live (dt=0 moves nothing else)
        vsState = E.stepPong(vsState, vsP1Y, p2, 0);
      }
      if (vsMode === 'host') netSend({ t: 's', s: vsState });
    }

    if (!vsState.winner && vsState.ball.vx !== 0) {
      vsTrail.push({ x: vsState.ball.x, y: vsState.ball.y });
      if (vsTrail.length > 14) vsTrail.shift();
    }
    if (vsState.winner != null && mode === 'play' && !vsAwaitRestart) showVersusOver(vsState.winner);
  }
  // scored? flash, shake, burst — on both ends of the wire
  function checkPongFX() {
    if (!vsState) return;
    var s = vsState.scores;
    if (s[0] !== vsPrevScores[0] || s[1] !== vsPrevScores[1]) {
      var scorer = s[0] !== vsPrevScores[0] ? 0 : 1;
      vsPrevScores = [s[0], s[1]];
      var g = pongGeom();
      burst(scorer === 0 ? g.ox + g.S * 0.9 : g.ox + g.S * 0.1, g.oy + g.S * 0.5,
            { n: 18, colors: scorer === 0 ? ['#4dd8ff', '#bff0ff'] : ['#8f7cf7', '#cfc2ff'], speed: 280, size: 6, life: 0.7 });
      addFlash(scorer === 0 ? '77,216,255' : '143,124,247', 0.18);
      addShake(4);
      vsFreezeUntil = performance.now() + 900;
      vsTrail = [];
      beep(scorer === (isNetPlay() ? myPaddle() - 1 : 0) ? 740 : 260, 160, 0.045);
    }
  }

  function pongGeom() {
    var top = 46, S = Math.min(CW, CH - top);
    return { S: S, ox: (CW - S) / 2, oy: top };
  }
  function drawPong(t) {
    drawBackdrop(t, 'pong', 0);
    var g = pongGeom(), S = g.S, ox = g.ox, oy = g.oy;

    if (vsPhase === 'pick' || !vsState) {
      // mode select, drawn on the canvas like a proper attract screen
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#e8ecff';
      ctx.font = '700 52px ui-monospace, monospace';
      ctx.shadowColor = '#ff5d7a';
      ctx.shadowBlur = 24;
      ctx.fillText('VERSUS', CW / 2, oy + S * 0.16);
      ctx.shadowBlur = 0;
      for (var o = 0; o < VS_OPTIONS.length; o++) {
        var y = oy + S * 0.36 + o * S * 0.17;
        var sel = o === vsSel;
        if (sel) {
          ctx.strokeStyle = '#4dd8ff';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#4dd8ff';
          ctx.shadowBlur = 14;
          roundRect(ox + S * 0.08, y - S * 0.055, S * 0.84, S * 0.115, 14);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = sel ? '#e8ecff' : '#8b93b8';
        ctx.font = '700 26px ui-monospace, monospace';
        ctx.fillText(VS_OPTIONS[o].label, CW / 2, y - 12);
        ctx.fillStyle = '#8b93b8';
        ctx.globalAlpha = sel ? 1 : 0.6;
        ctx.font = '400 16px ui-monospace, monospace';
        ctx.fillText(VS_OPTIONS[o].sub, CW / 2, y + 18);
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = '#8b93b8';
      ctx.font = '600 18px ui-monospace, monospace';
      ctx.fillText('FIRST TO 7 · A SELECT · B MENU', CW / 2, oy + S * 0.94);
      hud('VERSUS', '2P');
      return;
    }

    var st = vsState;
    var P = E.PONG;
    // the court: glowing rails and a dashed centre line
    ctx.strokeStyle = 'rgba(255,93,122,0.35)';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ff5d7a';
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(ox, oy + 2); ctx.lineTo(ox + S, oy + 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, oy + S - 2); ctx.lineTo(ox + S, oy + S - 2); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(139,147,184,0.28)';
    ctx.lineWidth = 3;
    ctx.setLineDash([S * 0.02, S * 0.025]);
    ctx.beginPath(); ctx.moveTo(CW / 2, oy + 8); ctx.lineTo(CW / 2, oy + S - 8); ctx.stroke();
    ctx.setLineDash([]);

    // scores, huge and glowing
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 64px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(77,216,255,0.85)';
    ctx.shadowColor = '#4dd8ff'; ctx.shadowBlur = 18;
    ctx.fillText(String(st.scores[0]), CW / 2 - S * 0.14, oy + S * 0.12);
    ctx.fillStyle = 'rgba(143,124,247,0.85)';
    ctx.shadowColor = '#8f7cf7';
    ctx.fillText(String(st.scores[1]), CW / 2 + S * 0.14, oy + S * 0.12);
    ctx.shadowBlur = 0;

    // ball trail + ball
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var tr = 0; tr < vsTrail.length; tr++) {
      var a = (tr + 1) / vsTrail.length;
      ctx.globalAlpha = a * 0.3;
      ctx.fillStyle = '#ffd9e1';
      ctx.beginPath();
      ctx.arc(ox + vsTrail[tr].x * S, oy + vsTrail[tr].y * S, P.ballR * S * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    var bx = ox + st.ball.x * S, by = oy + st.ball.y * S, br = P.ballR * S;
    var halo = ctx.createRadialGradient(bx, by, 0, bx, by, br * 3);
    halo.addColorStop(0, 'rgba(255,217,225,0.8)');
    halo.addColorStop(1, 'rgba(255,93,122,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(bx, by, br * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();

    // paddles: P1 cyan left, P2 violet right
    var ph = P.paddleH * S, pw = P.paddleW * S * 1.6;
    ctx.fillStyle = '#4dd8ff';
    ctx.shadowColor = '#4dd8ff'; ctx.shadowBlur = 16;
    roundRect(ox + (P.paddleX - P.paddleW / 2) * S, oy + st.p1Y * S - ph / 2, pw, ph, pw / 2);
    ctx.fill();
    ctx.fillStyle = '#8f7cf7';
    ctx.shadowColor = '#8f7cf7';
    roundRect(ox + (1 - P.paddleX - P.paddleW / 2) * S - pw * 0.35, oy + st.p2Y * S - ph / 2, pw, ph, pw / 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // serve pause
    if (t < vsFreezeUntil && st.winner == null) {
      ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t / 200);
      ctx.fillStyle = '#8b93b8';
      ctx.font = '600 22px ui-monospace, monospace';
      ctx.fillText('READY', CW / 2, oy + S * 0.62);
      ctx.globalAlpha = 1;
    }

    hud('<b style="color:#4dd8ff">P1</b>' + (isNetPlay() && myPaddle() === 1 ? ' · YOU' : ''),
        '<b style="color:#8f7cf7">P2</b>' + (isNetPlay() && myPaddle() === 2 ? ' · YOU' : '') + ' · FIRST TO 7');
  }

  function showVersusOver(winnerIdx) {
    mode = 'over';
    stopVsInput();
    var title, sub = 'FINAL ' + vsState.scores[0] + ' — ' + vsState.scores[1];
    var celebrate = true;
    if (isNetPlay()) {
      var won = winnerIdx === myPaddle() - 1;
      title = won ? 'YOU WIN' : 'YOU LOSE';
      celebrate = won;
    } else {
      title = winnerIdx === 0 ? 'P1 WINS' : 'P2 WINS';
    }
    $('overlay').innerHTML =
      '<div class="big">' + title + '</div>' +
      '<div class="score">🏓</div>' +
      '<div class="best">' + sub + '</div>' +
      '<div class="sub">A REMATCH · B MENU</div>';
    $('overlay').style.display = 'flex';
    if (celebrate) confetti();
    ensureLoop();
    beep(celebrate ? 880 : 196, 260, 0.05);
  }

  /* ================= QUAD (4 phones) ================= */
  // Four walls, up to four phones. Star network: the host pairs with each
  // guest through its own invite/reply code, runs the one pure engine, and
  // streams state to everyone; each guest streams its paddle back.
  var QUAD_OPTIONS = [
    { key: 'solo', label: 'PRACTICE SOLO', sub: 'three lives, three bouncy walls' },
    { key: 'host', label: 'HOST 2–4 PHONES', sub: 'one invite code per friend' },
    { key: 'join', label: 'JOIN A GAME', sub: 'paste the invite you were sent' }
  ];

  function startQuad() {
    qPhase = 'pick';
    qSel = 0;
    qState = null;
    hideNetPanel();
  }
  function quadIsNet() { return qMode === 'host' || qMode === 'join'; }
  function quadAxis(seat) { return seat < 2 ? 'x' : 'y'; } // bottom/top slide in x

  function beginQuadMatch(players, seat) {
    qPhase = 'match';
    qSeat = seat;
    qState = qMode === 'join' ? E.newQuad('pending', players) : E.newQuad(newSeed(), players);
    qMyPos = 0.5;
    qPrevLives = qState.lives.slice();
    qPrevServes = 0;
    qTrail = [];
    qTouch = null;
    qHeld.neg = qHeld.pos = false;
    qAwaitRestart = false;
    qFreezeUntil = performance.now() + 900;
    hideNetPanel();
    if (mode !== 'play') { mode = 'play'; $('overlay').style.display = 'none'; }
    ensureLoop();
  }

  /* ---- the star: one peer per guest ---- */
  function quadCleanup() {
    for (var i = 0; i < qnet.peers.length; i++) {
      try { qnet.peers[i].dc.close(); } catch (e) {}
      try { qnet.peers[i].pc.close(); } catch (e) {}
    }
    qnet.peers = [];
    if (qnet.pending) {
      try { if (qnet.pending.dc) qnet.pending.dc.close(); } catch (e) {}
      try { qnet.pending.pc.close(); } catch (e) {}
      qnet.pending = null;
    }
    try { if (qnet.hostDc) qnet.hostDc.close(); } catch (e) {}
    try { if (qnet.hostPc) qnet.hostPc.close(); } catch (e) {}
    qnet.hostPc = null; qnet.hostDc = null; qnet.open = false;
    $('npStart').style.display = 'none';
  }
  function quadPlayers() { return 1 + qnet.peers.length; }
  function quadRoomStatus(extra) {
    npStatus('Players in the room: ' + quadPlayers() + ' of 4 (you + ' + qnet.peers.length + ' friend' +
             (qnet.peers.length === 1 ? '' : 's') + ').' + (extra ? ' ' + extra : ''));
  }
  function quadBroadcast(obj) {
    var msg = JSON.stringify(obj);
    for (var i = 0; i < qnet.peers.length; i++) {
      var p = qnet.peers[i];
      if (p.dc && p.dc.readyState === 'open') { try { p.dc.send(msg); } catch (e) {} }
    }
  }

  function openQuadNet(role) {
    quadCleanup();
    qPhase = 'net';
    qMode = role;
    $('npTitle').textContent = role === 'host' ? 'HOST — UP TO 4 PHONES' : 'JOIN A GAME';
    $('npOut').value = '';
    $('npIn').value = '';
    if (role === 'host') {
      $('npOutLabel').textContent = 'INVITE CODE — SEND IT TO THE NEXT FRIEND';
      $('npInLabel').textContent = 'PASTE THEIR REPLY';
      $('npGo').textContent = 'CONNECT PLAYER';
    } else {
      $('npOutLabel').textContent = 'YOUR REPLY CODE — SEND IT BACK';
      $('npInLabel').textContent = 'PASTE THEIR INVITE';
      $('npGo').textContent = 'MAKE REPLY CODE';
    }
    showNetPanel();
    if (typeof window.RTCPeerConnection !== 'function') {
      npStatus('This browser has no WebRTC — online play needs it.', false);
      return;
    }
    if (role === 'host') quadMakeInvite();
    else {
      qnet.hostPc = new window.RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      qnet.hostPc.ondatachannel = function (e) { qnet.hostDc = e.channel; quadWireGuest(); };
      qnet.hostPc.onconnectionstatechange = function () {
        var st = qnet.hostPc && qnet.hostPc.connectionState;
        if ((st === 'failed' || st === 'disconnected' || st === 'closed') && qnet.open) quadDrop();
      };
      npStatus('Paste the invite code you were sent, then make a reply.');
    }
  }
  // Host: build the next guest slot's invite. The box empties immediately
  // so a used code can never be sent to the next friend by mistake.
  function quadMakeInvite() {
    $('npOut').value = '';
    $('npIn').value = '';
    var pc = new window.RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    var dc = pc.createDataChannel('arcade4');
    qnet.pending = { pc: pc, dc: dc };
    dc.onopen = function () { quadGuestJoined(pc, dc); };
    pc.createOffer()
      .then(function (o) { return pc.setLocalDescription(o); })
      .then(function () { return waitIce(pc); })
      .then(function () {
        if (qnet.pending && qnet.pending.pc === pc) {
          $('npOut').value = encodeSig(pc.localDescription);
          $('npIn').value = '';
          quadRoomStatus('Send the invite, paste the reply below.');
        }
      })
      .catch(function () { npStatus('Couldn’t build an invite — try again.', false); });
  }
  function quadGuestJoined(pc, dc) {
    var seat = 1 + qnet.peers.length;
    var peer = { pc: pc, dc: dc, seat: seat, pos: 0.5 };
    qnet.peers.push(peer);
    qnet.pending = null;
    dc.onmessage = function (e) {
      var m;
      try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m.t === 'i') peer.pos = Number(m.p) || 0.5;
      else if (m.t === 're' && qState && qState.over) quadRestart();
    };
    dc.onclose = function () {
      var idx = qnet.peers.indexOf(peer);
      if (idx >= 0) qnet.peers.splice(idx, 1);
      if (qPhase === 'match' && !qnet.peers.length) quadDrop();
      else if (qPhase === 'net') quadRoomStatus();
    };
    try { dc.send(JSON.stringify({ t: 'seat', n: seat })); } catch (e) {}
    beep(720, 90, 0.04);
    $('npStart').style.display = '';
    if (qnet.peers.length < 3) {
      quadMakeInvite();
      quadRoomStatus('Add another friend with the fresh invite, or press START GAME.');
    } else {
      $('npOut').value = '';
      quadRoomStatus('Room full — start when ready!');
    }
  }
  // Guest: the host's channel opened
  function quadWireGuest() {
    qnet.hostDc.onopen = function () {
      qnet.open = true;
      qPhase = 'wait';
      hideNetPanel();
      ensureLoop();
      beep(720, 90, 0.04);
    };
    qnet.hostDc.onmessage = function (e) {
      var m;
      try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m.t === 'seat') qSeat = m.n | 0;
      else if (m.t === 'go') beginQuadMatch(m.players | 0, qSeat);
      else if (m.t === 's') {
        if (qPhase === 'wait') beginQuadMatch(m.s.players, qSeat);
        qState = m.s;
        if (!qState.over) qAwaitRestart = false;
        checkQuadFX();
      }
    };
    qnet.hostDc.onclose = function () { if (qnet.open) quadDrop(); };
  }
  function quadGoPressed() {
    var pasted;
    try { pasted = decodeSig($('npIn').value); }
    catch (e) { npStatus('That code didn’t parse — paste the whole thing.', false); return; }
    if (qMode === 'host') {
      if (!qnet.pending) { npStatus('The room is full.', false); return; }
      qnet.pending.pc.setRemoteDescription(pasted)
        .then(function () { npStatus('Reply accepted — connecting that player…'); })
        .catch(function () { npStatus('That reply was rejected — is it from this invite?', false); });
    } else {
      qnet.hostPc.setRemoteDescription(pasted)
        .then(function () { return qnet.hostPc.createAnswer(); })
        .then(function (a) { return qnet.hostPc.setLocalDescription(a); })
        .then(function () { return waitIce(qnet.hostPc); })
        .then(function () {
          $('npOut').value = encodeSig(qnet.hostPc.localDescription);
          npStatus('Send the reply code back — connecting once they paste it…');
        })
        .catch(function () { npStatus('That invite was rejected — paste the whole code.', false); });
    }
  }
  function quadStartPressed() {
    if (qMode !== 'host' || !qnet.peers.length) return;
    beginQuadMatch(quadPlayers(), 0);
    quadBroadcast({ t: 'go', players: qState.players });
  }
  function quadRestart() {
    if (qMode === 'join') return;
    beginQuadMatch(qMode === 'solo' ? 1 : quadPlayers(), 0);
    if (qMode === 'host') quadBroadcast({ t: 'go', players: qState.players });
  }
  function quadDrop() {
    quadCleanup();
    if (currentId !== 'quad') return;
    mode = 'over';
    $('overlay').innerHTML =
      '<div class="big">CONNECTION LOST</div>' +
      '<div class="sub">The wire went quiet.</div>' +
      '<div class="sub">B MENU</div>';
    $('overlay').style.display = 'flex';
    beep(150, 300, 0.05);
    ensureLoop();
  }

  /* ---- per-frame: inputs, physics (host/solo), the wire ---- */
  function quadGeom() {
    var top = 46, S = Math.min(CW, CH - top);
    return { S: S, ox: (CW - S) / 2, oy: top };
  }
  function stepQuadFrame(t, dt) {
    if (qPhase !== 'match' || !qState) return;
    // local paddle: touch wins, else held keys / pad nudge along my axis
    var vel = 1.5 * dt;
    if (qHeld.neg) qMyPos -= vel;
    if (qHeld.pos) qMyPos += vel;
    var pads = listPads();
    if (pads[0]) {
      qMyPos += (quadAxis(qSeat) === 'x' ? padHorizontal(pads[0]) : padVertical(pads[0])) * vel;
    }
    if (qTouch != null) qMyPos = qTouch;
    qMyPos = E.clampQuadPos(qMyPos);

    if (qMode === 'join') {
      if (t - qLastSend > 33 && qnet.hostDc && qnet.hostDc.readyState === 'open') {
        qLastSend = t;
        try { qnet.hostDc.send(JSON.stringify({ t: 'i', p: qMyPos })); } catch (e) {}
      }
    } else {
      var inputs = [null, null, null, null];
      inputs[qSeat] = qMyPos;
      for (var i = 0; i < qnet.peers.length; i++) inputs[qnet.peers[i].seat] = qnet.peers[i].pos;
      if (t >= qFreezeUntil && !qState.over) {
        var slices = Math.max(1, Math.round(dt * 120));
        for (var s = 0; s < slices; s++) qState = E.stepQuad(qState, inputs, 1 / 120);
        checkQuadFX();
      } else if (!qState.over) {
        qState = E.stepQuad(qState, inputs, 0); // paddles stay live through the serve pause
      }
      if (qMode === 'host') quadBroadcast({ t: 's', s: qState });
    }

    if (!qState.over && (qState.ball.vx || qState.ball.vy)) {
      qTrail.push({ x: qState.ball.x, y: qState.ball.y });
      if (qTrail.length > 14) qTrail.shift();
    }
    if (qState.over && mode === 'play' && !qAwaitRestart) showQuadOver();
  }
  // a life was lost somewhere — flash that wall's colour, on every phone
  function checkQuadFX() {
    if (!qState || !qPrevLives) { qPrevLives = qState && qState.lives.slice(); return; }
    if (qState.serves !== qPrevServes) {
      for (var i = 0; i < 4; i++) {
        if (qState.lives[i] < qPrevLives[i]) {
          var g = quadGeom();
          var cx = i === 2 ? g.ox + g.S * 0.06 : i === 3 ? g.ox + g.S * 0.94 : g.ox + g.S * 0.5;
          var cy = i === 0 ? g.oy + g.S * 0.94 : i === 1 ? g.oy + g.S * 0.06 : g.oy + g.S * 0.5;
          burst(cx, cy, { n: 18, color: QUAD_COLORS[i], speed: 280, size: 6, life: 0.7 });
          addFlash(i === 0 ? '77,216,255' : i === 1 ? '143,124,247' : i === 2 ? '232,179,76' : '77,232,161', 0.18);
          addShake(4);
          if (qState.lives[i] <= 0 && qState.players > 1) {
            addFloat(cx, cy, 'ELIMINATED', QUAD_COLORS[i]);
          }
          beep(i === qSeat ? 220 : 640, 160, 0.045);
        }
      }
      qPrevServes = qState.serves;
      qFreezeUntil = performance.now() + 900;
      qTrail = [];
    }
    qPrevLives = qState.lives.slice();
  }

  function drawQuad(t) {
    drawBackdrop(t, 'quad', 0);
    var g = quadGeom(), S = g.S, ox = g.ox, oy = g.oy;

    if (qPhase === 'pick' || (!qState && qPhase !== 'wait')) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#e8ecff';
      ctx.font = '700 52px ui-monospace, monospace';
      ctx.shadowColor = '#e8b34c';
      ctx.shadowBlur = 24;
      ctx.fillText('QUAD', CW / 2, oy + S * 0.16);
      ctx.shadowBlur = 0;
      for (var o = 0; o < QUAD_OPTIONS.length; o++) {
        var y = oy + S * 0.36 + o * S * 0.17;
        var sel = o === qSel;
        if (sel) {
          ctx.strokeStyle = '#e8b34c';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#e8b34c';
          ctx.shadowBlur = 14;
          roundRect(ox + S * 0.08, y - S * 0.055, S * 0.84, S * 0.115, 14);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = sel ? '#e8ecff' : '#8b93b8';
        ctx.font = '700 26px ui-monospace, monospace';
        ctx.fillText(QUAD_OPTIONS[o].label, CW / 2, y - 12);
        ctx.fillStyle = '#8b93b8';
        ctx.globalAlpha = sel ? 1 : 0.6;
        ctx.font = '400 16px ui-monospace, monospace';
        ctx.fillText(QUAD_OPTIONS[o].sub, CW / 2, y + 18);
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = '#8b93b8';
      ctx.font = '600 18px ui-monospace, monospace';
      ctx.fillText('3 LIVES EACH · LAST PADDLE WINS', CW / 2, oy + S * 0.94);
      hud('QUAD', '2–4P');
      return;
    }
    if (qPhase === 'wait') {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t / 300);
      ctx.fillStyle = '#4de8a1';
      ctx.font = '700 26px ui-monospace, monospace';
      ctx.fillText('CONNECTED', CW / 2, oy + S * 0.42);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#8b93b8';
      ctx.font = '400 18px ui-monospace, monospace';
      ctx.fillText('waiting for the host to start…', CW / 2, oy + S * 0.52);
      hud('QUAD', 'JOINED');
      return;
    }

    var st = qState, Q = E.QUAD;
    // the court: each wall glows in its seat colour (dim when dead/unfilled)
    for (var w = 0; w < 4; w++) {
      var live = st.lives[w] > 0;
      ctx.strokeStyle = live ? QUAD_COLORS[w] : 'rgba(139,147,184,0.25)';
      ctx.lineWidth = live ? 2 : 4;
      ctx.globalAlpha = live ? 0.4 : 1;
      ctx.shadowColor = QUAD_COLORS[w];
      ctx.shadowBlur = live ? 8 : 0;
      ctx.beginPath();
      if (w === 0) { ctx.moveTo(ox + 2, oy + S - 2); ctx.lineTo(ox + S - 2, oy + S - 2); }
      else if (w === 1) { ctx.moveTo(ox + 2, oy + 2); ctx.lineTo(ox + S - 2, oy + 2); }
      else if (w === 2) { ctx.moveTo(ox + 2, oy + 2); ctx.lineTo(ox + 2, oy + S - 2); }
      else { ctx.moveTo(ox + S - 2, oy + 2); ctx.lineTo(ox + S - 2, oy + S - 2); }
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // lives as hearts along each live wall
    ctx.font = '600 20px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var h = 0; h < 4; h++) {
      if (st.players <= h && h !== 0) continue;
      if (st.lives[h] <= 0 && st.players <= 1) continue;
      var hearts = '';
      for (var n = 0; n < st.lives[h]; n++) hearts += '♥';
      if (!hearts) continue;
      ctx.fillStyle = QUAD_COLORS[h];
      if (h === 0) ctx.fillText(hearts, ox + S * 0.5, oy + S - 34);
      else if (h === 1) ctx.fillText(hearts, ox + S * 0.5, oy + 34);
      else if (h === 2) { ctx.save(); ctx.translate(ox + 34, oy + S * 0.5); ctx.rotate(-Math.PI / 2); ctx.fillText(hearts, 0, 0); ctx.restore(); }
      else { ctx.save(); ctx.translate(ox + S - 34, oy + S * 0.5); ctx.rotate(Math.PI / 2); ctx.fillText(hearts, 0, 0); ctx.restore(); }
    }

    // ball trail + ball
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var tr = 0; tr < qTrail.length; tr++) {
      var a = (tr + 1) / qTrail.length;
      ctx.globalAlpha = a * 0.3;
      ctx.fillStyle = '#ffe9c2';
      ctx.beginPath();
      ctx.arc(ox + qTrail[tr].x * S, oy + qTrail[tr].y * S, Q.ballR * S * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    var bx = ox + st.ball.x * S, by = oy + st.ball.y * S, br = Q.ballR * S;
    var halo = ctx.createRadialGradient(bx, by, 0, bx, by, br * 3);
    halo.addColorStop(0, 'rgba(255,233,194,0.8)');
    halo.addColorStop(1, 'rgba(232,179,76,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(bx, by, br * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();

    // paddles, with a YOU marker on yours
    var len = Q.paddleLen * S, th = 0.02 * S * 1.6, inset = Q.inset * S;
    for (var p = 0; p < 4; p++) {
      if (st.lives[p] <= 0) continue;
      ctx.fillStyle = QUAD_COLORS[p];
      ctx.shadowColor = QUAD_COLORS[p];
      ctx.shadowBlur = 16;
      if (p === 0) roundRect(ox + st.pos[0] * S - len / 2, oy + S - inset - th / 2, len, th, th / 2);
      else if (p === 1) roundRect(ox + st.pos[1] * S - len / 2, oy + inset - th / 2, len, th, th / 2);
      else if (p === 2) roundRect(ox + inset - th / 2, oy + st.pos[2] * S - len / 2, th, len, th / 2);
      else roundRect(ox + S - inset - th / 2, oy + st.pos[3] * S - len / 2, th, len, th / 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      if (p === qSeat && (quadIsNet() || qMode === 'solo')) {
        ctx.fillStyle = '#e8ecff';
        ctx.font = '700 15px ui-monospace, monospace';
        var lx = p === 2 ? ox + inset + 26 : p === 3 ? ox + S - inset - 26 : ox + st.pos[p] * S;
        var ly = p === 0 ? oy + S - inset - 26 : p === 1 ? oy + inset + 26 : oy + st.pos[p] * S;
        ctx.fillText('YOU', lx, ly);
      }
    }

    if (t < qFreezeUntil && !st.over) {
      ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t / 200);
      ctx.fillStyle = '#8b93b8';
      ctx.font = '600 22px ui-monospace, monospace';
      ctx.fillText('READY', CW / 2, oy + S * 0.4);
      ctx.globalAlpha = 1;
    }

    var mine = QUAD_COLORS[qSeat];
    hud(qMode === 'solo' ? 'HITS <b>' + st.hits + '</b>' : 'QUAD · <b>' + st.players + 'P</b>',
        '<b style="color:' + mine + '">' + (qMode === 'solo' ? 'PRACTICE' : 'YOU · ' + QUAD_NAMES[qSeat].split('·')[1]) + '</b>');
  }

  function showQuadOver() {
    mode = 'over';
    qHeld.neg = qHeld.pos = false;
    qTouch = null;
    var title, sub, celebrate = false;
    if (qMode === 'solo') {
      title = 'RUN OVER';
      sub = qState.hits + ' return' + (qState.hits === 1 ? '' : 's');
    } else if (qState.winner === qSeat) {
      title = 'YOU WIN';
      sub = 'last paddle standing';
      celebrate = true;
    } else {
      title = QUAD_NAMES[qState.winner] ? QUAD_NAMES[qState.winner].split(' ·')[0] + ' WINS' : 'MATCH OVER';
      sub = 'you were seat ' + (qSeat + 1);
    }
    $('overlay').innerHTML =
      '<div class="big">' + title + '</div>' +
      '<div class="score">⚔️</div>' +
      '<div class="best">' + sub + '</div>' +
      '<div class="sub">' + (qMode === 'join' ? 'A ASK FOR A REMATCH · B MENU' : 'A REMATCH · B MENU') + '</div>';
    $('overlay').style.display = 'flex';
    if (celebrate) confetti();
    ensureLoop();
    beep(celebrate ? 880 : 196, 260, 0.05);
  }

  // net panel buttons
  $('npGo').addEventListener('click', function () {
    if (currentId === 'quad') quadGoPressed(); else npGoPressed();
  });
  $('npStart').addEventListener('click', quadStartPressed);
  $('npBack').addEventListener('click', function () { pressB(); });
  $('npCopy').addEventListener('click', function () {
    var out = $('npOut');
    var ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(out.value);
        ok = true;
      } else if (out.select) {
        out.select();
        ok = document.execCommand && document.execCommand('copy');
      }
    } catch (e) {}
    npStatus(ok ? 'Copied — send it to your friend.' : 'Copy failed — select the code and copy it by hand.', ok);
  });

  /* ---------------- input routing ---------------- */
  function pressDir(dir) {
    if (mode === 'menu') {
      if (dir === 'up') menuSel = (menuSel + E.GAMES.length - 1) % E.GAMES.length;
      else if (dir === 'down') menuSel = (menuSel + 1) % E.GAMES.length;
      beep(440, 30);
      renderMenu();
    } else if (mode === 'play') {
      if (currentId === 'serpent') serpentInput(dir);
      else if (currentId === 'fuse') fuseInput(dir);
      else if (currentId === 'pong' && vsPhase === 'pick') {
        if (dir === 'up') vsSel = (vsSel + VS_OPTIONS.length - 1) % VS_OPTIONS.length;
        else if (dir === 'down') vsSel = (vsSel + 1) % VS_OPTIONS.length;
        beep(440, 30);
      }
      else if (currentId === 'quad' && qPhase === 'pick') {
        if (dir === 'up') qSel = (qSel + QUAD_OPTIONS.length - 1) % QUAD_OPTIONS.length;
        else if (dir === 'down') qSel = (qSel + 1) % QUAD_OPTIONS.length;
        beep(440, 30);
      }
      // breaker (and the pong match itself) use held state, handled below
    }
  }
  function pressA() {
    if (mode === 'menu') {
      beep(660, 60);
      enterGame(E.GAMES[menuSel].id);
    } else if (mode === 'over') {
      if (currentId === 'quad') {
        if (qMode === 'join') {
          if (qnet.open) {
            // ask the host for a rematch; their fresh 'go' restarts us
            try { qnet.hostDc.send(JSON.stringify({ t: 're' })); } catch (e) {}
            qAwaitRestart = true;
            qPhase = 'wait';
            mode = 'play';
            $('overlay').style.display = 'none';
            ensureLoop();
          } else {
            enterGame('quad'); // wire is gone — back to the pick screen
          }
        } else {
          quadRestart();
        }
        return;
      }
      if (currentId === 'pong') {
        if (net.open && vsMode === 'host') { restartMatch(); }
        else if (net.open && vsMode === 'join') {
          // ask the host for a rematch; their fresh state restarts us
          netSend({ t: 're' });
          vsAwaitRestart = true;
          mode = 'play';
          $('overlay').style.display = 'none';
          ensureLoop();
        } else if (isNetPlay()) { enterGame('pong'); } // wire is gone — back to the pick screen
        else { restartMatch(); }
        return;
      }
      enterGame(currentId);
    } else if (mode === 'play' && currentId === 'pong' && vsPhase === 'pick') {
      beep(660, 60);
      var opt = VS_OPTIONS[vsSel].key;
      if (opt === 'local') beginMatch('local');
      else openNet(opt);
    } else if (mode === 'play' && currentId === 'quad' && qPhase === 'pick') {
      beep(660, 60);
      var qopt = QUAD_OPTIONS[qSel].key;
      if (qopt === 'solo') { qMode = 'solo'; beginQuadMatch(1, 0); }
      else openQuadNet(qopt);
    } else if (mode === 'play' && currentId === 'breaker' && brkState.stuck) {
      brkState = E.launchBreaker(brkState);
      beep(600, 50);
    }
  }
  function pressB() {
    if (mode === 'play') {
      if (currentId === 'quad') {
        if (qPhase === 'net') {
          // back out of the code panel to the mode picker
          quadCleanup();
          hideNetPanel();
          qPhase = 'pick';
          return;
        }
        showMenu(); // versus keeps no high score to bank
        return;
      }
      if (currentId === 'pong') {
        if (vsPhase === 'net') {
          // back out of the code panel to the mode picker
          netCleanup();
          hideNetPanel();
          vsPhase = 'pick';
          return;
        }
        showMenu(); // versus keeps no high score to bank
        return;
      }
      if (!isExternal(currentId)) {
        // leaving mid-run still banks the score (the emulator keeps no score)
        var sc = currentId === 'serpent' ? snakeState.score
               : currentId === 'fuse' ? fuseState.score
               : brkState.score;
        scores = E.recordScore(scores, currentId, sc, Date.now());
        saveScores(scores);
      }
      showMenu();
    } else if (mode === 'over') {
      showMenu();
    }
  }

  // keyboard
  var KEY_DIRS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };
  document.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'BUTTON') return; // typing in the net panel
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); return; }
    if (mode === 'play' && currentId === 'pong' && vsPhase === 'match') {
      if (e.key === 'w' || e.key === 'W') { vsHeld.p1Up = true; e.preventDefault(); return; }
      if (e.key === 's' || e.key === 'S') { vsHeld.p1Down = true; e.preventDefault(); return; }
      if (e.key === 'ArrowUp') { vsHeld.p2Up = true; e.preventDefault(); return; }
      if (e.key === 'ArrowDown') { vsHeld.p2Down = true; e.preventDefault(); return; }
    }
    if (mode === 'play' && currentId === 'quad' && qPhase === 'match') {
      // whichever wall is yours, all four direction keys steer along it
      var neg = quadAxis(qSeat) === 'x' ? ['ArrowLeft', 'a', 'A'] : ['ArrowUp', 'w', 'W'];
      var pos = quadAxis(qSeat) === 'x' ? ['ArrowRight', 'd', 'D'] : ['ArrowDown', 's', 'S'];
      if (neg.indexOf(e.key) !== -1) { qHeld.neg = true; e.preventDefault(); return; }
      if (pos.indexOf(e.key) !== -1) { qHeld.pos = true; e.preventDefault(); return; }
    }
    var dir = KEY_DIRS[e.key];
    if (dir) {
      e.preventDefault();
      if (mode === 'play' && currentId === 'breaker') {
        if (dir === 'left') brkHeld.left = true;
        if (dir === 'right') brkHeld.right = true;
        brkPointerX = null;
      } else {
        pressDir(dir);
      }
      return;
    }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pressA(); }
    else if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); pressB(); }
  });
  document.addEventListener('keyup', function (e) {
    var dir = KEY_DIRS[e.key];
    if (dir === 'left') brkHeld.left = false;
    if (dir === 'right') brkHeld.right = false;
    if (e.key === 'w' || e.key === 'W') vsHeld.p1Up = false;
    if (e.key === 's' || e.key === 'S') vsHeld.p1Down = false;
    if (e.key === 'ArrowUp') vsHeld.p2Up = false;
    if (e.key === 'ArrowDown') vsHeld.p2Down = false;
    if (['ArrowLeft', 'ArrowUp', 'a', 'A', 'w', 'W'].indexOf(e.key) !== -1) qHeld.neg = false;
    if (['ArrowRight', 'ArrowDown', 'd', 'D', 's', 'S'].indexOf(e.key) !== -1) qHeld.pos = false;
  });

  // on-screen d-pad: taps for turn-based games, hold for breaker
  var dbtns = document.querySelectorAll('.dbtn');
  for (var di = 0; di < dbtns.length; di++) {
    (function (btn) {
      var dir = btn.getAttribute('data-dir');
      btn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        btn.classList.add('held');
        if (mode === 'play' && currentId === 'breaker') {
          if (dir === 'left') brkHeld.left = true;
          if (dir === 'right') brkHeld.right = true;
          brkPointerX = null;
        } else {
          pressDir(dir);
        }
      });
      var release = function () {
        btn.classList.remove('held');
        if (dir === 'left') brkHeld.left = false;
        if (dir === 'right') brkHeld.right = false;
      };
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('pointerleave', release);
    })(dbtns[di]);
  }
  $('btnA').addEventListener('pointerdown', function (e) { e.preventDefault(); pressA(); });
  $('btnB').addEventListener('pointerdown', function (e) { e.preventDefault(); pressB(); });

  // menu carts are tappable too
  $('menu').addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== this && !el.getAttribute('data-idx')) el = el.parentElement;
    if (el && el !== this) {
      menuSel = parseInt(el.getAttribute('data-idx'), 10) || 0;
      renderMenu();
      pressA();
    }
  });

  // swipes on the screen steer serpent & fuse; drags steer the breaker
  // paddle; in a versus match each half of the screen is one player's paddle
  // drag anywhere: your quad paddle follows the finger along your wall's axis
  function quadTouch(e) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var g = quadGeom();
    qTouch = quadAxis(qSeat) === 'x'
      ? E.clampQuadPos(((e.clientX - rect.left) / rect.width * CW - g.ox) / g.S)
      : E.clampQuadPos(((e.clientY - rect.top) / rect.height * CH - g.oy) / g.S);
  }
  function pongTouch(e) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var g = pongGeom();
    var yUnit = E.clampPaddle(((e.clientY - rect.top) / rect.height * CH - g.oy) / g.S);
    if (isNetPlay()) {
      if (myPaddle() === 1) vsTouch.p1 = yUnit; else vsTouch.p2 = yUnit;
    } else if ((e.clientX - rect.left) / rect.width < 0.5) {
      vsTouch.p1 = yUnit;
    } else {
      vsTouch.p2 = yUnit;
    }
  }
  var swipe = null;
  $('screen').addEventListener('pointerdown', function (e) {
    swipe = { x: e.clientX, y: e.clientY };
    if (mode === 'play' && currentId === 'breaker') {
      var rect = canvas.getBoundingClientRect();
      if (rect.width) brkPointerX = (e.clientX - rect.left) / rect.width;
    }
    if (mode === 'play' && currentId === 'pong' && vsPhase === 'match') pongTouch(e);
    if (mode === 'play' && currentId === 'quad' && qPhase === 'match') quadTouch(e);
  });
  $('screen').addEventListener('pointermove', function (e) {
    if (mode !== 'play' || !swipe) return;
    if (currentId === 'breaker') {
      var rect = canvas.getBoundingClientRect();
      if (rect.width) brkPointerX = (e.clientX - rect.left) / rect.width;
    } else if (currentId === 'pong' && vsPhase === 'match') {
      pongTouch(e);
    } else if (currentId === 'quad' && qPhase === 'match') {
      quadTouch(e);
    }
  });
  // lift only the finger's own paddle, so two players on one screen coexist
  function endTouch(e) {
    if (currentId === 'pong' && vsPhase === 'match' && !isNetPlay() && e && e.clientX != null) {
      var rect = canvas.getBoundingClientRect();
      if (rect.width && (e.clientX - rect.left) / rect.width < 0.5) vsTouch.p1 = null;
      else vsTouch.p2 = null;
      return;
    }
    vsTouch.p1 = null; vsTouch.p2 = null;
    qTouch = null;
  }
  $('screen').addEventListener('pointercancel', endTouch);
  $('screen').addEventListener('pointerup', function (e) {
    endTouch(e);
    if (!swipe) return;
    var dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    swipe = null;
    if (mode !== 'play' || currentId === 'breaker') return;
    if (currentId === 'pong' && vsPhase === 'match') return; // drags are paddles, not swipes
    if (currentId === 'quad' && qPhase === 'match') return;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    pressDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  /* ---------------- boot ---------------- */
  showMenu();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
