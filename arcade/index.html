<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Arcade — a pocket console</title>
<meta name="description" content="A pocket game console: Serpent, Fuse 2048 and Breaker on one dark handheld with a d-pad, two buttons and a high-score table.">
<meta name="theme-color" content="#0b0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --shell: #0b0d16;
    --shell-2: #131728;
    --screen: #060810;
    --line: #232a44;
    --ink: #e8ecff;
    --dim: #8b93b8;
    --cyan: #4dd8ff;
    --violet: #8f7cf7;
    --gold: #e8b34c;
    --red: #ff5d7a;
    --green: #4de8a1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #10142a 0%, var(--shell) 60%);
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 10px calc(10px + env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #shell {
    width: min(430px, 100%);
    background: linear-gradient(180deg, var(--shell-2), #0d1020 70%);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 14px 14px 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    display: flex; flex-direction: column; gap: 12px;
  }
  /* ---------- top plate ---------- */
  #plate { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
  #brand { font-weight: 700; letter-spacing: .35em; font-size: 13px;
    background: linear-gradient(90deg, var(--cyan), var(--violet) 55%, var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #plateBtns { display: flex; align-items: center; gap: 10px; }
  #padLed { display: none; font-size: 11px; color: var(--green); text-shadow: 0 0 8px rgba(77,232,161,.5); }
  #padLed.on { display: inline; }
  #btnFS { font: inherit; font-size: 12px; line-height: 1; width: 26px; height: 22px;
    background: none; border: 1px solid var(--line); border-radius: 7px; color: var(--dim); cursor: pointer; }
  #btnFS:active { color: var(--cyan); border-color: var(--cyan); }
  #power { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 10px; letter-spacing: .15em; }
  #power .led { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
  /* ---------- the screen ---------- */
  #screen {
    position: relative;
    background: var(--screen);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 1 / 1.08;
    box-shadow: inset 0 0 40px rgba(0,0,0,.7), inset 0 0 2px rgba(77,216,255,.25);
  }
  #screen::after { /* faint scanlines + glass sheen */
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 4;
    background:
      linear-gradient(115deg, rgba(255,255,255,.05) 0%, transparent 24%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  #emu { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; z-index: 2; }
  #hud { position: absolute; top: 0; left: 0; right: 0; display: none;
    justify-content: space-between; padding: 8px 12px; font-size: 11px; letter-spacing: .08em;
    color: var(--dim); text-shadow: 0 0 6px rgba(0,0,0,.9); pointer-events: none; z-index: 2; }
  #hud b { color: var(--ink); font-weight: 700; }
  /* menu */
  #menu { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 14px; gap: 8px; z-index: 1; overflow-y: auto; }
  #menu h1 { font-size: 12px; color: var(--dim); letter-spacing: .3em; text-align: center; margin: 4px 0 6px; font-weight: 400; }
  .cart {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    background: linear-gradient(180deg, rgba(255,255,255,.03), transparent);
    cursor: pointer; transition: border-color .12s, transform .12s;
  }
  .cart.sel { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 18px rgba(77,216,255,.18); transform: translateX(2px); }
  .cart .em { font-size: 24px; width: 34px; text-align: center; filter: drop-shadow(0 0 6px rgba(77,216,255,.3)); }
  .cart .txt { flex: 1; min-width: 0; }
  .cart .nm { font-size: 14px; font-weight: 700; letter-spacing: .04em; }
  .cart .tg { font-size: 10.5px; color: var(--dim); margin-top: 2px; }
  .cart .hs { font-size: 10px; color: var(--gold); text-align: right; white-space: nowrap; }
  .cart .hs .z { color: var(--dim); }
  #menuHint { margin-top: auto; text-align: center; color: var(--dim); font-size: 10px; letter-spacing: .12em; }
  /* overlay (game over / paused / how-to) */
  #overlay { position: absolute; inset: 0; display: none; z-index: 3;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(4,6,12,.72); backdrop-filter: blur(2px); text-align: center; padding: 20px; }
  #overlay .big { font-size: 20px; font-weight: 700; letter-spacing: .12em; }
  #overlay .sub { font-size: 12px; color: var(--dim); line-height: 1.7; }
  #overlay .score { font-size: 30px; font-weight: 700; color: var(--gold); text-shadow: 0 0 18px rgba(232,179,76,.4); }
  #overlay .best { font-size: 11px; color: var(--cyan); letter-spacing: .1em; }
  /* ---------- controls ---------- */
  #controls { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 8px; padding: 2px 6px 0; }
  #dpad { position: relative; width: 128px; height: 128px; justify-self: start; }
  .dbtn {
    position: absolute; width: 44px; height: 44px; border: 1px solid var(--line);
    background: linear-gradient(180deg, #1a2038, #10142a);
    color: var(--dim); font-size: 15px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .dbtn:active, .dbtn.held { background: #23305a; color: var(--cyan); border-color: var(--cyan); }
  #d-up    { top: 0;    left: 42px; }
  #d-down  { bottom: 0; left: 42px; }
  #d-left  { top: 42px; left: 0; }
  #d-right { top: 42px; right: 0; }
  #d-mid   { top: 42px; left: 42px; width: 44px; height: 44px; border: none;
    background: radial-gradient(circle at 40% 35%, #1c2340, #0d1020); border-radius: 8px; position: absolute; }
  #ab { display: flex; gap: 14px; justify-self: end; align-items: center; padding-right: 4px; }
  .ab { width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line);
    font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  #btnB { background: radial-gradient(circle at 35% 30%, #2a2450, #171233); color: var(--violet); margin-top: 22px; }
  #btnA { background: radial-gradient(circle at 35% 30%, #103247, #0a1f30); color: var(--cyan); }
  .ab:active { filter: brightness(1.5); }
  .ab .lbl { pointer-events: none; }
  #speaker { display: flex; gap: 5px; justify-content: center; padding-top: 2px; }
  #speaker i { width: 4px; height: 14px; border-radius: 2px; background: #1a2038; }
  /* ---------- the net panel: online versus invite codes ---------- */
  #netpanel { position: absolute; inset: 0; z-index: 3; display: none; flex-direction: column; gap: 7px;
    background: rgba(4,6,12,.95); padding: 14px; overflow-y: auto; }
  #netpanel .nptitle { font-size: 13px; font-weight: 700; letter-spacing: .18em; text-align: center; margin-bottom: 2px; }
  #netpanel label { font-size: 9.5px; color: var(--dim); letter-spacing: .1em; }
  #netpanel textarea { font: inherit; font-size: 10px; width: 100%; height: 62px; resize: none;
    background: #10142a; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  #netpanel .npbtn { font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .12em;
    background: #103247; color: var(--cyan); border: 1px solid var(--cyan); border-radius: 8px;
    padding: 8px; cursor: pointer; }
  #netpanel .npbtn:active { filter: brightness(1.4); }
  #npStatus { font-size: 10.5px; color: var(--gold); min-height: 15px; line-height: 1.4; }
  /* ---------- fullscreen: real API, plus a CSS maximize fallback ---------- */
  #shell:fullscreen { width: 100vw; height: 100vh; max-width: none; border-radius: 0;
    justify-content: center; }
  #shell:fullscreen #screen, body.maxi #screen {
    height: min(calc(100vh - 250px), calc((100vw - 28px) * 1.08));
    aspect-ratio: 1 / 1.08; width: auto; max-width: 100%; align-self: center; }
  body.maxi { padding: 0; }
  body.maxi #shell { position: fixed; inset: 0; width: 100%; max-width: none; border-radius: 0;
    z-index: 50; justify-content: center; }
  /* ---------- theater: an emulator cartridge is playing ---------- */
  /* The emulator draws its own touch controls, so the shell's pads are
     dead weight — hide them, slim the plate to a strip with an eject
     button, and give the game the whole display. On a tall phone the 4:3
     video letterboxes mid-screen, pushing the virtual controls onto the
     dark bars instead of over the picture. */
  #btnEject { display: none; font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .1em;
    line-height: 1; height: 22px; padding: 0 9px; align-items: center;
    background: none; border: 1px solid var(--line); border-radius: 7px; color: var(--dim); cursor: pointer; }
  #btnEject:active { color: var(--red); border-color: var(--red); }
  body.theater { padding: 0; }
  body.theater #shell { position: fixed; inset: 0; width: 100%; max-width: none; border-radius: 0;
    z-index: 50; gap: 8px;
    padding: calc(6px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom)); }
  body.theater #controls, body.theater #speaker { display: none; }
  body.theater #screen { flex: 1; height: auto; aspect-ratio: auto; max-width: none;
    align-self: stretch; border-radius: 8px; }
  body.theater #btnEject { display: inline-flex; }
</style>
</head>
<body>
<div id="shell">
  <div id="plate">
    <div id="brand">ARCADE</div>
    <div id="plateBtns">
      <button id="btnEject" aria-label="eject cartridge">⏏ EJECT</button>
      <span id="padLed">🎮</span>
      <button id="btnFS" aria-label="fullscreen" title="fullscreen (F)">⛶</button>
      <div id="power"><span class="led"></span>POWER</div>
    </div>
  </div>

  <div id="screen">
    <div id="menu"></div>
    <canvas id="game" width="720" height="778"></canvas>
    <div id="hud">
      <span id="hudLeft"></span>
      <span id="hudRight"></span>
    </div>
    <div id="overlay"></div>
    <div id="netpanel">
      <div class="nptitle" id="npTitle"></div>
      <label id="npOutLabel">YOUR INVITE CODE — SEND IT TO YOUR FRIEND</label>
      <textarea id="npOut" readonly></textarea>
      <button class="npbtn" id="npCopy">COPY CODE</button>
      <label id="npInLabel">PASTE THEIR REPLY</label>
      <textarea id="npIn" spellcheck="false"></textarea>
      <button class="npbtn" id="npGo">CONNECT</button>
      <button class="npbtn" id="npStart" style="display:none; background:#1d4020; color:#4de8a1; border-color:#4de8a1;">▶ START GAME</button>
      <div id="npStatus"></div>
      <button class="npbtn" id="npBack">← BACK (B)</button>
    </div>
  </div>

  <div id="controls">
    <div id="dpad">
      <div id="d-mid"></div>
      <button class="dbtn" id="d-up" data-dir="up" aria-label="up">▲</button>
      <button class="dbtn" id="d-left" data-dir="left" aria-label="left">◀</button>
      <button class="dbtn" id="d-right" data-dir="right" aria-label="right">▶</button>
      <button class="dbtn" id="d-down" data-dir="down" aria-label="down">▼</button>
    </div>
    <div id="ab">
      <button class="ab" id="btnB" aria-label="B — back"><span class="lbl">B</span></button>
      <button class="ab" id="btnA" aria-label="A — select / launch"><span class="lbl">A</span></button>
    </div>
  </div>
  <div id="speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = self.ArcadeEngine;
  function $(id) { return document.getElementById(id); }

  var canvas = $('game');
  var ctx = canvas.getContext('2d');
  var CW = 720, CH = 778;

  /* ---------------- persistence: the high-score table ---------------- */
  var SCORES_KEY = 'arcade-scores-v1';
  function loadScores() {
    try { return JSON.parse(localStorage.getItem(SCORES_KEY) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function saveScores(t) {
    try { localStorage.setItem(SCORES_KEY, JSON.stringify(t)); } catch (e) {}
  }
  var scores = loadScores();

  /* ---------------- tiny bleeps (guarded; the console works silent) ---------------- */
  var audioCtx = null;
  function beep(freq, ms, gainV) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.value = gainV || 0.03;
      o.connect(g); g.connect(audioCtx.destination);
      var t = audioCtx.currentTime;
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
      o.start(t); o.stop(t + ms / 1000);
    } catch (e) {}
  }

  /* ================================================================
   * The FX layer: everything that makes the screen feel alive.
   * Pure decoration — the engine never sees any of this.
   * ================================================================ */
  var particles = [];   // {x,y,vx,vy,life,max,size,color,grav,rot,vr,shape}
  var floats = [];      // rising score popups {x,y,txt,color,life}
  var flashes = [];     // full-screen tints {color:'r,g,b', a}
  var shakeMag = 0;

  function addShake(m) { shakeMag = Math.min(16, Math.max(shakeMag, m)); }
  function addFlash(color, a) { flashes.push({ color: color, a: a }); }
  function addFloat(x, y, txt, color) { floats.push({ x: x, y: y, txt: txt, color: color, life: 1 }); }

  function burst(x, y, opts) {
    opts = opts || {};
    var n = opts.n || 12;
    for (var i = 0; i < n; i++) {
      var a = (opts.angle != null ? opts.angle : Math.random() * Math.PI * 2) +
              (Math.random() - 0.5) * (opts.spread != null ? opts.spread : Math.PI * 2);
      var sp = (opts.speed || 220) * (0.35 + Math.random() * 0.85);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opts.lift || 0),
        life: 1, max: opts.life || 0.6,
        size: (opts.size || 5) * (0.6 + Math.random() * 0.8),
        color: opts.colors ? opts.colors[i % opts.colors.length] : (opts.color || '#4dd8ff'),
        grav: opts.grav != null ? opts.grav : 500,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 14,
        shape: opts.shape || 'dot'
      });
    }
  }

  function confetti() {
    for (var i = 0; i < 90; i++) {
      particles.push({
        x: Math.random() * CW, y: -20 - Math.random() * 160,
        vx: (Math.random() - 0.5) * 120, vy: 120 + Math.random() * 220,
        life: 1, max: 2.2 + Math.random(),
        size: 6 + Math.random() * 7,
        color: ['#4dd8ff', '#8f7cf7', '#e8b34c', '#4de8a1', '#ff5d7a'][i % 5],
        grav: 60, rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 10,
        shape: 'rect'
      });
    }
  }

  function stepFX(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt / p.max;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    for (var j = floats.length - 1; j >= 0; j--) {
      floats[j].life -= dt / 0.9;
      floats[j].y -= 50 * dt;
      if (floats[j].life <= 0) floats.splice(j, 1);
    }
    for (var k = flashes.length - 1; k >= 0; k--) {
      flashes[k].a *= Math.pow(0.02, dt);
      if (flashes[k].a < 0.01) flashes.splice(k, 1);
    }
    shakeMag *= Math.pow(0.001, dt);
    if (shakeMag < 0.05) shakeMag = 0;
  }

  function drawFX() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4));
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      } else {
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.size * 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var j = 0; j < floats.length; j++) {
      var f = floats[j];
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.font = '700 30px ui-monospace, monospace';
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 14;
      ctx.fillStyle = f.color;
      ctx.fillText(f.txt, f.x, f.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
    for (var k = 0; k < flashes.length; k++) {
      ctx.fillStyle = 'rgba(' + flashes[k].color + ',' + flashes[k].a.toFixed(3) + ')';
      ctx.fillRect(-20, -20, CW + 40, CH + 40);
    }
  }

  /* ---- the starfield backdrop: three parallax depths, per-game tint ---- */
  var stars = [];
  for (var si = 0; si < 110; si++) {
    stars.push({
      x: Math.random() * CW, y: Math.random() * CH,
      z: 0.3 + Math.random() * 0.7,           // depth → size, speed, brightness
      ph: Math.random() * Math.PI * 2,
      tw: 0.6 + Math.random() * 2.4
    });
  }
  var TINTS = {
    serpent: ['#04120e', '#071a12'],
    fuse:    ['#0a0716', '#120a22'],
    breaker: ['#050a18', '#081226'],
    pong:    ['#140609', '#1e0a14'],
    menu:    ['#05070f', '#0a0e1e']
  };
  function drawBackdrop(t, key, drift) {
    var tint = TINTS[key] || TINTS.menu;
    var g = ctx.createLinearGradient(0, 0, 0, CH);
    g.addColorStop(0, tint[1]);
    g.addColorStop(1, tint[0]);
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, CW + 40, CH + 40);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var y = s.y;
      if (drift) {
        y = (s.y + t * 0.014 * s.z * drift) % CH;
        if (y < 0) y += CH;
      }
      var a = (0.12 + 0.22 * s.z) * (0.55 + 0.45 * Math.sin(t / 1000 * s.tw + s.ph));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#bcd9ff';
      ctx.beginPath();
      ctx.arc(s.x, y, s.z * 1.7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawVignette() {
    var g = ctx.createRadialGradient(CW / 2, CH / 2, CH * 0.32, CW / 2, CH / 2, CH * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, CW + 40, CH + 40);
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOut(t) { return 1 - (1 - t) * (1 - t) * (1 - t); }

  /* ---------------- console state machine ---------------- */
  var mode = 'menu';          // 'menu' | 'play' | 'over'
  var currentId = null;       // which cartridge is in
  var menuSel = 0;
  var timerId = 0;            // serpent tick timer
  var rafId = 0;              // the render loop
  var lastFrame = 0;
  var pendingOver = null;     // {title, score, sub, at} — lets death FX play out
  var newSeed = function () { return 'run-' + Date.now() + '-' + Math.floor(Math.random() * 1e6); };

  // per-game live state
  var snakeState = null, snakeWant = null, snakePrev = null, snakeTickAt = 0, snakeTickMs = 160;
  var fuseState = null, fuseAnim = null, fusePulse = null;
  var brkState = null, brkHeld = { left: false, right: false }, brkPointerX = null, brkTrail = [];
  var emuFrame = null; // the Ultra 64 cartridge: a whole other machine in-screen

  // versus (pong) state
  var vsPhase = null;         // 'pick' | 'net' | 'match'
  var vsMode = null;          // 'local' | 'host' | 'join'
  var vsSel = 0;
  var vsState = null, vsP1Y = 0.5, vsP2Y = 0.5, vsPrevScores = [0, 0];
  var vsFreezeUntil = 0, vsTrail = [], vsAwaitRestart = false;
  var vsHeld = { p1Up: false, p1Down: false, p2Up: false, p2Down: false };
  var vsTouch = { p1: null, p2: null };
  var net = { pc: null, dc: null, open: false, remoteY: 0.5, lastSend: 0 };

  // quad (4-player) state — star network: the host holds one peer per guest
  var qPhase = null;          // 'pick' | 'net' | 'wait' | 'match'
  var qMode = null;           // 'solo' | 'host' | 'join'
  var qSel = 0, qSeat = 0;
  var qState = null, qMyPos = 0.5, qTrail = [], qPrevLives = null, qPrevServes = 0;
  var qFreezeUntil = 0, qAwaitRestart = false, qLastSend = 0;
  var qHeld = { neg: false, pos: false };
  var qTouch = null;
  var qnet = { peers: [], pending: null, hostPc: null, hostDc: null, open: false };
  var QUAD_COLORS = ['#4dd8ff', '#8f7cf7', '#e8b34c', '#4de8a1']; // bottom, top, left, right
  var QUAD_NAMES = ['P1 · BOTTOM', 'P2 · TOP', 'P3 · LEFT', 'P4 · RIGHT'];

  function isExternal(id) {
    var g = E.gameById(id);
    return !!(g && g.external);
  }
  // Slot the real N64 emulator (ultra/play.html — self-hosted mupen64plus)
  // into the console's screen. The shell's B button ejects it.
  function bootUltra(g) {
    document.body.classList.add('theater');
    emuFrame = document.createElement('iframe');
    emuFrame.id = 'emu';
    // a `machine` cart boots the from-scratch CPU page (SH-4 Dreamcast);
    // a `core` cart boots the real-ROM core player
    emuFrame.src = g.machine
      ? '../ultra/index.html?embed=1&machine=' + g.machine
      : '../ultra/play.html?embed=1' + (g.core ? '&core=' + g.core : '');
    emuFrame.setAttribute('allow', 'fullscreen; gamepad; autoplay');
    emuFrame.setAttribute('title', 'Ultra 64 — N64 emulator');
    $('screen').appendChild(emuFrame);
    try { emuFrame.focus(); } catch (e) {}
  }
  function ejectUltra() {
    document.body.classList.remove('theater');
    if (emuFrame && emuFrame.parentNode) emuFrame.parentNode.removeChild(emuFrame);
    emuFrame = null;
  }

  /* ---------------- fullscreen: the whole handheld, edge to edge ---------------- */
  function toggleFullscreen() {
    var shell = $('shell');
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      return;
    }
    if (document.body.classList && document.body.classList.contains('maxi')) {
      document.body.classList.remove('maxi');
      return;
    }
    if (shell.requestFullscreen) {
      var p = shell.requestFullscreen();
      if (p && p.catch) p.catch(function () { document.body.classList.add('maxi'); });
    } else if (shell.webkitRequestFullscreen) {
      shell.webkitRequestFullscreen();
    } else {
      // iOS Safari has no element fullscreen — maximize with CSS instead
      document.body.classList.add('maxi');
    }
  }
  $('btnFS').addEventListener('click', toggleFullscreen);
  $('btnEject').addEventListener('click', function () { pressB(); });

  /* ---------------- gamepads: Bluetooth/USB controllers land here ---------------- */
  // Paired controllers surface through the Gamepad API. Pad 0 drives the
  // menu and every single-player game; in Versus, pad 0 is P1 and pad 1 is
  // P2. The emulator cartridges read pads natively inside their frame.
  var padEdges = {}, padsOn = 0;
  function listPads() {
    var out = [];
    try {
      var pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (var i = 0; i < pads.length; i++) {
        if (pads[i] && pads[i].connected) out.push(pads[i]);
      }
    } catch (e) {}
    return out;
  }
  function padButton(gp, i) {
    var b = gp.buttons && gp.buttons[i];
    return !!(b && (b.pressed || b.value > 0.5));
  }
  function padAxis(gp, i) {
    var v = gp.axes && gp.axes[i];
    return typeof v === 'number' ? v : 0;
  }
  function padDigital(gp) {
    return {
      up: padButton(gp, 12) || padAxis(gp, 1) < -0.5,
      down: padButton(gp, 13) || padAxis(gp, 1) > 0.5,
      left: padButton(gp, 14) || padAxis(gp, 0) < -0.5,
      right: padButton(gp, 15) || padAxis(gp, 0) > 0.5,
      a: padButton(gp, 0) || padButton(gp, 9),   // South button or Start
      b: padButton(gp, 1)
    };
  }
  // -1..1 vertical intent from stick or d-pad, for paddle games
  function padVertical(gp) {
    var v = padAxis(gp, 1);
    if (Math.abs(v) > 0.15) return Math.max(-1, Math.min(1, v));
    if (padButton(gp, 12)) return -1;
    if (padButton(gp, 13)) return 1;
    return 0;
  }
  function padHorizontal(gp) {
    var v = padAxis(gp, 0);
    if (Math.abs(v) > 0.15) return Math.max(-1, Math.min(1, v));
    if (padButton(gp, 14)) return -1;
    if (padButton(gp, 15)) return 1;
    return 0;
  }
  function padEdge(key, now) {
    var was = padEdges[key];
    padEdges[key] = now;
    return now && !was;
  }
  // Edge-triggered navigation runs on its own clock so controllers work in
  // the menu too, not just while a game's render loop is alive.
  function pollPads() {
    var pads = listPads();
    if (pads.length !== padsOn) {
      padsOn = pads.length;
      $('padLed').className = padsOn ? 'on' : '';
      $('padLed').textContent = padsOn > 1 ? '🎮×' + padsOn : '🎮';
    }
    if (!pads.length) return;
    if (mode === 'play' && isExternal(currentId)) return; // the emulator owns its pads
    var d = padDigital(pads[0]);
    var analog = mode === 'play' &&
      (currentId === 'breaker' || (currentId === 'pong' && vsPhase === 'match') ||
       (currentId === 'quad' && qPhase === 'match'));
    if (!analog) {
      if (padEdge('up', d.up)) pressDir('up');
      if (padEdge('down', d.down)) pressDir('down');
      if (padEdge('left', d.left)) pressDir('left');
      if (padEdge('right', d.right)) pressDir('right');
    }
    if (padEdge('a', d.a) && vsPhase !== 'net' && qPhase !== 'net') pressA(); // A is inert on the code panel
    if (padEdge('b', d.b)) pressB();                                          // B still backs out of it
  }
  setInterval(pollPads, 50);

  /* ---------------- the menu ---------------- */
  function renderMenu() {
    var html = '<h1>INSERT CARTRIDGE</h1>';
    for (var i = 0; i < E.GAMES.length; i++) {
      var g = E.GAMES[i];
      var best = E.bestScore(scores, g.id);
      var hs = (g.external || g.versus) ? '<span style="color:#4de8a1">' + String(g.badge || '').replace(' ', '<br>') + '</span>'
             : best ? 'BEST<br>' + E.formatScore(best)
             : '<span class="z">NO<br>SCORE</span>';
      html += '<div class="cart' + (i === menuSel ? ' sel' : '') + '" data-idx="' + i + '">' +
        '<div class="em">' + g.emoji + '</div>' +
        '<div class="txt"><div class="nm">' + g.name + '</div><div class="tg">' + g.tagline + '</div></div>' +
        '<div class="hs">' + hs + '</div>' +
        '</div>';
    }
    html += '<div id="menuHint">▲▼ CHOOSE · A START</div>';
    $('menu').innerHTML = html;
    var sel = document.querySelector('#menu .cart.sel');
    if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
  }

  function showMenu() {
    stopLoops();
    ejectUltra();
    netCleanup();
    quadCleanup();
    hideNetPanel();
    vsPhase = null;
    vsMode = null;
    qPhase = null;
    qMode = null;
    stopVsInput();
    mode = 'menu';
    currentId = null;
    pendingOver = null;
    particles.length = 0; floats.length = 0; flashes.length = 0; shakeMag = 0;
    $('menu').style.display = 'flex';
    $('game').style.display = 'none';
    $('hud').style.display = 'none';
    $('overlay').style.display = 'none';
