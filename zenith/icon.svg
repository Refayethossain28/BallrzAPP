<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="night" cx="0.5" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#1a2a5c"/>
      <stop offset="1" stop-color="#070b1a"/>
    </radialGradient>
  </defs>
  <!-- deep-night tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#night)"/>
  <!-- the horizon ring: a sky dome seen flat -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#31427a" stroke-width="2"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#22305c" stroke-width="1.4"/>
  <!-- a constellation figure -->
  <polyline points="18,40 26,30 34,35 44,24" fill="none" stroke="#7fb3ff" stroke-width="1.6"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="18" cy="40" r="2.1" fill="#ffffff"/>
  <circle cx="26" cy="30" r="2.6" fill="#ffe9c4"/>
  <circle cx="34" cy="35" r="1.9" fill="#dfe8ff"/>
  <circle cx="44" cy="24" r="3" fill="#f2c76e"/>
  <!-- little companions -->
  <circle cx="24" cy="19" r="1.3" fill="#aecbff"/>
  <circle cx="45" cy="43" r="1.5" fill="#dfe8ff"/>
  <circle cx="36" cy="47" r="1.1" fill="#aecbff"/>
</svg>
