<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2c55"/>
      <stop offset="0.55" stop-color="#7a4d8e"/>
      <stop offset="1" stop-color="#ff9d6b"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fdcff"/>
      <stop offset="1" stop-color="#4dc3ff"/>
    </linearGradient>
  </defs>
  <!-- night-blue app tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0a1020"/>
  <!-- the window: a glimpse of a sky at dusk -->
  <rect x="12" y="10" width="40" height="44" rx="8" fill="url(#sky)"/>
  <!-- sun on the horizon -->
  <circle cx="32" cy="40" r="7" fill="#ffc46b"/>
  <rect x="12" y="41" width="40" height="13" rx="0" fill="#101b3a"/>
  <!-- window frame -->
  <rect x="12" y="10" width="40" height="44" rx="8" fill="none" stroke="url(#frame)" stroke-width="3.5"/>
  <line x1="32" y1="12" x2="32" y2="24" stroke="url(#frame)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
