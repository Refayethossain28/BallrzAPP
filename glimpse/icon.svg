<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#273458"/>
      <stop offset="0.55" stop-color="#7c5488"/>
      <stop offset="1" stop-color="#ef9a68"/>
    </linearGradient>
  </defs>
  <!-- warm paper tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#faf6ef"/>
  <!-- the window: a glimpse of a sky at dusk -->
  <rect x="13" y="11" width="38" height="42" rx="7" fill="url(#sky)"/>
  <!-- sun on the horizon -->
  <circle cx="32" cy="39" r="6.5" fill="#f4c06c"/>
  <rect x="13" y="40" width="38" height="13" fill="#1c2340"/>
  <!-- ink window frame -->
  <rect x="13" y="11" width="38" height="42" rx="7" fill="none" stroke="#232019" stroke-width="3"/>
  <line x1="32" y1="12.5" x2="32" y2="23" stroke="#232019" stroke-width="2.5" stroke-linecap="round"/>
</svg>
