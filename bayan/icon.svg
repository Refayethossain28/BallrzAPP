<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Bayan: a gold bāʾ bowl and its dot — the first letter of بيان and of
       the basmala — under a four-point star, on midnight indigo. -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="22%" r="95%">
      <stop offset="0" stop-color="#232c52"/>
      <stop offset="1" stop-color="#0b0e1c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c476"/>
      <stop offset="1" stop-color="#c98f2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <path d="M 401 185 L 401 249 A 160 160 0 0 1 111 249"
        fill="none" stroke="url(#gold)" stroke-width="34" stroke-linecap="round"/>
  <circle cx="256" cy="400" r="23" fill="url(#gold)"/>
  <path d="M 160 118 l 10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z"
        fill="#e8c476" opacity="0.9"/>
</svg>
