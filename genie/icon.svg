<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ink" cx="50%" cy="22%" r="95%">
      <stop offset="0" stop-color="#1b1638"/>
      <stop offset="1" stop-color="#0d0b1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2b544" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#f2b544" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f2b544" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d88a"/>
      <stop offset="1" stop-color="#c48a2a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#ink)"/>
  <!-- the soft glow the lamp throws on the dark -->
  <circle cx="250" cy="320" r="220" fill="url(#glow)"/>
  <!-- a curl of smoke: something is about to be granted -->
  <path d="M 64 238 C 50 214, 58 190, 84 172 C 108 156, 104 128, 84 112 C 72 100, 84 84, 104 80" fill="none" stroke="#f6df9a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- the spout -->
  <path d="M 160 296 L 66 244 L 60 270 L 150 340 Z" fill="url(#lamp)"/>
  <!-- the handle ring -->
  <circle cx="372" cy="318" r="44" fill="none" stroke="url(#lamp)" stroke-width="20"/>
  <!-- the body -->
  <ellipse cx="250" cy="330" rx="120" ry="62" fill="url(#lamp)"/>
  <!-- the foot -->
  <rect x="190" y="388" width="120" height="24" rx="10" fill="url(#lamp)"/>
  <!-- the lid and its knob -->
  <ellipse cx="250" cy="268" rx="46" ry="16" fill="url(#lamp)"/>
  <circle cx="250" cy="248" r="11" fill="#f6df9a"/>
  <!-- the shine -->
  <ellipse cx="212" cy="306" rx="38" ry="12" fill="#fbe7ad" opacity="0.5"/>
</svg>
