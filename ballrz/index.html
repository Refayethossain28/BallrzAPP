<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a120d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ballrz — football, all of it</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#0a120d; --bg2:#0d1811; --card:#101c14; --card2:#152418;
    --line:rgba(126,240,170,0.10); --line2:rgba(126,240,170,0.20);
    --ink:#eaf2ec; --ink2:#9db3a4; --ink3:#6d8374;
    --pitch:#2fae5f; --pitch2:#7ef0aa; --gold:#ffd479; --rose:#ff9d9d; --sky:#7ec8f0;
    --club:#2fae5f; --club2:#186338;
    --shadow:0 10px 30px rgba(0,0,0,0.45);
    --r:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.45; overscroll-behavior-y:contain}
  body{min-height:100vh}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0}
  input,select{font:inherit; color:var(--ink); background:var(--bg2);
    border:1px solid var(--line2); border-radius:12px; padding:10px 12px; outline:none}
  input:focus{border-color:var(--pitch)}
  ::selection{background:rgba(47,174,95,0.35)}

  #app{max-width:560px; margin:0 auto; padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  header.top{position:sticky; top:0; z-index:30; backdrop-filter:blur(14px);
    background:rgba(10,18,13,0.85); border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px}
  .crest{width:30px; height:30px; border-radius:9px; flex:none;
    background:linear-gradient(135deg,var(--club),var(--club2));
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,0.4)}
  .crest.sm{width:22px; height:22px; border-radius:7px; font-size:9px}
  .logo{font-weight:800; font-size:17px; letter-spacing:0.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .logo small{display:block; font-size:11px; color:var(--ink2); font-weight:600}
  .top .spacer{flex:1}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink2);
    border:1px solid var(--line2); border-radius:999px; padding:5px 10px; background:var(--bg2); white-space:nowrap}
  .chip b{color:var(--gold)}

  nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:rgba(10,18,13,0.93); backdrop-filter:blur(14px); border-top:1px solid var(--line);
    padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
  nav.tabs .row{max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-around}
  .tabbtn{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px;
    color:var(--ink3); padding:6px 10px; border-radius:12px}
  .tabbtn .ic{font-size:21px; line-height:1}
  .tabbtn.on{color:var(--pitch2)}
  .fab{width:56px; height:56px; border-radius:19px; background:linear-gradient(135deg,var(--pitch2),var(--pitch));
    color:#08130c; font-size:24px; font-weight:900; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 22px rgba(47,174,95,0.4); margin-top:-20px}
  .fab:active{transform:scale(0.94)}
  .fab.done{background:linear-gradient(135deg,var(--gold),#e0a23f); box-shadow:0 8px 22px rgba(224,162,63,0.4)}

  main{padding:14px 14px 30px}
  .view{display:none}
  .view.on{display:block; animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px; margin-bottom:12px}
  .card h3{margin:0 0 10px; font-size:14px; color:var(--ink2); font-weight:700;
    text-transform:uppercase; letter-spacing:0.6px}
  .muted{color:var(--ink2)} .dim{color:var(--ink3)} .small{font-size:12.5px}
  .gold{color:var(--gold)} .green{color:var(--pitch2)} .red{color:var(--rose)}
  .row{display:flex; align-items:center; gap:10px}
  .grow{flex:1; min-width:0}
  .right{text-align:right}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg,var(--pitch2),var(--pitch)); color:#08130c;
    font-weight:800; border-radius:14px; padding:12px 18px; font-size:15px}
  .btn:active{transform:scale(0.97)}
  .btn.wide{width:100%}
  .btn.ghost{background:var(--bg2); color:var(--ink); border:1px solid var(--line2); font-weight:700}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#e0a23f)}
  .btn.danger{background:linear-gradient(135deg,#ff9d9d,#d94f4f); color:#1c0808}
  .btn[disabled]{opacity:0.4; pointer-events:none}
  .btn.tiny{padding:7px 12px; font-size:13px; border-radius:10px}

  .seg{display:flex; background:var(--bg2); border:1px solid var(--line2); border-radius:12px; padding:3px; gap:3px}
  .seg button{flex:1; padding:8px 4px; border-radius:9px; font-size:13px; color:var(--ink2); font-weight:700}
  .seg button.on{background:var(--card2); color:var(--pitch2); box-shadow:0 2px 8px rgba(0,0,0,0.3)}

  /* fixture hero */
  .versus{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0}
  .versus .team{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0}
  .versus .team .nm{font-weight:800; font-size:13.5px; text-align:center}
  .versus .vs{font-size:22px; font-weight:900; color:var(--ink3)}
  .versus .crest{width:46px; height:46px; border-radius:14px; font-size:15px}
  .formdots{display:flex; gap:3px}
  .fdot{width:16px; height:16px; border-radius:5px; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center; color:#08130c}
  .fdot.W{background:var(--pitch2)} .fdot.D{background:var(--ink3)} .fdot.L{background:var(--rose)}

  /* table */
  table.lg{width:100%; border-collapse:collapse; font-size:13.5px}
  table.lg th{color:var(--ink3); font-size:11px; text-transform:uppercase; letter-spacing:0.5px;
    text-align:right; padding:4px 5px; font-weight:700}
  table.lg th.l{text-align:left}
  table.lg td{padding:7px 5px; text-align:right; border-top:1px solid var(--line)}
  table.lg td.l{text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px}
  table.lg tr.me td{background:rgba(47,174,95,0.10)}
  table.lg tr.me td:first-child{border-radius:8px 0 0 8px}
  table.lg tr.me td:last-child{border-radius:0 8px 8px 0}
  .posnum{display:inline-block; min-width:20px; color:var(--ink3); font-weight:700}
  tr.zone-t td:first-child .posnum{color:var(--gold)}

  /* players */
  .plrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line)}
  .plrow:first-of-type{border-top:none}
  .posbadge{flex:none; width:34px; height:26px; border-radius:8px; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; background:var(--bg2); border:1px solid var(--line2)}
  .posbadge.GK{color:var(--gold)} .posbadge.DF{color:var(--sky)}
  .posbadge.MF{color:var(--pitch2)} .posbadge.FW{color:var(--rose)}
  .ovr{flex:none; width:34px; height:34px; border-radius:10px; font-weight:900; font-size:14px;
    display:flex; align-items:center; justify-content:center; background:var(--card2); border:1px solid var(--line2)}
  .ovr.hi{color:var(--gold); border-color:rgba(255,212,121,0.4)}
  .plname{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .plmeta{font-size:11.5px; color:var(--ink3)}
  .tag{display:inline-block; font-size:10px; font-weight:800; padding:1px 6px; border-radius:6px; margin-left:5px}
  .tag.inj{background:rgba(255,157,157,0.15); color:var(--rose)}
  .tag.ban{background:rgba(255,212,121,0.15); color:var(--gold)}

  .bars .bar{margin-bottom:8px}
  .bars .bar .lab{display:flex; justify-content:space-between; font-size:12px; color:var(--ink2); margin-bottom:3px}
  .track{height:7px; background:var(--bg2); border-radius:4px; overflow:hidden}
  .track i{display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--pitch),var(--pitch2))}

  /* match overlay */
  .overlay{position:fixed; inset:0; z-index:60; background:rgba(6,10,8,0.96); backdrop-filter:blur(8px);
    display:none; overflow-y:auto}
  .overlay.on{display:block; animation:fadein .2s ease}
  .overlay .inner{max-width:560px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px 40px}
  .scoreboard{display:flex; align-items:center; justify-content:space-between; gap:6px;
    background:var(--card); border:1px solid var(--line2); border-radius:20px; padding:16px 14px;
    position:sticky; top:8px; z-index:5; box-shadow:var(--shadow)}
  .scoreboard .team{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0}
  .scoreboard .nm{font-size:12px; font-weight:800; text-align:center}
  .bigscore{font-size:34px; font-weight:900; letter-spacing:1px; min-width:90px; text-align:center}
  .minute{font-size:12px; color:var(--pitch2); font-weight:800; text-align:center; margin-top:2px}
  .ticker{margin-top:14px}
  #reportBox{scroll-margin-top:130px}
  .tick{display:flex; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); animation:fadein .25s ease}
  .tick .min{flex:none; width:34px; font-weight:800; color:var(--ink3); font-size:13px}
  .tick.goal{background:rgba(47,174,95,0.10); border-radius:10px}
  .tick.goal .min{color:var(--pitch2)}
  .tick.red{background:rgba(255,157,157,0.08); border-radius:10px}
  .tick .txt{font-size:13.5px}
  .statbar{display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:7px}
  .statbar .v{width:36px; font-weight:800} .statbar .v.a{text-align:right}
  .statbar .mid{flex:1; display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--bg2)}
  .statbar .mid i{display:block; height:100%}
  .statbar .lab2{width:70px; text-align:center; color:var(--ink3); font-size:11px}

  /* onboarding */
  .clubgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .clubcard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px;
    display:flex; align-items:center; gap:10px; text-align:left}
  .clubcard:active{transform:scale(0.97)}
  .clubcard .nm{font-weight:800; font-size:13px; line-height:1.25}
  .clubcard .tier{font-size:11px; color:var(--ink3)}
  .hero{padding:26px 6px 18px; text-align:center}
  .hero h1{margin:0; font-size:34px; font-weight:900; letter-spacing:0.5px}
  .hero h1 span{color:var(--pitch2)}
  .hero p{color:var(--ink2); font-size:14px; margin:8px auto 0; max-width:420px}

  /* modal */
  .modal{position:fixed; inset:0; z-index:70; display:none; align-items:flex-end; justify-content:center;
    background:rgba(4,8,6,0.7)}
  .modal.on{display:flex}
  .sheet{background:var(--card); border:1px solid var(--line2); border-radius:22px 22px 0 0;
    width:100%; max-width:560px; max-height:86vh; overflow-y:auto; padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    animation:slideup .22s ease}
  @keyframes slideup{from{transform:translateY(40px); opacity:0.5} to{transform:none; opacity:1}}
  .sheet h2{margin:0 0 4px; font-size:20px}
  .grabber{width:44px; height:5px; border-radius:3px; background:var(--line2); margin:0 auto 14px}

  .pens{display:flex; gap:5px; flex-wrap:wrap}
  .pen{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px}
  .pen.s{background:rgba(47,174,95,0.25)} .pen.m{background:rgba(255,157,157,0.25)}
  .newsitem{padding:9px 0; border-top:1px solid var(--line); font-size:13.5px}
  .newsitem:first-of-type{border-top:none}
  .newsitem .when{font-size:11px; color:var(--ink3)}
  .trophy{display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:14px}
  .empty{text-align:center; color:var(--ink3); padding:26px 10px; font-size:13.5px}
  .kv{display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--line); font-size:13.5px}
  .kv:first-of-type{border-top:none}
  .subtabs{display:flex; gap:6px; margin-bottom:12px; overflow-x:auto}
  .subtabs button{flex:none; font-size:13px; font-weight:700; color:var(--ink2); padding:7px 13px;
    border-radius:999px; background:var(--bg2); border:1px solid var(--line2)}
  .subtabs button.on{color:#08130c; background:var(--pitch2); border-color:var(--pitch2)}

  /* ---------- the Live desk ---------- */
  .livegame{padding:10px 0; border-top:1px solid var(--line)}
  .livegame:first-of-type{border-top:none}
  .livegame .score-line{display:flex; align-items:center; gap:8px}
  .livegame .tm{flex:1; display:flex; align-items:center; gap:8px; min-width:0; font-weight:700; font-size:13.5px}
  .livegame .tm.a{justify-content:flex-end; text-align:right}
  .livegame .tm img{width:22px; height:22px; object-fit:contain; flex:none}
  .livegame .tm span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .livegame .sc{flex:none; min-width:64px; text-align:center; font-weight:900; font-size:16px}
  .livegame .sc small{display:block; font-size:10.5px; font-weight:700; color:var(--ink3)}
  .livegame .sc small.inplay{color:var(--pitch2)}
  .livegame .scorerline{font-size:11px; color:var(--ink3); margin-top:4px; text-align:center}
  .livebadge{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--pitch2);
    animation:pulse 1.4s infinite; margin-right:4px; vertical-align:1px}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.3}}
  .newscard{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); align-items:flex-start}
  .newscard:first-of-type{border-top:none}
  .newscard img{width:74px; height:52px; object-fit:cover; border-radius:10px; flex:none; background:var(--bg2)}
  .newscard a{color:var(--ink); text-decoration:none; font-weight:700; font-size:13.5px; line-height:1.3}
  .newscard .d{font-size:12px; color:var(--ink2); margin-top:2px}
  .stale{font-size:11.5px; color:var(--gold); text-align:center; padding:6px 0 0}
  .loading{text-align:center; color:var(--ink3); padding:26px 0; font-size:13px}
  .loading .livebadge{background:var(--ink3)}
  table.lg img.tl{width:18px; height:18px; object-fit:contain; vertical-align:-4px; margin-right:6px}

  /* ---------- career card ---------- */
  #careerCanvas{width:100%; border-radius:16px; border:1px solid var(--line2)}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="topbar" style="display:none">
    <div class="crest" id="topCrest"></div>
    <div class="logo grow" id="topName"></div>
    <span class="chip" id="topBudget"></span>
    <span class="chip" id="topSeason"></span>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" id="tabs" style="display:none">
  <div class="row">
    <button class="tabbtn on" data-tab="home"><span class="ic">🏟️</span>Home</button>
    <button class="tabbtn" data-tab="squad"><span class="ic">👥</span>Squad</button>
    <button class="fab" id="playBtn">▶</button>
    <button class="tabbtn" data-tab="league"><span class="ic">🏆</span>League</button>
    <button class="tabbtn" data-tab="live"><span class="ic">📡</span>Live</button>
    <button class="tabbtn" data-tab="more"><span class="ic">💰</span>Club</button>
  </div>
</nav>

<div class="overlay" id="matchOverlay"><div class="inner" id="matchInner"></div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="engine.js"></script>
<script>
'use strict';
/* Ballrz UI — a renderer over the pure engine. Every rule lives in
 * engine.js; this file only draws state and forwards button presses. */
var E = Ballrz;
var esc = E.escapeHTML, money = E.fmtMoney;
var SAVE_KEY = 'ballrz.save.v2';   // bumped: v1 careers predate contracts & two-leg semis
var S = null;              // the whole career state (engine-shaped)
var ui = { tab: 'home', leagueTab: 'table', resultsRound: null, squadSort: 'pos', mktPos: 'ALL' };

function $(id) { return document.getElementById(id); }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) { var s = JSON.parse(raw); if (s && s.v === 1) return s; }
  } catch (e) {}
  return null;
}

function myClub() { return S.league.clubs.find(function (c) { return c.id === S.myClubId; }); }
function clubById(id) { return S.league.clubs.find(function (c) { return c.id === id; }); }
function P(id) { return S.league.players[id]; }
function crest(c, cls) {
  return '<div class="crest ' + (cls || '') + '" style="background:linear-gradient(135deg,' +
    esc(c.color) + ',' + esc(c.color2) + ')">' + esc(c.short) + '</div>';
}
function stars(tier) { return '★★★★'.slice(0, 5 - tier); }
function leagueResults() { return S.results.filter(function (r) { return r.comp === 'league'; }); }
function table() { return E.leagueTable(S.league.clubs, leagueResults()); }
function myPos() {
  var t = table();
  for (var i = 0; i < t.length; i++) if (t[i].id === S.myClubId) return i + 1;
  return 0;
}
function statusTags(p) {
  var out = '';
  if (S.injuries[p.id] > 0) out += '<span class="tag inj">🚑 ' + S.injuries[p.id] + '</span>';
  if (S.suspensions[p.id] > 0) out += '<span class="tag ban">⛔ ' + S.suspensions[p.id] + '</span>';
  return out;
}
function formDots(form) {
  return '<div class="formdots">' + (form || []).map(function (f) {
    return '<span class="fdot ' + f + '">' + f + '</span>';
  }).join('') + '</div>';
}

/* ---------------- top bar & tabs ---------------- */

function renderChrome() {
  var me = myClub();
  document.documentElement.style.setProperty('--club', me.color);
  document.documentElement.style.setProperty('--club2', me.color2);
  $('topbar').style.display = 'flex';
  $('tabs').style.display = 'block';
  $('topCrest').textContent = me.short;
  $('topCrest').style.background = 'linear-gradient(135deg,' + me.color + ',' + me.color2 + ')';
  $('topName').innerHTML = esc(me.name) + '<small>' + esc(ordinal(myPos())) + ' · morale ' + me.morale + '</small>';
  $('topBudget').innerHTML = '<b>' + money(me.budget) + '</b>';
  $('topSeason').textContent = 'S' + S.season + ' · MD ' + Math.min(S.pointer + 1, S.calendar.length);
  var play = $('playBtn');
  if (S.seasonOver) { play.textContent = '🏅'; play.className = 'fab done'; }
  else { play.textContent = '▶'; play.className = 'fab'; }
}
function ordinal(n) {
  if (!n) return '—';
  var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function setTab(tab) {
  ui.tab = tab;
  var btns = document.querySelectorAll('.tabbtn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].dataset.tab === tab);
  render();
}

/* ---------------- views ---------------- */

function render() {
  if (!S) {
    if (ui.guestLive) { renderGuestLive(); } else { renderOnboarding(); }
    return;
  }
  renderChrome();
  var v = ui.tab;
  $('main').innerHTML =
    v === 'home' ? viewHome() :
    v === 'squad' ? viewSquad() :
    v === 'league' ? viewLeague() :
    v === 'live' ? viewLive() :
    viewMore();
  if (v === 'live') loadLive();
}

/* ---------------- the Live desk: real-world scores, tables, news ----------------
 * Data comes from ESPN's public keyless JSON API, fetched by the browser and
 * cached in localStorage so the last-seen numbers still show offline (with an
 * honest "updated X ago" stamp). All parsing is pure engine code.
 */

var liveUI = { league: 'eng.1', tab: 'scores', dayOffset: 0, seq: 0 };
var LIVE_TTL = { scores: 60e3, table: 10 * 60e3, news: 10 * 60e3 };

function liveDateParam() {
  if (!liveUI.dayOffset) return null;
  var d = new Date(Date.now() + liveUI.dayOffset * 864e5);
  var mm = String(d.getMonth() + 1); if (mm.length < 2) mm = '0' + mm;
  var dd = String(d.getDate()); if (dd.length < 2) dd = '0' + dd;
  return '' + d.getFullYear() + mm + dd;
}

function liveGet(url, ttl, cb) {
  var key = 'ballrz.live.' + url;
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
  if (cached && Date.now() - cached.ts < ttl) { cb(null, cached.data, cached.ts, false); return; }
  fetch(url)
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data: data })); } catch (e) {}
      cb(null, data, Date.now(), false);
    })
    .catch(function (err) {
      if (cached) cb(null, cached.data, cached.ts, true);
      else cb(err);
    });
}

function loadLive(force) {
  var seq = ++liveUI.seq;
  var tab = liveUI.tab, lg = liveUI.league;
  var url = tab === 'scores' ? E.liveScoreboardUrl(lg, liveDateParam())
    : tab === 'table' ? E.liveStandingsUrl(lg) : E.liveNewsUrl(lg);
  if (force) { try { localStorage.removeItem('ballrz.live.' + url); } catch (e) {} }
  liveGet(url, LIVE_TTL[tab], function (err, data, ts, stale) {
    if (seq !== liveUI.seq) return;   // user moved on
    var box = $('liveBox');
    if (!box) return;
    if (err) {
      box.innerHTML = '<div class="empty">Couldn\'t reach the live feed — check your connection.' +
        '<div style="height:10px"></div><button class="btn ghost tiny" data-liverefresh="1">Try again</button></div>';
      return;
    }
    var html = tab === 'scores' ? renderScores(E.parseScoreboard(data))
      : tab === 'table' ? renderLiveTable(E.parseStandings(data))
      : renderLiveNews(E.parseNews(data));
    if (stale) {
      html += '<div class="stale">⚠ offline — showing data from ' +
        esc(E.agoLabel(new Date(ts).toISOString(), Date.now())) + '</div>';
    }
    box.innerHTML = html;
  });
}

function nextEntry() { return S.calendar[S.pointer] || null; }
function nextFixture() {
  var e = nextEntry();
  if (!e) return null;
  if (e.type === 'league') {
    var games = S.fixtures[e.round];
    for (var i = 0; i < games.length; i++) {
      if (games[i].home === S.myClubId || games[i].away === S.myClubId) {
        return { comp: 'League · MD ' + (e.round + 1), home: games[i].home, away: games[i].away };
      }
    }
  } else {
    if (S.cup.myOut) return { comp: E.CUP_ROUNDS[S.cup.round] + ' (cup day — you\'re out)', home: null, away: null };
    if (S.cup.round === 0) {
      for (var j = 0; j < S.cup.draw.prelim.length; j++) {
        var t = S.cup.draw.prelim[j];
        if (t.home === S.myClubId || t.away === S.myClubId) {
          return { comp: 'Cup · ' + E.CUP_ROUNDS[0], home: t.home, away: t.away };
        }
      }
      return { comp: 'Cup · ' + E.CUP_ROUNDS[0] + ' (you have a bye)', home: null, away: null };
    }
    var pairs = S.cup.round === 4 && S.cup.sf
      ? S.cup.sf.pairs.map(function (t) { return { home: t.away, away: t.home }; })
      : E.cupPairs(S.seed + ':s' + S.season, E.CUP_ROUNDS[S.cup.round], S.cup.alive);
    for (var k = 0; k < pairs.length; k++) {
      if (pairs[k].home === S.myClubId || pairs[k].away === S.myClubId) {
        return { comp: 'Cup · ' + E.CUP_ROUNDS[S.cup.round], home: pairs[k].home, away: pairs[k].away };
      }
    }
    return { comp: 'Cup · ' + E.CUP_ROUNDS[S.cup.round] + ' (not your day)', home: null, away: null };
  }
  return null;
}

        ' · you finished <b>' + ordinal(h.myPos) + '</b>';

function negotiateSheet(pid) {

    '<input type="number" id="offerInput" class="grow" value="' + price + '" step="25000" min="25000">' +
    '<button class="btn" data-offer="' + pid + '">Bid</button></div>' +
    '<div id="offerMsg" class="small" style="margin-top:10px"></div>' +
    '<div style="height:8px"></div><button class="btn ghost wide" data-act="closeModal">Walk away</button>';
  openSheet(html);
}

function handleOffer(pid) {
  var p = P(pid), me = myClub();
  var input = $('offerInput');
  var offer = Math.round(Number(input && input.value || 0));
  var msg = $('offerMsg');
  if (!offer || offer <= 0) { msg.innerHTML = '<span class="red">Put a number on the table.</span>'; return; }
  if (offer > me.budget) { msg.innerHTML = '<span class="red">You don\'t have ' + money(offer) + '.</span>'; return; }
  var res = E.offerResult(S.seed, p, offer);
  if (res.verdict === 'accepted') {
    try {
      S = E.buyPlayer(S, pid, offer);
      save(); closeModal(); render();
    } catch (e) { msg.innerHTML = '<span class="red">' + esc(e.message) + '</span>'; }
  } else if (res.verdict === 'countered') {
    msg.innerHTML = '<span class="gold">They counter at <b>' + money(res.counter) + '</b>.</span> ' +
      '<button class="btn tiny" data-counter="' + pid + '" data-price="' + res.counter + '">Accept counter</button>';
  } else {
    msg.innerHTML = '<span class="red">Laughed out of the room. They want ' + money(res.ask) + '.</span>';
  }
}

/* ---------------- matchday: ticker & report ---------------- */

var ticker = { timer: 0, idx: 0, events: [], speed: 320 };

function playMatchday() {
  if (S.seasonOver) { ceremony(); return; }
  var before = S;
  S = E.advanceRound(before);
  save();
  var m = S.lastMatch;
  if (!m) { render(); return; }
  openMatchOverlay(m);
}

function openMatchOverlay(m) {
  var ov = $('matchOverlay');
  ov.classList.add('on');
  var h = m.homeClub, a = m.awayClub;
  var hC = clubById(h.id), aC = clubById(a.id);
  $('matchInner').innerHTML =
    '<div class="scoreboard">' +
      '<div class="team">' + crest(hC) + '<div class="nm">' + esc(h.name) + '</div></div>' +
      '<div><div class="bigscore" id="scLine">0–0</div><div class="minute" id="scMin">kick-off</div></div>' +
      '<div class="team">' + crest(aC) + '<div class="nm">' + esc(a.name) + '</div></div>' +
    '</div>' +
    '<div class="row" style="margin-top:12px; justify-content:center; gap:8px">' +
      '<button class="btn ghost tiny" data-speed="320">▶ normal</button>' +
      '<button class="btn ghost tiny" data-speed="90">⏩ fast</button>' +
      '<button class="btn ghost tiny" data-act="skipmatch">⏭ full-time</button>' +
    '</div>' +
    '<div class="ticker" id="tickerBox"></div>' +
    '<div id="reportBox"></div>';
  ticker.idx = 0; ticker.events = m.sim.events; ticker.match = m; ticker.speed = 320;
  clearTimeout(ticker.timer);
  ticker.timer = setTimeout(tick, 500);
}

function scoreAt(i) {
  var g = { H: 0, A: 0 };
  for (var k = 0; k <= i && k < ticker.events.length; k++) {
    if (ticker.events[k].type === 'goal') g[ticker.events[k].team]++;
  }
  return g.H + '–' + g.A;
}

function tick() {
  var evs = ticker.events;
  if (ticker.idx >= evs.length) { showReport(); return; }
  var e = evs[ticker.idx];
  appendTick(e);
  $('scLine').textContent = scoreAt(ticker.idx);
  $('scMin').textContent = e.type === 'ft' ? 'full-time' : e.type === 'ht' ? 'half-time' : e.min + '′';
  ticker.idx++;
  if (ticker.idx >= evs.length) { showReport(); return; }
  ticker.timer = setTimeout(tick, e.type === 'goal' ? ticker.speed * 3 : ticker.speed);
}

function appendTick(e) {
  var box = $('tickerBox');
  if (!box) return;
  var icon = { goal: '⚽', yellow: '🟨', red: '🟥', save: '🧤', post: '🫨', miss: '😮‍💨', injury: '🚑', ko: '🟢', ht: '⏸', ft: '🏁', et: '⏱' }[e.type] || '·';
  var div = document.createElement('div');
  div.className = 'tick ' + (e.type === 'goal' ? 'goal' : e.type === 'red' ? 'red' : '');
  div.innerHTML = '<span class="min">' + e.min + '′</span><span class="txt">' + icon + ' ' + esc(e.text) + '</span>';
  box.insertBefore(div, box.firstChild);
}

function skipMatch() {
  clearTimeout(ticker.timer);
  var box = $('tickerBox');
  if (box) {
    box.innerHTML = '';
    for (var i = 0; i < ticker.events.length; i++) appendTick(ticker.events[i]);
  }
  ticker.idx = ticker.events.length;
  $('scLine').textContent = scoreAt(ticker.events.length - 1);
  $('scMin').textContent = 'full-time';
  showReport();
}

function statRow(label, vH, vA, fmt) {
  var tot = (vH + vA) || 1;
  return '<div style="text-align:center; color:var(--ink3); font-size:11px; margin:2px 0 3px">' + label + '</div>' +
    '<div class="statbar"><span class="v">' + (fmt ? fmt(vH) : vH) + '</span>' +
    '<span class="mid"><i style="width:' + Math.round(vH / tot * 100) + '%; background:var(--pitch2)"></i>' +
    '<i style="width:' + Math.round(vA / tot * 100) + '%; background:var(--ink3)"></i></span>' +
    '<span class="v a">' + (fmt ? fmt(vA) : vA) + '</span></div>';
}

function showReport() {
  clearTimeout(ticker.timer);
  var m = ticker.match;
  if (!m) return;
  var box = $('reportBox');
  if (!box || box.dataset.done) return;
  box.dataset.done = '1';
  var st = m.sim.stats;
  var html = '';
  if (m.res.comp === 'cup' && m.res.round === 3) {
    html += '<div class="card" style="margin-top:14px"><h3>First leg</h3>' +
      '<p class="muted small" style="margin:0">The tie is decided over two legs — the return fixture settles it.</p></div>';
  }
  if (m.res.agg) {
    html += '<div class="card" style="margin-top:14px"><h3>Aggregate</h3>' +
      '<p style="margin:0; font-size:20px; font-weight:900">' + esc(m.res.agg) +
      (m.res.pens ? ' <span class="dim small">(pens ' + esc(m.res.pens) + ')</span>' : '') + '</p></div>';
  }
  html += '<div class="card" style="margin-top:14px"><h3>Match report</h3>' +
    statRow('possession', st.possH, st.possA, function (v) { return v + '%'; }) +
    statRow('shots', st.shotsH, st.shotsA) +
    statRow('on target', st.onTargetH, st.onTargetA) +
    statRow('expected goals', st.xgH, st.xgA) +
    statRow('fouls', st.foulsH, st.foulsA) + '</div>';

  if (m.pens) {
    html += '<div class="card"><h3>Penalty shootout — ' + m.pens.hScore + '–' + m.pens.aScore + '</h3><div class="pens">' +
      m.pens.kicks.map(function (k) {
        return '<span class="pen ' + (k.scored ? 's' : 'm') + '" title="' + esc(k.name) + '">' + (k.scored ? '⚽' : '❌') + '</span>';
      }).join('') + '</div></div>';
  }

  if (m.motm && P(m.motm)) {
    var mp = P(m.motm);
    html += '<div class="card"><h3>Player of the match</h3><div class="row">' +
      '<span class="ovr hi">' + (m.sim.ratings[m.motm] || '') + '</span>' +
      '<div class="grow"><b>' + esc(mp.name) + '</b><div class="dim small">' + esc(clubById(mp.clubId).name) + '</div></div>⭐</div></div>';
  }

  // my players' ratings
  var mineId = S.myClubId;
  var rated = Object.keys(m.sim.ratings)
    .filter(function (id) { return P(id) && P(id).clubId === mineId; })
    .sort(function (x, y) { return m.sim.ratings[y] - m.sim.ratings[x]; });
  if (rated.length) {
    html += '<div class="card"><h3>Your ratings</h3>';
    rated.forEach(function (id) {
      var r = m.sim.ratings[id];
      html += '<div class="kv"><span>' + esc(P(id).name) + '</span><b class="' +
        (r >= 7.5 ? 'green' : r < 6 ? 'red' : '') + '">' + r.toFixed(1) + '</b></div>';
    });
    html += '</div>';
  }

  // elsewhere
  var others = S.results.slice(-10).filter(function (r) {
    return r.home !== mineId && r.away !== mineId &&
      ((m.res.comp === 'league' && r.comp === 'league' && r.round === m.res.round) ||
       (m.res.comp === 'cup' && r.comp === 'cup' && r.round === m.res.round));
  });
  if (others.length) {
    html += '<div class="card"><h3>Elsewhere</h3>';
    others.forEach(function (r) {
      html += '<div class="kv"><span>' + esc(clubById(r.home).short) + '</span><b>' + r.hg + '–' + r.ag +
        (r.pens ? ' <span class="dim small">(' + r.pens + 'p)</span>' : '') + '</b><span>' + esc(clubById(r.away).short) + '</span></div>';
    });
    html += '</div>';
  }

  html += '<button class="btn wide" data-act="closeMatch">Continue →</button>';
  box.innerHTML = html;
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function careerCardSheet() {

  var grad = x.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, cs.club.color); grad.addColorStop(1, cs.club.color2);
  x.fillStyle = '#0a120d'; x.fillRect(0, 0, W, H);
  x.fillStyle = grad; x.globalAlpha = 0.28; x.fillRect(0, 0, W, H); x.globalAlpha = 1;
  // pitch rings
  x.strokeStyle = 'rgba(126,240,170,0.18)'; x.lineWidth = 3;
  x.beginPath(); x.arc(W / 2, H + 160, 330, Math.PI, 2 * Math.PI); x.stroke();
  x.beginPath(); x.arc(W / 2, H + 160, 250, Math.PI, 2 * Math.PI); x.stroke();
  // crest
  x.fillStyle = grad;
  x.beginPath();
  if (x.roundRect) x.roundRect(60, 60, 130, 130, 34); else x.rect(60, 60, 130, 130);
  x.fill();
  x.fillStyle = '#fff'; x.font = '900 44px system-ui,sans-serif'; x.textAlign = 'center';
  x.fillText(cs.club.short, 125, 143);
  // header
  x.textAlign = 'left'; x.fillStyle = '#eaf2ec';
  x.font = '900 54px system-ui,sans-serif';
  x.fillText(cs.club.name, 220, 122);
  x.font = '600 26px system-ui,sans-serif'; x.fillStyle = '#9db3a4';
  x.fillText('Manager career · Season ' + cs.seasons, 220, 165);
  // record row
  var stats = [[cs.record.w, 'WINS'], [cs.record.d, 'DRAWS'], [cs.record.l, 'LOSSES'], [cs.winPct + '%', 'WIN RATE']];
  stats.forEach(function (s, i) {
    var sx = 80 + i * 230;
    x.fillStyle = '#eaf2ec'; x.font = '900 64px system-ui,sans-serif';
    x.fillText(String(s[0]), sx, 305);
    x.fillStyle = '#6d8374'; x.font = '700 22px system-ui,sans-serif';
    x.fillText(s[1], sx, 340);
  });
  // trophies + legend
  x.fillStyle = '#ffd479'; x.font = '700 30px system-ui,sans-serif';
  x.fillText('🏆 ' + (cs.trophies.length ? cs.trophies.map(function (t) {
    return t.name + ' (S' + t.season + ')';
  }).join(' · ') : 'The cabinet awaits…'), 80, 420);
  x.fillStyle = '#9db3a4'; x.font = '600 26px system-ui,sans-serif';
  if (cs.legend) x.fillText('Club legend: ' + cs.legend.name + ' — ' + cs.legend.goals + ' goals in ' + cs.legend.apps + ' apps', 80, 470);
  if (cs.bestFinish) x.fillText('Best league finish: ' + ordinal(cs.bestFinish), 80, 510);
  x.fillText('Goals: ' + cs.record.gf + ' for · ' + cs.record.ga + ' against', 80, cs.bestFinish ? 550 : 510);
  // footer
  x.fillStyle = '#7ef0aa'; x.font = '900 30px system-ui,sans-serif';
  x.textAlign = 'right'; x.fillText('⚽ BALLRZ', W - 60, H - 45);
}

/* ---------------- events (one delegated listener) ---------------- */

document.addEventListener('click', function (ev) {
  var t = ev.target && ev.target.closest ? ev.target.closest('[data-tab],[data-act],[data-form],[data-ment],[data-player],[data-sell],[data-lgtab],[data-moretab],[data-sqsort],[data-mktpos],[data-negotiate],[data-offer],[data-counter],[data-choose],[data-speed],[data-rnav],[data-livelg],[data-livetab],[data-ldate],[data-liverefresh],[data-renew],[data-release],[data-careercard],[data-savecard]') : null;
  if (!t) return;
  var d = t.dataset;
  if (d.tab) return setTab(d.tab);
  if (d.form) { S.tactics.formation = d.form; save(); render(); return; }
  if (d.ment) { S.tactics.mentality = d.ment; save(); render(); return; }
  if (d.player) return playerSheet(d.player);
  if (d.lgtab) { ui.leagueTab = d.lgtab; render(); return; }
  if (d.moretab) { ui.moreTab = d.moretab; render(); return; }
  if (d.sqsort) { ui.squadSort = d.sqsort; render(); return; }
  if (d.mktpos) { ui.mktPos = d.mktpos; render(); return; }
  if (d.negotiate) return negotiateSheet(d.negotiate);
  if (d.offer) return handleOffer(d.offer);
  if (d.counter) {
    try { S = E.buyPlayer(S, d.counter, Number(d.price)); save(); closeModal(); render(); }
    catch (e) { var m = $('offerMsg'); if (m) m.innerHTML = '<span class="red">' + esc(e.message) + '</span>'; }
    return;
  }
  if (d.sell) {
    try { S = E.sellPlayer(S, d.sell); save(); closeModal(); render(); }
    catch (e) { alert(e.message); }
    return;
  }
  if (d.choose) {
    S = E.newGame(onboardSeed, d.choose);
    save(); setTab('home');
    return;
  }
  if (d.speed) { ticker.speed = Number(d.speed); return; }
  if (d.livelg) { liveUI.league = d.livelg; liveUI.dayOffset = 0; render(); return; }
  if (d.livetab) { liveUI.tab = d.livetab; render(); return; }
  if (d.ldate) { liveUI.dayOffset += Number(d.ldate); render(); return; }
  if (d.liverefresh) { render(); loadLive(true); return; }
  if (d.careercard) return careerCardSheet();
  if (d.savecard) return saveCareerCard();
  if (d.renew) {
    try { S = E.renewContract(S, d.renew); save(); renewalsSheet(); } catch (e) { alert(e.message); }
    return;
  }
  if (d.release) {
    try { S = E.releasePlayer(S, d.release); save(); renewalsSheet(); } catch (e) { alert(e.message); }
    return;
  }
  if (d.rnav) {
    var keys = Object.keys(leagueResults().reduce(function (acc, r) { acc[r.round] = 1; return acc; }, {}))
      .map(Number).sort(function (a, b) { return a - b; });
    var cur = ui.resultsRound == null ? keys[keys.length - 1] : ui.resultsRound;
    var i = keys.indexOf(cur) + Number(d.rnav);
    if (i >= 0 && i < keys.length) { ui.resultsRound = keys[i]; render(); }
    return;
  }
  if (d.act === 'play') return playMatchday();
  if (d.act === 'skipmatch') return skipMatch();
  if (d.act === 'closeMatch') { $('matchOverlay').classList.remove('on'); render(); return; }
  if (d.act === 'closeModal') return closeModal();
  if (d.act === 'endseason') return ceremony();
  if (d.act === 'newseason') {
    S = E.endSeason(S); save();
    if ((S.pendingRenewals || []).length) { renewalsSheet(); render(); }
    else { closeModal(); render(); }
    return;
  }
  if (d.act === 'renewals') return renewalsSheet();
  if (d.act === 'openLiveGuest') { ui.guestLive = true; render(); return; }
  if (d.act === 'backOnboard') { ui.guestLive = false; render(); return; }
  if (d.act === 'gotoLeague') { ui.leagueTab = 'table'; return setTab('league'); }
  if (d.act === 'reroll') { onboardSeed = 'ballrz-' + Math.random().toString(36).slice(2, 8); render(); return; }
  if (d.act === 'reset') {
    if (confirm('Abandon this career? The universe (and your trophies) will be lost.')) {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      S = null; onboardSeed = null; render();
    }
    return;
  }
});

$('playBtn').addEventListener('click', function () { playMatchday(); });
$('modal').addEventListener('click', function (ev) { if (ev.target === $('modal')) closeModal(); });

/* ---------------- boot ---------------- */

S = load();
render();

// Debug/test hook: lets the harness fast-forward a career deterministically.
window.__ballrz = {
  E: E,
  getState: function () { return S; },
  setState: function (s) { S = s; save(); render(); },
};

if (navigator.serviceWorker && typeof navigator.serviceWorker.register === 'function') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
