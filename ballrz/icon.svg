<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#14392a"/>
      <stop offset="100%" stop-color="#0a120d"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d6cd"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- pitch line arcs -->
  <circle cx="256" cy="500" r="180" fill="none" stroke="#2fae5f" stroke-opacity="0.35" stroke-width="8"/>
  <circle cx="256" cy="500" r="120" fill="none" stroke="#2fae5f" stroke-opacity="0.25" stroke-width="8"/>
  <!-- motion swoosh -->
  <path d="M96 330 C 150 290, 210 275, 280 285" fill="none" stroke="#ffd479" stroke-width="14"
        stroke-linecap="round" opacity="0.85"/>
  <path d="M120 368 C 168 338, 214 326, 268 330" fill="none" stroke="#ffd479" stroke-width="9"
        stroke-linecap="round" opacity="0.5"/>
  <!-- the ball -->
  <circle cx="300" cy="212" r="118" fill="url(#ball)"/>
  <circle cx="300" cy="212" r="118" fill="none" stroke="#0a120d" stroke-opacity="0.3" stroke-width="6"/>
  <!-- pentagon panels -->
  <polygon points="300,158 336,184 322,226 278,226 264,184" fill="#101c14"/>
  <polygon points="300,102 322,140 300,158 278,140" fill="#101c14" opacity="0.9"/>
  <polygon points="398,180 412,220 382,246 356,218 368,186" fill="#101c14" opacity="0.9"/>
  <polygon points="202,180 232,186 244,218 218,246 188,220" fill="#101c14" opacity="0.9"/>
  <polygon points="300,330 270,308 282,272 318,272 330,308" fill="#101c14" opacity="0.9"/>
  <!-- seams -->
  <path d="M300 158 L300 102 M336 184 L368 186 M322 226 L330 308 M278 226 L270 308 M264 184 L232 186"
        fill="none" stroke="#101c14" stroke-width="5" opacity="0.7"/>
</svg>
